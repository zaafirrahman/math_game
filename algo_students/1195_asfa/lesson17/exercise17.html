<style>
  :root{--bg:#0a0a0f;--card:#1a1a28;--border:#2a2a40;--neon:#00f5c4;--accent:#f59e0b;--text:#e2e8f0;--muted:#64748b;--violet:#a78bfa;--red:#ef4444;--blue:#38bdf8;--orange:#fb923c;--meet:#f472b6;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 10% 20%,rgba(56,189,248,0.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 80%,rgba(251,146,60,0.05) 0%,transparent 50%);pointer-events:none;}
  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;font-family:'Orbitron',monospace;font-size:0.72rem;letter-spacing:1px;}
  nav a{color:var(--muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--neon);}
  nav span{color:var(--border);}
  nav .current{color:var(--violet);}
  .wrapper{max-width:680px;margin:0 auto;padding:2.5rem 1.5rem 6rem;position:relative;z-index:1;}
  .page-header{text-align:center;margin-bottom:2rem;}
  .page-title{font-family:'Orbitron',monospace;font-size:clamp(1.2rem,4vw,1.8rem);font-weight:900;color:var(--violet);margin-bottom:0.5rem;}
  .page-sub{color:var(--muted);font-size:0.9rem;}
  .prog-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;margin-bottom:2rem;}
  .prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;}
  .prog-label{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
  .prog-val{font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;color:var(--violet);}
  .prog-bar{background:var(--border);border-radius:99px;height:6px;overflow:hidden;}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--neon));border-radius:99px;transition:width 0.5s ease;}
  .dot-row{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.8rem;}
  .dot{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);cursor:pointer;transition:all 0.2s;font-family:'Orbitron',monospace;font-size:0.6rem;display:flex;align-items:center;justify-content:center;color:var(--muted);}
  .dot.done-ok{background:rgba(0,245,196,0.15);border-color:var(--neon);color:var(--neon);}
  .dot.done-ko{background:rgba(239,68,68,0.12);border-color:var(--red);color:var(--red);}
  .dot.active{border-color:var(--violet);color:var(--violet);background:rgba(167,139,250,0.1);}
  .q-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.6rem;margin-bottom:1.2rem;display:none;}
  .q-card.active{display:block;animation:fadeIn 0.3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
  .q-num{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:3px;color:var(--violet);text-transform:uppercase;}
  .q-tag{font-size:0.65rem;padding:0.2rem 0.6rem;border-radius:99px;font-weight:700;}
  .tag-meet{background:rgba(244,114,182,0.1);color:var(--meet);border:1px solid rgba(244,114,182,0.3);}
  .tag-check{background:rgba(0,245,196,0.1);color:var(--neon);border:1px solid rgba(0,245,196,0.3);}
  .tag-table{background:rgba(56,189,248,0.1);color:var(--blue);border:1px solid rgba(56,189,248,0.3);}
  .tag-graph{background:rgba(251,146,60,0.1);color:var(--orange);border:1px solid rgba(251,146,60,0.3);}
  .tag-cerita{background:rgba(245,158,11,0.1);color:var(--accent);border:1px solid rgba(245,158,11,0.3);}
  .q-text{font-size:0.95rem;line-height:1.7;margin-bottom:1.2rem;color:var(--text);}
  .q-text strong{color:var(--violet);}
  .dual-rule{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;margin-bottom:1.2rem;}
  @media(max-width:420px){.dual-rule{grid-template-columns:1fr;}}
  .rule-display{background:#12121c;border:1.5px solid var(--border);border-radius:12px;padding:0.7rem 0.9rem;text-align:center;}
  .rule-display.ma{border-color:var(--blue);}
  .rule-display.mb{border-color:var(--orange);}
  .rule-tag{font-family:'Orbitron',monospace;font-size:0.58rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:0.3rem;}
  .rule-display.ma .rule-tag{color:var(--blue);}
  .rule-display.mb .rule-tag{color:var(--orange);}
  .rule-text{font-family:'Orbitron',monospace;font-size:1.02rem;font-weight:900;}
  .rule-display.ma .rule-text{color:var(--blue);}
  .rule-display.mb .rule-text{color:var(--orange);}
  .xy-table{width:100%;border-collapse:collapse;margin:0 0 1.2rem;background:#12121c;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
  .xy-table th{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:2px;padding:0.4rem 0;text-align:center;border-bottom:1px solid var(--border);}
  .xy-table th.th-x{color:var(--muted);}
  .xy-table th.th-a{color:var(--blue);}
  .xy-table th.th-b{color:var(--orange);}
  .xy-table td{font-family:'Orbitron',monospace;font-size:0.92rem;font-weight:900;text-align:center;padding:0.4rem 0;}
  .xy-table td.td-x{color:var(--muted);}
  .xy-table td.td-a{color:var(--blue);}
  .xy-table td.td-b{color:var(--orange);}
  .xy-table tr:not(:last-child) td{border-bottom:1px solid rgba(255,255,255,0.04);}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;margin-bottom:0.8rem;}
  @media(max-width:400px){.opts{grid-template-columns:1fr;}}
  .opt-btn{background:#12121c;border:1px solid var(--border);color:var(--text);padding:0.65rem 0.8rem;border-radius:10px;cursor:pointer;font-family:'Orbitron',monospace;font-size:0.78rem;letter-spacing:1px;transition:all 0.2s;text-align:center;line-height:1.4;}
  .opt-btn:hover:not(:disabled){border-color:var(--violet);background:rgba(167,139,250,0.07);}
  .opt-btn.correct{border-color:var(--neon);background:rgba(0,245,196,0.1);color:var(--neon);}
  .opt-btn.wrong{border-color:var(--red);background:rgba(239,68,68,0.1);color:var(--red);}
  .opt-btn.reveal-correct{border-color:var(--neon);background:rgba(0,245,196,0.06);color:var(--neon);}
  .q-feedback{min-height:24px;font-size:0.85rem;margin-bottom:0.8rem;line-height:1.5;}
  .q-feedback.ok{color:var(--neon);}
  .q-feedback.ko{color:var(--red);}
  .q-nav{display:flex;gap:0.8rem;justify-content:flex-end;}
  .qnav-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:0.55rem 1.2rem;border-radius:8px;cursor:pointer;font-family:'Orbitron',monospace;font-size:0.7rem;letter-spacing:2px;transition:all 0.2s;}
  .qnav-btn.next{background:linear-gradient(135deg,var(--neon),#059669);border:none;color:#000;font-weight:800;}
  .qnav-btn:hover{border-color:var(--neon);}
  #resultPanel{display:none;background:var(--card);border:1px solid rgba(0,245,196,0.3);border-radius:18px;padding:2rem;text-align:center;margin-top:2rem;}
  .result-score{font-family:'Orbitron',monospace;font-size:3.5rem;font-weight:900;color:var(--neon);margin-bottom:0.3rem;}
  .result-sub{color:var(--muted);font-size:0.85rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:1.5rem;}
  .result-grade{display:inline-block;font-family:'Orbitron',monospace;font-size:1rem;letter-spacing:3px;padding:0.5rem 1.5rem;border-radius:12px;margin-bottom:1.5rem;}
  .rg-s{background:rgba(0,245,196,0.1);border:2px solid var(--neon);color:var(--neon);}
  .rg-a{background:rgba(167,139,250,0.1);border:2px solid var(--violet);color:var(--violet);}
  .rg-b{background:rgba(245,158,11,0.1);border:2px solid var(--accent);color:var(--accent);}
  .rg-c{background:rgba(239,68,68,0.1);border:2px solid var(--red);color:var(--red);}
  .result-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
  .ra-btn{padding:0.7rem 1.6rem;border-radius:12px;font-family:'Orbitron',monospace;font-size:0.75rem;letter-spacing:2px;text-decoration:none;display:inline-block;transition:all 0.2s;cursor:pointer;}
  .ra-primary{background:linear-gradient(135deg,var(--neon),#059669);color:#000;border:none;font-weight:800;}
  .ra-secondary{background:var(--card);border:1px solid var(--border);color:var(--text);}
  .ra-primary:hover{transform:translateY(-2px);}
  .ra-secondary:hover{border-color:var(--neon);color:var(--neon);}
</style>

<script>
function tableHTML(xs, as, bs){
  const rows = xs.map((x,i)=>`<tr><td class="td-x">${x}</td><td class="td-a">${as[i]}</td><td class="td-b">${bs[i]}</td></tr>`).join('');
  return `<table class="xy-table"><thead><tr><th class="th-x">x</th><th class="th-a">Mesin A</th><th class="th-b">Mesin B</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function ruleHTML(ruleA, ruleB){
  return `<div class="dual-rule">
    <div class="rule-display ma"><div class="rule-tag">Mesin A</div><div class="rule-text">${ruleA}</div></div>
    <div class="rule-display mb"><div class="rule-tag">Mesin B</div><div class="rule-text">${ruleB}</div></div>
  </div>`;
}

const QS=[
  // Cari titik pertemuan (1-6)
  {tag:'tag-meet',label:'Titik Pertemuan',extra:ruleHTML('y = x + 3','y = 2x'),text:'Dua mesin di atas. Pada nilai <strong>x berapa</strong> kedua mesin menghasilkan output yang sama?',correct:'x = 3',wrongs:['x = 1','x = 2','x = 4'],expl:'x=3: A=3+3=6, B=2×3=6 → SAMA! ✓'},
  {tag:'tag-meet',label:'Titik Pertemuan',extra:ruleHTML('y = x + 4','y = 3x'),text:'Dua mesin di atas. Pada nilai <strong>x berapa</strong> kedua mesin menghasilkan output yang sama?',correct:'x = 2',wrongs:['x = 1','x = 3','x = 4'],expl:'x=2: A=2+4=6, B=3×2=6 → SAMA! ✓'},
  {tag:'tag-meet',label:'Titik Pertemuan',extra:ruleHTML('y = x + 6','y = 2x + 2'),text:'Dua mesin di atas. Pada nilai <strong>x berapa</strong> kedua mesin menghasilkan output yang sama?',correct:'x = 4',wrongs:['x = 2','x = 3','x = 5'],expl:'x=4: A=4+6=10, B=2×4+2=10 → SAMA! ✓'},
  {tag:'tag-meet',label:'Titik Pertemuan',extra:ruleHTML('y = 2x + 1','y = 3x − 2'),text:'Dua mesin di atas. Pada nilai <strong>x berapa</strong> kedua mesin menghasilkan output yang sama?',correct:'x = 3',wrongs:['x = 1','x = 2','x = 4'],expl:'x=3: A=2×3+1=7, B=3×3−2=7 → SAMA! ✓'},
  {tag:'tag-meet',label:'Titik Pertemuan',extra:ruleHTML('y = x + 1','y = 4x − 5'),text:'Dua mesin di atas. Pada nilai <strong>x berapa</strong> kedua mesin menghasilkan output yang sama?',correct:'x = 2',wrongs:['x = 1','x = 3','x = 4'],expl:'x=2: A=2+1=3, B=4×2−5=3 → SAMA! ✓'},
  {tag:'tag-meet',label:'Titik Pertemuan',extra:ruleHTML('y = 3x','y = x + 8'),text:'Dua mesin di atas. Pada nilai <strong>x berapa</strong> kedua mesin menghasilkan output yang sama?',correct:'x = 4',wrongs:['x = 2','x = 3','x = 6'],expl:'x=4: A=3×4=12, B=4+8=12 → SAMA! ✓'},
  // Cek kesamaan output (7-11)
  {tag:'tag-check',label:'Cek Kesamaan',extra:ruleHTML('y = x + 5','y = 2x'),text:'Jika <strong>x = 5</strong>, apakah kedua mesin menghasilkan output yang sama?',correct:'Sama, keduanya 10',wrongs:['Tidak sama, A=10 B=8','Tidak sama, A=8 B=10','Sama, keduanya 8'],expl:'A=5+5=10, B=2×5=10 → SAMA, hasilnya 10 ✓'},
  {tag:'tag-check',label:'Cek Kesamaan',extra:ruleHTML('y = x + 2','y = 3x − 4'),text:'Jika <strong>x = 4</strong>, apakah kedua mesin menghasilkan output yang sama?',correct:'Tidak sama, A=6 B=8',wrongs:['Sama, keduanya 6','Sama, keduanya 8','Tidak sama, A=8 B=6'],expl:'A=4+2=6, B=3×4−4=8 → TIDAK sama, A=6 dan B=8 ✓'},
  {tag:'tag-check',label:'Cek Kesamaan',extra:ruleHTML('y = 2x + 3','y = 4x − 3'),text:'Jika <strong>x = 3</strong>, apakah kedua mesin menghasilkan output yang sama?',correct:'Sama, keduanya 9',wrongs:['Tidak sama, A=9 B=12','Tidak sama, A=12 B=9','Sama, keduanya 12'],expl:'A=2×3+3=9, B=4×3−3=9 → SAMA, hasilnya 9 ✓'},
  {tag:'tag-check',label:'Cek Kesamaan',extra:ruleHTML('y = x + 7','y = 2x + 2'),text:'Jika <strong>x = 5</strong>, apakah kedua mesin menghasilkan output yang sama?',correct:'Sama, keduanya 12',wrongs:['Tidak sama, A=12 B=10','Tidak sama, A=10 B=12','Sama, keduanya 10'],expl:'A=5+7=12, B=2×5+2=12 → SAMA, hasilnya 12 ✓'},
  {tag:'tag-check',label:'Cek Kesamaan',extra:ruleHTML('y = 3x','y = x + 6'),text:'Jika <strong>x = 2</strong>, apakah kedua mesin menghasilkan output yang sama?',correct:'Tidak sama, A=6 B=8',wrongs:['Sama, keduanya 6','Sama, keduanya 8','Tidak sama, A=8 B=6'],expl:'A=3×2=6, B=2+6=8 → TIDAK sama, A=6 dan B=8 ✓'},
  // Baca tabel (12-15)
  {tag:'tag-table',label:'Baca Tabel',extra:tableHTML([1,2,3,4],[3,4,5,6],[1,3,5,7]),text:'Dari tabel di atas (Mesin A: y=x+2, Mesin B: y=2x−1), pada x berapa output kedua mesin sama?',correct:'x = 3',wrongs:['x = 1','x = 2','x = 4'],expl:'Pada x=3: A=5, B=5 → SAMA! ✓'},
  {tag:'tag-table',label:'Baca Tabel',extra:tableHTML([1,2,3,4],[4,6,8,10],[2,5,8,11]),text:'Dari tabel di atas, pada x berapa output kedua mesin sama?',correct:'x = 3',wrongs:['x = 1','x = 2','x = 4'],expl:'Pada x=3: A=8, B=8 → SAMA! ✓'},
  {tag:'tag-table',label:'Baca Tabel',extra:tableHTML([1,2,3,4],[6,7,8,9],[3,5,7,9]),text:'Dari tabel di atas, pada x berapa output kedua mesin sama?',correct:'x = 4',wrongs:['x = 1','x = 2','x = 3'],expl:'Pada x=4: A=9, B=9 → SAMA! ✓'},
  {tag:'tag-table',label:'Baca Tabel',extra:tableHTML([0,1,2,3],[2,5,8,11],[5,6,7,8]),text:'Dari tabel di atas, apakah kedua mesin PERNAH menghasilkan output sama pada rentang x ini?',correct:'Tidak, A selalu lebih besar setelah x=1',wrongs:['Ya, pada x=0','Ya, pada x=2','Ya, pada x=3'],expl:'Bandingkan tiap baris: 2vs5, 5vs6, 8vs7, 11vs8 — tidak pernah sama persis, A lewati B setelah x=1 ✓'},
  // Baca grafik (16-18)
  {tag:'tag-graph',label:'Baca Grafik',extra:'',text:'Di grafik, garis Mesin A dan Mesin B saling berpotongan di satu titik. Titik itu disebut...',correct:'Titik pertemuan (solusi)',wrongs:['Titik awal','Titik puncak','Titik asal (0,0)'],expl:'Titik potong dua garis = titik pertemuan, yaitu nilai x,y yang memenuhi kedua aturan sekaligus ✓'},
  {tag:'tag-graph',label:'Baca Grafik',extra:'',text:'Sebelum titik pertemuan, garis Mesin A berada di bawah garis Mesin B. Setelah titik pertemuan, posisi keduanya...',correct:'Bertukar — A jadi di atas B',wrongs:['Tetap sama, A tetap di bawah','Kedua garis berhenti','Garis B menghilang'],expl:'Saat dua garis berpotongan, posisi atas-bawahnya bertukar setelah titik itu ✓'},
  {tag:'tag-graph',label:'Baca Grafik',extra:'',text:'Jika dua garis pada grafik SEJAJAR (tidak pernah berpotongan), itu artinya...',correct:'Kedua mesin tidak pernah punya output sama',wrongs:['Kedua mesin selalu sama','Hanya sama di x=0','Tidak bisa ditentukan'],expl:'Garis sejajar tidak pernah berpotongan, jadi tidak ada nilai x yang membuat outputnya sama ✓'},
  // Soal cerita (19-20)
  {tag:'tag-cerita',label:'Soal Cerita',extra:ruleHTML('y = 2.000x','y = 1.500x + 1.000'),text:'Dua paket internet. Mesin A = biaya paket harian (Rp), Mesin B = biaya paket lain. Pada berapa hari (x) biaya keduanya sama?',correct:'x = 2 hari',wrongs:['x = 1 hari','x = 3 hari','x = 4 hari'],expl:'x=2: A=2000×2=4000, B=1500×2+1000=4000 → SAMA di hari ke-2 ✓'},
  {tag:'tag-cerita',label:'Soal Cerita',extra:ruleHTML('y = 5.000x','y = 3.000x + 4.000'),text:'Dua tukang parkir. Mesin A = tarif per jam (Rp), Mesin B = tarif lain. Pada berapa jam (x) biaya parkir keduanya sama?',correct:'x = 2 jam',wrongs:['x = 1 jam','x = 3 jam','x = 4 jam'],expl:'x=2: A=5000×2=10000, B=3000×2+4000=10000 → SAMA di jam ke-2 ✓'},
];

const STATE_KEY='ex17_state';
let state={answers:{},done:0,total:QS.length};
function saveState(){localStorage.setItem(STATE_KEY,JSON.stringify(state));}
function loadState(){try{const s=localStorage.getItem(STATE_KEY);if(s)state=JSON.parse(s);}catch(e){}}
function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}

function buildDots(){
  const dr=document.getElementById('dotRow');
  dr.innerHTML='';
  for(let i=0;i<QS.length;i++){
    const d=document.createElement('div');
    d.className='dot';
    d.textContent=i+1;
    d.id='dot'+i;
    if(state.answers[i]!==undefined){d.classList.add(state.answers[i]?'done-ok':'done-ko');}
    d.onclick=()=>showQ(i);
    dr.appendChild(d);
  }
}
function buildQuestions(){
  const cont=document.getElementById('questionsContainer');
  cont.innerHTML='';
  QS.forEach((q,i)=>{
    const card=document.createElement('div');
    card.className='q-card'+(i===0?' active':'');
    card.id='qcard'+i;
    const opts=shuffle([q.correct,...q.wrongs]);
    let optsHTML=opts.map(o=>`<button class="opt-btn" onclick="answer(${i},'${o.replace(/'/g,"\\'")}',this)">${o}</button>`).join('');
    card.innerHTML=`
      <div class="q-meta">
        <div class="q-num">Soal ${i+1} / 20</div>
        <div class="q-tag ${q.tag}">${q.label}</div>
      </div>
      ${q.extra}
      <div class="q-text">${q.text}</div>
      <div class="opts">${optsHTML}</div>
      <div class="q-feedback" id="fb${i}"></div>
      <div class="q-nav">
        ${i>0?`<button class="qnav-btn" onclick="showQ(${i-1})">← Prev</button>`:''}
        ${i<QS.length-1?`<button class="qnav-btn next" id="nxt${i}" onclick="showQ(${i+1})" style="display:none">Next →</button>`:''}
      </div>
    `;
    cont.appendChild(card);
    if(state.answers[i]!==undefined) restoreAnswer(i, q, opts);
  });
}
function restoreAnswer(i,q,opts){
  const card=document.getElementById('qcard'+i);
  const btns=card.querySelectorAll('.opt-btn');
  btns.forEach(b=>{
    b.disabled=true;
    if(b.textContent===q.correct) b.classList.add(state.answers[i]?'correct':'reveal-correct');
  });
  const fb=document.getElementById('fb'+i);
  if(state.answers[i]){fb.className='q-feedback ok';fb.textContent='✅ '+q.expl;}
  else{fb.className='q-feedback ko';fb.textContent='❌ '+q.expl;}
  const nxt=document.getElementById('nxt'+i);
  if(nxt) nxt.style.display='inline-block';
}
function answer(i, chosen, btn){
  if(state.answers[i]!==undefined) return;
  const q=QS[i];
  const correct=chosen===q.correct;
  state.answers[i]=correct;
  if(correct) state.done++;
  saveState();
  const card=document.getElementById('qcard'+i);
  card.querySelectorAll('.opt-btn').forEach(b=>{
    b.disabled=true;
    if(b.textContent===q.correct) b.classList.add('correct');
    else if(b===btn) b.classList.add('wrong');
  });
  const fb=document.getElementById('fb'+i);
  if(correct){fb.className='q-feedback ok';fb.textContent='✅ '+q.expl;}
  else{fb.className='q-feedback ko';fb.textContent='❌ '+q.expl;}
  const dot=document.getElementById('dot'+i);
  dot.classList.remove('active');
  dot.classList.add(correct?'done-ok':'done-ko');
  const nxt=document.getElementById('nxt'+i);
  if(nxt) nxt.style.display='inline-block';
  updateProgress();
  if(Object.keys(state.answers).length===QS.length) setTimeout(showResult,600);
}
function showQ(i){
  document.querySelectorAll('.q-card').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));
  document.getElementById('qcard'+i).classList.add('active');
  document.getElementById('dot'+i).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}
function updateProgress(){
  const done=Object.keys(state.answers).length;
  document.getElementById('progVal').textContent=done+' / 20';
  document.getElementById('progFill').style.width=(done/QS.length*100)+'%';
}
function showResult(){
  document.getElementById('resultPanel').style.display='block';
  const correct=Object.values(state.answers).filter(Boolean).length;
  const pts=correct*10;
  document.getElementById('rScore').textContent=pts;
  const rg=document.getElementById('rGrade');
  if(pts>=180){rg.textContent='⭐ RANK S';rg.className='result-grade rg-s';}
  else if(pts>=140){rg.textContent='🏆 RANK A';rg.className='result-grade rg-a';}
  else if(pts>=100){rg.textContent='💪 RANK B';rg.className='result-grade rg-b';}
  else{rg.textContent='📚 RANK C';rg.className='result-grade rg-c';}
  document.getElementById('resultPanel').scrollIntoView({behavior:'smooth'});
}
function restartExercise(){
  state={answers:{},done:0,total:QS.length};
  saveState();
  location.reload();
}
loadState();
buildDots();
buildQuestions();
updateProgress();
showQ(0);
if(Object.keys(state.answers).length===QS.length) setTimeout(showResult,200);
</script>
