<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#1a1a28;--border:#2a2a40;--neon:#00f5c4;--accent:#f59e0b;--text:#e2e8f0;--muted:#64748b;--violet:#a78bfa;--red:#ef4444;--blue:#38bdf8;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(245,158,11,0.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(167,139,250,0.06) 0%,transparent 50%);pointer-events:none;}
  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;font-family:'Orbitron',monospace;font-size:0.72rem;letter-spacing:1px;}
  nav a{color:var(--muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--neon);}
  nav span{color:var(--border);}
  nav .current{color:var(--accent);}
  .wrapper{max-width:640px;margin:0 auto;padding:3rem 1.5rem 6rem;position:relative;z-index:1;}

  #intro{text-align:center;}
  .qt-icon{font-size:5rem;display:block;margin-bottom:1.5rem;animation:pulse 1.5s ease infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
  .qt-title{font-family:'Orbitron',monospace;font-size:clamp(1.4rem,5vw,2rem);font-weight:900;color:var(--accent);margin-bottom:0.8rem;text-shadow:0 0 30px rgba(245,158,11,0.4);}
  .qt-sub{color:var(--muted);line-height:1.7;margin-bottom:2rem;font-size:0.95rem;}
  .info-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.8rem;margin-bottom:2.5rem;}
  @media(max-width:480px){.info-cards{grid-template-columns:1fr;}}
  .info-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;text-align:center;}
  .info-val{font-family:'Orbitron',monospace;font-size:1.8rem;font-weight:900;color:var(--accent);margin-bottom:0.3rem;}
  .info-lbl{font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .start-btn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;font-weight:800;padding:1rem 3rem;border-radius:14px;border:none;font-family:'Orbitron',monospace;font-size:1rem;letter-spacing:3px;cursor:pointer;box-shadow:0 4px 20px rgba(245,158,11,0.4);transition:all 0.2s;}
  .start-btn:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(245,158,11,0.5);}

  #game{display:none;}
  .hud{display:flex;justify-content:space-between;align-items:stretch;margin-bottom:1.5rem;gap:0.8rem;}
  .hud-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0.7rem 1.2rem;text-align:center;flex:1;}
  .hud-val{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:700;}
  .hud-lbl{font-size:0.62rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:0.1rem;}
  .hud-val.score-v{color:var(--accent);}
  .hud-val.q-v{color:var(--violet);}
  .hud-val.timer-v{color:var(--text);transition:color 0.3s;}
  .hud-val.timer-v.warn{color:var(--red);animation:blink 0.5s ease infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.4;}}

  .q-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.5rem;margin-bottom:1.2rem;}
  .q-label{font-family:'Orbitron',monospace;font-size:0.62rem;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:0.8rem;}
  .q-type{font-size:0.8rem;color:var(--muted);margin-bottom:0.6rem;}
  
  .io-display{display:flex;justify-content:center;margin-bottom:1.2rem;}
  table.iot{border-collapse:collapse;}
  table.iot th{font-family:'Orbitron',monospace;font-size:0.6rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;padding:0.35rem 1.2rem;border-bottom:1px solid var(--border);}
  table.iot td{text-align:center;padding:0.5rem 1.2rem;font-family:'Orbitron',monospace;font-size:1.05rem;font-weight:700;border-top:1px solid rgba(42,42,64,0.5);}
  table.iot td.iv{color:var(--blue);}
  table.iot td.ov{color:var(--neon);}
  table.iot td.ar{color:var(--muted);font-size:0.8rem;padding:0.5rem 0.3rem;}
  table.iot td.qv{color:var(--accent);}

  .q-prompt{text-align:center;font-family:'Orbitron',monospace;font-size:0.88rem;color:var(--text);margin-bottom:1.2rem;line-height:1.6;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;}
  .opt-btn{background:#12121c;border:1px solid var(--border);color:var(--text);padding:0.7rem 1rem;border-radius:10px;cursor:pointer;font-family:'Orbitron',monospace;font-size:0.82rem;letter-spacing:1px;transition:all 0.2s;text-align:center;line-height:1.4;}
  .opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(245,158,11,0.07);}
  .opt-btn.correct{border-color:var(--neon);background:rgba(0,245,196,0.1);color:var(--neon);}
  .opt-btn.wrong{border-color:var(--red);background:rgba(239,68,68,0.1);color:var(--red);}
  .feedback{text-align:center;font-family:'Orbitron',monospace;font-size:0.8rem;letter-spacing:1px;height:28px;margin-top:0.6rem;}
  .feedback.ok{color:var(--neon);}
  .feedback.ko{color:var(--red);}

  #result{display:none;text-align:center;}
  .score-big{font-family:'Orbitron',monospace;font-size:clamp(3rem,12vw,5rem);font-weight:900;color:var(--accent);line-height:1;margin-bottom:0.5rem;}
  .score-label{font-size:0.85rem;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:2rem;}
  .grade-badge{display:inline-block;font-family:'Orbitron',monospace;font-size:1.1rem;letter-spacing:3px;padding:0.5rem 1.5rem;border-radius:12px;margin-bottom:2rem;}
  .grade-s{background:rgba(0,245,196,0.1);border:2px solid var(--neon);color:var(--neon);}
  .grade-a{background:rgba(167,139,250,0.1);border:2px solid var(--violet);color:var(--violet);}
  .grade-b{background:rgba(245,158,11,0.1);border:2px solid var(--accent);color:var(--accent);}
  .grade-c{background:rgba(239,68,68,0.1);border:2px solid var(--red);color:var(--red);}
  .result-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
  .act-btn{padding:0.75rem 1.8rem;border-radius:12px;font-family:'Orbitron',monospace;font-size:0.78rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-block;}
  .act-primary{background:linear-gradient(135deg,var(--accent),#d97706);color:#000;border:none;font-weight:800;}
  .act-secondary{background:var(--card);border:1px solid var(--border);color:var(--text);}
  .act-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(245,158,11,0.3);}
  .act-secondary:hover{border-color:var(--accent);color:var(--accent);}
</style>
</head>

<div class="wrapper">
  <div id="intro">
    <span class="qt-icon">⚡</span>
    <div class="qt-title">Quick Test · Rule Detector</div>
    <div class="qt-sub">10 soal detektif pola — analisa tabel input/output, temukan aturan, dan jawab pertanyaan. Timer 25 detik per soal!</div>
    <div class="info-cards">
      <div class="info-card"><div class="info-val">10</div><div class="info-lbl">Soal</div></div>
      <div class="info-card"><div class="info-val" style="color:var(--red)">25s</div><div class="info-lbl">Timer</div></div>
      <div class="info-card"><div class="info-val" style="color:var(--neon)">+10</div><div class="info-lbl">Per Soal</div></div>
    </div>
    <button class="start-btn" onclick="startGame()">MULAI ⚡</button>
  </div>

  <div id="game">
    <div class="hud">
      <div class="hud-item"><div class="hud-val score-v" id="scoreV">0</div><div class="hud-lbl">Score</div></div>
      <div class="hud-item"><div class="hud-val q-v" id="qV">1/10</div><div class="hud-lbl">Soal</div></div>
      <div class="hud-item"><div class="hud-val timer-v" id="timerV">25</div><div class="hud-lbl">Detik</div></div>
    </div>
    <div class="q-card">
      <div class="q-label">Detektif Pola ⚡</div>
      <div class="q-type" id="qType"></div>
      <div class="io-display" id="ioDisplay"></div>
      <div class="q-prompt" id="qPrompt"></div>
      <div class="opts" id="optsDiv"></div>
      <div class="feedback" id="feedbackDiv"></div>
    </div>
  </div>

  <div id="result">
    <div style="font-size:4rem;margin-bottom:1rem;">🏆</div>
    <div class="score-big" id="finalScore">0</div>
    <div class="score-label">poin dari 100</div>
    <div class="grade-badge" id="gradeBadge">—</div>
    <div class="result-actions">
      <button class="act-btn act-primary" onclick="resetGame()">ULANG</button>
      <a href="exercise14.html" class="act-btn act-secondary">Exercise</a>
      <a href="lesson14.html" class="act-btn act-secondary">Lesson 14</a>
    </div>
  </div>
</div>

<script>
// question types: 'predict' = predict output for new input, 'rule' = identify rule text
const QS = [
  {pairs:[[1,3],[2,4],[3,5]], type:'predict', ask:10, correct:12, wrongs:[10,11,13], prompt:'Jika input = 10, berapa outputnya?', expl:'Aturan +2: 10+2=12'},
  {pairs:[[1,2],[2,4],[3,6],[4,8]], type:'predict', ask:7, correct:14, wrongs:[13,15,16], prompt:'Jika input = 7, berapa outputnya?', expl:'Aturan ×2: 7×2=14'},
  {pairs:[[1,4],[2,7],[3,10]], type:'predict', ask:6, correct:19, wrongs:[17,18,20], prompt:'Jika input = 6, berapa outputnya?', expl:'Aturan ×3+1: 6×3+1=19'},
  {pairs:[[2,9],[4,17],[6,25]], type:'predict', ask:8, correct:33, wrongs:[31,32,34], prompt:'Jika input = 8, berapa outputnya?', expl:'Aturan ×4+1: 8×4+1=33'},
  {pairs:[[1,5],[2,8],[3,11],[4,14]], type:'rule', ask:0, correct:'×3+2', wrongs:['×2+3','×3+1','×4+1'], prompt:'Aturan mesin ini adalah...?', expl:'Selisih 3, dan 1×3+2=5'},
  {pairs:[[1,6],[2,10],[3,14],[4,18]], type:'rule', ask:0, correct:'×4+2', wrongs:['×4+1','×3+3','×5+1'], prompt:'Aturan mesin ini adalah...?', expl:'Selisih 4, dan 1×4+2=6'},
  {pairs:[[3,7],[5,11],[7,15]], type:'predict', ask:10, correct:21, wrongs:[19,20,22], prompt:'Jika input = 10, berapa outputnya?', expl:'Aturan ×2+1: 10×2+1=21'},
  {pairs:[[1,3],[2,5],[3,7],[4,9]], type:'predict', ask:20, correct:41, wrongs:[39,40,42], prompt:'Jika input = 20, berapa outputnya?', expl:'Aturan ×2+1: 20×2+1=41'},
  {pairs:[[2,6],[3,9],[4,12],[5,15]], type:'rule', ask:0, correct:'×3', wrongs:['×2+2','×3+1','×4−2'], prompt:'Aturan mesin ini adalah...?', expl:'Setiap output = input × 3'},
  {pairs:[[1,7],[2,9],[3,11],[4,13]], type:'predict', ask:15, correct:37, wrongs:[35,36,38], prompt:'Jika input = 15, berapa outputnya?', expl:'Aturan ×2+5: 15×2+5=35... eh, coba lagi! ×2+5: 30+5=35. Jawaban 37? Cek: selisih 2, dan 1→7: 1×2+5=7. 15×2+5=35? Aturan ×2+5: 15×2=30+5=35. Hmm data: 1→7(×2+5=7✓), 2→9(×2+5=9✓). Jadi 15→35 bukan 37. Koreksi.'},
];

// Fix Q9
QS[9] = {pairs:[[1,7],[2,9],[3,11],[4,13]], type:'predict', ask:15, correct:35, wrongs:[33,34,36], prompt:'Jika input = 15, berapa outputnya?', expl:'Aturan ×2+5: 15×2+5=35'};

let cur=0,score=0,timer=null,answered=false;

function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}

function buildTable(pairs) {
  let h=`<table class="iot"><tr><th>Input</th><th></th><th>Output</th></tr>`;
  pairs.forEach(([i,o])=>{h+=`<tr><td class="iv">${i}</td><td class="ar">→</td><td class="ov">${o}</td></tr>`;});
  return h+`</table>`;
}

function showQ() {
  if(cur>=QS.length){endGame();return;}
  answered=false;
  const q=QS[cur];
  document.getElementById('qV').textContent=(cur+1)+'/10';
  document.getElementById('qType').textContent=q.type==='predict'?'📊 Prediksi Output':'🔍 Identifikasi Aturan';
  document.getElementById('ioDisplay').innerHTML=buildTable(q.pairs);
  document.getElementById('qPrompt').textContent=q.prompt;
  const opts=shuffle([q.correct,...q.wrongs]);
  const od=document.getElementById('optsDiv');
  od.innerHTML='';
  opts.forEach(opt=>{
    const b=document.createElement('button');
    b.className='opt-btn'; b.textContent=opt;
    b.onclick=()=>pick(opt,q.correct);
    od.appendChild(b);
  });
  document.getElementById('feedbackDiv').textContent='';
  document.getElementById('feedbackDiv').className='feedback';
  startTimer();
}

function startTimer(){
  clearInterval(timer);
  let t=25;
  const tv=document.getElementById('timerV');
  tv.textContent=t; tv.classList.remove('warn');
  timer=setInterval(()=>{
    t--; tv.textContent=t;
    if(t<=5) tv.classList.add('warn');
    if(t<=0){clearInterval(timer);if(!answered)pick('__timeout__',QS[cur].correct);}
  },1000);
}

function pick(chosen,correct){
  if(answered)return;
  answered=true; clearInterval(timer);
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.disabled=true;
    const v=b.textContent.trim();
    const cv=String(correct);
    if(v===String(chosen)&&String(chosen)===cv) b.classList.add('correct');
    else if(v===String(chosen)) b.classList.add('wrong');
    else if(v===cv) b.classList.add('correct');
  });
  const fb=document.getElementById('feedbackDiv');
  if(String(chosen)===String(correct)){
    score+=10; document.getElementById('scoreV').textContent=score;
    fb.className='feedback ok'; fb.textContent='✅ BENAR! '+QS[cur].expl.split(':')[0];
  } else {
    fb.className='feedback ko';
    fb.textContent=chosen==='__timeout__'?'⏱ WAKTU! Jawaban: '+correct:'❌ SALAH! Jawaban: '+correct;
  }
  setTimeout(()=>{cur++;showQ();},1500);
}

function endGame(){
  document.getElementById('game').style.display='none';
  document.getElementById('result').style.display='block';
  document.getElementById('finalScore').textContent=score;
  const gb=document.getElementById('gradeBadge');
  if(score>=90){gb.textContent='⭐ RANK S';gb.className='grade-badge grade-s';}
  else if(score>=70){gb.textContent='🏆 RANK A';gb.className='grade-badge grade-a';}
  else if(score>=50){gb.textContent='💪 RANK B';gb.className='grade-badge grade-b';}
  else{gb.textContent='📚 RANK C';gb.className='grade-badge grade-c';}
}

function startGame(){
  cur=0;score=0;
  document.getElementById('intro').style.display='none';
  document.getElementById('game').style.display='block';
  showQ();
}
function resetGame(){
  cur=0;score=0;
  document.getElementById('scoreV').textContent='0';
  document.getElementById('result').style.display='none';
  document.getElementById('game').style.display='block';
  showQ();
}
</script>
</body>
