<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise · Lesson 14 · Asfa</title>
<link rel="icon" type="image/svg+xml" href="../../../assets/logo1.svg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#1a1a28;--border:#2a2a40;--neon:#00f5c4;--accent:#f59e0b;--text:#e2e8f0;--muted:#64748b;--violet:#a78bfa;--red:#ef4444;--blue:#38bdf8;--orange:#fb923c;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 10% 20%,rgba(0,245,196,0.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 80%,rgba(251,146,60,0.05) 0%,transparent 50%);pointer-events:none;}
  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;font-family:'Orbitron',monospace;font-size:0.72rem;letter-spacing:1px;}
  nav a{color:var(--muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--neon);}
  nav span{color:var(--border);}
  nav .current{color:var(--orange);}
  .wrapper{max-width:680px;margin:0 auto;padding:2.5rem 1.5rem 6rem;position:relative;z-index:1;}

  /* Header */
  .page-header{text-align:center;margin-bottom:2rem;}
  .page-title{font-family:'Orbitron',monospace;font-size:clamp(1.2rem,4vw,1.8rem);font-weight:900;color:var(--orange);margin-bottom:0.5rem;}
  .page-sub{color:var(--muted);font-size:0.9rem;}

  /* Progress */
  .prog-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;margin-bottom:2rem;}
  .prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;}
  .prog-label{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
  .prog-val{font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;color:var(--orange);}
  .prog-bar{background:var(--border);border-radius:99px;height:6px;overflow:hidden;}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--neon));border-radius:99px;transition:width 0.5s ease;}
  .dot-row{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.8rem;}
  .dot{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);cursor:pointer;transition:all 0.2s;font-family:'Orbitron',monospace;font-size:0.6rem;display:flex;align-items:center;justify-content:center;color:var(--muted);}
  .dot.done-ok{background:rgba(0,245,196,0.15);border-color:var(--neon);color:var(--neon);}
  .dot.done-ko{background:rgba(239,68,68,0.12);border-color:var(--red);color:var(--red);}
  .dot.active{border-color:var(--orange);color:var(--orange);background:rgba(251,146,60,0.1);}

  /* Question card */
  .q-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.6rem;margin-bottom:1.2rem;display:none;}
  .q-card.active{display:block;animation:fadeIn 0.3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
  .q-num{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:3px;color:var(--orange);text-transform:uppercase;}
  .q-tag{font-size:0.65rem;padding:0.2rem 0.6rem;border-radius:99px;}
  .tag-pola{background:rgba(56,189,248,0.1);color:var(--blue);border:1px solid rgba(56,189,248,0.3);}
  .tag-isi{background:rgba(167,139,250,0.1);color:var(--violet);border:1px solid rgba(167,139,250,0.3);}
  .tag-prediksi{background:rgba(0,245,196,0.1);color:var(--neon);border:1px solid rgba(0,245,196,0.3);}
  .tag-cerita{background:rgba(245,158,11,0.1);color:var(--accent);border:1px solid rgba(245,158,11,0.3);}
  .tag-aturan{background:rgba(251,146,60,0.1);color:var(--orange);border:1px solid rgba(251,146,60,0.3);}

  .q-text{font-size:0.95rem;line-height:1.7;margin-bottom:1.2rem;color:var(--text);}
  .q-text strong{color:var(--orange);}

  .io-wrap{display:flex;justify-content:center;margin-bottom:1.2rem;}
  table.iot{border-collapse:collapse;}
  table.iot th{font-family:'Orbitron',monospace;font-size:0.6rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;padding:0.35rem 1.2rem;border-bottom:1px solid var(--border);}
  table.iot td{text-align:center;padding:0.5rem 1.2rem;font-family:'Orbitron',monospace;font-size:1.05rem;font-weight:700;border-top:1px solid rgba(42,42,64,0.5);}
  table.iot td.iv{color:var(--blue);}
  table.iot td.ov{color:var(--neon);}
  table.iot td.ar{color:var(--muted);font-size:0.8rem;padding:0.5rem 0.3rem;}
  table.iot td.qv{color:var(--accent);}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;margin-bottom:0.8rem;}
  @media(max-width:400px){.opts{grid-template-columns:1fr;}}
  .opt-btn{background:#12121c;border:1px solid var(--border);color:var(--text);padding:0.65rem 0.8rem;border-radius:10px;cursor:pointer;font-family:'Orbitron',monospace;font-size:0.78rem;letter-spacing:1px;transition:all 0.2s;text-align:center;line-height:1.4;}
  .opt-btn:hover:not(:disabled){border-color:var(--orange);background:rgba(251,146,60,0.07);}
  .opt-btn.correct{border-color:var(--neon);background:rgba(0,245,196,0.1);color:var(--neon);}
  .opt-btn.wrong{border-color:var(--red);background:rgba(239,68,68,0.1);color:var(--red);}
  .opt-btn.reveal-correct{border-color:var(--neon);background:rgba(0,245,196,0.06);color:var(--neon);}

  .q-feedback{min-height:24px;font-size:0.85rem;margin-bottom:0.8rem;line-height:1.5;}
  .q-feedback.ok{color:var(--neon);}
  .q-feedback.ko{color:var(--red);}

  .q-nav{display:flex;gap:0.8rem;justify-content:flex-end;}
  .qn-btn{padding:0.55rem 1.2rem;border-radius:10px;font-family:'Orbitron',monospace;font-size:0.72rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;border:1px solid var(--border);background:var(--card);color:var(--text);}
  .qn-btn.next{background:linear-gradient(135deg,var(--orange),#ea580c);border:none;color:#fff;font-weight:800;}
  .qn-btn:hover{border-color:var(--orange);color:var(--orange);}
  .qn-btn.next:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(251,146,60,0.3);}

  /* Result */
  #resultPanel{display:none;text-align:center;}
  .score-big{font-family:'Orbitron',monospace;font-size:clamp(3rem,12vw,5rem);font-weight:900;color:var(--orange);line-height:1;margin-bottom:0.5rem;}
  .score-label{font-size:0.85rem;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:2rem;}
  .grade-badge{display:inline-block;font-family:'Orbitron',monospace;font-size:1.1rem;letter-spacing:3px;padding:0.5rem 1.5rem;border-radius:12px;margin-bottom:2rem;}
  .grade-s{background:rgba(0,245,196,0.1);border:2px solid var(--neon);color:var(--neon);}
  .grade-a{background:rgba(167,139,250,0.1);border:2px solid var(--violet);color:var(--violet);}
  .grade-b{background:rgba(245,158,11,0.1);border:2px solid var(--accent);color:var(--accent);}
  .grade-c{background:rgba(239,68,68,0.1);border:2px solid var(--red);color:var(--red);}
  .result-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
  .act-btn{padding:0.75rem 1.8rem;border-radius:12px;font-family:'Orbitron',monospace;font-size:0.78rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-block;}
  .act-primary{background:linear-gradient(135deg,var(--orange),#ea580c);color:#fff;border:none;font-weight:800;}
  .act-secondary{background:var(--card);border:1px solid var(--border);color:var(--text);}
  .act-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(251,146,60,0.3);}
  .act-secondary:hover{border-color:var(--orange);color:var(--orange);}
</style>
</head>

<div class="wrapper">
  <div class="page-header">
    <div class="page-title">🏋️ Exercise Zone</div>
    <div class="page-sub">20 soal latihan lengkap · Progress tersimpan otomatis</div>
  </div>

  <div class="prog-wrap">
    <div class="prog-top">
      <div class="prog-label">Progress</div>
      <div class="prog-val" id="progVal">0 / 20</div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="dot-row" id="dotRow"></div>
  </div>

  <div id="questionsArea"></div>
  <div id="resultPanel">
    <div style="font-size:4rem;margin-bottom:1rem;">🏆</div>
    <div class="score-big" id="finalScore">0</div>
    <div class="score-label">dari 200 poin</div>
    <div class="grade-badge" id="gradeBadge">—</div>
    <div class="result-actions">
      <button class="act-btn act-primary" onclick="resetAll()">ULANG SEMUA</button>
      <a href="quicktest14.html" class="act-btn act-secondary">Quick Test</a>
      <a href="lesson14.html" class="act-btn act-secondary">Lesson 14</a>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'asfa_l14_exercise';

const QS = [
  // 1-5: Temukan pola
  {tag:'tag-pola',label:'Temukan Pola',text:'Lihat tabel berikut. Apa aturan mesinnya?',pairs:[[1,3],[2,4],[3,5],[4,6]],correct:'Tambah 2',wrongs:['Kali 2','Tambah 3','Kali 3']},
  {tag:'tag-pola',label:'Temukan Pola',text:'Perhatikan pola input dan output ini.',pairs:[[1,5],[2,10],[3,15]],correct:'Kali 5',wrongs:['Tambah 5','Kali 4','Tambah 4×input']},
  {tag:'tag-pola',label:'Temukan Pola',text:'Mesin ini punya aturan dua langkah. Apa aturannya?',pairs:[[1,4],[2,6],[3,8],[4,10]],correct:'Kali 2 + 2',wrongs:['Kali 3 + 1','Kali 2 + 3','Tambah 4']},
  {tag:'tag-pola',label:'Temukan Pola',text:'Identifikasi aturan mesin berikut.',pairs:[[1,7],[2,12],[3,17]],correct:'Kali 5 + 2',wrongs:['Kali 6 + 1','Kali 4 + 3','Kali 5 + 3']},
  {tag:'tag-pola',label:'Temukan Pola',text:'Apa pola dari tabel ini?',pairs:[[2,7],[4,13],[6,19]],correct:'Kali 3 + 1',wrongs:['Kali 2 + 3','Kali 3 + 2','Kali 4 − 1']},

  // 6-10: Isi tabel
  {tag:'tag-isi',label:'Isi Tabel',text:'Aturan mesin: Output = Input × 3. Jika input = 7, berapa output?',pairs:[[1,3],[2,6],[3,9]],correct:'21',wrongs:['18','24','20']},
  {tag:'tag-isi',label:'Isi Tabel',text:'Aturan mesin: Output = Input + 8. Jika input = 13, output?',pairs:[[1,9],[2,10],[3,11]],correct:'21',wrongs:['20','22','19']},
  {tag:'tag-isi',label:'Isi Tabel',text:'Lengkapi tabel. Aturan: Output = Input × 4 − 1. Input = 5?',pairs:[[1,3],[2,7],[3,11]],correct:'19',wrongs:['20','18','21']},
  {tag:'tag-isi',label:'Isi Tabel',text:'Lanjutkan pola tabel ini. Input = 6, output?',pairs:[[1,6],[2,10],[3,14],[4,18]],correct:'22',wrongs:['20','24','21']},
  {tag:'tag-isi',label:'Isi Tabel',text:'Tabel dengan pola ×2+3. Input = 8, output?',pairs:[[1,5],[2,7],[3,9]],correct:'19',wrongs:['18','20','17']},

  // 11-15: Prediksi besar
  {tag:'tag-prediksi',label:'Prediksi Besar',text:'Aturan: Output = Input × 2 + 1. Jika input = <strong>50</strong>, berapa output?',pairs:[],correct:'101',wrongs:['100','102','99']},
  {tag:'tag-prediksi',label:'Prediksi Besar',text:'Aturan: Output = Input + 15. Jika input = <strong>85</strong>, berapa output?',pairs:[],correct:'100',wrongs:['95','99','101']},
  {tag:'tag-prediksi',label:'Prediksi Besar',text:'Pola dari tabel: 1→3, 2→5, 3→7. Jika input = <strong>25</strong>, berapa output?',pairs:[[1,3],[2,5],[3,7]],correct:'51',wrongs:['49','50','52']},
  {tag:'tag-prediksi',label:'Prediksi Besar',text:'Pola: 1→4, 2→7, 3→10. Jika input = <strong>10</strong>, berapa output?',pairs:[[1,4],[2,7],[3,10]],correct:'31',wrongs:['30','32','29']},
  {tag:'tag-prediksi',label:'Prediksi Besar',text:'Mesin dengan aturan ×5+1. Jika input = <strong>20</strong>, output?',pairs:[],correct:'101',wrongs:['100','102','96']},

  // 16-20: Soal cerita + aturan
  {tag:'tag-cerita',label:'Soal Cerita',text:'Sebuah toko menghitung harga dengan aturan: Harga = Jumlah × 3 + 5 (dalam ribuan). Jika membeli 4 item, berapa harganya?',pairs:[],correct:'17 ribu',wrongs:['12 ribu','14 ribu','20 ribu']},
  {tag:'tag-cerita',label:'Soal Cerita',text:'Mesin cetak menghasilkan Output = Input × 6 stiker per menit. Setelah 8 menit, berapa stiker yang dihasilkan?',pairs:[],correct:'48',wrongs:['42','54','46']},
  {tag:'tag-aturan',label:'Tulis Aturan',text:'Perhatikan pola: 2→5, 4→9, 6→13. Aturan mesinnya adalah...',pairs:[[2,5],[4,9],[6,13]],correct:'× 2 + 1',wrongs:['× 3 − 1','× 2 + 2','× 3 + 1']},
  {tag:'tag-aturan',label:'Tulis Aturan',text:'Jika Output = Input × 4 + 3, input mana yang menghasilkan output 23?',pairs:[],correct:'5',wrongs:['4','6','7']},
  {tag:'tag-cerita',label:'Soal Cerita',text:'Pabrik membuat kue dengan aturan: per batch menghasilkan 12 kue. Setelah 7 batch, berapa total kue? Aturannya: Output = Input × 12.',pairs:[],correct:'84',wrongs:['72','96','78']},
];

let state = {answers:new Array(20).fill(null), cur:0};
const TOTAL = 20;

function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}
function loadState(){
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if(s) state = JSON.parse(s);
  } catch(e){}
}

function buildTable(pairs){
  if(!pairs||!pairs.length) return '';
  let h=`<div class="io-wrap"><table class="iot"><tr><th>Input</th><th></th><th>Output</th></tr>`;
  pairs.forEach(([i,o])=>{h+=`<tr><td class="iv">${i}</td><td class="ar">→</td><td class="ov">${o}</td></tr>`;});
  return h+`</table></div>`;
}

function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}

function renderAll(){
  const qa = document.getElementById('questionsArea');
  qa.innerHTML = '';
  QS.forEach((q,i)=>{
    const div = document.createElement('div');
    div.className = 'q-card' + (i===state.cur?' active':'');
    div.id = 'qcard'+i;
    const ans = state.answers[i];
    const opts = shuffle([q.correct,...q.wrongs]);
    let optsHtml = '';
    opts.forEach(opt=>{
      let cls = 'opt-btn';
      if(ans !== null){
        if(opt===q.correct) cls+=' reveal-correct';
        if(opt===ans && ans!==q.correct) cls+=' wrong';
      }
      optsHtml += `<button class="${cls}" ${ans!==null?'disabled':''} onclick="pick(${i},'${opt.replace(/'/g,"\\'")}',this)">${opt}</button>`;
    });
    div.innerHTML = `
      <div class="q-meta">
        <div class="q-num">Soal ${i+1} / ${TOTAL}</div>
        <span class="q-tag ${q.tag}">${q.label}</span>
      </div>
      <div class="q-text">${q.text}</div>
      ${buildTable(q.pairs)}
      <div class="opts">${optsHtml}</div>
      <div class="q-feedback ${ans===q.correct?'ok':ans!==null?'ko':''}" id="fb${i}">
        ${ans===q.correct?'✅ Benar!':ans!==null?'❌ Salah! Jawaban: '+q.correct:''}
      </div>
      <div class="q-nav">
        ${i>0?`<button class="qn-btn" onclick="gotoQ(${i-1})">← Prev</button>`:''}
        ${ans!==null&&i<TOTAL-1?`<button class="qn-btn next" onclick="gotoQ(${i+1})">Next →</button>`:''}
        ${ans!==null&&i===TOTAL-1?`<button class="qn-btn next" onclick="showResult()">Lihat Hasil 🏆</button>`:''}
      </div>`;
    qa.appendChild(div);
  });
  updateProgress();
  updateDots();
}

function pick(idx, chosen, btn){
  if(state.answers[idx]!==null) return;
  state.answers[idx] = chosen;
  saveState();
  const q = QS[idx];
  // Update buttons
  document.querySelectorAll(`#qcard${idx} .opt-btn`).forEach(b=>{
    b.disabled=true;
    const v=b.textContent.trim();
    if(v===q.correct) b.classList.add('reveal-correct');
    if(v===chosen&&chosen!==q.correct) b.classList.add('wrong');
  });
  const fb=document.getElementById('fb'+idx);
  if(chosen===q.correct){fb.className='q-feedback ok';fb.textContent='✅ Benar!';}
  else{fb.className='q-feedback ko';fb.textContent='❌ Salah! Jawaban: '+q.correct;}
  // Add nav button
  const nav=document.querySelector(`#qcard${idx} .q-nav`);
  if(idx<TOTAL-1){
    const nb=document.createElement('button');
    nb.className='qn-btn next';nb.textContent='Next →';nb.onclick=()=>gotoQ(idx+1);
    nav.appendChild(nb);
  } else {
    const nb=document.createElement('button');
    nb.className='qn-btn next';nb.textContent='Lihat Hasil 🏆';nb.onclick=showResult;
    nav.appendChild(nb);
  }
  updateProgress();updateDots();
}

function gotoQ(idx){
  document.querySelectorAll('.q-card').forEach(c=>c.classList.remove('active'));
  document.getElementById('qcard'+idx).classList.add('active');
  state.cur=idx; saveState();
  updateDots();
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateProgress(){
  const done = state.answers.filter(a=>a!==null).length;
  document.getElementById('progVal').textContent=done+' / '+TOTAL;
  document.getElementById('progFill').style.width=(done/TOTAL*100)+'%';
}

function updateDots(){
  const dr=document.getElementById('dotRow');
  dr.innerHTML='';
  for(let i=0;i<TOTAL;i++){
    const d=document.createElement('div');
    d.className='dot';
    d.textContent=i+1;
    const ans=state.answers[i];
    if(ans!==null) d.className+=(ans===QS[i].correct?' done-ok':' done-ko');
    if(i===state.cur) d.className+=' active';
    d.onclick=()=>gotoQ(i);
    dr.appendChild(d);
  }
}

function showResult(){
  document.getElementById('questionsArea').style.display='none';
  document.getElementById('resultPanel').style.display='block';
  const correct=state.answers.filter((a,i)=>a===QS[i].correct).length;
  const score=correct*10;
  document.getElementById('finalScore').textContent=score;
  const gb=document.getElementById('gradeBadge');
  if(score>=180){gb.textContent='⭐ RANK S';gb.className='grade-badge grade-s';}
  else if(score>=140){gb.textContent='🏆 RANK A';gb.className='grade-badge grade-a';}
  else if(score>=100){gb.textContent='💪 RANK B';gb.className='grade-badge grade-b';}
  else{gb.textContent='📚 RANK C';gb.className='grade-badge grade-c';}
}

function resetAll(){
  state={answers:new Array(20).fill(null),cur:0};
  saveState();
  document.getElementById('resultPanel').style.display='none';
  document.getElementById('questionsArea').style.display='block';
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

// Init
loadState();
renderAll();
// Show last active
if(state.cur>0){
  document.querySelectorAll('.q-card').forEach(c=>c.classList.remove('active'));
  const el=document.getElementById('qcard'+state.cur);
  if(el) el.classList.add('active');
}
// Check if all done
if(state.answers.every(a=>a!==null)){
  // show result button
}
</script>
</body>
</html>
