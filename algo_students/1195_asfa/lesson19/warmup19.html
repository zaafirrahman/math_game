<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warmup · Lesson 19 · Asfa</title>
<link rel="icon" type="image/svg+xml" href="../../../assets/logo1.svg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#1a1a28;--border:#2a2a40;--neon:#00f5c4;--accent:#f59e0b;--text:#e2e8f0;--muted:#64748b;--red:#ef4444;--cyan:#22d3ee;--emerald:#34d399;--amber:#fbbf24;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(239,68,68,0.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(34,211,238,0.06) 0%,transparent 50%);pointer-events:none;}
  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;font-family:'Orbitron',monospace;font-size:0.72rem;letter-spacing:1px;}
  nav a{color:var(--muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--neon);}
  nav span{color:var(--border);}
  nav .current{color:#f87171;}
  .wrapper{max-width:640px;margin:0 auto;padding:3rem 1.5rem 6rem;position:relative;z-index:1;}
  #intro{text-align:center;}
  .warmup-icon{font-size:5rem;display:block;margin-bottom:1.5rem;animation:pulse 1.5s ease infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  .warmup-title{font-family:'Orbitron',monospace;font-size:clamp(1.4rem,5vw,2rem);font-weight:900;color:#f87171;margin-bottom:0.8rem;text-shadow:0 0 30px rgba(239,68,68,0.4);}
  .warmup-sub{color:var(--muted);line-height:1.7;margin-bottom:2rem;font-size:0.95rem;}
  .warmup-sub strong{color:var(--emerald);}
  .info-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.8rem;margin-bottom:2.5rem;}
  @media(max-width:480px){.info-cards{grid-template-columns:1fr;}}
  .info-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;text-align:center;}
  .info-val{font-family:'Orbitron',monospace;font-size:1.8rem;font-weight:900;color:var(--emerald);margin-bottom:0.3rem;}
  .info-lbl{font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .start-btn{background:linear-gradient(135deg,#34d399,#059669);color:#001;font-weight:800;padding:1rem 3rem;border-radius:14px;border:none;font-family:'Orbitron',monospace;font-size:1rem;letter-spacing:3px;cursor:pointer;box-shadow:0 4px 20px rgba(52,211,153,0.35);transition:all 0.2s;}
  .start-btn:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(52,211,153,0.45);}
  #game{display:none;}
  .hud{display:flex;justify-content:space-between;align-items:stretch;margin-bottom:1.5rem;gap:0.8rem;}
  .hud-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0.7rem 1.2rem;text-align:center;flex:1;}
  .hud-val{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:700;}
  .hud-lbl{font-size:0.62rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:0.1rem;}
  .hud-val.score-v{color:var(--emerald);}
  .hud-val.q-v{color:var(--accent);}
  .hud-val.timer-v{color:var(--text);transition:color 0.3s;}
  .hud-val.timer-v.warn{color:var(--red);animation:blink 0.5s ease infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.4;}}
  .q-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.5rem;margin-bottom:1.2rem;}
  .q-label{font-family:'Orbitron',monospace;font-size:0.62rem;letter-spacing:3px;color:#f87171;text-transform:uppercase;margin-bottom:0.8rem;}
  .eq-display{background:#12121c;border:1.5px solid var(--border);border-radius:12px;padding:1rem;text-align:center;margin-bottom:1.2rem;}
  .eq-line{font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:800;margin-bottom:0.4rem;font-style:italic;color:var(--cyan);}
  .eq-line:last-child{margin-bottom:0;}
  .coord-question{text-align:center;font-size:0.95rem;color:var(--muted);margin-bottom:1.2rem;line-height:1.6;}
  .coord-question strong{color:var(--emerald);}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;}
  .opt-btn{background:#12121c;border:1px solid var(--border);color:var(--text);padding:0.7rem 1rem;border-radius:10px;cursor:pointer;font-family:'Orbitron',monospace;font-size:0.85rem;letter-spacing:1px;transition:all 0.2s;text-align:center;}
  .opt-btn:hover:not(:disabled){border-color:var(--emerald);background:rgba(52,211,153,0.07);}
  .opt-btn.correct{border-color:var(--neon);background:rgba(0,245,196,0.1);color:var(--neon);}
  .opt-btn.wrong{border-color:var(--red);background:rgba(239,68,68,0.1);color:var(--red);}
  .feedback{text-align:center;font-family:'Orbitron',monospace;font-size:0.8rem;letter-spacing:1px;min-height:28px;margin-top:0.6rem;line-height:1.5;}
  .feedback.ok{color:var(--neon);}
  .feedback.ko{color:var(--red);}
  #result{display:none;text-align:center;}
  .score-big{font-family:'Orbitron',monospace;font-size:clamp(3rem,12vw,5rem);font-weight:900;color:var(--emerald);line-height:1;margin-bottom:0.5rem;}
  .score-label{font-size:0.85rem;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:2rem;}
  .grade-badge{display:inline-block;font-family:'Orbitron',monospace;font-size:1.1rem;letter-spacing:3px;padding:0.5rem 1.5rem;border-radius:12px;margin-bottom:2rem;}
  .grade-s{background:rgba(0,245,196,0.1);border:2px solid var(--neon);color:var(--neon);}
  .grade-a{background:rgba(52,211,153,0.1);border:2px solid var(--emerald);color:var(--emerald);}
  .grade-b{background:rgba(245,158,11,0.1);border:2px solid var(--accent);color:var(--accent);}
  .grade-c{background:rgba(239,68,68,0.1);border:2px solid var(--red);color:var(--red);}
  .result-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
  .act-btn{padding:0.75rem 1.8rem;border-radius:12px;font-family:'Orbitron',monospace;font-size:0.78rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-block;}
  .act-primary{background:linear-gradient(135deg,var(--emerald),#059669);color:#001;border:none;font-weight:800;}
  .act-secondary{background:var(--card);border:1px solid var(--border);color:var(--text);}
  .act-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(52,211,153,0.3);}
  .act-secondary:hover{border-color:var(--emerald);color:var(--emerald);}
</style>
</head>
<body>
<nav>

<div class="wrapper">
  <div id="intro">
    <span class="warmup-icon">🕵️</span>
    <div class="warmup-title">Warmup: Decoder Kilat</div>
    <div class="warmup-sub">Sebelum jadi agen penerjemah penuh, latihan dulu reflex dasarnya: <strong>mengubah kata kunci jadi simbol</strong> secepat kilat!</div>
    <div class="info-cards">
      <div class="info-card"><div class="info-val">10</div><div class="info-lbl">Soal</div></div>
      <div class="info-card"><div class="info-val" style="color:var(--accent)">20s</div><div class="info-lbl">Timer</div></div>
      <div class="info-card"><div class="info-val">+10</div><div class="info-lbl">Per Soal</div></div>
    </div>
    <button class="start-btn" onclick="startGame()">START 🚀</button>
  </div>
  <div id="game">
    <div class="hud">
      <div class="hud-item"><div class="hud-val score-v" id="scoreV">0</div><div class="hud-lbl">Score</div></div>
      <div class="hud-item"><div class="hud-val q-v" id="qV">1/10</div><div class="hud-lbl">Soal</div></div>
      <div class="hud-item"><div class="hud-val timer-v" id="timerV">20</div><div class="hud-lbl">Detik</div></div>
    </div>
    <div class="q-card">
      <div class="q-label">🕵️ Decoder Kilat</div>
      <div class="eq-display" id="eqDisplay"></div>
      <div class="coord-question" id="questionText"></div>
      <div class="opts" id="optsDiv"></div>
      <div class="feedback" id="feedbackDiv"></div>
    </div>
  </div>
  <div id="result">
    <div style="font-size:4rem;margin-bottom:1rem;">🏆</div>
    <div class="score-big" id="finalScore">0</div>
    <div class="score-label">poin dari 100</div>
    <div class="grade-badge" id="gradeBadge">—</div>
    <div class="result-actions">
      <button class="act-btn act-primary" onclick="resetGame()">ULANG</button>
      <a href="section1_19.html" class="act-btn act-secondary">Belajar Dulu</a>
      <a href="lesson19.html" class="act-btn act-secondary">Lesson 19</a>
    </div>
  </div>
</div>
<script>
// Each Q: eq (kalimat), q (instruksi), cx (jawaban benar/simbol), wx (distractor)
const QS = [
  {eq:'"Jumlah dua bilangan"', q:'Simbol apa yang cocok?', cx:'x + y', wx:['x − y','xy','x / y'], expl:'"Jumlah" = tanda tambah → x + y'},
  {eq:'"Selisih dua bilangan"', q:'Simbol apa yang cocok?', cx:'x − y', wx:['x + y','xy','x / y'], expl:'"Selisih" = tanda kurang → x − y'},
  {eq:'"Hasil kali dua bilangan"', q:'Simbol apa yang cocok?', cx:'xy', wx:['x + y','x − y','x / y'], expl:'"Hasil kali" = tanda kali → xy'},
  {eq:'"Lima lebih dari suatu bilangan"', q:'Ekspresi apa yang cocok? (x = bilangan itu)', cx:'x + 5', wx:['x − 5','5x','x / 5'], expl:'"Lebih dari" = ditambah → x + 5'},
  {eq:'"Tiga kurang dari suatu bilangan"', q:'Ekspresi apa yang cocok?', cx:'x − 3', wx:['x + 3','3x','3 − x'], expl:'"Kurang dari" = dikurang → x − 3'},
  {eq:'"Dua kali suatu bilangan"', q:'Ekspresi apa yang cocok?', cx:'2x', wx:['x + 2','x − 2','x / 2'], expl:'"Kali" = dikali → 2x'},
  {eq:'"Setengah dari suatu bilangan"', q:'Ekspresi apa yang cocok?', cx:'x / 2', wx:['2x','x + 2','x − 2'], expl:'"Setengah dari" = dibagi 2 → x / 2'},
  {eq:'"Suatu bilangan ditambah 5 menghasilkan 12"', q:'Persamaan apa yang cocok?', cx:'x + 5 = 12', wx:['x − 5 = 12','5x = 12','x + 12 = 5'], expl:'"Menghasilkan" = ada "=" → x + 5 = 12'},
  {eq:'"Dua kali suatu bilangan sama dengan 18"', q:'Persamaan apa yang cocok?', cx:'2x = 18', wx:['x + 2 = 18','x − 2 = 18','x/2 = 18'], expl:'"Dua kali" = 2x, "sama dengan" = "=" → 2x = 18'},
  {eq:'"Hasil bagi dua bilangan"', q:'Simbol apa yang cocok?', cx:'x / y', wx:['x + y','x − y','xy'], expl:'"Hasil bagi" = tanda bagi → x / y'},
];
let cur=0, score=0, timer=null, answered=false;
function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}
function showQ(){
  if(cur>=QS.length){endGame();return;}
  answered=false;
  const q=QS[cur];
  document.getElementById('qV').textContent=(cur+1)+'/10';
  document.getElementById('eqDisplay').innerHTML='<div class="eq-line">'+q.eq+'</div>';
  document.getElementById('questionText').textContent=q.q;
  const opts = shuffle([q.cx, ...q.wx]);
  const od=document.getElementById('optsDiv');
  od.innerHTML='';
  opts.forEach(v=>{
    const b=document.createElement('button');
    b.className='opt-btn'; b.textContent=v; b.dataset.v=v;
    b.onclick=()=>pick(v, q.cx);
    od.appendChild(b);
  });
  document.getElementById('feedbackDiv').textContent='';
  document.getElementById('feedbackDiv').className='feedback';
  startTimer();
}
function startTimer(){
  clearInterval(timer);
  let t=20;
  const tv=document.getElementById('timerV');
  tv.textContent=t; tv.classList.remove('warn');
  timer=setInterval(()=>{
    t--; tv.textContent=t;
    if(t<=5) tv.classList.add('warn');
    if(t<=0){clearInterval(timer);if(!answered)pick('__timeout__',QS[cur].cx);}
  },1000);
}
function pick(chosen, correct){
  if(answered)return;
  answered=true; clearInterval(timer);
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.disabled=true;
    const v=b.dataset.v;
    if(v===chosen&&chosen===correct) b.classList.add('correct');
    else if(v===chosen) b.classList.add('wrong');
    else if(v===correct) b.classList.add('correct');
  });
  const fb=document.getElementById('feedbackDiv');
  if(chosen===correct){
    score+=10; document.getElementById('scoreV').textContent=score;
    fb.className='feedback ok'; fb.textContent='✅ BENAR! '+QS[cur].expl;
  } else {
    fb.className='feedback ko';
    fb.textContent=chosen==='__timeout__'?'⏱ WAKTU! '+QS[cur].expl:'❌ '+QS[cur].expl;
  }
  setTimeout(()=>{cur++;showQ();},1700);
}
function endGame(){
  document.getElementById('game').style.display='none';
  document.getElementById('result').style.display='block';
  document.getElementById('finalScore').textContent=score;
  const gb=document.getElementById('gradeBadge');
  if(score>=90){gb.textContent='⭐ RANK S';gb.className='grade-badge grade-s';}
  else if(score>=70){gb.textContent='🏆 RANK A';gb.className='grade-badge grade-a';}
  else if(score>=50){gb.textContent='💪 RANK B';gb.className='grade-badge grade-b';}
  else{gb.textContent='📚 RANK C';gb.className='grade-badge grade-c';}
}
function startGame(){
  cur=0;score=0;
  document.getElementById('intro').style.display='none';
  document.getElementById('game').style.display='block';
  showQ();
}
function resetGame(){
  cur=0;score=0;
  document.getElementById('scoreV').textContent='0';
  document.getElementById('result').style.display='none';
  document.getElementById('game').style.display='block';
  showQ();
}
</script>
</body>
