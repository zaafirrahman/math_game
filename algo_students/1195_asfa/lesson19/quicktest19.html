<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Test · Lesson 19 · Asfa</title>
<link rel="icon" type="image/svg+xml" href="../../../assets/logo1.svg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#1a1a28;--border:#2a2a40;--neon:#00f5c4;--accent:#f59e0b;--text:#e2e8f0;--muted:#64748b;--red:#ef4444;--cyan:#22d3ee;--emerald:#34d399;--amber:#fbbf24;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(245,158,11,0.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(34,211,238,0.06) 0%,transparent 50%);pointer-events:none;}
  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;font-family:'Orbitron',monospace;font-size:0.72rem;letter-spacing:1px;}
  nav a{color:var(--muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--neon);}
  nav span{color:var(--border);}
  nav .current{color:var(--accent);}
  .wrapper{max-width:640px;margin:0 auto;padding:3rem 1.5rem 6rem;position:relative;z-index:1;}
  #intro{text-align:center;}
  .qt-icon{font-size:5rem;display:block;margin-bottom:1.5rem;animation:pulse 1.5s ease infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
  .qt-title{font-family:'Orbitron',monospace;font-size:clamp(1.4rem,5vw,2rem);font-weight:900;color:var(--accent);margin-bottom:0.8rem;text-shadow:0 0 30px rgba(245,158,11,0.4);}
  .qt-sub{color:var(--muted);line-height:1.7;margin-bottom:2rem;font-size:0.95rem;}
  .qt-sub strong{color:var(--emerald);}
  .info-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.8rem;margin-bottom:2.5rem;}
  @media(max-width:480px){.info-cards{grid-template-columns:1fr;}}
  .info-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;text-align:center;}
  .info-val{font-family:'Orbitron',monospace;font-size:1.8rem;font-weight:900;color:var(--accent);margin-bottom:0.3rem;}
  .info-lbl{font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .start-btn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;font-weight:800;padding:1rem 3rem;border-radius:14px;border:none;font-family:'Orbitron',monospace;font-size:1rem;letter-spacing:3px;cursor:pointer;box-shadow:0 4px 20px rgba(245,158,11,0.4);transition:all 0.2s;}
  .start-btn:hover{transform:translateY(-3px);}
  #game{display:none;}
  .hud{display:flex;justify-content:space-between;align-items:stretch;margin-bottom:1.5rem;gap:0.8rem;}
  .hud-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0.7rem 1.2rem;text-align:center;flex:1;}
  .hud-val{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:700;}
  .hud-lbl{font-size:0.62rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:0.1rem;}
  .hud-val.score-v{color:var(--accent);}
  .hud-val.q-v{color:var(--emerald);}
  .hud-val.timer-v{color:var(--text);transition:color 0.3s;}
  .hud-val.timer-v.warn{color:var(--red);animation:blink 0.5s ease infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.4;}}
  .q-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.5rem;margin-bottom:1.2rem;}
  .q-label{font-family:'Orbitron',monospace;font-size:0.62rem;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:0.5rem;}
  .q-type-badge{display:inline-block;font-size:0.7rem;padding:0.2rem 0.7rem;border-radius:20px;margin-bottom:0.8rem;font-weight:700;letter-spacing:1px;}
  .badge-k2e{background:rgba(34,211,238,0.1);color:var(--cyan);border:1px solid rgba(34,211,238,0.3);}
  .badge-e2k{background:rgba(251,191,36,0.1);color:var(--amber);border:1px solid rgba(251,191,36,0.3);}
  .badge-pers{background:rgba(52,211,153,0.1);color:var(--emerald);border:1px solid rgba(52,211,153,0.3);}
  .badge-story{background:rgba(239,68,68,0.1);color:#f87171;border:1px solid rgba(239,68,68,0.3);}
  .q-text{font-size:0.95rem;line-height:1.7;margin-bottom:1rem;color:var(--text);}
  .q-text strong{color:var(--accent);}
  .eq-mini{background:#12121c;border-radius:10px;padding:0.9rem 1rem;margin-bottom:1rem;text-align:center;}
  .eq-mini .el{font-family:'Orbitron',monospace;font-size:1rem;font-weight:800;margin-bottom:0.3rem;color:var(--cyan);}
  .eq-mini .el:last-child{margin-bottom:0;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;}
  @media(max-width:400px){.opts{grid-template-columns:1fr;}}
  .opt-btn{background:#12121c;border:1px solid var(--border);color:var(--text);padding:0.65rem 0.8rem;border-radius:10px;cursor:pointer;font-family:'Orbitron',monospace;font-size:0.78rem;letter-spacing:1px;transition:all 0.2s;text-align:center;line-height:1.4;}
  .opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(245,158,11,0.07);}
  .opt-btn.correct{border-color:var(--neon);background:rgba(0,245,196,0.1);color:var(--neon);}
  .opt-btn.wrong{border-color:var(--red);background:rgba(239,68,68,0.1);color:var(--red);}
  .feedback{text-align:center;font-family:'Orbitron',monospace;font-size:0.78rem;letter-spacing:1px;min-height:28px;margin-top:0.6rem;line-height:1.5;}
  .feedback.ok{color:var(--neon);}
  .feedback.ko{color:var(--red);}
  #result{display:none;text-align:center;}
  .score-big{font-family:'Orbitron',monospace;font-size:clamp(3rem,12vw,5rem);font-weight:900;color:var(--accent);line-height:1;margin-bottom:0.5rem;}
  .score-label{font-size:0.85rem;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:2rem;}
  .grade-badge{display:inline-block;font-family:'Orbitron',monospace;font-size:1.1rem;letter-spacing:3px;padding:0.5rem 1.5rem;border-radius:12px;margin-bottom:2rem;}
  .grade-s{background:rgba(0,245,196,0.1);border:2px solid var(--neon);color:var(--neon);}
  .grade-a{background:rgba(52,211,153,0.1);border:2px solid var(--emerald);color:var(--emerald);}
  .grade-b{background:rgba(245,158,11,0.1);border:2px solid var(--accent);color:var(--accent);}
  .grade-c{background:rgba(239,68,68,0.1);border:2px solid var(--red);color:var(--red);}
  .result-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
  .act-btn{padding:0.75rem 1.8rem;border-radius:12px;font-family:'Orbitron',monospace;font-size:0.78rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-block;}
  .act-primary{background:linear-gradient(135deg,var(--accent),#d97706);color:#000;border:none;font-weight:800;}
  .act-secondary{background:var(--card);border:1px solid var(--border);color:var(--text);}
  .act-primary:hover{transform:translateY(-2px);}
  .act-secondary:hover{border-color:var(--neon);color:var(--neon);}
</style>
</head>

<div class="wrapper">
  <div id="intro">
    <span class="qt-icon">⚡</span>
    <div class="qt-title">Quick Test · Misi Decoder</div>
    <div class="qt-sub">10 soal — terjemahkan kalimat ke simbol, simbol ke kalimat, dan bangun model dari soal cerita. <strong>Timer 30 detik!</strong></div>
    <div class="info-cards">
      <div class="info-card"><div class="info-val">10</div><div class="info-lbl">Soal</div></div>
      <div class="info-card"><div class="info-val">30s</div><div class="info-lbl">Timer</div></div>
      <div class="info-card"><div class="info-val">+10</div><div class="info-lbl">Per Soal</div></div>
    </div>
    <button class="start-btn" onclick="startGame()">START ⚡</button>
  </div>
  <div id="game">
    <div class="hud">
      <div class="hud-item"><div class="hud-val score-v" id="scoreV">0</div><div class="hud-lbl">Score</div></div>
      <div class="hud-item"><div class="hud-val q-v" id="qV">1/10</div><div class="hud-lbl">Soal</div></div>
      <div class="hud-item"><div class="hud-val timer-v" id="timerV">30</div><div class="hud-lbl">Detik</div></div>
    </div>
    <div class="q-card" id="qCard">
      <div class="q-label">⚡ Quick Test</div>
      <div class="q-type-badge" id="typeBadge">—</div>
      <div class="q-text" id="qText"></div>
      <div class="eq-mini" id="eqArea" style="display:none;"></div>
      <div class="opts" id="optsDiv"></div>
      <div class="feedback" id="feedbackDiv"></div>
    </div>
  </div>
  <div id="result">
    <div style="font-size:4rem;margin-bottom:1rem;">⚡</div>
    <div class="score-big" id="finalScore">0</div>
    <div class="score-label">poin dari 100</div>
    <div class="grade-badge" id="gradeBadge">—</div>
    <div class="result-actions">
      <button class="act-btn act-primary" onclick="resetGame()">ULANG</button>
      <a href="exercise19.html" class="act-btn act-secondary">Exercise 🏋️</a>
      <a href="lesson19.html" class="act-btn act-secondary">Lesson 19</a>
    </div>
  </div>
</div>
<script>
const QS = [
  {type:'k2e',badge:'badge-k2e',badgeLabel:'Kalimat→Ekspresi',
    eq:['"Lima lebih dari suatu bilangan"'],
    text:'Manakah ekspresi yang tepat untuk kalimat di atas?',
    correct:'x + 5',wrongs:['x − 5','5x','x / 5'],expl:'"Lebih dari" = ditambah → x + 5'},
  {type:'k2e',badge:'badge-k2e',badgeLabel:'Kalimat→Ekspresi',
    eq:['"Setengah dari suatu bilangan"'],
    text:'Manakah ekspresi yang tepat untuk kalimat di atas?',
    correct:'x / 2',wrongs:['2x','x + 2','x − 2'],expl:'"Setengah dari" = dibagi 2 → x / 2'},
  {type:'e2k',badge:'badge-e2k',badgeLabel:'Ekspresi→Kalimat',
    eq:['x − 4'],
    text:'Kalimat sehari-hari mana yang paling cocok dengan ekspresi di atas?',
    correct:'Empat kurang dari suatu bilangan',wrongs:['Empat lebih dari suatu bilangan','Suatu bilangan dibagi empat','Empat kali suatu bilangan'],expl:'x − 4 berarti "empat dikurangkan" dari bilangan itu'},
  {type:'e2k',badge:'badge-e2k',badgeLabel:'Ekspresi→Kalimat',
    eq:['3x'],
    text:'Kalimat sehari-hari mana yang paling cocok dengan ekspresi di atas?',
    correct:'Tiga kali suatu bilangan',wrongs:['Tiga lebih dari suatu bilangan','Suatu bilangan dibagi tiga','Tiga kurang dari suatu bilangan'],expl:'3x berarti bilangan itu dikali 3'},
  {type:'pers',badge:'badge-pers',badgeLabel:'Kalimat→Persamaan',
    eq:['"Suatu bilangan ditambah 5 menghasilkan 12"'],
    text:'Manakah persamaan yang tepat?',
    correct:'x + 5 = 12',wrongs:['x − 5 = 12','5x = 12','x + 12 = 5'],expl:'"Menghasilkan" menandai tanda "=" → x + 5 = 12'},
  {type:'pers',badge:'badge-pers',badgeLabel:'Kalimat→Persamaan',
    eq:['"Dua kali suatu bilangan sama dengan 18"'],
    text:'Manakah persamaan yang tepat?',
    correct:'2x = 18',wrongs:['x + 2 = 18','x / 2 = 18','x − 2 = 18'],expl:'"Dua kali" → 2x, "sama dengan" → "=" → 2x = 18'},
  {type:'story',badge:'badge-story',badgeLabel:'Soal Cerita',
    eq:['"Jumlah dua bilangan adalah 15"'],
    text:'Jika kedua bilangan itu x dan y, manakah model yang tepat?',
    correct:'x + y = 15',wrongs:['x − y = 15','xy = 15','x / y = 15'],expl:'"Jumlah" = tanda tambah → x + y = 15'},
  {type:'story',badge:'badge-story',badgeLabel:'Soal Cerita',
    eq:['"Selisih dua bilangan adalah 3, dan hasil kalinya 28"'],
    text:'Jika kedua bilangan itu x dan y, manakah SEPASANG model yang tepat?',
    correct:'x − y = 3 dan xy = 28',wrongs:['x + y = 3 dan xy = 28','x − y = 28 dan xy = 3','x + y = 28 dan x − y = 3'],expl:'"Selisih" → x−y=3, "hasil kali" → xy=28'},
  {type:'story',badge:'badge-story',badgeLabel:'Soal Cerita',
    eq:['"Jumlah umur Rani dan Sari adalah 30 tahun. Selisih umur mereka 6 tahun."'],
    text:'Jika umur Rani = a dan umur Sari = b, manakah SEPASANG persamaan yang tepat?',
    correct:'a + b = 30 dan a − b = 6',wrongs:['a + b = 6 dan a − b = 30','a − b = 30 dan a + b = 6','ab = 30 dan a + b = 6'],expl:'"Jumlah umur...30" → a+b=30. "Selisih umur...6" → a−b=6'},
  {type:'story',badge:'badge-story',badgeLabel:'Soal Cerita',
    eq:['"Harga 1 buku dan 1 pensil jumlahnya Rp9.000. Harga buku Rp3.000 lebih mahal dari pensil."'],
    text:'Jika harga buku = b dan harga pensil = p, manakah SEPASANG model yang tepat?',
    correct:'b + p = 9000 dan b − p = 3000',wrongs:['b + p = 3000 dan b − p = 9000','b − p = 9000 dan b + p = 3000','bp = 9000 dan b − p = 3000'],expl:'"Jumlahnya 9.000" → b+p=9000. "Buku 3.000 lebih mahal" → b−p=3000'},
];

let cur=0, score=0, timer=null, answered=false;
function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}
function showQ(){
  if(cur>=QS.length){endGame();return;}
  answered=false;
  const q=QS[cur];
  document.getElementById('qV').textContent=(cur+1)+'/10';
  const badge=document.getElementById('typeBadge');
  badge.className='q-type-badge '+q.badge;
  badge.textContent=q.badgeLabel;
  document.getElementById('qText').innerHTML=q.text;
  const ea=document.getElementById('eqArea');
  if(q.eq){
    ea.style.display='block';
    ea.innerHTML=q.eq.map(e=>'<div class="el">'+e+'</div>').join('');
  }else{ea.style.display='none';ea.innerHTML='';}
  const opts=shuffle([q.correct,...q.wrongs]);
  const od=document.getElementById('optsDiv');
  od.innerHTML='';
  opts.forEach(opt=>{
    const b=document.createElement('button');
    b.className='opt-btn'; b.textContent=opt;
    b.onclick=()=>pick(opt,q.correct);
    od.appendChild(b);
  });
  document.getElementById('feedbackDiv').textContent='';
  document.getElementById('feedbackDiv').className='feedback';
  startTimer();
}
function startTimer(){
  clearInterval(timer);
  let t=30;
  const tv=document.getElementById('timerV');
  tv.textContent=t; tv.classList.remove('warn');
  timer=setInterval(()=>{
    t--; tv.textContent=t;
    if(t<=8) tv.classList.add('warn');
    if(t<=0){clearInterval(timer);if(!answered)pick('__timeout__',QS[cur].correct);}
  },1000);
}
function pick(chosen,correct){
  if(answered)return;
  answered=true; clearInterval(timer);
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.disabled=true;
    if(b.textContent===chosen&&chosen===correct) b.classList.add('correct');
    else if(b.textContent===chosen) b.classList.add('wrong');
    else if(b.textContent===correct) b.classList.add('correct');
  });
  const fb=document.getElementById('feedbackDiv');
  if(chosen===correct){
    score+=10; document.getElementById('scoreV').textContent=score;
    fb.className='feedback ok'; fb.textContent='✅ BENAR! '+QS[cur].expl;
  } else {
    fb.className='feedback ko';
    fb.textContent=chosen==='__timeout__'?'⏱ WAKTU! '+QS[cur].expl:'❌ '+QS[cur].expl;
  }
  setTimeout(()=>{cur++;showQ();},1800);
}
function endGame(){
  document.getElementById('game').style.display='none';
  document.getElementById('result').style.display='block';
  document.getElementById('finalScore').textContent=score;
  const gb=document.getElementById('gradeBadge');
  if(score>=90){gb.textContent='⭐ RANK S';gb.className='grade-badge grade-s';}
  else if(score>=70){gb.textContent='🏆 RANK A';gb.className='grade-badge grade-a';}
  else if(score>=50){gb.textContent='💪 RANK B';gb.className='grade-badge grade-b';}
  else{gb.textContent='📚 RANK C';gb.className='grade-badge grade-c';}
}
function startGame(){
  cur=0;score=0;
  document.getElementById('intro').style.display='none';
  document.getElementById('game').style.display='block';
  showQ();
}
function resetGame(){
  cur=0;score=0;
  document.getElementById('scoreV').textContent='0';
  document.getElementById('result').style.display='none';
  document.getElementById('game').style.display='block';
  showQ();
}
</script>
</body>
</html>
