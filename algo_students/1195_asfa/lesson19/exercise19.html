<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise · Lesson 19 · Asfa</title>
<link rel="icon" type="image/svg+xml" href="../../../assets/logo1.svg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#1a1a28;--border:#2a2a40;--neon:#00f5c4;--accent:#f59e0b;--text:#e2e8f0;--muted:#64748b;--red:#ef4444;--cyan:#22d3ee;--emerald:#34d399;--amber:#fbbf24;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 10% 20%,rgba(34,211,238,0.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 80%,rgba(251,191,36,0.05) 0%,transparent 50%);pointer-events:none;}
  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;font-family:'Orbitron',monospace;font-size:0.72rem;letter-spacing:1px;}
  nav a{color:var(--muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--neon);}
  nav span{color:var(--border);}
  nav .current{color:var(--emerald);}
  .wrapper{max-width:680px;margin:0 auto;padding:2.5rem 1.5rem 6rem;position:relative;z-index:1;}
  .page-header{text-align:center;margin-bottom:2rem;}
  .page-title{font-family:'Orbitron',monospace;font-size:clamp(1.2rem,4vw,1.8rem);font-weight:900;color:var(--emerald);margin-bottom:0.5rem;}
  .page-sub{color:var(--muted);font-size:0.9rem;}
  .prog-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;margin-bottom:2rem;}
  .prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;}
  .prog-label{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
  .prog-val{font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;color:var(--emerald);}
  .prog-bar{background:var(--border);border-radius:99px;height:6px;overflow:hidden;}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--emerald),var(--neon));border-radius:99px;transition:width 0.5s ease;}
  .dot-row{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.8rem;}
  .dot{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);cursor:pointer;transition:all 0.2s;font-family:'Orbitron',monospace;font-size:0.6rem;display:flex;align-items:center;justify-content:center;color:var(--muted);}
  .dot.done-ok{background:rgba(0,245,196,0.15);border-color:var(--neon);color:var(--neon);}
  .dot.done-ko{background:rgba(239,68,68,0.12);border-color:var(--red);color:var(--red);}
  .dot.active{border-color:var(--emerald);color:var(--emerald);background:rgba(52,211,153,0.1);}
  .q-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.6rem;margin-bottom:1.2rem;display:none;}
  .q-card.active{display:block;animation:fadeIn 0.3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
  .q-num{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:3px;color:var(--emerald);text-transform:uppercase;}
  .q-tag{font-size:0.65rem;padding:0.2rem 0.6rem;border-radius:99px;font-weight:700;}
  .tag-dasar{background:rgba(34,211,238,0.1);color:var(--cyan);border:1px solid rgba(34,211,238,0.3);}
  .tag-k2e{background:rgba(52,211,153,0.1);color:var(--emerald);border:1px solid rgba(52,211,153,0.3);}
  .tag-e2k{background:rgba(251,191,36,0.1);color:var(--amber);border:1px solid rgba(251,191,36,0.3);}
  .tag-pers{background:rgba(0,245,196,0.1);color:var(--neon);border:1px solid rgba(0,245,196,0.3);}
  .tag-cerita{background:rgba(245,158,11,0.1);color:var(--accent);border:1px solid rgba(245,158,11,0.3);}
  .q-text{font-size:0.95rem;line-height:1.7;margin-bottom:1.2rem;color:var(--text);}
  .q-text strong{color:var(--emerald);}
  .sys-box{background:#12121c;border:1.5px solid var(--border);border-radius:12px;padding:0.9rem 1rem;margin-bottom:1.2rem;text-align:center;}
  .sys-eq{font-family:'Nunito',sans-serif;font-style:italic;font-size:0.95rem;font-weight:700;line-height:1.8;color:var(--cyan);}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;margin-bottom:0.8rem;}
  @media(max-width:400px){.opts{grid-template-columns:1fr;}}
  .opt-btn{background:#12121c;border:1px solid var(--border);color:var(--text);padding:0.65rem 0.8rem;border-radius:10px;cursor:pointer;font-family:'Orbitron',monospace;font-size:0.78rem;letter-spacing:1px;transition:all 0.2s;text-align:center;line-height:1.4;}
  .opt-btn:hover:not(:disabled){border-color:var(--emerald);background:rgba(52,211,153,0.07);}
  .opt-btn.correct{border-color:var(--neon);background:rgba(0,245,196,0.1);color:var(--neon);}
  .opt-btn.wrong{border-color:var(--red);background:rgba(239,68,68,0.1);color:var(--red);}
  .opt-btn.reveal-correct{border-color:var(--neon);background:rgba(0,245,196,0.06);color:var(--neon);}
  .q-feedback{min-height:24px;font-size:0.85rem;margin-bottom:0.8rem;line-height:1.5;}
  .q-feedback.ok{color:var(--neon);}
  .q-feedback.ko{color:var(--red);}
  .q-nav{display:flex;gap:0.8rem;justify-content:flex-end;}
  .qnav-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:0.55rem 1.2rem;border-radius:8px;cursor:pointer;font-family:'Orbitron',monospace;font-size:0.7rem;letter-spacing:2px;transition:all 0.2s;}
  .qnav-btn.next{background:linear-gradient(135deg,var(--neon),#059669);border:none;color:#000;font-weight:800;}
  .qnav-btn:hover{border-color:var(--neon);}
  #resultPanel{display:none;background:var(--card);border:1px solid rgba(0,245,196,0.3);border-radius:18px;padding:2rem;text-align:center;margin-top:2rem;}
  .result-score{font-family:'Orbitron',monospace;font-size:3.5rem;font-weight:900;color:var(--neon);margin-bottom:0.3rem;}
  .result-sub{color:var(--muted);font-size:0.85rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:1.5rem;}
  .result-grade{display:inline-block;font-family:'Orbitron',monospace;font-size:1rem;letter-spacing:3px;padding:0.5rem 1.5rem;border-radius:12px;margin-bottom:1.5rem;}
  .rg-s{background:rgba(0,245,196,0.1);border:2px solid var(--neon);color:var(--neon);}
  .rg-a{background:rgba(52,211,153,0.1);border:2px solid var(--emerald);color:var(--emerald);}
  .rg-b{background:rgba(245,158,11,0.1);border:2px solid var(--accent);color:var(--accent);}
  .rg-c{background:rgba(239,68,68,0.1);border:2px solid var(--red);color:var(--red);}
  .result-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
  .ra-btn{padding:0.7rem 1.6rem;border-radius:12px;font-family:'Orbitron',monospace;font-size:0.75rem;letter-spacing:2px;text-decoration:none;display:inline-block;transition:all 0.2s;cursor:pointer;}
  .ra-primary{background:linear-gradient(135deg,var(--neon),#059669);color:#000;border:none;font-weight:800;}
  .ra-secondary{background:var(--card);border:1px solid var(--border);color:var(--text);}
  .ra-primary:hover{transform:translateY(-2px);}
  .ra-secondary:hover{border-color:var(--neon);color:var(--neon);}
</style>
</head>

<div class="wrapper">
  <div class="page-header">
    <div class="page-title">🏋️ Exercise Zone</div>
    <div class="page-sub">20 soal · Bahasa Matematika & Penerjemahan Soal Cerita · Progress tersimpan otomatis</div>
  </div>

  <div class="prog-wrap">
    <div class="prog-top">
      <div class="prog-label">Progress</div>
      <div class="prog-val" id="progVal">0 / 20</div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="dot-row" id="dotRow"></div>
  </div>

  <div id="questionsContainer"></div>
  <div id="resultPanel">
    <div style="font-size:3rem;margin-bottom:1rem;">🏋️</div>
    <div class="result-score" id="rScore">0</div>
    <div class="result-sub">poin dari 200</div>
    <div class="result-grade" id="rGrade">—</div>
    <div class="result-actions">
      <button class="ra-btn ra-primary" onclick="restartExercise()">ULANG SEMUA</button>
      <a href="lesson19.html" class="ra-btn ra-secondary">Lesson 19</a>
      <a href="../asfa_1195.html" class="ra-btn ra-secondary">Back to ASFA</a>
    </div>
  </div>
</div>

<script>
function sysHTML(...lines){
  return `<div class="sys-box"><div class="sys-eq">${lines.join('<br>')}</div></div>`;
}

const QS=[
  // Kamus dasar / kata kunci ke simbol (1-4)
  {tag:'tag-dasar',label:'Kamus Dasar',extra:'',text:'Kata "jumlah" dalam bahasa matematika diterjemahkan menjadi simbol...',correct:'+',wrongs:['−','×','÷'],expl:'"Jumlah" selalu berarti tanda tambah (+) ✓'},
  {tag:'tag-dasar',label:'Kamus Dasar',extra:'',text:'Kata "selisih" dalam bahasa matematika diterjemahkan menjadi simbol...',correct:'−',wrongs:['+','×','÷'],expl:'"Selisih" selalu berarti tanda kurang (−) ✓'},
  {tag:'tag-dasar',label:'Kamus Dasar',extra:'',text:'Frasa "hasil kali dua bilangan" diterjemahkan menjadi...',correct:'xy',wrongs:['x + y','x − y','x / y'],expl:'"Hasil kali" → dikali → xy ✓'},
  {tag:'tag-dasar',label:'Kamus Dasar',extra:'',text:'Frasa "hasil bagi dua bilangan" diterjemahkan menjadi...',correct:'x / y',wrongs:['x + y','x − y','xy'],expl:'"Hasil bagi" → dibagi → x / y ✓'},
  // Kalimat ke ekspresi (5-8)
  {tag:'tag-k2e',label:'Kalimat→Ekspresi',extra:'',text:'"Tujuh lebih dari suatu bilangan" — manakah ekspresi yang tepat (x = bilangan itu)?',correct:'x + 7',wrongs:['x − 7','7x','x / 7'],expl:'"Lebih dari" = ditambah → x + 7 ✓'},
  {tag:'tag-k2e',label:'Kalimat→Ekspresi',extra:'',text:'"Enam kurang dari suatu bilangan" — manakah ekspresi yang tepat?',correct:'x − 6',wrongs:['x + 6','6x','6 − x'],expl:'"Kurang dari" = dikurangkan dari bilangan → x − 6 ✓'},
  {tag:'tag-k2e',label:'Kalimat→Ekspresi',extra:'',text:'"Empat kali suatu bilangan" — manakah ekspresi yang tepat?',correct:'4x',wrongs:['x + 4','x − 4','x / 4'],expl:'"Kali" → dikali → 4x ✓'},
  {tag:'tag-k2e',label:'Kalimat→Ekspresi',extra:'',text:'"Sepertiga dari suatu bilangan" — manakah ekspresi yang tepat?',correct:'x / 3',wrongs:['3x','x + 3','x − 3'],expl:'"...dari" pada pecahan → dibagi → x / 3 ✓'},
  // Ekspresi ke kalimat (9-11)
  {tag:'tag-e2k',label:'Ekspresi→Kalimat',extra:sysHTML('x + 9'),text:'Manakah kalimat sehari-hari yang paling tepat untuk ekspresi di atas?',correct:'Sembilan lebih dari suatu bilangan',wrongs:['Sembilan kurang dari suatu bilangan','Suatu bilangan dibagi sembilan','Sembilan kali suatu bilangan'],expl:'x + 9 berarti "sembilan ditambahkan" pada bilangan itu ✓'},
  {tag:'tag-e2k',label:'Ekspresi→Kalimat',extra:sysHTML('5x'),text:'Manakah kalimat sehari-hari yang paling tepat untuk ekspresi di atas?',correct:'Lima kali suatu bilangan',wrongs:['Lima lebih dari suatu bilangan','Suatu bilangan dibagi lima','Lima kurang dari suatu bilangan'],expl:'5x berarti bilangan itu dikali 5 ✓'},
  {tag:'tag-e2k',label:'Ekspresi→Kalimat',extra:sysHTML('x − 6'),text:'Manakah kalimat sehari-hari yang paling tepat untuk ekspresi di atas?',correct:'Enam kurang dari suatu bilangan',wrongs:['Enam lebih dari suatu bilangan','Enam kali suatu bilangan','Suatu bilangan dibagi enam'],expl:'x − 6 berarti "enam dikurangkan" dari bilangan itu ✓'},
  // Kalimat ke persamaan (12-14)
  {tag:'tag-pers',label:'Kalimat→Persamaan',extra:'',text:'"Suatu bilangan ditambah 8 menghasilkan 20" — manakah persamaan yang tepat?',correct:'x + 8 = 20',wrongs:['x − 8 = 20','8x = 20','x + 20 = 8'],expl:'"Menghasilkan" = ada tanda "=" → x + 8 = 20 ✓'},
  {tag:'tag-pers',label:'Kalimat→Persamaan',extra:'',text:'"Tiga kali suatu bilangan sama dengan 21" — manakah persamaan yang tepat?',correct:'3x = 21',wrongs:['x + 3 = 21','x − 3 = 21','x / 3 = 21'],expl:'"Tiga kali" → 3x, "sama dengan" → "=" → 3x = 21 ✓'},
  {tag:'tag-pers',label:'Kalimat→Persamaan',extra:'',text:'"Suatu bilangan dikurangi 5 adalah 11" — manakah persamaan yang tepat?',correct:'x − 5 = 11',wrongs:['x + 5 = 11','5 − x = 11','5x = 11'],expl:'"Dikurangi 5" → x − 5, "adalah" → "=" → x − 5 = 11 ✓'},
  // Soal cerita / model SPLDV (15-20)
  {tag:'tag-cerita',label:'Soal Cerita',extra:'',text:'"Jumlah dua bilangan adalah 18. Selisihnya adalah 2." Jika bilangan itu x dan y, model SPLDV yang tepat adalah...',correct:'x + y = 18 dan x − y = 2',wrongs:['x + y = 2 dan x − y = 18','x − y = 18 dan x + y = 2','xy = 18 dan x + y = 2'],expl:'"Jumlah" → +, "Selisih" → −. Jumlah=18, selisih=2 ✓'},
  {tag:'tag-cerita',label:'Soal Cerita',extra:'',text:'"Jumlah umur Tia dan Wati adalah 28 tahun. Selisih umur mereka 6 tahun." Jika umur Tia = a, umur Wati = b, model yang tepat...',correct:'a + b = 28 dan a − b = 6',wrongs:['a + b = 6 dan a − b = 28','a − b = 28 dan a + b = 6','ab = 28 dan a − b = 6'],expl:'"Jumlah umur...28" → a+b=28. "Selisih umur...6" → a−b=6 ✓'},
  {tag:'tag-cerita',label:'Soal Cerita',extra:'',text:'"Harga 1 kaos dan 1 topi jumlahnya Rp120.000. Harga kaos Rp40.000 lebih mahal dari topi." Jika kaos=k, topi=t, model yang tepat...',correct:'k + t = 120000 dan k − t = 40000',wrongs:['k + t = 40000 dan k − t = 120000','k − t = 120000 dan k + t = 40000','kt = 120000 dan k − t = 40000'],expl:'"Jumlahnya 120.000" → k+t=120000. "Kaos 40.000 lebih mahal" → k−t=40000 ✓'},
  {tag:'tag-cerita',label:'Soal Cerita',extra:'',text:'"Sebuah bilangan dua kali bilangan lainnya. Jumlah keduanya adalah 21." Jika bilangan itu x dan y (x = 2y), model yang tepat...',correct:'x = 2y dan x + y = 21',wrongs:['y = 2x dan x + y = 21','x = 2y dan x − y = 21','x + y = 2 dan x = 21y'],expl:'"Dua kali bilangan lainnya" → x=2y. "Jumlah keduanya 21" → x+y=21 ✓'},
  {tag:'tag-cerita',label:'Soal Cerita',extra:'',text:'"Keliling sebuah persegi panjang adalah 26 cm. Panjangnya 3 cm lebih dari lebarnya." Jika panjang=p, lebar=l, manakah model yang tepat untuk hubungan panjang dan lebar?',correct:'p = l + 3',wrongs:['p = l − 3','p = 3l','l = p + 3'],expl:'"Panjangnya 3 cm lebih dari lebarnya" → p = l + 3 ✓'},
  {tag:'tag-cerita',label:'Soal Cerita',extra:'',text:'"2 tiket anak dan 1 tiket dewasa berharga Rp70.000." Jika harga tiket anak = a dan tiket dewasa = d, manakah model yang tepat?',correct:'2a + d = 70000',wrongs:['a + 2d = 70000','2a − d = 70000','a + d = 70000'],expl:'"2 tiket anak" → 2a, "1 tiket dewasa" → d, jumlahnya 70000 → 2a + d = 70000 ✓'},
];

const STATE_KEY='ex19_state';
let state={answers:{},done:0,total:QS.length};
function saveState(){localStorage.setItem(STATE_KEY,JSON.stringify(state));}
function loadState(){try{const s=localStorage.getItem(STATE_KEY);if(s)state=JSON.parse(s);}catch(e){}}
function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}

function buildDots(){
  const dr=document.getElementById('dotRow');
  dr.innerHTML='';
  for(let i=0;i<QS.length;i++){
    const d=document.createElement('div');
    d.className='dot';
    d.textContent=i+1;
    d.id='dot'+i;
    if(state.answers[i]!==undefined){d.classList.add(state.answers[i]?'done-ok':'done-ko');}
    d.onclick=()=>showQ(i);
    dr.appendChild(d);
  }
}
function buildQuestions(){
  const cont=document.getElementById('questionsContainer');
  cont.innerHTML='';
  QS.forEach((q,i)=>{
    const card=document.createElement('div');
    card.className='q-card'+(i===0?' active':'');
    card.id='qcard'+i;
    const opts=shuffle([q.correct,...q.wrongs]);
    let optsHTML=opts.map(o=>`<button class="opt-btn" onclick="answer(${i},'${o.replace(/'/g,"\\'")}',this)">${o}</button>`).join('');
    card.innerHTML=`
      <div class="q-meta">
        <div class="q-num">Soal ${i+1} / 20</div>
        <div class="q-tag ${q.tag}">${q.label}</div>
      </div>
      ${q.extra}
      <div class="q-text">${q.text}</div>
      <div class="opts">${optsHTML}</div>
      <div class="q-feedback" id="fb${i}"></div>
      <div class="q-nav">
        ${i>0?`<button class="qnav-btn" onclick="showQ(${i-1})">← Prev</button>`:''}
        ${i<QS.length-1?`<button class="qnav-btn next" id="nxt${i}" onclick="showQ(${i+1})" style="display:none">Next →</button>`:''}
      </div>
    `;
    cont.appendChild(card);
    if(state.answers[i]!==undefined) restoreAnswer(i, q, opts);
  });
}
function restoreAnswer(i,q,opts){
  const card=document.getElementById('qcard'+i);
  const btns=card.querySelectorAll('.opt-btn');
  btns.forEach(b=>{
    b.disabled=true;
    if(b.textContent===q.correct) b.classList.add(state.answers[i]?'correct':'reveal-correct');
  });
  const fb=document.getElementById('fb'+i);
  if(state.answers[i]){fb.className='q-feedback ok';fb.textContent='✅ '+q.expl;}
  else{fb.className='q-feedback ko';fb.textContent='❌ '+q.expl;}
  const nxt=document.getElementById('nxt'+i);
  if(nxt) nxt.style.display='inline-block';
}
function answer(i, chosen, btn){
  if(state.answers[i]!==undefined) return;
  const q=QS[i];
  const correct=chosen===q.correct;
  state.answers[i]=correct;
  if(correct) state.done++;
  saveState();
  const card=document.getElementById('qcard'+i);
  card.querySelectorAll('.opt-btn').forEach(b=>{
    b.disabled=true;
    if(b.textContent===q.correct) b.classList.add('correct');
    else if(b===btn) b.classList.add('wrong');
  });
  const fb=document.getElementById('fb'+i);
  if(correct){fb.className='q-feedback ok';fb.textContent='✅ '+q.expl;}
  else{fb.className='q-feedback ko';fb.textContent='❌ '+q.expl;}
  const dot=document.getElementById('dot'+i);
  dot.classList.remove('active');
  dot.classList.add(correct?'done-ok':'done-ko');
  const nxt=document.getElementById('nxt'+i);
  if(nxt) nxt.style.display='inline-block';
  updateProgress();
  if(Object.keys(state.answers).length===QS.length) setTimeout(showResult,600);
}
function showQ(i){
  document.querySelectorAll('.q-card').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));
  document.getElementById('qcard'+i).classList.add('active');
  document.getElementById('dot'+i).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}
function updateProgress(){
  const done=Object.keys(state.answers).length;
  document.getElementById('progVal').textContent=done+' / 20';
  document.getElementById('progFill').style.width=(done/QS.length*100)+'%';
}
function showResult(){
  document.getElementById('resultPanel').style.display='block';
  const correct=Object.values(state.answers).filter(Boolean).length;
  const pts=correct*10;
  document.getElementById('rScore').textContent=pts;
  const rg=document.getElementById('rGrade');
  if(pts>=180){rg.textContent='⭐ RANK S';rg.className='result-grade rg-s';}
  else if(pts>=140){rg.textContent='🏆 RANK A';rg.className='result-grade rg-a';}
  else if(pts>=100){rg.textContent='💪 RANK B';rg.className='result-grade rg-b';}
  else{rg.textContent='📚 RANK C';rg.className='result-grade rg-c';}
  document.getElementById('resultPanel').scrollIntoView({behavior:'smooth'});
}
function restartExercise(){
  state={answers:{},done:0,total:QS.length};
  saveState();
  location.reload();
}
loadState();
buildDots();
buildQuestions();
updateProgress();
showQ(0);
if(Object.keys(state.answers).length===QS.length) setTimeout(showResult,200);
</script>
</body>
