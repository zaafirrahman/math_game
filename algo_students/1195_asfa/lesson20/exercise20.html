<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise · Lesson 20 · Asfa</title>
<link rel="icon" type="image/svg+xml" href="../../../assets/logo1.svg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#1a1a28;--border:#2a2a40;--neon:#00f5c4;--accent:#f59e0b;--text:#e2e8f0;--muted:#64748b;--red:#ef4444;--cyan:#22d3ee;--emerald:#34d399;--amber:#fbbf24;--violet:#a78bfa;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 10% 20%,rgba(34,211,238,0.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 80%,rgba(167,139,250,0.05) 0%,transparent 50%);pointer-events:none;}
  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;font-family:'Orbitron',monospace;font-size:0.72rem;letter-spacing:1px;}
  nav a{color:var(--muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--neon);}
  nav span{color:var(--border);}
  nav .current{color:var(--emerald);}
  .wrapper{max-width:680px;margin:0 auto;padding:2.5rem 1.5rem 6rem;position:relative;z-index:1;}
  .page-header{text-align:center;margin-bottom:2rem;}
  .page-title{font-family:'Orbitron',monospace;font-size:clamp(1.2rem,4vw,1.8rem);font-weight:900;color:var(--emerald);margin-bottom:0.5rem;}
  .page-sub{color:var(--muted);font-size:0.9rem;}
  .prog-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;margin-bottom:2rem;}
  .prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;}
  .prog-label{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
  .prog-val{font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;color:var(--emerald);}
  .prog-bar{background:var(--border);border-radius:99px;height:6px;overflow:hidden;}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--neon));border-radius:99px;transition:width 0.5s ease;}
  .dot-row{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.8rem;}
  .dot{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);cursor:pointer;transition:all 0.2s;font-family:'Orbitron',monospace;font-size:0.6rem;display:flex;align-items:center;justify-content:center;color:var(--muted);}
  .dot.done-ok{background:rgba(0,245,196,0.15);border-color:var(--neon);color:var(--neon);}
  .dot.done-ko{background:rgba(239,68,68,0.12);border-color:var(--red);color:var(--red);}
  .dot.active{border-color:var(--violet);color:var(--violet);background:rgba(167,139,250,0.1);}
  .q-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.6rem;margin-bottom:1.2rem;display:none;}
  .q-card.active{display:block;animation:fadeIn 0.3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
  .q-num{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:3px;color:var(--violet);text-transform:uppercase;}
  .q-tag{font-size:0.65rem;padding:0.2rem 0.6rem;border-radius:99px;font-weight:700;}
  .tag-tabel{background:rgba(167,139,250,0.1);color:var(--violet);border:1px solid rgba(167,139,250,0.3);}
  .tag-batang{background:rgba(34,211,238,0.1);color:var(--cyan);border:1px solid rgba(34,211,238,0.3);}
  .tag-frekuensi{background:rgba(52,211,153,0.1);color:var(--emerald);border:1px solid rgba(52,211,153,0.3);}
  .tag-garis{background:rgba(251,191,36,0.1);color:var(--amber);border:1px solid rgba(251,191,36,0.3);}
  .tag-analisis{background:rgba(0,245,196,0.1);color:var(--neon);border:1px solid rgba(0,245,196,0.3);}
  .q-text{font-size:0.95rem;line-height:1.7;margin-bottom:1rem;color:var(--text);}
  .q-text strong{color:var(--violet);}
  /* mini visuals */
  .mini-table{width:100%;border-collapse:separate;border-spacing:0;background:#12121c;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:1rem;font-size:0.85rem;}
  .mini-table th{font-family:'Orbitron',monospace;font-size:0.58rem;letter-spacing:2px;color:var(--violet);background:rgba(167,139,250,0.07);padding:0.55rem;text-align:center;}
  .mini-table td{padding:0.5rem;text-align:center;border-top:1px solid var(--border);}
  .mini-chart{background:#12121c;border:1.5px solid var(--border);border-radius:12px;padding:0.8rem 0.5rem 0.5rem;margin-bottom:1rem;}
  .mini-chart-title{font-family:'Orbitron',monospace;font-size:0.52rem;letter-spacing:2px;color:var(--muted);text-align:center;margin-bottom:0.4rem;}
  .bars-wrap{display:flex;align-items:flex-end;gap:6px;height:65px;justify-content:center;}
  .bc{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .bv{font-size:0.6rem;color:var(--muted);}
  .bf{border-radius:3px 3px 0 0;}
  .bl{font-size:0.58rem;color:var(--muted);font-family:'Orbitron',monospace;}
  .raw-box{background:#12121c;border:1.5px solid var(--border);border-radius:12px;padding:0.75rem;text-align:center;font-family:'Orbitron',monospace;font-size:0.85rem;color:var(--cyan);letter-spacing:2px;margin-bottom:1rem;line-height:1.8;}
  /* opts */
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;margin-bottom:0.8rem;}
  @media(max-width:400px){.opts{grid-template-columns:1fr;}}
  .opt-btn{background:#12121c;border:1px solid var(--border);color:var(--text);padding:0.65rem 0.8rem;border-radius:10px;cursor:pointer;font-family:'Orbitron',monospace;font-size:0.78rem;letter-spacing:1px;transition:all 0.2s;text-align:center;line-height:1.4;}
  .opt-btn:hover:not(:disabled){border-color:var(--violet);background:rgba(167,139,250,0.07);}
  .opt-btn.correct{border-color:var(--neon);background:rgba(0,245,196,0.1);color:var(--neon);}
  .opt-btn.wrong{border-color:var(--red);background:rgba(239,68,68,0.1);color:var(--red);}
  .opt-btn.reveal-correct{border-color:var(--neon);background:rgba(0,245,196,0.06);color:var(--neon);}
  .q-feedback{min-height:24px;font-size:0.85rem;margin-bottom:0.8rem;line-height:1.5;}
  .q-feedback.ok{color:var(--neon);}
  .q-feedback.ko{color:var(--red);}
  .q-nav{display:flex;gap:0.8rem;justify-content:flex-end;}
  .qnav-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:0.55rem 1.2rem;border-radius:8px;cursor:pointer;font-family:'Orbitron',monospace;font-size:0.7rem;letter-spacing:2px;transition:all 0.2s;}
  .qnav-btn.next{background:linear-gradient(135deg,var(--violet),#7c3aed);border:none;color:#fff;font-weight:800;}
  .qnav-btn:hover:not(.next){border-color:var(--violet);}
  #resultPanel{display:none;background:var(--card);border:1px solid rgba(167,139,250,0.3);border-radius:18px;padding:2rem;text-align:center;margin-top:2rem;}
  .result-score{font-family:'Orbitron',monospace;font-size:3.5rem;font-weight:900;color:var(--violet);margin-bottom:0.3rem;}
  .result-sub{color:var(--muted);font-size:0.85rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:1.5rem;}
  .result-grade{display:inline-block;font-family:'Orbitron',monospace;font-size:1rem;letter-spacing:3px;padding:0.5rem 1.5rem;border-radius:12px;margin-bottom:1.5rem;}
  .rg-s{background:rgba(0,245,196,0.1);border:2px solid var(--neon);color:var(--neon);}
  .rg-a{background:rgba(167,139,250,0.1);border:2px solid var(--violet);color:var(--violet);}
  .rg-b{background:rgba(245,158,11,0.1);border:2px solid var(--accent);color:var(--accent);}
  .rg-c{background:rgba(239,68,68,0.1);border:2px solid var(--red);color:var(--red);}
  .result-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
  .ra-btn{padding:0.7rem 1.6rem;border-radius:12px;font-family:'Orbitron',monospace;font-size:0.75rem;letter-spacing:2px;text-decoration:none;display:inline-block;transition:all 0.2s;cursor:pointer;}
  .ra-primary{background:linear-gradient(135deg,var(--violet),#7c3aed);color:#fff;border:none;font-weight:800;}
  .ra-secondary{background:var(--card);border:1px solid var(--border);color:var(--text);}
  .ra-primary:hover{transform:translateY(-2px);}
  .ra-secondary:hover{border-color:var(--violet);color:var(--violet);}
  .reset-link{font-family:'Orbitron',monospace;font-size:0.65rem;color:var(--muted);cursor:pointer;text-decoration:underline;display:block;text-align:right;margin-top:0.5rem;}
  .reset-link:hover{color:var(--red);}
</style>

<script>
const KEY='asfa_ex20_v1';
const QS=[
  // Tabel
  {tag:'tabel',type:'table',thead:['Hari','Pengunjung'],tbody:[['Senin','20'],['Selasa','32'],['Rabu','28'],['Kamis','35'],['Jumat','25']],q:'Hari apa jumlah pengunjung paling banyak?',cx:'Kamis',wx:['Selasa','Rabu','Jumat'],expl:'Kamis=35 — paling tinggi.'},
  {tag:'tabel',type:'table',thead:['Hari','Pengunjung'],tbody:[['Senin','20'],['Selasa','32'],['Rabu','28'],['Kamis','35'],['Jumat','25']],q:'Berapa rata-rata pengunjung per hari?',cx:'28',wx:['30','25','32'],expl:'Total=140, dibagi 5 hari = 28.'},
  {tag:'frekuensi',type:'raw',rawStr:'4 · 2 · 3 · 4 · 2 · 4 · 3 · 4 · 2 · 3',q:'Berapa frekuensi nilai 4?',cx:'4',wx:['3','2','5'],expl:'Nilai 4 muncul di posisi 1,4,6,8 → 4 kali.'},
  {tag:'frekuensi',type:'raw',rawStr:'4 · 2 · 3 · 4 · 2 · 4 · 3 · 4 · 2 · 3',q:'Nilai apa yang paling sering muncul?',cx:'4',wx:['3','2','Semua sama'],expl:'4 muncul 4×, 3 muncul 3×, 2 muncul 3×. Nilai 4 paling sering.'},
  {tag:'tabel',type:'table',thead:['Nilai','Frekuensi'],tbody:[['65','3'],['75','5'],['85','7'],['95','5']],q:'Berapa total siswa dalam tabel ini?',cx:'20',wx:['18','22','25'],expl:'3+5+7+5=20 siswa.'},
  {tag:'analisis',type:'table',thead:['Nilai','Frekuensi'],tbody:[['65','3'],['75','5'],['85','7'],['95','5']],q:'Nilai apa yang paling sering muncul?',cx:'85',wx:['75','95','65'],expl:'Nilai 85 punya frekuensi 7 — tertinggi.'},
  {tag:'batang',type:'bars',chartTitle:'Hobi Siswa Kelas 8',data:[{lbl:'Buku',val:6,c:'rgba(167,139,250,0.8)'},{lbl:'Game',val:10,c:'rgba(34,211,238,0.8)'},{lbl:'Musik',val:8,c:'rgba(52,211,153,0.8)'},{lbl:'Sport',val:6,c:'rgba(251,191,36,0.8)'}],q:'Hobi apa yang paling populer?',cx:'Game',wx:['Musik','Buku','Sport'],expl:'Batang Game paling tinggi = 10 siswa.'},
  {tag:'batang',type:'bars',chartTitle:'Hobi Siswa Kelas 8',data:[{lbl:'Buku',val:6,c:'rgba(167,139,250,0.8)'},{lbl:'Game',val:10,c:'rgba(34,211,238,0.8)'},{lbl:'Musik',val:8,c:'rgba(52,211,153,0.8)'},{lbl:'Sport',val:6,c:'rgba(251,191,36,0.8)'}],q:'Berapa total siswa dalam diagram ini?',cx:'30',wx:['28','32','26'],expl:'6+10+8+6=30 siswa.'},
  {tag:'garis',type:'tren',days:['Sen','Sel','Rab','Kam','Jum'],vals:[30,45,40,55,60],q:'Pada hari apa data sempat TURUN?',cx:'Rabu',wx:['Selasa','Kamis','Jumat'],expl:'Rabu=40 < Selasa=45, jadi terjadi penurunan pada Rabu.'},
  {tag:'garis',type:'tren',days:['Sen','Sel','Rab','Kam','Jum'],vals:[30,45,40,55,60],q:'Secara keseluruhan tren datanya adalah?',cx:'Meningkat',wx:['Menurun','Stabil','Tidak berpola'],expl:'Dari 30 (Senin) ke 60 (Jumat) — secara umum MENINGKAT meski ada penurunan di Rabu.'},
  {tag:'frekuensi',type:'raw',rawStr:'7 · 8 · 7 · 9 · 8 · 7 · 8 · 9 · 7 · 8',q:'Berapa frekuensi nilai 8?',cx:'4',wx:['3','5','2'],expl:'Nilai 8 muncul di posisi 2,5,7,10 → 4 kali.'},
  {tag:'frekuensi',type:'raw',rawStr:'7 · 8 · 7 · 9 · 8 · 7 · 8 · 9 · 7 · 8',q:'Berapa banyak nilai BERBEDA dalam data?',cx:'3',wx:['4','2','5'],expl:'Nilai unik: 7, 8, 9 → ada 3 nilai berbeda.'},
  {tag:'tabel',type:'table',thead:['Bulan','Penjualan (juta)'],tbody:[['Jan','120'],['Feb','90'],['Mar','150'],['Apr','130'],['Mei','180']],q:'Bulan apa penjualan paling rendah?',cx:'Februari',wx:['Januari','April','Maret'],expl:'Februari=90 — paling kecil dari semua bulan.'},
  {tag:'analisis',type:'table',thead:['Bulan','Penjualan (juta)'],tbody:[['Jan','120'],['Feb','90'],['Mar','150'],['Apr','130'],['Mei','180']],q:'Berapa kenaikan penjualan dari Januari ke Maret?',cx:'30 juta',wx:['60 juta','20 juta','40 juta'],expl:'Maret=150, Jan=120. Kenaikan=150−120=30 juta.'},
  {tag:'batang',type:'bars',chartTitle:'Nilai Ulangan',data:[{lbl:'60',val:2,c:'rgba(239,68,68,0.7)'},{lbl:'70',val:5,c:'rgba(167,139,250,0.7)'},{lbl:'80',val:8,c:'rgba(0,245,196,0.8)'},{lbl:'90',val:4,c:'rgba(34,211,238,0.7)'},{lbl:'100',val:1,c:'rgba(251,191,36,0.7)'}],q:'Berapa persen siswa yang dapat nilai 80? (Total=20)',cx:'40%',wx:['30%','50%','25%'],expl:'8 dari 20 siswa dapat nilai 80. 8/20×100%=40%.'},
  {tag:'analisis',type:'bars',chartTitle:'Nilai Ulangan',data:[{lbl:'60',val:2,c:'rgba(239,68,68,0.7)'},{lbl:'70',val:5,c:'rgba(167,139,250,0.7)'},{lbl:'80',val:8,c:'rgba(0,245,196,0.8)'},{lbl:'90',val:4,c:'rgba(34,211,238,0.7)'},{lbl:'100',val:1,c:'rgba(251,191,36,0.7)'}],q:'Berapa siswa yang mendapat nilai di atas 70?',cx:'13',wx:['12','14','8'],expl:'Nilai>70: nilai 80(8)+90(4)+100(1)=13 siswa.'},
  {tag:'tabel',type:'table',thead:['Hari','Suhu (°C)'],tbody:[['Senin','28'],['Selasa','30'],['Rabu','29'],['Kamis','32'],['Jumat','31']],q:'Berapa selisih suhu tertinggi dan terendah?',cx:'4°C',wx:['3°C','5°C','2°C'],expl:'Tertinggi Kamis=32, terendah Senin=28. Selisih=32−28=4°C.'},
  {tag:'frekuensi',type:'raw',rawStr:'A · B · A · C · B · A · B · A · C · B',q:'Nilai frekuensi B adalah?',cx:'4',wx:['3','5','2'],expl:'B muncul di posisi 2,5,7,10 → 4 kali.'},
  {tag:'analisis',type:'table',thead:['Kelas','Nilai Rata-rata'],tbody:[['8A','78'],['8B','82'],['8C','75'],['8D','85'],['8E','80']],q:'Kelas mana yang nilai rata-ratanya di atas 80?',cx:'8B dan 8D',wx:['8D saja','8A dan 8B','8B, 8D, dan 8E'],expl:'8B=82>80 ✓, 8D=85>80 ✓. 8E=80 tidak lebih dari 80 (sama dengan).'},
  {tag:'analisis',type:'table',thead:['Kelas','Nilai Rata-rata'],tbody:[['8A','78'],['8B','82'],['8C','75'],['8D','85'],['8E','80']],q:'Berapa rata-rata dari semua nilai rata-rata kelas?',cx:'80',wx:['79','81','82'],expl:'(78+82+75+85+80)÷5=400÷5=80.'},
];

let state={};
function loadState(){
  try{const s=localStorage.getItem(KEY);if(s){state=JSON.parse(s);}}catch(e){state={};}
  if(!state.answers) state.answers={};
}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}

function renderVisual(q){
  if(q.type==='table'){
    let h='<table class="mini-table"><thead><tr>';
    q.thead.forEach(t=>h+=`<th>${t}</th>`);
    h+='</tr></thead><tbody>';
    q.tbody.forEach(r=>{h+='<tr>';r.forEach(c=>h+=`<td>${c}</td>`);h+='</tr>';});
    h+='</tbody></table>';
    return h;
  } else if(q.type==='bars'){
    const mv=Math.max(...q.data.map(x=>x.val));
    let h=`<div class="mini-chart"><div class="mini-chart-title">${q.chartTitle}</div><div class="bars-wrap">`;
    q.data.forEach(b=>{
      const bh=Math.round((b.val/mv)*62);
      h+=`<div class="bc"><div class="bv">${b.val}</div><div class="bf" style="width:32px;height:${bh}px;background:${b.c};"></div><div class="bl">${b.lbl}</div></div>`;
    });
    h+='</div></div>';
    return h;
  } else if(q.type==='raw'){
    return `<div class="raw-box">${q.rawStr}</div>`;
  } else if(q.type==='tren'){
    const vals=q.vals, days=q.days, mv=Math.max(...vals);
    const xs=[55,100,150,200,255];
    const ys=vals.map(v=>90-Math.round((v/mv)*72));
    const pts=xs.map((x,i)=>`${x},${ys[i]}`).join(' ');
    const dots=xs.map((x,i)=>`<circle cx="${x}" cy="${ys[i]}" r="4" fill="#a78bfa"/><text x="${x}" y="${ys[i]-7}" fill="#64748b" font-size="8" text-anchor="middle">${vals[i]}</text>`).join('');
    const xlbls=days.map((d,i)=>`<text x="${xs[i]}" y="108" fill="#64748b" font-size="8" text-anchor="middle">${d}</text>`).join('');
    return `<div class="mini-chart"><div class="mini-chart-title">Tren Data Harian</div><svg width="100%" viewBox="0 0 310 120"><line x1="40" y1="100" x2="280" y2="100" stroke="#2a2a40" stroke-width="1.5"/><polyline points="${pts}" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linejoin="round"/>${dots}${xlbls}</svg></div>`;
  }
  return '';
}

function renderAll(){
  const qd=document.getElementById('questionsDiv');
  qd.innerHTML='';
  QS.forEach((q,i)=>{
    const ans=state.answers[i];
    const done=ans!==undefined;
    const opts=shuffle([q.cx,...q.wx]);
    const tagClass='tag-'+q.tag;
    let optsHtml='';
    opts.forEach(v=>{
      let cls='opt-btn';
      if(done){
        if(v===q.cx) cls+=' reveal-correct';
        if(v===ans&&ans!==q.cx) cls+=' wrong';
      }
      optsHtml+=`<button class="${cls}" onclick="pickQ(${i},'${v.replace(/'/g,"\\'")}',this)" ${done?'disabled':''}>${v}</button>`;
    });
    let fbHtml='';
    if(done){
      const ok=ans===q.cx;
      fbHtml=`<div class="q-feedback ${ok?'ok':'ko'}">${ok?'✅ '+q.expl:'❌ Benar: '+q.cx+'. '+q.expl}</div>`;
    } else {
      fbHtml=`<div class="q-feedback" id="fb${i}"></div>`;
    }
    const isActive=(i===currentQ())?'active':'';
    qd.innerHTML+=`
    <div class="q-card ${isActive}" id="qcard${i}">
      <div class="q-meta">
        <div class="q-num">Soal ${i+1} / 20</div>
        <span class="q-tag ${tagClass}">${q.tag}</span>
      </div>
      ${renderVisual(q)}
      <div class="q-text">${q.q}</div>
      <div class="opts">${optsHtml}</div>
      ${fbHtml}
      <div class="q-nav">
        ${i>0?`<button class="qnav-btn" onclick="jumpQ(${i-1})">← Prev</button>`:''}
        ${i<19?`<button class="qnav-btn next" onclick="jumpQ(${i+1})">Next →</button>`:'<button class="qnav-btn next" onclick="showResult()">Lihat Hasil 🎉</button>'}
      </div>
    </div>`;
  });
  updateProgress();
}

function currentQ(){
  const done=Object.keys(state.answers).length;
  for(let i=0;i<20;i++){if(state.answers[i]===undefined)return i;}
  return 19;
}
function jumpQ(n){
  document.querySelectorAll('.q-card').forEach(c=>c.classList.remove('active'));
  document.getElementById('qcard'+n).classList.add('active');
  window.scrollTo({top:document.getElementById('qcard'+n).offsetTop-80,behavior:'smooth'});
}
function pickQ(idx,chosen,btn){
  if(state.answers[idx]!==undefined)return;
  state.answers[idx]=chosen;
  saveState();
  const q=QS[idx];
  const btns=btn.closest('.opts').querySelectorAll('.opt-btn');
  btns.forEach(b=>{
    b.disabled=true;
    const v=b.textContent;
    if(v===q.cx) b.classList.add('reveal-correct');
    if(v===chosen&&chosen!==q.cx) b.classList.add('wrong');
  });
  const fb=document.getElementById('fb'+idx);
  if(fb){
    const ok=chosen===q.cx;
    fb.className='q-feedback '+(ok?'ok':'ko');
    fb.textContent=ok?'✅ '+q.expl:'❌ Benar: '+q.cx+'. '+q.expl;
  }
  updateProgress();
  // auto-advance after 1.5s
  if(idx<19) setTimeout(()=>jumpQ(idx+1),1600);
  else setTimeout(()=>showResult(),1600);
}
function updateProgress(){
  const done=Object.keys(state.answers).length;
  document.getElementById('progVal').textContent=done+' / 20';
  document.getElementById('progFill').style.width=(done/20*100)+'%';
  const dr=document.getElementById('dotRow');
  dr.innerHTML='';
  for(let i=0;i<20;i++){
    const a=state.answers[i];
    let cls='dot';
    if(a!==undefined) cls+=(a===QS[i].cx?' done-ok':' done-ko');
    else if(i===currentQ()) cls+=' active';
    dr.innerHTML+=`<div class="${cls}" onclick="jumpQ(${i})" title="Soal ${i+1}">${i+1}</div>`;
  }
}
function showResult(){
  const done=Object.keys(state.answers).length;
  if(done<20){jumpQ(currentQ());return;}
  let correct=0;
  QS.forEach((q,i)=>{if(state.answers[i]===q.cx)correct++;});
  const pts=correct*10;
  document.getElementById('resultPanel').style.display='block';
  document.getElementById('rScore').textContent=pts;
  const rg=document.getElementById('rGrade');
  if(correct>=18){rg.textContent='⭐ RANK S — DATA MASTER';rg.className='result-grade rg-s';}
  else if(correct>=14){rg.textContent='🏆 RANK A — DATA DETECTIVE';rg.className='result-grade rg-a';}
  else if(correct>=10){rg.textContent='💪 RANK B — ANALYST';rg.className='result-grade rg-b';}
  else{rg.textContent='📚 RANK C — TRAINEE';rg.className='result-grade rg-c';}
  document.getElementById('resultPanel').scrollIntoView({behavior:'smooth'});
}
function resetProgress(){
  if(!confirm('Reset semua progress Exercise 20?'))return;
  state={answers:{}};
  saveState();
  renderAll();
  document.getElementById('resultPanel').style.display='none';
}
loadState();
renderAll();
</script>
</body>
</html>
