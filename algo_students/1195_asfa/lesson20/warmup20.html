<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warmup · Lesson 20 · Asfa</title>
<link rel="icon" type="image/svg+xml" href="../../../assets/logo1.svg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#1a1a28;--border:#2a2a40;--neon:#00f5c4;--accent:#f59e0b;--text:#e2e8f0;--muted:#64748b;--red:#ef4444;--cyan:#22d3ee;--emerald:#34d399;--amber:#fbbf24;--violet:#a78bfa;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(167,139,250,0.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(34,211,238,0.06) 0%,transparent 50%);pointer-events:none;}
  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;font-family:'Orbitron',monospace;font-size:0.72rem;letter-spacing:1px;}
  nav a{color:var(--muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--neon);}
  nav span{color:var(--border);}
  nav .current{color:#f87171;}
  .wrapper{max-width:640px;margin:0 auto;padding:3rem 1.5rem 6rem;position:relative;z-index:1;}
  #intro{text-align:center;}
  .warmup-icon{font-size:5rem;display:block;margin-bottom:1.5rem;animation:pulse 1.5s ease infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  .warmup-title{font-family:'Orbitron',monospace;font-size:clamp(1.4rem,5vw,2rem);font-weight:900;color:#f87171;margin-bottom:0.8rem;text-shadow:0 0 30px rgba(239,68,68,0.4);}
  .warmup-sub{color:var(--muted);line-height:1.7;margin-bottom:2rem;font-size:0.95rem;}
  .warmup-sub strong{color:var(--violet);}
  .info-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.8rem;margin-bottom:2.5rem;}
  @media(max-width:480px){.info-cards{grid-template-columns:1fr;}}
  .info-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;text-align:center;}
  .info-val{font-family:'Orbitron',monospace;font-size:1.8rem;font-weight:900;color:var(--violet);margin-bottom:0.3rem;}
  .info-lbl{font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .start-btn{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;font-weight:800;padding:1rem 3rem;border-radius:14px;border:none;font-family:'Orbitron',monospace;font-size:1rem;letter-spacing:3px;cursor:pointer;box-shadow:0 4px 20px rgba(167,139,250,0.35);transition:all 0.2s;}
  .start-btn:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(167,139,250,0.45);}
  #game{display:none;}
  .hud{display:flex;justify-content:space-between;align-items:stretch;margin-bottom:1.5rem;gap:0.8rem;}
  .hud-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0.7rem 1.2rem;text-align:center;flex:1;}
  .hud-val{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:700;}
  .hud-lbl{font-size:0.62rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:0.1rem;}
  .hud-val.score-v{color:var(--violet);}
  .hud-val.q-v{color:var(--accent);}
  .hud-val.timer-v{color:var(--text);transition:color 0.3s;}
  .hud-val.timer-v.warn{color:var(--red);animation:blink 0.5s ease infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.4;}}
  .q-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.5rem;margin-bottom:1.2rem;}
  .q-label{font-family:'Orbitron',monospace;font-size:0.62rem;letter-spacing:3px;color:#f87171;text-transform:uppercase;margin-bottom:0.8rem;}
  /* mini data table */
  .mini-table{width:100%;border-collapse:separate;border-spacing:0;background:#12121c;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:1.2rem;font-size:0.88rem;}
  .mini-table th{font-family:'Orbitron',monospace;font-size:0.6rem;letter-spacing:2px;color:var(--violet);background:rgba(167,139,250,0.07);padding:0.6rem;text-align:center;}
  .mini-table td{padding:0.55rem;text-align:center;border-top:1px solid var(--border);}
  .mini-table td.hi{color:var(--cyan);font-weight:700;}
  /* mini bar chart */
  .mini-chart{background:#12121c;border:1.5px solid var(--border);border-radius:12px;padding:0.8rem 0.8rem 0.4rem;margin-bottom:1.2rem;}
  .chart-title{font-family:'Orbitron',monospace;font-size:0.55rem;letter-spacing:2px;color:var(--muted);text-align:center;margin-bottom:0.5rem;}
  .bars-wrap{display:flex;align-items:flex-end;gap:6px;height:70px;justify-content:center;}
  .bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;}
  .bar-fill{width:28px;border-radius:3px 3px 0 0;}
  .bar-lbl{font-size:0.65rem;color:var(--muted);font-family:'Orbitron',monospace;}
  .bar-val{font-size:0.6rem;color:var(--text);}
  .coord-question{text-align:center;font-size:0.95rem;color:var(--muted);margin-bottom:1.2rem;line-height:1.6;}
  .coord-question strong{color:var(--violet);}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;}
  .opt-btn{background:#12121c;border:1px solid var(--border);color:var(--text);padding:0.7rem 1rem;border-radius:10px;cursor:pointer;font-family:'Orbitron',monospace;font-size:0.85rem;letter-spacing:1px;transition:all 0.2s;text-align:center;}
  .opt-btn:hover:not(:disabled){border-color:var(--violet);background:rgba(167,139,250,0.07);}
  .opt-btn.correct{border-color:var(--neon);background:rgba(0,245,196,0.1);color:var(--neon);}
  .opt-btn.wrong{border-color:var(--red);background:rgba(239,68,68,0.1);color:var(--red);}
  .feedback{text-align:center;font-family:'Orbitron',monospace;font-size:0.78rem;letter-spacing:1px;min-height:28px;margin-top:0.6rem;line-height:1.5;}
  .feedback.ok{color:var(--neon);}
  .feedback.ko{color:var(--red);}
  #result{display:none;text-align:center;}
  .score-big{font-family:'Orbitron',monospace;font-size:clamp(3rem,12vw,5rem);font-weight:900;color:var(--violet);line-height:1;margin-bottom:0.5rem;}
  .score-label{font-size:0.85rem;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:2rem;}
  .grade-badge{display:inline-block;font-family:'Orbitron',monospace;font-size:1.1rem;letter-spacing:3px;padding:0.5rem 1.5rem;border-radius:12px;margin-bottom:2rem;}
  .grade-s{background:rgba(0,245,196,0.1);border:2px solid var(--neon);color:var(--neon);}
  .grade-a{background:rgba(167,139,250,0.1);border:2px solid var(--violet);color:var(--violet);}
  .grade-b{background:rgba(245,158,11,0.1);border:2px solid var(--accent);color:var(--accent);}
  .grade-c{background:rgba(239,68,68,0.1);border:2px solid var(--red);color:var(--red);}
  .result-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
  .act-btn{padding:0.75rem 1.8rem;border-radius:12px;font-family:'Orbitron',monospace;font-size:0.78rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-block;}
  .act-primary{background:linear-gradient(135deg,var(--violet),#7c3aed);color:#fff;border:none;font-weight:800;}
  .act-secondary{background:var(--card);border:1px solid var(--border);color:var(--text);}
  .act-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(167,139,250,0.3);}
  .act-secondary:hover{border-color:var(--violet);color:var(--violet);}
</style>
</head>
<body>
<nav>
  <a href="../../../index.html">MATH ARENA</a>
  <span>›</span>
  <a href="../asfa_1195.html">ASFA</a>
  <span>›</span>
  <a href="lesson20.html">LESSON 20</a>

  <span class="current">WARMUP</span>
</nav>
<div class="wrapper">
  <div id="intro">
    <span class="warmup-icon">🔍</span>
    <div class="warmup-title">Warmup: Baca Data Kilat</div>
    <div class="warmup-sub">Sebelum jadi Data Detective sejati, latihan dulu reflex dasarnya: <strong>membaca tabel dan diagram</strong> secepat kilat!</div>
    <div class="info-cards">
      <div class="info-card"><div class="info-val">10</div><div class="info-lbl">Soal</div></div>
      <div class="info-card"><div class="info-val" style="color:var(--accent)">20s</div><div class="info-lbl">Timer</div></div>
      <div class="info-card"><div class="info-val">+10</div><div class="info-lbl">Per Soal</div></div>
    </div>
    <button class="start-btn" onclick="startGame()">START 🚀</button>
  </div>
  <div id="game">
    <div class="hud">
      <div class="hud-item"><div class="hud-val score-v" id="scoreV">0</div><div class="hud-lbl">Score</div></div>
      <div class="hud-item"><div class="hud-val q-v" id="qV">1/10</div><div class="hud-lbl">Soal</div></div>
      <div class="hud-item"><div class="hud-val timer-v" id="timerV">20</div><div class="hud-lbl">Detik</div></div>
    </div>
    <div class="q-card">
      <div class="q-label" id="qLabel">🔍 Baca Data Kilat</div>
      <div id="visualDiv"></div>
      <div class="coord-question" id="questionText"></div>
      <div class="opts" id="optsDiv"></div>
      <div class="feedback" id="feedbackDiv"></div>
    </div>
  </div>
  <div id="result">
    <div style="font-size:4rem;margin-bottom:1rem;">🏆</div>
    <div class="score-big" id="finalScore">0</div>
    <div class="score-label">poin dari 100</div>
    <div class="grade-badge" id="gradeBadge">—</div>
    <div class="result-actions">
      <button class="act-btn act-primary" onclick="resetGame()">ULANG</button>
      <a href="section1_20.html" class="act-btn act-secondary">Belajar Dulu</a>
      <a href="lesson20.html" class="act-btn act-secondary">Lesson 20</a>
    </div>
  </div>
</div>
<script>
// visual: 'table' or 'bars' or 'text'
// For bars: data = [{lbl, val, color}]
const QS = [
  {
    type:'table',
    thead:['Hari','Pengunjung'],
    tbody:[['Senin','20'],['Selasa','32'],['Rabu','28'],['Kamis','35'],['Jumat','25']],
    q:'Hari apa jumlah pengunjung PALING BANYAK?',
    cx:'Kamis', wx:['Selasa','Rabu','Jumat'],
    expl:'Kamis punya 35 pengunjung — paling banyak dari semua hari.'
  },
  {
    type:'table',
    thead:['Hari','Pengunjung'],
    tbody:[['Senin','20'],['Selasa','32'],['Rabu','28'],['Kamis','35'],['Jumat','25']],
    q:'Hari apa jumlah pengunjung PALING SEDIKIT?',
    cx:'Senin', wx:['Jumat','Rabu','Selasa'],
    expl:'Senin hanya 20 pengunjung — paling sedikit.'
  },
  {
    type:'table',
    thead:['Hari','Pengunjung'],
    tbody:[['Senin','20'],['Selasa','32'],['Rabu','28'],['Kamis','35'],['Jumat','25']],
    q:'Berapa TOTAL pengunjung selama 5 hari?',
    cx:'140', wx:['130','150','125'],
    expl:'20+32+28+35+25 = 140 pengunjung.'
  },
  {
    type:'bars',
    chartTitle:'Nilai Ujian',
    data:[{lbl:'Ana',val:60,color:'rgba(167,139,250,0.8)'},{lbl:'Budi',val:80,color:'rgba(34,211,238,0.8)'},{lbl:'Cici',val:70,color:'rgba(52,211,153,0.8)'},{lbl:'Deni',val:90,color:'rgba(251,191,36,0.8)'}],
    q:'Siapa yang mendapat nilai TERTINGGI?',
    cx:'Deni', wx:['Budi','Cici','Ana'],
    expl:'Batang Deni paling tinggi — nilainya 90.'
  },
  {
    type:'bars',
    chartTitle:'Nilai Ujian',
    data:[{lbl:'Ana',val:60,color:'rgba(167,139,250,0.8)'},{lbl:'Budi',val:80,color:'rgba(34,211,238,0.8)'},{lbl:'Cici',val:70,color:'rgba(52,211,153,0.8)'},{lbl:'Deni',val:90,color:'rgba(251,191,36,0.8)'}],
    q:'Siapa yang mendapat nilai TERENDAH?',
    cx:'Ana', wx:['Cici','Budi','Deni'],
    expl:'Batang Ana paling pendek — nilainya 60.'
  },
  {
    type:'table',
    thead:['Nilai','Frekuensi'],
    tbody:[['70','1'],['75','2'],['80','4'],['90','2'],['95','1']],
    q:'Nilai apa yang paling SERING muncul?',
    cx:'80', wx:['75','90','95'],
    expl:'Nilai 80 punya frekuensi 4 — paling tinggi dari semua nilai.'
  },
  {
    type:'table',
    thead:['Nilai','Frekuensi'],
    tbody:[['70','1'],['75','2'],['80','4'],['90','2'],['95','1']],
    q:'Berapa TOTAL siswa dari tabel ini?',
    cx:'10', wx:['8','12','9'],
    expl:'1+2+4+2+1 = 10 siswa total.'
  },
  {
    type:'text',
    dataStr:'Data mentah: 3, 5, 3, 4, 5, 3, 5, 4, 3, 5',
    q:'Berapa frekuensi nilai 3 dalam data di atas?',
    cx:'4', wx:['3','5','2'],
    expl:'Angka 3 muncul 4 kali: posisi 1, 3, 6, 9.'
  },
  {
    type:'bars',
    chartTitle:'Buku Dibaca / Minggu',
    data:[{lbl:'Ali',val:2,color:'rgba(167,139,250,0.8)'},{lbl:'Bela',val:5,color:'rgba(239,68,68,0.8)'},{lbl:'Ciko',val:4,color:'rgba(52,211,153,0.8)'},{lbl:'Dita',val:3,color:'rgba(34,211,238,0.8)'}],
    q:'Selisih buku terbanyak dan tersedikit adalah?',
    cx:'3', wx:['2','4','5'],
    expl:'Terbanyak Bela (5), tersedikit Ali (2). Selisih = 5 − 2 = 3.'
  },
  {
    type:'table',
    thead:['Hari','Pemain Online'],
    tbody:[['Senin','120'],['Selasa','90'],['Rabu','150'],['Kamis','130'],['Jumat','200']],
    q:'Dari tabel ini, tren umum jumlah pemain dari Selasa ke Jumat adalah?',
    cx:'Naik', wx:['Turun','Tetap','Naik-turun acak'],
    expl:'Sel→90, Rab→150, Kam→130, Jum→200. Secara umum trennya NAIK.'
  },
];

let cur=0, score=0, timer=null, answered=false;
function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}

function renderVisual(q){
  const d=document.getElementById('visualDiv');
  if(q.type==='table'){
    let h='<table class="mini-table"><thead><tr>';
    q.thead.forEach(t=>h+=`<th>${t}</th>`);
    h+='</tr></thead><tbody>';
    q.tbody.forEach(r=>{h+='<tr>';r.forEach(c=>h+=`<td>${c}</td>`);h+='</tr>';});
    h+='</tbody></table>';
    d.innerHTML=h;
  } else if(q.type==='bars'){
    const maxVal=Math.max(...q.data.map(x=>x.val));
    let h=`<div class="mini-chart"><div class="chart-title">${q.chartTitle}</div><div class="bars-wrap">`;
    q.data.forEach(b=>{
      const h2=Math.round((b.val/maxVal)*64);
      h+=`<div class="bar-col"><div class="bar-val">${b.val}</div><div class="bar-fill" style="height:${h2}px;background:${b.color};"></div><div class="bar-lbl">${b.lbl}</div></div>`;
    });
    h+='</div></div>';
    d.innerHTML=h;
  } else {
    d.innerHTML=`<div class="mini-chart"><div style="font-size:0.9rem;color:var(--cyan);font-weight:700;text-align:center;padding:0.5rem;">${q.dataStr}</div></div>`;
  }
}

function showQ(){
  if(cur>=QS.length){endGame();return;}
  answered=false;
  const q=QS[cur];
  document.getElementById('qV').textContent=(cur+1)+'/10';
  renderVisual(q);
  document.getElementById('questionText').innerHTML=q.q;
  const opts=shuffle([q.cx,...q.wx]);
  const od=document.getElementById('optsDiv');
  od.innerHTML='';
  opts.forEach(v=>{
    const b=document.createElement('button');
    b.className='opt-btn'; b.textContent=v; b.dataset.v=v;
    b.onclick=()=>pick(v,q.cx);
    od.appendChild(b);
  });
  document.getElementById('feedbackDiv').textContent='';
  document.getElementById('feedbackDiv').className='feedback';
  startTimer();
}
function startTimer(){
  clearInterval(timer);
  let t=20;
  const tv=document.getElementById('timerV');
  tv.textContent=t; tv.classList.remove('warn');
  timer=setInterval(()=>{
    t--; tv.textContent=t;
    if(t<=5) tv.classList.add('warn');
    if(t<=0){clearInterval(timer);if(!answered)pick('__timeout__',QS[cur].cx);}
  },1000);
}
function pick(chosen,correct){
  if(answered)return;
  answered=true; clearInterval(timer);
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.disabled=true;
    if(b.dataset.v===chosen&&chosen===correct) b.classList.add('correct');
    else if(b.dataset.v===chosen) b.classList.add('wrong');
    else if(b.dataset.v===correct) b.classList.add('correct');
  });
  const fb=document.getElementById('feedbackDiv');
  if(chosen===correct){
    score+=10; document.getElementById('scoreV').textContent=score;
    fb.className='feedback ok'; fb.textContent='✅ BENAR! '+QS[cur].expl;
  } else {
    fb.className='feedback ko';
    fb.textContent=chosen==='__timeout__'?'⏱ WAKTU! '+QS[cur].expl:'❌ '+QS[cur].expl;
  }
  setTimeout(()=>{cur++;showQ();},1800);
}
function endGame(){
  document.getElementById('game').style.display='none';
  document.getElementById('result').style.display='block';
  document.getElementById('finalScore').textContent=score;
  const gb=document.getElementById('gradeBadge');
  if(score>=90){gb.textContent='⭐ RANK S';gb.className='grade-badge grade-s';}
  else if(score>=70){gb.textContent='🏆 RANK A';gb.className='grade-badge grade-a';}
  else if(score>=50){gb.textContent='💪 RANK B';gb.className='grade-badge grade-b';}
  else{gb.textContent='📚 RANK C';gb.className='grade-badge grade-c';}
}
function startGame(){
  cur=0;score=0;
  document.getElementById('intro').style.display='none';
  document.getElementById('game').style.display='block';
  showQ();
}
function resetGame(){
  cur=0;score=0;
  document.getElementById('scoreV').textContent='0';
  document.getElementById('result').style.display='none';
  document.getElementById('game').style.display='block';
  showQ();
}
</script>
</body>
</html>
