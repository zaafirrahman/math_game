<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warmup · Lesson 7 · Asfa</title>
<link rel="icon" type="image/svg+xml" href="../../../assets/logo1.svg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f; --card: #1a1a28; --border: #2a2a40;
    --neon: #00f5c4; --neon2: #7c3aed; --accent: #f59e0b;
    --cyan: #22d3ee; --red: #ef4444; --green: #4ade80;
    --violet: #a78bfa; --text: #e2e8f0; --muted: #64748b;
    --orange: #fb923c; --blue: #60a5fa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; min-height: 100vh; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(239,68,68,0.07) 0%, transparent 50%);
    pointer-events: none;
  }
  nav {
    padding: 1rem 2rem; display: flex; align-items: center; gap: 0.5rem;
    border-bottom: 1px solid var(--border); background: rgba(10,10,15,0.9);
    backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100;
    font-family: 'Orbitron', monospace; font-size: 0.72rem; letter-spacing: 1px;
  }
  nav a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
  nav a:hover { color: var(--neon); }
  nav span { color: var(--border); }
  nav .current { color: #f87171; }
  .wrapper { max-width: 640px; margin: 0 auto; padding: 3rem 1.5rem 6rem; position: relative; z-index: 1; }

  #intro { text-align: center; }
  .warmup-icon { font-size: 5rem; display: block; margin-bottom: 1.5rem; animation: pulse 1.5s ease infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  .warmup-title { font-family: 'Orbitron', monospace; font-size: clamp(1.8rem,5vw,2.5rem); font-weight: 900; color: #f87171; margin-bottom: 0.8rem; text-shadow: 0 0 30px rgba(239,68,68,0.4); }
  .warmup-sub { color: var(--muted); line-height: 1.7; margin-bottom: 2rem; font-size: 0.95rem; }
  .info-cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.8rem; margin-bottom: 2.5rem; }
  @media(max-width:480px){ .info-cards { grid-template-columns: 1fr; } }
  .info-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem; text-align: center; }
  .info-val { font-family: 'Orbitron', monospace; font-size: 1.8rem; font-weight: 900; color: var(--neon); margin-bottom: 0.3rem; }
  .info-lbl { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .start-btn { background: linear-gradient(135deg,#ef4444,#b91c1c); color: white; font-weight: 800; padding: 1rem 3rem; border-radius: 14px; border: none; font-family: 'Orbitron', monospace; font-size: 1rem; letter-spacing: 3px; cursor: pointer; box-shadow: 0 4px 20px rgba(239,68,68,0.4); transition: all 0.2s; }
  .start-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(239,68,68,0.5); }

  #game { display: none; }
  .hud { display: flex; justify-content: space-between; align-items: stretch; margin-bottom: 1.5rem; gap: 0.8rem; }
  .hud-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0.7rem 1.2rem; text-align: center; flex: 1; }
  .hud-val { font-family: 'Orbitron', monospace; font-size: 1.3rem; font-weight: 700; }
  .hud-lbl { font-size: 0.62rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 0.1rem; }
  .hud-val.score-v { color: var(--neon); }
  .hud-val.q-v { color: var(--accent); }
  .hud-val.timer-v { color: var(--text); transition: color 0.3s; }
  .hud-val.timer-v.warn { color: var(--red); animation: blink 0.5s ease infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .phase-tag { text-align: center; font-family: 'Orbitron', monospace; font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 0.8rem; }
  .phase-a { color: var(--cyan); }
  .phase-b { color: var(--orange); }

  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem 2rem; text-align: center; margin-bottom: 1.2rem; animation: fadeUp 0.35s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
  .q-hint-tag { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.8rem; font-style: italic; }
  .q-text { font-family: 'Orbitron', monospace; font-size: clamp(1rem,4vw,1.8rem); font-weight: 900; color: var(--text); margin-bottom: 1.5rem; line-height: 1.5; }
  .opts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  @media(max-width:400px){ .opts-grid { grid-template-columns: 1fr; } }
  .opt { background: #12121c; border: 2px solid var(--border); color: var(--text); padding: 1rem; border-radius: 14px; cursor: pointer; font-family: 'Orbitron', monospace; font-size: 0.95rem; font-weight: 700; transition: all 0.15s; text-align: center; }
  .opt:hover:not(:disabled) { border-color: var(--neon); background: rgba(0,245,196,0.06); }
  .opt.correct { border-color: var(--neon); background: rgba(0,245,196,0.12); color: var(--neon); }
  .opt.wrong { border-color: var(--red); background: rgba(239,68,68,0.1); color: var(--red); }
  .opt:disabled { cursor: default; }
  .q-feedback { margin-top: 1rem; padding: 0.9rem 1.2rem; border-radius: 12px; font-size: 0.9rem; font-weight: 700; display: none; line-height: 1.5; }
  .q-feedback.show { display: block; animation: fadeUp 0.3s ease; }
  .q-feedback.ok { background: rgba(0,245,196,0.1); color: var(--neon); border: 1px solid rgba(0,245,196,0.3); }
  .q-feedback.no { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
  .next-btn { width: 100%; padding: 1rem; border-radius: 12px; border: none; background: linear-gradient(135deg,var(--neon2),#4f46e5); color: white; font-family: 'Orbitron', monospace; font-size: 0.85rem; letter-spacing: 3px; cursor: pointer; margin-top: 1rem; display: none; transition: all 0.2s; box-shadow: 0 4px 15px rgba(124,58,237,0.3); }
  .next-btn:hover { transform: translateY(-2px); }
  .next-btn.show { display: block; animation: fadeUp 0.3s ease; }

  #results { display: none; text-align: center; }
  .result-icon { font-size: 5rem; display: block; margin-bottom: 1.5rem; animation: pulse 1s infinite; }
  .result-grade { font-family: 'Orbitron', monospace; font-size: clamp(3rem,10vw,5rem); font-weight: 900; margin-bottom: 0.5rem; }
  .result-label { font-family: 'Orbitron', monospace; font-size: 1rem; color: var(--muted); letter-spacing: 3px; margin-bottom: 2rem; }
  .score-breakdown { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem; text-align: left; }
  .score-row { display: flex; justify-content: space-between; align-items: center; padding: 0.45rem 0; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
  .score-row:last-child { border-bottom: none; }
  .score-row .qtext { color: var(--muted); }
  .verdict.ok { color: var(--neon); font-family: 'Orbitron', monospace; font-size: 0.75rem; }
  .verdict.no { color: var(--red); font-family: 'Orbitron', monospace; font-size: 0.75rem; }
  .xp-badge { display: inline-block; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.4); color: var(--accent); padding: 0.4rem 1.2rem; border-radius: 20px; font-family: 'Orbitron', monospace; font-size: 0.85rem; margin-bottom: 2rem; }
  .action-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  .btn { padding: 0.8rem 1.8rem; border-radius: 10px; border: none; font-family: 'Orbitron', monospace; font-size: 0.78rem; letter-spacing: 2px; cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-ghost:hover { border-color: var(--neon); color: var(--neon); }
  .btn-primary { background: linear-gradient(135deg,var(--neon2),#4f46e5); color: white; box-shadow: 0 4px 15px rgba(124,58,237,0.3); }
  .btn-primary:hover { transform: translateY(-2px); }
  .btn-accent { background: linear-gradient(135deg,#ef4444,#b91c1c); color: white; font-weight: 800; }
</style>
</head>
<body>
<nav>
  <a href="../../../index.html">ARENA</a><span>›</span>
  <a href="../asfa_1195.html">ASFA</a><span>›</span>
  <a href="lesson7.html">LESSON 7</a><span>›</span>
  <span class="current">WARMUP</span>
</nav>
<div class="wrapper">
  <div id="intro">
    <span class="warmup-icon">🔥</span>
    <div class="warmup-title">WARMUP TIME!</div>
    <div class="warmup-sub">
      Sebelum masuk operasi pecahan, kita review dulu fondasi-fondasinya!<br>
      5 soal tentang pecahan dasar &amp; KPK, lalu 5 soal tentang menyamakan penyebut.
    </div>
    <div class="info-cards">
      <div class="info-card"><div class="info-val">10</div><div class="info-lbl">Soal</div></div>
      <div class="info-card"><div class="info-val">20s</div><div class="info-lbl">Per Soal</div></div>
      <div class="info-card"><div class="info-val">10</div><div class="info-lbl">Poin/Soal</div></div>
    </div>
    <button class="start-btn" onclick="startGame()">🔥 MULAI WARMUP</button>
  </div>

  <div id="game">
    <div class="hud">
      <div class="hud-item"><div class="hud-val score-v" id="scoreDisp">0</div><div class="hud-lbl">Score</div></div>
      <div class="hud-item"><div class="hud-val q-v" id="qDisp">1 / 10</div><div class="hud-lbl">Soal</div></div>
      <div class="hud-item"><div class="hud-val timer-v" id="timerDisp">20</div><div class="hud-lbl">Detik</div></div>
    </div>
    <div class="phase-tag" id="phaseTag"></div>
    <div class="q-card" id="qCard">
      <div class="q-hint-tag" id="qHintTag"></div>
      <div class="q-text" id="qText">Loading...</div>
      <div class="opts-grid" id="optsGrid"></div>
      <div class="q-feedback" id="qFb"></div>
    </div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">SOAL BERIKUTNYA →</button>
  </div>

  <div id="results">
    <span class="result-icon" id="resIcon"></span>
    <div class="result-grade" id="resGrade"></div>
    <div class="result-label" id="resLabel"></div>
    <div class="score-breakdown" id="scoreBreakdown"></div>
    <div class="xp-badge" id="xpBadge"></div>
    <div class="action-btns">
      <button class="btn btn-accent" onclick="restartGame()">🔄 Ulangi</button>
      <a href="lesson7.html" class="btn btn-ghost">← Lesson Hub</a>
      <a href="section1.html" class="btn btn-primary">Lanjut: Materi →</a>
    </div>
  </div>
</div>

<script>
const questions = [
  // Fase 1: Pecahan dasar & KPK (5 soal)
  { phase:'a', hint:'Ingat: pembilang = atas, penyebut = bawah', text:'Dalam pecahan 3/7, angka 7 disebut apa?', opts:['Pembilang','Penyebut','Hasil bagi','Desimal'], answer:'Penyebut', explain:'7 ada di bawah garis = penyebut = total bagian. 3 di atas = pembilang = bagian yang diambil. ✅' },
  { phase:'a', hint:'KPK = Kelipatan Persekutuan Terkecil', text:'KPK dari 4 dan 6 adalah...', opts:['8','10','12','24'], answer:'12', explain:'Kelipatan 4: 4,8,12... Kelipatan 6: 6,12... Ketemunya di 12! KPK(4,6) = 12. ✅' },
  { phase:'a', hint:'KPK dari 3 dan 5?', text:'KPK dari 3 dan 5 adalah...', opts:['8','10','15','30'], answer:'15', explain:'Kelipatan 3: 3,6,9,12,15... Kelipatan 5: 5,10,15... KPK(3,5) = 15. ✅' },
  { phase:'a', hint:'Mana yang lebih besar?', text:'Mana yang lebih besar: 2/3 atau 3/4?', opts:['2/3','3/4','Sama besar','Tidak bisa dibandingkan'], answer:'3/4', explain:'Samakan penyebut: 2/3 = 8/12 dan 3/4 = 9/12. Jadi 3/4 > 2/3! ✅' },
  { phase:'a', hint:'Pecahan senilai = kalikan pembilang & penyebut dengan angka sama', text:'Pecahan 1/2 senilai dengan...', opts:['2/6','3/8','2/4','4/6'], answer:'2/4', explain:'1/2 × 2/2 = 2/4. Kalikan pembilang DAN penyebut dengan 2 → nilainya tetap sama! ✅' },
  // Fase 2: Menyamakan penyebut (5 soal)
  { phase:'b', hint:'Samakan penyebut dulu pakai KPK!', text:'Untuk menghitung 1/3 + 1/4, penyebut samanya adalah...', opts:['7','8','12','24'], answer:'12', explain:'KPK(3,4) = 12. Jadi 1/3 = 4/12 dan 1/4 = 3/12. Siap dijumlah! ✅' },
  { phase:'b', hint:'KPK dari 6 dan 4?', text:'Penyebut yang dipakai untuk 1/6 + 1/4 adalah...', opts:['10','12','24','2'], answer:'12', explain:'KPK(6,4) = 12. Ini penyebut bersama yang paling kecil untuk menghitung operasinya! ✅' },
  { phase:'b', hint:'1/2 diubah ke penyebut 8: kalikan dengan 4/4', text:'1/2 = ?/8', opts:['2/8','4/8','3/8','6/8'], answer:'4/8', explain:'1/2 × 4/4 = 4/8. Kalikan penyebut 2 × 4 = 8, pembilang 1 × 4 = 4. ✅' },
  { phase:'b', hint:'2/3 ke penyebut 9: kalikan dengan 3/3', text:'2/3 = ?/9', opts:['4/9','5/9','6/9','3/9'], answer:'6/9', explain:'2/3 × 3/3 = 6/9. Penyebut 3 × 3 = 9, pembilang 2 × 3 = 6. ✅' },
  { phase:'b', hint:'Pilih penyebut yang tepat untuk menjumlahkan', text:'Untuk 1/5 + 2/3, penyebut bersama yang tepat adalah...', opts:['8','10','15','20'], answer:'15', explain:'KPK(5,3) = 15. Sehingga 1/5 = 3/15 dan 2/3 = 10/15. Tinggal jumlahkan! ✅' },
];

function shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }
let cur=0,score=0,timeLeft=20,timer=null;
const results=[];

function startGame(){ document.getElementById('intro').style.display='none'; document.getElementById('game').style.display='block'; loadQuestion(); }
function loadQuestion(){
  const q=questions[cur];
  document.getElementById('qText').textContent=q.text;
  document.getElementById('qHintTag').textContent=q.hint||'';
  document.getElementById('qDisp').textContent=`${cur+1} / ${questions.length}`;
  document.getElementById('qFb').className='q-feedback';
  document.getElementById('nextBtn').className='next-btn';
  const pt=document.getElementById('phaseTag');
  if(q.phase==='a'){ pt.textContent='📐 Fase 1 — Pecahan Dasar & KPK'; pt.className='phase-tag phase-a'; }
  else { pt.textContent='⚖️ Fase 2 — Menyamakan Penyebut'; pt.className='phase-tag phase-b'; }
  const grid=document.getElementById('optsGrid');
  grid.innerHTML='';
  shuffle(q.opts).forEach(val=>{ const btn=document.createElement('button'); btn.className='opt'; btn.textContent=val; btn.onclick=()=>answer(val,btn,q); grid.appendChild(btn); });
  const card=document.getElementById('qCard'); card.style.animation='none'; void card.offsetWidth; card.style.animation='';
  startTimer();
}
function startTimer(){
  timeLeft=20; const d=document.getElementById('timerDisp');
  d.textContent=timeLeft; d.className='hud-val timer-v';
  clearInterval(timer);
  timer=setInterval(()=>{ timeLeft--; d.textContent=timeLeft; if(timeLeft<=5)d.className='hud-val timer-v warn'; if(timeLeft<=0){clearInterval(timer);timeUp();} },1000);
}
function answer(val,btn,q){
  clearInterval(timer); const correct=val===q.answer;
  document.getElementById('optsGrid').querySelectorAll('.opt').forEach(b=>b.disabled=true);
  btn.classList.add(correct?'correct':'wrong');
  const fb=document.getElementById('qFb');
  fb.textContent=q.explain; fb.className='q-feedback show '+(correct?'ok':'no');
  if(correct){score+=10; document.getElementById('scoreDisp').textContent=score;}
  results.push({text:q.text,correct,answer:q.answer,chosen:val});
  document.getElementById('nextBtn').className='next-btn show';
}
function timeUp(){
  const q=questions[cur];
  document.getElementById('optsGrid').querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct');});
  const fb=document.getElementById('qFb');
  fb.textContent='⏰ Waktu habis! '+q.explain; fb.className='q-feedback show no';
  results.push({text:q.text,correct:false,answer:q.answer,chosen:'—'});
  document.getElementById('nextBtn').className='next-btn show';
}
function nextQuestion(){
  cur++;
  if(cur>=questions.length){ showResults(); return; }
  loadQuestion();
}
function showResults(){
  document.getElementById('game').style.display='none';
  const res=document.getElementById('results'); res.style.display='block';
  const pct=Math.round(score/100*100);
  let icon,grade,label,color;
  if(pct>=90){icon='🌟';grade='S';label='WARMUP MASTER';color='var(--neon)';}
  else if(pct>=70){icon='🔥';grade='A';label='SIAP TEMPUR';color='var(--accent)';}
  else if(pct>=50){icon='💪';grade='B';label='LUMAYAN PANAS';color='var(--orange)';}
  else{icon='😅';grade='C';label='PERLU REVIEW';color='var(--red)';}
  document.getElementById('resIcon').textContent=icon;
  document.getElementById('resGrade').textContent=grade; document.getElementById('resGrade').style.color=color;
  document.getElementById('resLabel').textContent=label;
  const bd=document.getElementById('scoreBreakdown');
  bd.innerHTML='<div class="score-row"><span style="font-family:\'Orbitron\',monospace;font-size:0.7rem;color:var(--muted);">SOAL</span><span style="font-family:\'Orbitron\',monospace;font-size:0.7rem;color:var(--muted);">HASIL</span></div>';
  results.forEach(r=>{ bd.innerHTML+=`<div class="score-row"><span class="qtext">${r.text.substring(0,45)}${r.text.length>45?'...':''}</span><span class="verdict ${r.correct?'ok':'no'}">${r.correct?'✓ BENAR':'✗ '+r.answer}</span></div>`; });
  document.getElementById('xpBadge').textContent=`⚡ +${score} XP — Score ${score}/100`;
}
function restartGame(){ cur=0; score=0; results.length=0; document.getElementById('results').style.display='none'; document.getElementById('scoreDisp').textContent=0; document.getElementById('game').style.display='none'; document.getElementById('intro').style.display='block'; }
</script>
</body>
</html>
