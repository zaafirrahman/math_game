<style>
  :root {
    --bg:#0a0a0f; --card:#1a1a28; --border:#2a2a40;
    --neon:#00f5c4; --accent:#f59e0b;
    --text:#e2e8f0; --muted:#64748b;
    --coord:#38bdf8; --coord2:#fb923c; --pt:#00f5c4;
    --red:#ef4444; --up:#34d399; --violet:#a78bfa;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;
    background:radial-gradient(ellipse at 20% 30%,rgba(245,158,11,0.06) 0%,transparent 55%),
               radial-gradient(ellipse at 80% 70%,rgba(56,189,248,0.05) 0%,transparent 55%);
    pointer-events:none;}
  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;font-family:'Orbitron',monospace;font-size:0.72rem;letter-spacing:1px;}
  nav a{color:var(--muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--neon);}
  nav span{color:var(--border);}
  nav .current{color:var(--accent);}
  .wrapper{max-width:680px;margin:0 auto;padding:3rem 1.5rem 6rem;position:relative;z-index:1;}

  /* INTRO */
  #intro{text-align:center;}
  .qt-icon{font-size:5rem;display:block;margin-bottom:1.5rem;animation:spin 3s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .qt-title{font-family:'Orbitron',monospace;font-size:clamp(1.6rem,5vw,2.2rem);font-weight:900;color:var(--accent);margin-bottom:0.8rem;text-shadow:0 0 30px rgba(245,158,11,0.4);}
  .qt-sub{color:var(--muted);line-height:1.7;margin-bottom:2rem;font-size:0.95rem;}
  .info-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.8rem;margin-bottom:2.5rem;}
  @media(max-width:480px){.info-cards{grid-template-columns:1fr;}}
  .info-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;text-align:center;}
  .info-val{font-family:'Orbitron',monospace;font-size:1.8rem;font-weight:900;color:var(--accent);margin-bottom:0.3rem;}
  .info-lbl{font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .start-btn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;font-weight:800;padding:1rem 3rem;border-radius:14px;border:none;font-family:'Orbitron',monospace;font-size:1rem;letter-spacing:3px;cursor:pointer;box-shadow:0 4px 20px rgba(245,158,11,0.4);transition:all 0.2s;}
  .start-btn:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(245,158,11,0.5);}

  /* GAME */
  #game{display:none;}
  .hud{display:flex;gap:0.8rem;margin-bottom:1.5rem;}
  .hud-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0.7rem 1.2rem;text-align:center;flex:1;}
  .hud-val{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:700;}
  .hud-lbl{font-size:0.62rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:0.1rem;}
  .score-v{color:var(--accent);}
  .q-v{color:var(--coord);}
  .timer-v{color:var(--text);transition:color 0.3s;}
  .timer-v.warn{color:var(--red);animation:blink 0.5s ease infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
  .timer-track{height:4px;background:var(--border);border-radius:99px;margin-bottom:1.2rem;overflow:hidden;}
  .timer-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--red));border-radius:99px;transition:width 0.9s linear;}

  .q-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.5rem;margin-bottom:1.2rem;}
  .story-box{background:rgba(245,158,11,0.05);border:1px solid rgba(245,158,11,0.2);border-radius:12px;padding:0.9rem 1.1rem;margin-bottom:1rem;}
  .story-tag{font-family:'Orbitron',monospace;font-size:0.55rem;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:0.3rem;}
  .story-text{font-size:0.92rem;font-weight:700;color:var(--text);line-height:1.5;}
  .q-text{font-family:'Orbitron',monospace;font-size:clamp(0.82rem,2.5vw,1rem);font-weight:700;line-height:1.5;margin-bottom:1rem;}
  .grid-display{display:flex;justify-content:center;margin-bottom:1rem;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;}
  .opt-btn{background:#12121c;border:1px solid var(--border);color:var(--text);padding:0.7rem 1rem;border-radius:10px;cursor:pointer;font-family:'Orbitron',monospace;font-size:0.8rem;letter-spacing:1px;transition:all 0.2s;text-align:center;line-height:1.4;}
  .opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(245,158,11,0.07);}
  .opt-btn.correct{border-color:var(--pt);background:rgba(0,245,196,0.1);color:var(--pt);}
  .opt-btn.wrong{border-color:var(--red);background:rgba(239,68,68,0.1);color:var(--red);}
  .feedback{text-align:center;font-family:'Orbitron',monospace;font-size:0.82rem;letter-spacing:1px;height:26px;margin-top:0.6rem;}
  .feedback.ok{color:var(--pt);}
  .feedback.ko{color:var(--red);}

  /* RESULT */
  #result{display:none;text-align:center;}
  .score-big{font-family:'Orbitron',monospace;font-size:clamp(3rem,12vw,5rem);font-weight:900;color:var(--accent);line-height:1;margin-bottom:0.5rem;}
  .score-label{font-size:0.85rem;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:2rem;}
  .grade-badge{display:inline-block;font-family:'Orbitron',monospace;font-size:1.1rem;letter-spacing:3px;padding:0.5rem 1.5rem;border-radius:12px;margin-bottom:2rem;}
  .grade-s{background:rgba(0,245,196,0.1);border:2px solid var(--pt);color:var(--pt);}
  .grade-a{background:rgba(245,158,11,0.1);border:2px solid var(--accent);color:var(--accent);}
  .grade-b{background:rgba(56,189,248,0.1);border:2px solid var(--coord);color:var(--coord);}
  .grade-c{background:rgba(239,68,68,0.1);border:2px solid var(--red);color:var(--red);}
  .result-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
  .act-btn{padding:0.75rem 1.8rem;border-radius:12px;font-family:'Orbitron',monospace;font-size:0.78rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-block;border:none;}
  .act-primary{background:linear-gradient(135deg,var(--accent),#d97706);color:#000;font-weight:800;}
  .act-secondary{background:var(--card);border:1px solid var(--border);color:var(--text);}
  .act-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(245,158,11,0.3);}
  .act-secondary:hover{border-color:var(--accent);color:var(--accent);}
</style>

<div class="wrapper">
  <!-- INTRO -->
  <div id="intro">
    <span class="qt-icon">⚡</span>
    <div class="qt-title">Coord Detective</div>
    <div class="qt-sub">10 soal baca koordinat &amp; grafik — timer 25 detik per soal!<br>Tunjukkan kemampuan detektifmu!</div>
    <div class="info-cards">
      <div class="info-card"><div class="info-val">10</div><div class="info-lbl">Soal</div></div>
      <div class="info-card"><div class="info-val" style="color:var(--accent)">25s</div><div class="info-lbl">Timer</div></div>
      <div class="info-card"><div class="info-val" style="color:var(--pt)">+10</div><div class="info-lbl">Per Soal</div></div>
    </div>
    <button class="start-btn" onclick="startGame()">MULAI ⚡</button>
  </div>

  <!-- GAME -->
  <div id="game">
    <div class="hud">
      <div class="hud-item"><div class="hud-val score-v" id="scoreV">0</div><div class="hud-lbl">Score</div></div>
      <div class="hud-item"><div class="hud-val q-v" id="qV">1/10</div><div class="hud-lbl">Soal</div></div>
      <div class="hud-item"><div class="hud-val timer-v" id="timerV">25</div><div class="hud-lbl">Detik</div></div>
    </div>
    <div class="timer-track"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
    <div class="q-card">
      <div class="story-box"><div class="story-tag">📍 Situasi</div><div class="story-text" id="storyText">—</div></div>
      <div class="q-text" id="qText">—</div>
      <div class="grid-display" id="gridDisplay"></div>
      <div class="opts" id="optsDiv"></div>
      <div class="feedback" id="feedbackDiv"></div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result">
    <div style="font-size:4rem;margin-bottom:1rem" id="resultEmoji">🔍</div>
    <div class="score-big" id="finalScore">0</div>
    <div class="score-label">poin dari 100</div>
    <div class="grade-badge" id="gradeBadge">—</div>
    <div class="result-actions">
      <button class="act-btn act-primary" onclick="resetGame()">ULANG</button>
      <a href="exercise.html" class="act-btn act-secondary">Exercise</a>
      <a href="lesson13.html" class="act-btn act-secondary">Lesson 13</a>
    </div>
  </div>
</div>

<script>
function buildGrid(pts, colors, W, H, maxN) {
  const pad=30, step=Math.floor((Math.min(W,H)-pad*2)/maxN);
  let g = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  g += `<defs><marker id="ax" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#38bdf8"/></marker>`;
  g += `<marker id="ay" markerWidth="7" markerHeight="7" refX="3.5" refY="5" orient="auto"><polygon points="0 7,3.5 0,7 7" fill="#fb923c"/></marker></defs>`;
  g += `<g stroke="#2a2a40" stroke-width="0.8" opacity="0.6">`;
  for(let i=0;i<=maxN;i++){
    const x=pad+i*step, y=H-pad-i*step;
    g+=`<line x1="${x}" y1="${pad}" x2="${x}" y2="${H-pad}"/>`;
    g+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}"/>`;
  }
  g+=`</g>`;
  g+=`<line x1="${pad}" y1="${H-pad}" x2="${W-pad+6}" y2="${H-pad}" stroke="#38bdf8" stroke-width="2" marker-end="url(#ax)"/>`;
  g+=`<line x1="${pad}" y1="${H-pad}" x2="${pad}" y2="${pad-6}" stroke="#fb923c" stroke-width="2" marker-end="url(#ay)"/>`;
  for(let i=1;i<=maxN;i++){
    const x=pad+i*step, y=H-pad-i*step;
    g+=`<text x="${x-4}" y="${H-pad+14}" fill="#64748b" font-family="Nunito,sans-serif" font-size="10">${i}</text>`;
    g+=`<text x="${pad-16}" y="${y+4}" fill="#64748b" font-family="Nunito,sans-serif" font-size="10">${i}</text>`;
  }
  g+=`<circle cx="${pad}" cy="${H-pad}" r="3" fill="#64748b"/>`;
  g+=`<text x="${pad-14}" y="${H-pad+14}" fill="#64748b" font-family="Nunito,sans-serif" font-size="10">0</text>`;
  pts.forEach((p,i)=>{
    const cx=pad+p[0]*step, cy=H-pad-p[1]*step;
    g+=`<circle cx="${cx}" cy="${cy}" r="7" fill="${colors[i]}" opacity="0.9"/>`;
    if(pts.length===1){
      g+=`<line x1="${pad}" y1="${cy}" x2="${cx}" y2="${cy}" stroke="${colors[i]}" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>`;
      g+=`<line x1="${cx}" y1="${H-pad}" x2="${cx}" y2="${cy}" stroke="${colors[i]}" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>`;
    }
  });
  if(pts.length>1){
    let poly='<polyline points="';
    pts.forEach((p)=>{poly+=`${pad+p[0]*step},${H-pad-p[1]*step} `;});
    poly+=`" fill="none" stroke="${colors[0]}" stroke-width="2" stroke-dasharray="5,3" opacity="0.5"/>`;
    g+=poly;
  }
  g+=`</svg>`;
  return g;
}

const QS = [
  {
    story: 'Andi menandai rumahnya di peta grid.',
    q: 'Titik hijau ini berada di koordinat…',
    pts:[[3,4]], colors:['#00f5c4'], opts:['(3,4)','(4,3)','(3,3)','(4,4)'], answer:'(3,4)', grid:true
  },
  {
    story: 'Sebuah harta karun ada di peta koordinat.',
    q: 'Di mana titik oranye itu berada?',
    pts:[[5,2]], colors:['#fb923c'], opts:['(2,5)','(5,3)','(5,2)','(4,2)'], answer:'(5,2)', grid:true
  },
  {
    story: 'Grafik di bawah menunjukkan penjualan selama 4 hari.',
    q: 'Titik mana yang koordinatnya (2, 3)?',
    pts:[[1,2],[2,3],[3,5],[4,4]], colors:['#64748b','#f59e0b','#64748b','#64748b'],
    opts:['Titik pertama','Titik kedua','Titik ketiga','Titik keempat'], answer:'Titik kedua', grid:true
  },
  {
    story: 'Dari tabel: Hari 1→skor 10, Hari 2→15, Hari 3→20.',
    q: 'Titik manakah koordinat Hari 3?',
    pts:[[1,10],[2,15],[3,20]], colors:['#64748b','#64748b','#00f5c4'],
    opts:['(1,10)','(2,15)','(3,20)','(3,15)'], answer:'(3,20)', grid:false
  },
  {
    story: 'Titik ungu ada di grid di bawah ini.',
    q: 'Koordinat titik ungu adalah…',
    pts:[[2,5]], colors:['#a78bfa'], opts:['(5,2)','(2,4)','(2,5)','(3,5)'], answer:'(2,5)', grid:true
  },
  {
    story: 'Grafik naik dari (1,5) ke (2,10) ke (3,15).',
    q: 'Koordinat titik terakhir adalah…',
    pts:[[1,5],[2,10],[3,15]], colors:['#64748b','#64748b','#f472b6'],
    opts:['(2,10)','(3,10)','(3,15)','(15,3)'], answer:'(3,15)', grid:false
  },
  {
    story: 'Titik kuning ditandai di peta grid.',
    q: 'Di mana posisi titik kuning ini?',
    pts:[[4,1]], colors:['#f59e0b'], opts:['(1,4)','(4,2)','(4,1)','(3,1)'], answer:'(4,1)', grid:true
  },
  {
    story: 'Data: (1,3), (2,5), (3,4), (4,6). Mana titik tertinggi?',
    q: 'Koordinat titik dengan nilai Y terbesar adalah…',
    pts:[[1,3],[2,5],[3,4],[4,6]], colors:['#64748b','#64748b','#64748b','#f59e0b'],
    opts:['(2,5)','(3,4)','(4,6)','(1,6)'], answer:'(4,6)', grid:false
  },
  {
    story: 'Titik biru ditandai di grid di bawah.',
    q: 'Koordinat titik biru adalah…',
    pts:[[3,3]], colors:['#38bdf8'], opts:['(3,3)','(2,3)','(3,2)','(4,3)'], answer:'(3,3)', grid:true
  },
  {
    story: 'Grafik menurun: (1,8), (2,5), (3,3), (4,1).',
    q: 'Pada koordinat mana grafik mulai (titik pertama)?',
    pts:[[1,8],[2,5],[3,3],[4,1]], colors:['#00f5c4','#64748b','#64748b','#64748b'],
    opts:['(1,5)','(2,8)','(1,8)','(8,1)'], answer:'(1,8)', grid:false
  }
];

let cur=0, score=0, timer=null, answered=false;
function shuffle(a){return a.sort(()=>Math.random()-0.5);}

function showQ(){
  if(cur>=QS.length){endGame();return;}
  answered=false;
  const q=QS[cur];
  document.getElementById('qV').textContent=(cur+1)+'/10';
  document.getElementById('storyText').textContent=q.story;
  document.getElementById('qText').textContent=q.q;
  if(q.grid){
    const maxN=q.pts.reduce((m,p)=>Math.max(m,p[0],p[1]),5)+1;
    const dim=Math.min(280,Math.max(200,maxN*40+60));
    document.getElementById('gridDisplay').innerHTML=buildGrid(q.pts,q.colors,dim,dim,maxN);
    document.getElementById('gridDisplay').style.display='flex';
  } else {
    document.getElementById('gridDisplay').style.display='none';
  }
  const shuffled=shuffle([...q.opts]);
  const optsDiv=document.getElementById('optsDiv');
  optsDiv.innerHTML='';
  shuffled.forEach(opt=>{
    const b=document.createElement('button');
    b.className='opt-btn';
    b.textContent=opt;
    b.onclick=()=>pick(opt,q.answer);
    optsDiv.appendChild(b);
  });
  document.getElementById('feedbackDiv').textContent='';
  document.getElementById('feedbackDiv').className='feedback';
  startTimer();
}

function startTimer(){
  clearInterval(timer);
  let t=25;
  document.getElementById('timerV').textContent=t;
  document.getElementById('timerV').classList.remove('warn');
  document.getElementById('timerFill').style.transition='none';
  document.getElementById('timerFill').style.width='100%';
  setTimeout(()=>{
    document.getElementById('timerFill').style.transition='width 25s linear';
    document.getElementById('timerFill').style.width='0%';
  },50);
  timer=setInterval(()=>{
    t--;
    document.getElementById('timerV').textContent=t;
    if(t<=8)document.getElementById('timerV').classList.add('warn');
    if(t<=0){clearInterval(timer);if(!answered)pick('__timeout__',QS[cur].answer);}
  },1000);
}

function pick(chosen,correct){
  if(answered)return;
  answered=true;
  clearInterval(timer);
  document.getElementById('timerFill').style.transition='none';
  const btns=document.querySelectorAll('.opt-btn');
  btns.forEach(b=>{
    b.disabled=true;
    if(b.textContent.trim()===chosen&&chosen===correct)b.classList.add('correct');
    else if(b.textContent.trim()===chosen)b.classList.add('wrong');
    else if(b.textContent.trim()===correct)b.classList.add('correct');
  });
  const fb=document.getElementById('feedbackDiv');
  if(chosen===correct){
    score+=10;
    document.getElementById('scoreV').textContent=score;
    fb.className='feedback ok';fb.textContent='✅ BENAR!';
  }else{
    fb.className='feedback ko';
    fb.textContent=chosen==='__timeout__'?'⏱ WAKTU! Jawaban: '+correct:'❌ SALAH! Jawaban: '+correct;
  }
  setTimeout(()=>{cur++;showQ();},1400);
}

function endGame(){
  document.getElementById('game').style.display='none';
  document.getElementById('result').style.display='block';
  document.getElementById('finalScore').textContent=score;
  const gb=document.getElementById('gradeBadge');
  const em=document.getElementById('resultEmoji');
  if(score>=90){gb.textContent='⭐ RANK S';gb.className='grade-badge grade-s';em.textContent='🏆';}
  else if(score>=70){gb.textContent='🔍 RANK A';gb.className='grade-badge grade-a';em.textContent='🎯';}
  else if(score>=50){gb.textContent='💪 RANK B';gb.className='grade-badge grade-b';em.textContent='💪';}
  else{gb.textContent='📚 RANK C';gb.className='grade-badge grade-c';em.textContent='📚';}
}

function startGame(){
  cur=0;score=0;
  document.getElementById('intro').style.display='none';
  document.getElementById('game').style.display='block';
  showQ();
}

function resetGame(){
  cur=0;score=0;
  document.getElementById('scoreV').textContent='0';
  document.getElementById('result').style.display='none';
  document.getElementById('game').style.display='block';
  showQ();
}
</script>
