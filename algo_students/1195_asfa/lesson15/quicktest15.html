<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Test · Lesson 15 · Asfa</title>
<link rel="icon" type="image/svg+xml" href="../../../assets/logo1.svg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#1a1a28;--border:#2a2a40;--neon:#00f5c4;--accent:#f59e0b;--text:#e2e8f0;--muted:#64748b;--violet:#a78bfa;--red:#ef4444;--blue:#38bdf8;--orange:#fb923c;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(245,158,11,0.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(0,245,196,0.06) 0%,transparent 50%);pointer-events:none;}
  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;font-family:'Orbitron',monospace;font-size:0.72rem;letter-spacing:1px;}
  nav a{color:var(--muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--neon);}
  nav span{color:var(--border);}
  nav .current{color:var(--accent);}
  .wrapper{max-width:640px;margin:0 auto;padding:3rem 1.5rem 6rem;position:relative;z-index:1;}

  #intro{text-align:center;}
  .qt-icon{font-size:5rem;display:block;margin-bottom:1.5rem;animation:pulse 1.5s ease infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
  .qt-title{font-family:'Orbitron',monospace;font-size:clamp(1.4rem,5vw,2rem);font-weight:900;color:var(--accent);margin-bottom:0.8rem;text-shadow:0 0 30px rgba(245,158,11,0.4);}
  .qt-sub{color:var(--muted);line-height:1.7;margin-bottom:2rem;font-size:0.95rem;}
  .info-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.8rem;margin-bottom:2.5rem;}
  @media(max-width:480px){.info-cards{grid-template-columns:1fr;}}
  .info-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;text-align:center;}
  .info-val{font-family:'Orbitron',monospace;font-size:1.8rem;font-weight:900;color:var(--accent);margin-bottom:0.3rem;}
  .info-lbl{font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .start-btn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;font-weight:800;padding:1rem 3rem;border-radius:14px;border:none;font-family:'Orbitron',monospace;font-size:1rem;letter-spacing:3px;cursor:pointer;box-shadow:0 4px 20px rgba(245,158,11,0.4);transition:all 0.2s;}
  .start-btn:hover{transform:translateY(-3px);}

  #game{display:none;}
  .hud{display:flex;justify-content:space-between;align-items:stretch;margin-bottom:1.5rem;gap:0.8rem;}
  .hud-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0.7rem 1.2rem;text-align:center;flex:1;}
  .hud-val{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:700;}
  .hud-lbl{font-size:0.62rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:0.1rem;}
  .hud-val.score-v{color:var(--accent);}
  .hud-val.q-v{color:var(--neon);}
  .hud-val.timer-v{color:var(--text);transition:color 0.3s;}
  .hud-val.timer-v.warn{color:var(--red);animation:blink 0.5s ease infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.4;}}

  .q-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.5rem;margin-bottom:1.2rem;}
  .q-label{font-family:'Orbitron',monospace;font-size:0.62rem;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:0.5rem;}
  .q-type-badge{display:inline-block;font-size:0.7rem;padding:0.2rem 0.7rem;border-radius:20px;margin-bottom:0.8rem;font-weight:700;letter-spacing:1px;}
  .badge-dual{background:rgba(56,189,248,0.1);color:var(--blue);border:1px solid rgba(56,189,248,0.3);}
  .badge-rev{background:rgba(251,146,60,0.1);color:var(--orange);border:1px solid rgba(251,146,60,0.3);}
  .badge-rule{background:rgba(167,139,250,0.1);color:var(--violet);border:1px solid rgba(167,139,250,0.3);}

  /* Machine display */
  .machine-display{background:#12121c;border-radius:12px;padding:1rem;margin-bottom:1.2rem;overflow-x:auto;}
  .dm-row{display:flex;align-items:center;justify-content:center;gap:0.5rem;flex-wrap:wrap;row-gap:0.4rem;}
  .dm-input{background:rgba(56,189,248,0.1);border:1.5px solid var(--blue);border-radius:8px;padding:0.4rem 0.7rem;font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:900;color:var(--blue);min-width:40px;text-align:center;}
  .dm-arrow{color:var(--muted);font-size:1rem;}
  .dm-box{border-radius:8px;padding:0.4rem 0.7rem;font-family:'Orbitron',monospace;font-size:0.82rem;font-weight:700;text-align:center;min-width:60px;}
  .dm-box.b1{background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.3);color:var(--blue);}
  .dm-box.b2{background:rgba(167,139,250,0.08);border:1px solid rgba(167,139,250,0.3);color:var(--violet);}
  .dm-output{background:rgba(245,158,11,0.1);border:1.5px solid var(--accent);border-radius:8px;padding:0.4rem 0.7rem;font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:900;color:var(--accent);min-width:40px;text-align:center;}
  .dm-output.rev{border-color:var(--orange);color:var(--orange);}
  .dm-input.rev{border-color:var(--orange);color:var(--orange);}

  .q-prompt{text-align:center;font-family:'Orbitron',monospace;font-size:0.9rem;color:var(--text);margin-bottom:1.2rem;line-height:1.6;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;}
  .opt-btn{background:#12121c;border:1px solid var(--border);color:var(--text);padding:0.7rem 1rem;border-radius:10px;cursor:pointer;font-family:'Orbitron',monospace;font-size:0.85rem;letter-spacing:1px;transition:all 0.2s;text-align:center;line-height:1.4;}
  .opt-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(245,158,11,0.07);}
  .opt-btn.correct{border-color:var(--neon);background:rgba(0,245,196,0.1);color:var(--neon);}
  .opt-btn.wrong{border-color:var(--red);background:rgba(239,68,68,0.1);color:var(--red);}
  .feedback{text-align:center;font-family:'Orbitron',monospace;font-size:0.8rem;letter-spacing:1px;height:28px;margin-top:0.6rem;}
  .feedback.ok{color:var(--neon);}
  .feedback.ko{color:var(--red);}

  #result{display:none;text-align:center;}
  .score-big{font-family:'Orbitron',monospace;font-size:clamp(3rem,12vw,5rem);font-weight:900;color:var(--accent);line-height:1;margin-bottom:0.5rem;}
  .score-label{font-size:0.85rem;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:2rem;}
  .grade-badge{display:inline-block;font-family:'Orbitron',monospace;font-size:1.1rem;letter-spacing:3px;padding:0.5rem 1.5rem;border-radius:12px;margin-bottom:2rem;}
  .grade-s{background:rgba(0,245,196,0.1);border:2px solid var(--neon);color:var(--neon);}
  .grade-a{background:rgba(167,139,250,0.1);border:2px solid var(--violet);color:var(--violet);}
  .grade-b{background:rgba(245,158,11,0.1);border:2px solid var(--accent);color:var(--accent);}
  .grade-c{background:rgba(239,68,68,0.1);border:2px solid var(--red);color:var(--red);}
  .result-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
  .act-btn{padding:0.75rem 1.8rem;border-radius:12px;font-family:'Orbitron',monospace;font-size:0.78rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-block;}
  .act-primary{background:linear-gradient(135deg,var(--accent),#d97706);color:#000;border:none;font-weight:800;}
  .act-secondary{background:var(--card);border:1px solid var(--border);color:var(--text);}
  .act-primary:hover{transform:translateY(-2px);}
  .act-secondary:hover{border-color:var(--accent);color:var(--accent);}
</style>
</head>
<body>
<nav>
  <a href="../../../index.html">MATH ARENA</a>
  <span>›</span>
  <a href="../asfa_1195.html">ASFA</a>
  <span>›</span>
  <a href="lesson15.html">LESSON 15</a>
  <span>›</span>
  <span class="current">QUICK TEST</span>
</nav>

<div class="wrapper">
  <div id="intro">
    <span class="qt-icon">⚡</span>
    <div class="qt-title">Quick Test · Reverse & Double</div>
    <div class="qt-sub">10 soal campuran — mesin dua langkah, reverse challenge, dan identifikasi aturan. Timer 30 detik!</div>
    <div class="info-cards">
      <div class="info-card"><div class="info-val">10</div><div class="info-lbl">Soal</div></div>
      <div class="info-card"><div class="info-val" style="color:var(--red)">30s</div><div class="info-lbl">Timer</div></div>
      <div class="info-card"><div class="info-val" style="color:var(--neon)">+10</div><div class="info-lbl">Per Soal</div></div>
    </div>
    <button class="start-btn" onclick="startGame()">MULAI ⚡</button>
  </div>

  <div id="game">
    <div class="hud">
      <div class="hud-item"><div class="hud-val score-v" id="scoreV">0</div><div class="hud-lbl">Score</div></div>
      <div class="hud-item"><div class="hud-val q-v" id="qV">1/10</div><div class="hud-lbl">Soal</div></div>
      <div class="hud-item"><div class="hud-val timer-v" id="timerV">30</div><div class="hud-lbl">Detik</div></div>
    </div>
    <div class="q-card">
      <div class="q-label">Level 2 ⚡</div>
      <div id="typeBadge"></div>
      <div class="machine-display" id="machineDisplay"></div>
      <div class="q-prompt" id="qPrompt"></div>
      <div class="opts" id="optsDiv"></div>
      <div class="feedback" id="feedbackDiv"></div>
    </div>
  </div>

  <div id="result">
    <div style="font-size:4rem;margin-bottom:1rem;">🏆</div>
    <div class="score-big" id="finalScore">0</div>
    <div class="score-label">poin dari 100</div>
    <div class="grade-badge" id="gradeBadge">—</div>
    <div class="result-actions">
      <button class="act-btn act-primary" onclick="resetGame()">ULANG</button>
      <a href="exercise15.html" class="act-btn act-secondary">Exercise</a>
      <a href="lesson15.html" class="act-btn act-secondary">Lesson 15</a>
    </div>
  </div>
</div>

<script>
// type: 'dual'=dua langkah, 'rev'=reverse, 'rule'=identifikasi aturan
const QS = [
  // Dual step
  {type:'dual', s1:'× 2', s2:'+ 3', inp:5,  correct:13, wrongs:[11,12,14], prompt:'Mesin ×2 lalu +3. Input=5, output=?', expl:'5×2=10, +3=13'},
  {type:'dual', s1:'× 3', s2:'+ 1', inp:4,  correct:13, wrongs:[11,12,14], prompt:'Mesin ×3 lalu +1. Input=4, output=?', expl:'4×3=12, +1=13'},
  {type:'dual', s1:'× 4', s2:'− 2', inp:3,  correct:10, wrongs:[8,9,11],   prompt:'Mesin ×4 lalu −2. Input=3, output=?', expl:'3×4=12, −2=10'},
  {type:'dual', s1:'× 2', s2:'+ 7', inp:6,  correct:19, wrongs:[17,18,20], prompt:'Mesin ×2 lalu +7. Input=6, output=?', expl:'6×2=12, +7=19'},
  // Reverse
  {type:'rev',  s1:'× 2', s2:'+ 1', out:15, correct:7,  wrongs:[6,8,9],   prompt:'Aturan ×2 lalu +1. Output=15. Input=?', expl:'15−1=14, 14÷2=7'},
  {type:'rev',  s1:'× 3', s2:'+ 4', out:19, correct:5,  wrongs:[4,6,7],   prompt:'Aturan ×3 lalu +4. Output=19. Input=?', expl:'19−4=15, 15÷3=5'},
  {type:'rev',  s1:'× 2', s2:'+ 5', out:21, correct:8,  wrongs:[6,7,9],   prompt:'Aturan ×2 lalu +5. Output=21. Input=?', expl:'21−5=16, 16÷2=8'},
  // Rule identification
  {type:'rule', pairs:[[1,5],[2,8],[3,11],[4,14]], correct:'y = 3x + 2', wrongs:['y = 4x + 1','y = 3x + 3','y = 2x + 3'], prompt:'Apa aturan mesin ini?', expl:'Selisih 3, x=1→5: 3(1)+2=5 ✓'},
  {type:'rule', pairs:[[1,4],[2,7],[3,10],[5,16]], correct:'y = 3x + 1', wrongs:['y = 4x','y = 3x + 2','y = 2x + 2'], prompt:'Apa aturan mesin ini?', expl:'Selisih 3, x=1→4: 3(1)+1=4 ✓'},
  {type:'dual', s1:'× 5', s2:'− 3', inp:4,  correct:17, wrongs:[15,16,18], prompt:'Mesin ×5 lalu −3. Input=4, output=?', expl:'4×5=20, −3=17'},
];

let cur=0, score=0, timer=null, answered=false;
function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}

function buildDualDisplay(q){
  return `<div class="dm-row">
    <div class="dm-input">${q.inp}</div>
    <div class="dm-arrow">→</div>
    <div class="dm-box b1">${q.s1}</div>
    <div class="dm-arrow">→</div>
    <div class="dm-box b2">${q.s2}</div>
    <div class="dm-arrow">→</div>
    <div class="dm-output">?</div>
  </div>`;
}

function buildRevDisplay(q){
  return `<div class="dm-row">
    <div class="dm-input rev">?</div>
    <div class="dm-arrow">→</div>
    <div class="dm-box b1">${q.s1}</div>
    <div class="dm-arrow">→</div>
    <div class="dm-box b2">${q.s2}</div>
    <div class="dm-arrow">→</div>
    <div class="dm-output rev">${q.out}</div>
  </div>`;
}

function buildRuleDisplay(q){
  let h='<table style="border-collapse:collapse;margin:0 auto;">';
  h+='<tr><th style="font-family:Orbitron,monospace;font-size:0.6rem;letter-spacing:2px;color:var(--muted);padding:0.3rem 1rem;">x</th><th style="font-family:Orbitron,monospace;font-size:0.6rem;letter-spacing:2px;color:var(--muted);padding:0.3rem 0.3rem;"></th><th style="font-family:Orbitron,monospace;font-size:0.6rem;letter-spacing:2px;color:var(--muted);padding:0.3rem 1rem;">y</th></tr>';
  q.pairs.forEach(([x,y])=>{
    h+=`<tr><td style="text-align:center;padding:0.4rem 1rem;font-family:Orbitron,monospace;font-size:1rem;font-weight:700;color:var(--blue);border-top:1px solid rgba(42,42,64,0.5);">${x}</td>
        <td style="text-align:center;padding:0.4rem 0.3rem;color:var(--muted);font-size:0.85rem;border-top:1px solid rgba(42,42,64,0.5);">→</td>
        <td style="text-align:center;padding:0.4rem 1rem;font-family:Orbitron,monospace;font-size:1rem;font-weight:700;color:var(--neon);border-top:1px solid rgba(42,42,64,0.5);">${y}</td></tr>`;
  });
  return h+'</table>';
}

function showQ(){
  if(cur>=QS.length){endGame();return;}
  answered=false;
  const q=QS[cur];
  document.getElementById('qV').textContent=(cur+1)+'/10';

  const badge=document.getElementById('typeBadge');
  if(q.type==='dual'){badge.innerHTML='<span class="q-type-badge badge-dual">⚙️ Dua Langkah</span>';}
  else if(q.type==='rev'){badge.innerHTML='<span class="q-type-badge badge-rev">🔄 Reverse</span>';}
  else{badge.innerHTML='<span class="q-type-badge badge-rule">🔍 Temukan Aturan</span>';}

  const md=document.getElementById('machineDisplay');
  if(q.type==='dual') md.innerHTML=buildDualDisplay(q);
  else if(q.type==='rev') md.innerHTML=buildRevDisplay(q);
  else md.innerHTML=buildRuleDisplay(q);

  document.getElementById('qPrompt').textContent=q.prompt;
  const opts=shuffle([q.correct,...q.wrongs]);
  const od=document.getElementById('optsDiv');
  od.innerHTML='';
  opts.forEach(opt=>{
    const b=document.createElement('button');
    b.className='opt-btn'; b.textContent=opt;
    b.onclick=()=>pick(String(opt),String(q.correct));
    od.appendChild(b);
  });
  document.getElementById('feedbackDiv').textContent='';
  document.getElementById('feedbackDiv').className='feedback';
  startTimer();
}

function startTimer(){
  clearInterval(timer);
  let t=30;
  const tv=document.getElementById('timerV');
  tv.textContent=t; tv.classList.remove('warn');
  timer=setInterval(()=>{
    t--; tv.textContent=t;
    if(t<=7) tv.classList.add('warn');
    if(t<=0){clearInterval(timer);if(!answered)pick('__timeout__',String(QS[cur].correct));}
  },1000);
}

function pick(chosen,correct){
  if(answered)return;
  answered=true; clearInterval(timer);
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.disabled=true;
    const v=b.textContent.trim();
    if(v===chosen&&chosen===correct) b.classList.add('correct');
    else if(v===chosen) b.classList.add('wrong');
    else if(v===correct) b.classList.add('correct');
  });
  const fb=document.getElementById('feedbackDiv');
  if(chosen===correct){
    score+=10; document.getElementById('scoreV').textContent=score;
    fb.className='feedback ok'; fb.textContent='✅ BENAR! '+QS[cur].expl;
  } else {
    fb.className='feedback ko';
    fb.textContent=chosen==='__timeout__'?'⏱ WAKTU! Jawaban: '+correct:'❌ '+QS[cur].expl;
  }
  setTimeout(()=>{cur++;showQ();},1800);
}

function endGame(){
  document.getElementById('game').style.display='none';
  document.getElementById('result').style.display='block';
  document.getElementById('finalScore').textContent=score;
  const gb=document.getElementById('gradeBadge');
  if(score>=90){gb.textContent='⭐ RANK S';gb.className='grade-badge grade-s';}
  else if(score>=70){gb.textContent='🏆 RANK A';gb.className='grade-badge grade-a';}
  else if(score>=50){gb.textContent='💪 RANK B';gb.className='grade-badge grade-b';}
  else{gb.textContent='📚 RANK C';gb.className='grade-badge grade-c';}
}
function startGame(){
  cur=0;score=0;
  document.getElementById('intro').style.display='none';
  document.getElementById('game').style.display='block';
  showQ();
}
function resetGame(){
  cur=0;score=0;
  document.getElementById('scoreV').textContent='0';
  document.getElementById('result').style.display='none';
  document.getElementById('game').style.display='block';
  showQ();
}
</script>
</body>
</html>
