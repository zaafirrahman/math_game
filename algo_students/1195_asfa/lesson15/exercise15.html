<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise · Lesson 15 · Asfa</title>
<link rel="icon" type="image/svg+xml" href="../../../assets/logo1.svg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--card:#1a1a28;--border:#2a2a40;--neon:#00f5c4;--accent:#f59e0b;--text:#e2e8f0;--muted:#64748b;--violet:#a78bfa;--red:#ef4444;--blue:#38bdf8;--orange:#fb923c;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 10% 20%,rgba(167,139,250,0.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 80%,rgba(0,245,196,0.05) 0%,transparent 50%);pointer-events:none;}
  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;font-family:'Orbitron',monospace;font-size:0.72rem;letter-spacing:1px;}
  nav a{color:var(--muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--neon);}
  nav span{color:var(--border);}
  nav .current{color:var(--violet);}
  .wrapper{max-width:680px;margin:0 auto;padding:2.5rem 1.5rem 6rem;position:relative;z-index:1;}

  .page-header{text-align:center;margin-bottom:2rem;}
  .page-title{font-family:'Orbitron',monospace;font-size:clamp(1.2rem,4vw,1.8rem);font-weight:900;color:var(--violet);margin-bottom:0.5rem;}
  .page-sub{color:var(--muted);font-size:0.9rem;}

  .prog-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;margin-bottom:2rem;}
  .prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;}
  .prog-label{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
  .prog-val{font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;color:var(--violet);}
  .prog-bar{background:var(--border);border-radius:99px;height:6px;overflow:hidden;}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--neon));border-radius:99px;transition:width 0.5s ease;}
  .dot-row{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.8rem;}
  .dot{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);cursor:pointer;transition:all 0.2s;font-family:'Orbitron',monospace;font-size:0.6rem;display:flex;align-items:center;justify-content:center;color:var(--muted);}
  .dot.done-ok{background:rgba(0,245,196,0.15);border-color:var(--neon);color:var(--neon);}
  .dot.done-ko{background:rgba(239,68,68,0.12);border-color:var(--red);color:var(--red);}
  .dot.active{border-color:var(--violet);color:var(--violet);background:rgba(167,139,250,0.1);}

  .q-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.6rem;margin-bottom:1.2rem;display:none;}
  .q-card.active{display:block;animation:fadeIn 0.3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
  .q-num{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:3px;color:var(--violet);text-transform:uppercase;}
  .q-tag{font-size:0.65rem;padding:0.2rem 0.6rem;border-radius:99px;font-weight:700;}
  .tag-dual{background:rgba(56,189,248,0.1);color:var(--blue);border:1px solid rgba(56,189,248,0.3);}
  .tag-rev{background:rgba(251,146,60,0.1);color:var(--orange);border:1px solid rgba(251,146,60,0.3);}
  .tag-rule{background:rgba(167,139,250,0.1);color:var(--violet);border:1px solid rgba(167,139,250,0.3);}
  .tag-notation{background:rgba(0,245,196,0.1);color:var(--neon);border:1px solid rgba(0,245,196,0.3);}
  .tag-cerita{background:rgba(245,158,11,0.1);color:var(--accent);border:1px solid rgba(245,158,11,0.3);}

  .q-text{font-size:0.95rem;line-height:1.7;margin-bottom:1.2rem;color:var(--text);}
  .q-text strong{color:var(--violet);}

  /* Machine inline */
  .mach-inline{display:flex;align-items:center;justify-content:center;gap:0.5rem;flex-wrap:wrap;row-gap:0.4rem;background:#12121c;border-radius:10px;padding:0.8rem;margin-bottom:1rem;}
  .mi-inp{background:rgba(56,189,248,0.1);border:1.5px solid var(--blue);border-radius:8px;padding:0.3rem 0.6rem;font-family:'Orbitron',monospace;font-size:1rem;font-weight:900;color:var(--blue);}
  .mi-arr{color:var(--muted);font-size:0.9rem;}
  .mi-box{border-radius:7px;padding:0.3rem 0.6rem;font-family:'Orbitron',monospace;font-size:0.8rem;font-weight:700;}
  .mi-box.b1{background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.3);color:var(--blue);}
  .mi-box.b2{background:rgba(167,139,250,0.08);border:1px solid rgba(167,139,250,0.3);color:var(--violet);}
  .mi-out{background:rgba(245,158,11,0.1);border:1.5px solid var(--accent);border-radius:8px;padding:0.3rem 0.6rem;font-family:'Orbitron',monospace;font-size:1rem;font-weight:900;color:var(--accent);}
  .mi-out.rev-out{border-color:var(--orange);color:var(--orange);}
  .mi-inp.rev-inp{border-color:var(--orange);color:var(--orange);}

  /* IO Table */
  .io-wrap{display:flex;justify-content:center;margin-bottom:1rem;}
  table.iot{border-collapse:collapse;}
  table.iot th{font-family:'Orbitron',monospace;font-size:0.6rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;padding:0.35rem 1.2rem;border-bottom:1px solid var(--border);}
  table.iot td{text-align:center;padding:0.5rem 1.2rem;font-family:'Orbitron',monospace;font-size:1.05rem;font-weight:700;border-top:1px solid rgba(42,42,64,0.5);}
  table.iot td.iv{color:var(--blue);}
  table.iot td.ov{color:var(--neon);}
  table.iot td.ar{color:var(--muted);font-size:0.8rem;padding:0.5rem 0.3rem;}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;margin-bottom:0.8rem;}
  @media(max-width:400px){.opts{grid-template-columns:1fr;}}
  .opt-btn{background:#12121c;border:1px solid var(--border);color:var(--text);padding:0.65rem 0.8rem;border-radius:10px;cursor:pointer;font-family:'Orbitron',monospace;font-size:0.78rem;letter-spacing:1px;transition:all 0.2s;text-align:center;line-height:1.4;}
  .opt-btn:hover:not(:disabled){border-color:var(--violet);background:rgba(167,139,250,0.07);}
  .opt-btn.correct{border-color:var(--neon);background:rgba(0,245,196,0.1);color:var(--neon);}
  .opt-btn.wrong{border-color:var(--red);background:rgba(239,68,68,0.1);color:var(--red);}
  .opt-btn.reveal-correct{border-color:var(--neon);background:rgba(0,245,196,0.06);color:var(--neon);}

  .q-feedback{min-height:24px;font-size:0.85rem;margin-bottom:0.8rem;line-height:1.5;}
  .q-feedback.ok{color:var(--neon);}
  .q-feedback.ko{color:var(--red);}

  .q-nav{display:flex;gap:0.8rem;justify-content:flex-end;}
  .qn-btn{padding:0.55rem 1.2rem;border-radius:10px;font-family:'Orbitron',monospace;font-size:0.72rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;border:1px solid var(--border);background:var(--card);color:var(--text);}
  .qn-btn.next{background:linear-gradient(135deg,var(--violet),#7c3aed);border:none;color:#fff;font-weight:800;}
  .qn-btn:hover{border-color:var(--violet);color:var(--violet);}
  .qn-btn.next:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(167,139,250,0.3);}

  #resultPanel{display:none;text-align:center;}
  .score-big{font-family:'Orbitron',monospace;font-size:clamp(3rem,12vw,5rem);font-weight:900;color:var(--violet);line-height:1;margin-bottom:0.5rem;}
  .score-label{font-size:0.85rem;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:2rem;}
  .grade-badge{display:inline-block;font-family:'Orbitron',monospace;font-size:1.1rem;letter-spacing:3px;padding:0.5rem 1.5rem;border-radius:12px;margin-bottom:2rem;}
  .grade-s{background:rgba(0,245,196,0.1);border:2px solid var(--neon);color:var(--neon);}
  .grade-a{background:rgba(167,139,250,0.1);border:2px solid var(--violet);color:var(--violet);}
  .grade-b{background:rgba(245,158,11,0.1);border:2px solid var(--accent);color:var(--accent);}
  .grade-c{background:rgba(239,68,68,0.1);border:2px solid var(--red);color:var(--red);}
  .result-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
  .act-btn{padding:0.75rem 1.8rem;border-radius:12px;font-family:'Orbitron',monospace;font-size:0.78rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-block;}
  .act-primary{background:linear-gradient(135deg,var(--violet),#7c3aed);color:#fff;border:none;font-weight:800;}
  .act-secondary{background:var(--card);border:1px solid var(--border);color:var(--text);}
  .act-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(167,139,250,0.3);}
  .act-secondary:hover{border-color:var(--violet);color:var(--violet);}
</style>
</head>

<div class="wrapper">

    <div class="page-title">🏋️ Exercise Zone</div>
    <div class="page-sub">20 soal latihan lengkap · Level 2 · Progress tersimpan otomatis</div>
  </div>

    <div class="prog-top">
      <div class="prog-label">Progress</div>
      <div class="prog-val" id="progVal">0 / 20</div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="dot-row" id="dotRow"></div>
  </div>
  <div id="questionsArea"></div>

    <div style="font-size:4rem;margin-bottom:1rem;">🏆</div>

      <button class="act-btn act-primary" onclick="resetAll()">ULANG SEMUA</button>
      <a href="quicktest15.html" class="act-btn act-secondary">Quick Test</a>

<script>
const STORAGE_KEY='asfa_l15_exercise';
const TOTAL=20;

// tag, label, text, mach (optional html), pairs (optional), correct, wrongs, expl
const QS = [
  // === DUAL STEP (1-6) ===
  {
    tag:'tag-dual',label:'Dua Langkah',
    text:'Mesin dua langkah: <strong>×2 lalu +3</strong>. Jika input = 4, berapa output?',
    mach:'<div class="mach-inline"><div class="mi-inp">4</div><div class="mi-arr">→</div><div class="mi-box b1">×2</div><div class="mi-arr">→</div><div class="mi-box b2">+3</div><div class="mi-arr">→</div><div class="mi-out">?</div></div>',
    correct:'11',wrongs:['9','10','12'],expl:'4×2=8, +3=11'
  },
  {
    tag:'tag-dual',label:'Dua Langkah',
    text:'Mesin: <strong>×3 lalu +2</strong>. Input = 5. Output?',
    mach:'<div class="mach-inline"><div class="mi-inp">5</div><div class="mi-arr">→</div><div class="mi-box b1">×3</div><div class="mi-arr">→</div><div class="mi-box b2">+2</div><div class="mi-arr">→</div><div class="mi-out">?</div></div>',
    correct:'17',wrongs:['15','16','18'],expl:'5×3=15, +2=17'
  },
  {
    tag:'tag-dual',label:'Dua Langkah',
    text:'Mesin: <strong>×4 lalu −1</strong>. Input = 3. Output?',
    mach:'<div class="mach-inline"><div class="mi-inp">3</div><div class="mi-arr">→</div><div class="mi-box b1">×4</div><div class="mi-arr">→</div><div class="mi-box b2">−1</div><div class="mi-arr">→</div><div class="mi-out">?</div></div>',
    correct:'11',wrongs:[' 9','10','12'],expl:'3×4=12, −1=11'
  },
  {
    tag:'tag-dual',label:'Dua Langkah',
    text:'Mesin: <strong>×2 lalu +5</strong>. Input = 7. Output?',
    mach:'<div class="mach-inline"><div class="mi-inp">7</div><div class="mi-arr">→</div><div class="mi-box b1">×2</div><div class="mi-arr">→</div><div class="mi-box b2">+5</div><div class="mi-arr">→</div><div class="mi-out">?</div></div>',
    correct:'19',wrongs:['17','18','20'],expl:'7×2=14, +5=19'
  },
  {
    tag:'tag-dual',label:'Dua Langkah',
    text:'Mesin: <strong>×5 lalu −4</strong>. Input = 6. Output?',
    mach:'<div class="mach-inline"><div class="mi-inp">6</div><div class="mi-arr">→</div><div class="mi-box b1">×5</div><div class="mi-arr">→</div><div class="mi-box b2">−4</div><div class="mi-arr">→</div><div class="mi-out">?</div></div>',
    correct:'26',wrongs:['24','25','28'],expl:'6×5=30, −4=26'
  },
  {
    tag:'tag-dual',label:'Dua Langkah',
    text:'Mesin: <strong>×3 lalu +6</strong>. Input = 10. Output?',
    mach:'<div class="mach-inline"><div class="mi-inp">10</div><div class="mi-arr">→</div><div class="mi-box b1">×3</div><div class="mi-arr">→</div><div class="mi-box b2">+6</div><div class="mi-arr">→</div><div class="mi-out">?</div></div>',
    correct:'36',wrongs:['34','35','38'],expl:'10×3=30, +6=36'
  },
  // === REVERSE (7-11) ===
  {
    tag:'tag-rev',label:'Reverse',
    text:'Aturan mesin: <strong>×2 lalu +1</strong>. Output = 11. Input berapa?',
    mach:'<div class="mach-inline"><div class="mi-inp rev-inp">?</div><div class="mi-arr">→</div><div class="mi-box b1">×2</div><div class="mi-arr">→</div><div class="mi-box b2">+1</div><div class="mi-arr">→</div><div class="mi-out rev-out">11</div></div>',
    correct:'5',wrongs:['4','6','7'],expl:'11−1=10, 10÷2=5'
  },
  {
    tag:'tag-rev',label:'Reverse',
    text:'Aturan mesin: <strong>×3 lalu +2</strong>. Output = 20. Input berapa?',
    mach:'<div class="mach-inline"><div class="mi-inp rev-inp">?</div><div class="mi-arr">→</div><div class="mi-box b1">×3</div><div class="mi-arr">→</div><div class="mi-box b2">+2</div><div class="mi-arr">→</div><div class="mi-out rev-out">20</div></div>',
    correct:'6',wrongs:['5','7','8'],expl:'20−2=18, 18÷3=6'
  },
  {
    tag:'tag-rev',label:'Reverse',
    text:'Aturan mesin: <strong>×4 lalu +3</strong>. Output = 27. Input berapa?',
    mach:'<div class="mach-inline"><div class="mi-inp rev-inp">?</div><div class="mi-arr">→</div><div class="mi-box b1">×4</div><div class="mi-arr">→</div><div class="mi-box b2">+3</div><div class="mi-arr">→</div><div class="mi-out rev-out">27</div></div>',
    correct:'6',wrongs:['5','7','8'],expl:'27−3=24, 24÷4=6'
  },
  {
    tag:'tag-rev',label:'Reverse',
    text:'Aturan mesin: <strong>×2 lalu +7</strong>. Output = 23. Input berapa?',
    mach:'<div class="mach-inline"><div class="mi-inp rev-inp">?</div><div class="mi-arr">→</div><div class="mi-box b1">×2</div><div class="mi-arr">→</div><div class="mi-box b2">+7</div><div class="mi-arr">→</div><div class="mi-out rev-out">23</div></div>',
    correct:'8',wrongs:['6','7','9'],expl:'23−7=16, 16÷2=8'
  },
  {
    tag:'tag-rev',label:'Reverse',
    text:'Aturan mesin: <strong>×5 lalu −2</strong>. Output = 28. Input berapa?',
    mach:'<div class="mach-inline"><div class="mi-inp rev-inp">?</div><div class="mi-arr">→</div><div class="mi-box b1">×5</div><div class="mi-arr">→</div><div class="mi-box b2">−2</div><div class="mi-arr">→</div><div class="mi-out rev-out">28</div></div>',
    correct:'6',wrongs:['5','7','8'],expl:'28+2=30, 30÷5=6'
  },
  // === RULE / NOTATION (12-16) ===
  {
    tag:'tag-rule',label:'Temukan Aturan',
    text:'Lihat tabel. Apa aturan mesinnya?',
    pairs:[[1,5],[2,8],[3,11],[4,14]],
    correct:'y = 3x + 2',wrongs:['y = 4x + 1','y = 3x + 3','y = 2x + 3'],expl:'Selisih 3 → koef 3. x=1: 3+2=5 ✓'
  },
  {
    tag:'tag-rule',label:'Temukan Aturan',
    text:'Identifikasi aturan mesin berikut.',
    pairs:[[1,6],[2,9],[3,12],[5,18]],
    correct:'y = 3x + 3',wrongs:['y = 4x + 2','y = 3x + 2','y = 3x + 4'],expl:'Selisih 3, x=1: 3+3=6 ✓'
  },
  {
    tag:'tag-notation',label:'Notasi',
    text:'Rumus mesin: <strong>y = 2x + 5</strong>. Jika x = 8, berapa y?',
    correct:'21',wrongs:['18','20','22'],expl:'y = 2(8)+5 = 16+5 = 21'
  },
  {
    tag:'tag-notation',label:'Notasi',
    text:'Rumus mesin: <strong>y = 4x − 3</strong>. Jika x = 7, berapa y?',
    correct:'25',wrongs:['24','26','28'],expl:'y = 4(7)−3 = 28−3 = 25'
  },
  {
    tag:'tag-notation',label:'Notasi',
    text:'Rumus mesin: <strong>y = 3x + 4</strong>. Jika x = 10, berapa y?',
    correct:'34',wrongs:['30','32','36'],expl:'y = 3(10)+4 = 30+4 = 34'
  },
  // === CERITA / CONTEXT (17-20) ===
  {
    tag:'tag-cerita',label:'Soal Cerita',
    text:'Robot pabrik punya aturan: kalikan jumlah bahan dengan 2, lalu tambah 5. Jika ada <strong>6 bahan</strong>, berapa output robot?',
    correct:'17',wrongs:['16','18','22'],expl:'6×2=12, +5=17'
  },
  {
    tag:'tag-cerita',label:'Soal Cerita',
    text:'Mesin konversi suhu punya rumus <strong>y = 3x + 2</strong>. Thermometer menunjukkan x = 12. Berapa nilai y yang keluar?',
    correct:'38',wrongs:['36','37','40'],expl:'y = 3(12)+2 = 36+2 = 38'
  },
  {
    tag:'tag-cerita',label:'Soal Cerita',
    text:'Sebuah mesin menghasilkan output 37. Aturan mesinnya: ×4 lalu +1. Berapa input yang dimasukkan?',
    mach:'<div class="mach-inline"><div class="mi-inp rev-inp">?</div><div class="mi-arr">→</div><div class="mi-box b1">×4</div><div class="mi-arr">→</div><div class="mi-box b2">+1</div><div class="mi-arr">→</div><div class="mi-out rev-out">37</div></div>',
    correct:'9',wrongs:['8','10','11'],expl:'37−1=36, 36÷4=9'
  },
  {
    tag:'tag-cerita',label:'Soal Cerita',
    text:'Tabel ini dari mesin yang rusak — beberapa output hilang. Aturan mesin: <strong>y = 5x − 2</strong>. Jika x = 9, y = ?',
    pairs:[[1,3],[2,8],[3,13],[9,'?']],
    correct:'43',wrongs:['40','42','45'],expl:'y = 5(9)−2 = 45−2 = 43'
  },
];

const STORAGE_KEY_L = 'asfa_l15_exercise';
let state = {answers: new Array(TOTAL).fill(null), cur: 0};

function saveState(){try{localStorage.setItem(STORAGE_KEY_L,JSON.stringify(state));}catch(e){}}
function loadState(){try{const s=localStorage.getItem(STORAGE_KEY_L);if(s)state=JSON.parse(s);}catch(e){}}

function buildTable(pairs){
  if(!pairs||!pairs.length) return '';
  let h=`<div class="io-wrap"><table class="iot"><tr><th>x</th><th></th><th>y</th></tr>`;
  pairs.forEach(([i,o])=>{h+=`<tr><td class="iv">${i}</td><td class="ar">→</td><td class="${o==='?'?'qv':'ov'}">${o}</td></tr>`;});
  return h+`</table></div>`;
}
function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}

function renderAll(){
  const qa=document.getElementById('questionsArea');
  qa.innerHTML='';
  QS.forEach((q,i)=>{
    const div=document.createElement('div');
    div.className='q-card'+(i===state.cur?' active':'');
    div.id='qcard'+i;
    const ans=state.answers[i];
    const opts=shuffle([q.correct,...q.wrongs]);
    let optsHtml='';
    opts.forEach(opt=>{
      let cls='opt-btn';
      if(ans!==null){
        if(opt===q.correct) cls+=' reveal-correct';
        if(opt===ans&&ans!==q.correct) cls+=' wrong';
      }
      optsHtml+=`<button class="${cls}" ${ans!==null?'disabled':''} onclick="pick(${i},'${opt.replace(/'/g,"\\'")}',this)">${opt}</button>`;
    });
    div.innerHTML=`
      <div class="q-meta">
        <div class="q-num">Soal ${i+1} / ${TOTAL}</div>
        <span class="q-tag ${q.tag}">${q.label}</span>
      </div>
      <div class="q-text">${q.text}</div>
      ${q.mach||''}
      ${buildTable(q.pairs)}
      <div class="opts">${optsHtml}</div>
      <div class="q-feedback ${ans===q.correct?'ok':ans!==null?'ko':''}" id="fb${i}">
        ${ans===q.correct?'✅ Benar! '+q.expl:ans!==null?'❌ Salah! '+q.expl:''}
      </div>
      <div class="q-nav">
        ${i>0?`<button class="qn-btn" onclick="gotoQ(${i-1})">← Prev</button>`:''}
        ${ans!==null&&i<TOTAL-1?`<button class="qn-btn next" onclick="gotoQ(${i+1})">Next →</button>`:''}
        ${ans!==null&&i===TOTAL-1?`<button class="qn-btn next" onclick="showResult()">Lihat Hasil 🏆</button>`:''}
      </div>`;
    qa.appendChild(div);
  });
  updateProgress();updateDots();
}

function pick(idx,chosen,btn){
  if(state.answers[idx]!==null)return;
  state.answers[idx]=chosen;
  saveState();
  const q=QS[idx];
  document.querySelectorAll(`#qcard${idx} .opt-btn`).forEach(b=>{
    b.disabled=true;
    const v=b.textContent.trim();
    if(v===q.correct) b.classList.add('reveal-correct');
    if(v===chosen&&chosen!==q.correct) b.classList.add('wrong');
  });
  const fb=document.getElementById('fb'+idx);
  if(chosen===q.correct){fb.className='q-feedback ok';fb.textContent='✅ Benar! '+q.expl;}
  else{fb.className='q-feedback ko';fb.textContent='❌ Salah! '+q.expl;}
  const nav=document.querySelector(`#qcard${idx} .q-nav`);
  const nb=document.createElement('button');
  nb.className='qn-btn next';
  if(idx<TOTAL-1){nb.textContent='Next →';nb.onclick=()=>gotoQ(idx+1);}
  else{nb.textContent='Lihat Hasil 🏆';nb.onclick=showResult;}
  nav.appendChild(nb);
  updateProgress();updateDots();
}

function gotoQ(idx){
  document.querySelectorAll('.q-card').forEach(c=>c.classList.remove('active'));
  document.getElementById('qcard'+idx).classList.add('active');
  state.cur=idx;saveState();
  updateDots();
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateProgress(){
  const done=state.answers.filter(a=>a!==null).length;
  document.getElementById('progVal').textContent=done+' / '+TOTAL;
  document.getElementById('progFill').style.width=(done/TOTAL*100)+'%';
}

function updateDots(){
  const dr=document.getElementById('dotRow');
  dr.innerHTML='';
  for(let i=0;i<TOTAL;i++){
    const d=document.createElement('div');
    d.className='dot';d.textContent=i+1;
    const ans=state.answers[i];
    if(ans!==null) d.className+=(ans===QS[i].correct?' done-ok':' done-ko');
    if(i===state.cur) d.className+=' active';
    d.onclick=()=>gotoQ(i);
    dr.appendChild(d);
  }
}

function showResult(){
  document.getElementById('questionsArea').style.display='none';
  document.getElementById('resultPanel').style.display='block';
  const correct=state.answers.filter((a,i)=>a===QS[i].correct).length;
  const score=correct*10;
  document.getElementById('finalScore').textContent=score;
  const gb=document.getElementById('gradeBadge');
  if(score>=180){gb.textContent='⭐ RANK S';gb.className='grade-badge grade-s';}
  else if(score>=140){gb.textContent='🏆 RANK A';gb.className='grade-badge grade-a';}
  else if(score>=100){gb.textContent='💪 RANK B';gb.className='grade-badge grade-b';}
  else{gb.textContent='📚 RANK C';gb.className='grade-badge grade-c';}
}

function resetAll(){
  state={answers:new Array(TOTAL).fill(null),cur:0};
  saveState();
  document.getElementById('resultPanel').style.display='none';
  document.getElementById('questionsArea').style.display='block';
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

loadState();
renderAll();
if(state.cur>0){
  document.querySelectorAll('.q-card').forEach(c=>c.classList.remove('active'));
  const el=document.getElementById('qcard'+state.cur);
  if(el) el.classList.add('active');
}
</script>
</body>
</html>
