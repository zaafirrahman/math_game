<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warmup · Lesson 11 · Asfa</title>
<link rel="icon" type="image/svg+xml" href="../../../assets/logo1.svg">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f; --card: #1a1a28; --border: #2a2a40;
    --neon: #00f5c4; --neon2: #7c3aed; --accent: #f59e0b;
    --cyan: #22d3ee; --red: #ef4444; --green: #4ade80;
    --violet: #a78bfa; --text: #e2e8f0; --muted: #64748b;
    --orange: #fb923c; --blue: #60a5fa; --ratio: #34d399;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; min-height: 100vh; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(239,68,68,0.07) 0%, transparent 50%);
    pointer-events: none;
  }
  nav {
    padding: 1rem 2rem; display: flex; align-items: center; gap: 0.5rem;
    border-bottom: 1px solid var(--border); background: rgba(10,10,15,0.9);
    backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100;
    font-family: 'Orbitron', monospace; font-size: 0.72rem; letter-spacing: 1px;
  }
  nav a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
  nav a:hover { color: var(--neon); }
  nav span { color: var(--border); }
  nav .current { color: #f87171; }
  .wrapper { max-width: 640px; margin: 0 auto; padding: 3rem 1.5rem 6rem; position: relative; z-index: 1; }

  #intro { text-align: center; }
  .warmup-icon { font-size: 5rem; display: block; margin-bottom: 1.5rem; animation: pulse 1.5s ease infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  .warmup-title { font-family: 'Orbitron', monospace; font-size: clamp(1.8rem,5vw,2.5rem); font-weight: 900; color: #f87171; margin-bottom: 0.8rem; text-shadow: 0 0 30px rgba(239,68,68,0.4); }
  .warmup-sub { color: var(--muted); line-height: 1.7; margin-bottom: 2rem; font-size: 0.95rem; }
  .info-cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.8rem; margin-bottom: 2.5rem; }
  @media(max-width:480px){ .info-cards { grid-template-columns: 1fr; } }
  .info-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem; text-align: center; }
  .info-val { font-family: 'Orbitron', monospace; font-size: 1.8rem; font-weight: 900; color: var(--ratio); margin-bottom: 0.3rem; }
  .info-lbl { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .start-btn { background: linear-gradient(135deg,#ef4444,#b91c1c); color: white; font-weight: 800; padding: 1rem 3rem; border-radius: 14px; border: none; font-family: 'Orbitron', monospace; font-size: 1rem; letter-spacing: 3px; cursor: pointer; box-shadow: 0 4px 20px rgba(239,68,68,0.4); transition: all 0.2s; }
  .start-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(239,68,68,0.5); }

  #game { display: none; }
  .hud { display: flex; justify-content: space-between; align-items: stretch; margin-bottom: 1.5rem; gap: 0.8rem; }
  .hud-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0.7rem 1.2rem; text-align: center; flex: 1; }
  .hud-val { font-family: 'Orbitron', monospace; font-size: 1.3rem; font-weight: 700; }
  .hud-lbl { font-size: 0.62rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 0.1rem; }
  .hud-val.score-v { color: var(--ratio); }
  .hud-val.q-v { color: var(--accent); }
  .hud-val.timer-v { color: var(--text); transition: color 0.3s; }
  .hud-val.timer-v.warn { color: var(--red); animation: blink 0.5s ease infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .phase-tag { text-align: center; font-family: 'Orbitron', monospace; font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 0.8rem; }
  .phase-a { color: var(--orange); }
  .phase-b { color: var(--ratio); }

  /* Situation display */
  .story-display {
    background: rgba(52,211,153,0.06); border: 1px solid rgba(52,211,153,0.25);
    border-radius: 16px; padding: 1.2rem 1.5rem; margin-bottom: 1.5rem; text-align: center;
  }
  .story-tag { font-family: 'Orbitron', monospace; font-size: 0.62rem; letter-spacing: 3px; color: var(--ratio); text-transform: uppercase; margin-bottom: 0.5rem; }
  .story-text { font-size: 1.05rem; font-weight: 700; color: var(--text); line-height: 1.5; }
  .story-text .hl-a { color: #f87171; }
  .story-text .hl-b { color: var(--blue); }
  .story-text .hl-r { color: var(--ratio); }

  /* Emoji visual for items */
  .emoji-visual { display: flex; justify-content: center; align-items: center; gap: 0.8rem; margin: 0.8rem 0; flex-wrap: wrap; }
  .emoji-group { display: flex; gap: 0.3rem; flex-wrap: wrap; justify-content: center; }
  .emoji-group span { font-size: 1.6rem; }
  .vs-sep { font-family: 'Orbitron', monospace; font-size: 1.4rem; color: var(--muted); }

  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; text-align: center; margin-bottom: 1.2rem; animation: fadeUp 0.35s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
  .q-text { font-family: 'Orbitron', monospace; font-size: clamp(0.85rem,3.5vw,1.1rem); font-weight: 900; color: var(--text); margin-bottom: 1.5rem; line-height: 1.5; }

  .opts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  @media(max-width:400px){ .opts-grid { grid-template-columns: 1fr; } }
  .opt { background: #12121c; border: 2px solid var(--border); color: var(--text); padding: 1rem; border-radius: 14px; cursor: pointer; font-family: 'Orbitron', monospace; font-size: 1rem; font-weight: 700; transition: all 0.15s; text-align: center; }
  .opt:hover:not(:disabled) { border-color: var(--ratio); background: rgba(52,211,153,0.06); }
  .opt.correct { border-color: var(--neon); background: rgba(0,245,196,0.12); color: var(--neon); }
  .opt.wrong { border-color: var(--red); background: rgba(239,68,68,0.1); color: var(--red); }
  .opt:disabled { cursor: default; }
  .q-feedback { margin-top: 1rem; padding: 0.9rem 1.2rem; border-radius: 12px; font-size: 0.9rem; font-weight: 700; display: none; line-height: 1.5; }
  .q-feedback.show { display: block; animation: fadeUp 0.3s ease; }
  .q-feedback.ok { background: rgba(0,245,196,0.1); color: var(--neon); border: 1px solid rgba(0,245,196,0.3); }
  .q-feedback.no { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
  .next-btn { width: 100%; padding: 1rem; border-radius: 12px; border: none; background: linear-gradient(135deg,var(--neon2),#4f46e5); color: white; font-family: 'Orbitron', monospace; font-size: 0.85rem; letter-spacing: 3px; cursor: pointer; margin-top: 1rem; display: none; transition: all 0.2s; box-shadow: 0 4px 15px rgba(124,58,237,0.3); }
  .next-btn:hover { transform: translateY(-2px); }
  .next-btn.show { display: block; animation: fadeUp 0.3s ease; }

  #results { display: none; text-align: center; }
  .result-icon { font-size: 5rem; display: block; margin-bottom: 1.5rem; animation: pulse 1s infinite; }
  .result-grade { font-family: 'Orbitron', monospace; font-size: clamp(3rem,10vw,5rem); font-weight: 900; margin-bottom: 0.5rem; }
  .result-label { font-family: 'Orbitron', monospace; font-size: 1rem; color: var(--muted); letter-spacing: 3px; margin-bottom: 2rem; }
  .score-breakdown { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem; text-align: left; }
  .score-row { display: flex; justify-content: space-between; align-items: center; padding: 0.45rem 0; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
  .score-row:last-child { border-bottom: none; }
  .score-row .qtext { color: var(--muted); }
  .verdict.ok { color: var(--neon); font-family: 'Orbitron', monospace; font-size: 0.75rem; }
  .verdict.no { color: var(--red); font-family: 'Orbitron', monospace; font-size: 0.75rem; }
  .xp-badge { display: inline-block; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.4); color: var(--accent); padding: 0.4rem 1.2rem; border-radius: 20px; font-family: 'Orbitron', monospace; font-size: 0.85rem; margin-bottom: 2rem; }
  .action-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  .btn { padding: 0.8rem 1.8rem; border-radius: 10px; border: none; font-family: 'Orbitron', monospace; font-size: 0.78rem; letter-spacing: 2px; cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-ghost:hover { border-color: var(--neon); color: var(--neon); }
  .btn-accent { background: linear-gradient(135deg,#ef4444,#b91c1c); color: white; }
  .btn-primary { background: linear-gradient(135deg,var(--neon2),#4f46e5); color: white; box-shadow: 0 4px 15px rgba(124,58,237,0.3); }
  .btn-primary:hover { transform: translateY(-2px); }
</style>
</head>
<body>
<nav>
  <a href="../../../index.html">MATH ARENA</a><span>›</span>
  <a href="../asfa_1195.html">ASFA</a><span>›</span>

</nav>
<div class="wrapper">

  <!-- INTRO -->
  <div id="intro">
    <span class="warmup-icon">🔥</span>
    <div class="warmup-title">WARMUP: BACA RASIO!</div>
    <div class="warmup-sub">
      Sebelum masuk ke dunia rasio, latih dulu <strong>instingmu</strong>!<br>
      Lihat situasinya → identifikasi rasio yang tepat.<br>
      Fase 1: dari visual/kata. Fase 2: hitung dan bandingkan!
    </div>
    <div class="info-cards">
      <div class="info-card"><div class="info-val">10</div><div class="info-lbl">Soal</div></div>
      <div class="info-card"><div class="info-val">15s</div><div class="info-lbl">Per Soal</div></div>
      <div class="info-card"><div class="info-val">2</div><div class="info-lbl">Fase</div></div>
    </div>
    <button class="start-btn" onclick="startGame()">▶ MULAI</button>
  </div>

  <!-- GAME -->
  <div id="game">
    <div class="hud">
      <div class="hud-item"><div class="hud-val score-v" id="scoreDisp">0</div><div class="hud-lbl">Score</div></div>
      <div class="hud-item"><div class="hud-val q-v" id="qDisp">1/10</div><div class="hud-lbl">Soal</div></div>
      <div class="hud-item"><div class="hud-val timer-v" id="timerDisp">15</div><div class="hud-lbl">Detik</div></div>
    </div>
    <div class="phase-tag" id="phaseTag"></div>
    <div class="story-display">
      <div class="story-tag">📊 Situasi</div>
      <div class="story-text" id="storyText"></div>
      <div class="emoji-visual" id="emojiVisual"></div>
    </div>
    <div class="q-card" id="qCard">
      <div class="q-text" id="qText"></div>
      <div class="opts-grid" id="optsGrid"></div>
      <div class="q-feedback" id="qFb"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">LANJUT →</button>
    </div>
  </div>

  <!-- RESULTS -->
  <div id="results">
    <span class="result-icon" id="resIcon"></span>
    <div class="result-grade" id="resGrade"></div>
    <div class="result-label" id="resLabel"></div>
    <div class="xp-badge" id="xpBadge"></div>
    <div class="score-breakdown" id="scoreBreakdown"></div>
    <div class="action-btns">
      <button class="btn btn-ghost" onclick="restartGame()">🔄 Ulangi</button>
      <a href="section1.html" class="btn btn-primary">📐 Section 1 →</a>
    </div>
  </div>

</div>

<script>
const questions = [
  // Fase A: Baca langsung dari situasi
  {
    phase:'a',
    story: 'Dalam kotak ada <span class="hl-a">3 bola merah</span> dan <span class="hl-b">5 bola biru</span>.',
    emoji: '<span>🔴</span><span>🔴</span><span>🔴</span>',
    emoji2: '<span>🔵</span><span>🔵</span><span>🔵</span><span>🔵</span><span>🔵</span>',
    text: 'Rasio bola merah : bola biru?',
    opts: ['3 : 5', '5 : 3', '3 : 8', '5 : 8'], answer: '3 : 5',
    explain: '✅ Merah ada 3, biru ada 5. Jadi rasionya 3 : 5!'
  },
  {
    phase:'a',
    story: 'Rina punya <span class="hl-a">4 potion merah</span> dan <span class="hl-b">2 potion biru</span> di inventorinya.',
    emoji: '<span>🧪</span><span>🧪</span><span>🧪</span><span>🧪</span>',
    emoji2: '<span>💧</span><span>💧</span>',
    text: 'Rasio potion merah : potion biru?',
    opts: ['4 : 2', '2 : 4', '4 : 6', '2 : 6'], answer: '4 : 2',
    explain: '✅ Potion merah 4, biru 2. Rasio = 4 : 2 (atau disederhanakan jadi 2 : 1!)'
  },
  {
    phase:'a',
    story: 'Di kelas ada <span class="hl-a">12 siswa laki-laki</span> dan <span class="hl-b">18 siswa perempuan</span>.',
    emoji: '<span>👦</span><span>👦</span><span>👦</span>',
    emoji2: '<span>👧</span><span>👧</span><span>👧</span><span>👧</span><span>👧</span>',
    text: 'Rasio laki-laki : perempuan?',
    opts: ['12 : 18', '18 : 12', '12 : 30', '2 : 3'], answer: '12 : 18',
    explain: '✅ Laki-laki 12, perempuan 18. Rasio = 12 : 18 (bisa disederhanakan ke 2 : 3!)'
  },
  {
    phase:'a',
    story: 'Resep kue butuh <span class="hl-a">2 cangkir tepung</span> dan <span class="hl-b">1 cangkir gula</span>.',
    emoji: '<span>🫙</span><span>🫙</span>',
    emoji2: '<span>🍬</span>',
    text: 'Rasio tepung : gula?',
    opts: ['1 : 2', '2 : 1', '2 : 3', '1 : 3'], answer: '2 : 1',
    explain: '✅ Tepung 2, gula 1. Rasio tepung : gula = 2 : 1!'
  },
  {
    phase:'a',
    story: 'Skor game Budi: <span class="hl-a">6 kill</span> dan <span class="hl-b">2 death</span> dalam satu ronde.',
    emoji: '⚔️⚔️⚔️⚔️⚔️⚔️',
    emoji2: '💀💀',
    text: 'Rasio kill : death?',
    opts: ['6 : 2', '2 : 6', '6 : 8', '3 : 1'], answer: '6 : 2',
    explain: '✅ Kill 6, death 2. Rasio = 6 : 2 (atau 3 : 1 dalam bentuk sederhana!)'
  },
  // Fase B: Hitung & bandingkan
  {
    phase:'b',
    story: 'Jus jeruk dibuat dari <span class="hl-a">3 buah jeruk</span> untuk <span class="hl-b">1 gelas</span>.',
    emoji: '🍊🍊🍊 → 🥤',
    emoji2: '',
    text: 'Rasio jeruk : gelas = ?',
    opts: ['1 : 3', '3 : 1', '3 : 3', '1 : 1'], answer: '3 : 1',
    explain: '✅ 3 jeruk untuk 1 gelas → rasio jeruk : gelas = 3 : 1!'
  },
  {
    phase:'b',
    story: 'Campuran cat: <span class="hl-a">5 bagian biru</span> dan <span class="hl-b">2 bagian putih</span>.',
    emoji: '🔵🔵🔵🔵🔵',
    emoji2: '⬜⬜',
    text: 'Rasio biru : putih (paling sederhana)?',
    opts: ['5 : 2', '2 : 5', '10 : 4', '7 : 2'], answer: '5 : 2',
    explain: '✅ 5 biru, 2 putih. Rasio 5 : 2 sudah paling sederhana karena 5 dan 2 tidak punya faktor persekutuan!'
  },
  {
    phase:'b',
    story: '<span class="hl-r">Rasio senilai</span>: jika 2 : 3 = 4 : ?',
    emoji: '2 : 3  →  4 : ?',
    emoji2: '',
    text: 'Nilai ? yang benar?',
    opts: ['5', '6', '7', '8'], answer: '6',
    explain: '✅ 2 × 2 = 4, jadi 3 × 2 = 6. Rasio senilai: 2 : 3 = 4 : 6!'
  },
  {
    phase:'b',
    story: 'Resep untuk <span class="hl-a">2 orang</span> butuh <span class="hl-b">4 telur</span>. Untuk 6 orang butuh berapa?',
    emoji: '👤👤 → 🥚🥚🥚🥚',
    emoji2: '👤👤👤👤👤👤 → ?',
    text: 'Berapa telur untuk 6 orang?',
    opts: ['8', '10', '12', '6'], answer: '12',
    explain: '✅ 2 orang = 4 telur → 1 orang = 2 telur → 6 orang = 6 × 2 = 12 telur!'
  },
  {
    phase:'b',
    story: '<span class="hl-r">Mana yang lebih besar?</span> Bandingkan dua rasio berikut:',
    emoji: '2 : 3  vs  4 : 5',
    emoji2: '',
    text: 'Rasio mana yang "lebih besar"?',
    opts: ['2 : 3', '4 : 5', 'Sama besar', 'Tidak bisa dibandingkan'], answer: '4 : 5',
    explain: '✅ 2÷3 ≈ 0.67, tapi 4÷5 = 0.8. Jadi 4 : 5 lebih besar dari 2 : 3!'
  },
];

let cur=0, score=0, timeLeft=15, timer=null;
const results=[];

function startGame(){
  document.getElementById('intro').style.display='none';
  document.getElementById('game').style.display='block';
  loadQuestion();
}

function loadQuestion(){
  const q=questions[cur];
  document.getElementById('storyText').innerHTML=q.story;
  // Emoji visual
  const ev=document.getElementById('emojiVisual');
  if(q.emoji2){
    ev.innerHTML=`<div class="emoji-group">${q.emoji}</div><div class="vs-sep">:</div><div class="emoji-group">${q.emoji2}</div>`;
  } else if(q.emoji){
    ev.innerHTML=`<div class="emoji-group" style="font-size:1.4rem;letter-spacing:4px;">${q.emoji}</div>`;
  } else { ev.innerHTML=''; }
  document.getElementById('qText').textContent=q.text;
  document.getElementById('qDisp').textContent=`${cur+1} / ${questions.length}`;
  document.getElementById('qFb').className='q-feedback';
  document.getElementById('nextBtn').className='next-btn';
  const pt=document.getElementById('phaseTag');
  if(q.phase==='a'){ pt.textContent='📊 Fase 1 — Baca Situasi'; pt.className='phase-tag phase-a'; }
  else { pt.textContent='🧮 Fase 2 — Hitung & Bandingkan'; pt.className='phase-tag phase-b'; }
  const grid=document.getElementById('optsGrid');
  grid.innerHTML='';
  q.opts.forEach(val=>{
    const btn=document.createElement('button');
    btn.className='opt'; btn.textContent=val;
    btn.onclick=()=>answer(val,btn,q);
    grid.appendChild(btn);
  });
  const card=document.getElementById('qCard');
  card.style.animation='none'; void card.offsetWidth; card.style.animation='';
  startTimer();
}

function startTimer(){
  timeLeft=15; const d=document.getElementById('timerDisp');
  d.textContent=timeLeft; d.className='hud-val timer-v';
  clearInterval(timer);
  timer=setInterval(()=>{
    timeLeft--; d.textContent=timeLeft;
    if(timeLeft<=5) d.className='hud-val timer-v warn';
    if(timeLeft<=0){ clearInterval(timer); timeUp(); }
  },1000);
}

function answer(val,btn,q){
  clearInterval(timer);
  const correct=val===q.answer;
  document.getElementById('optsGrid').querySelectorAll('.opt').forEach(b=>b.disabled=true);
  btn.classList.add(correct?'correct':'wrong');
  if(!correct){ document.getElementById('optsGrid').querySelectorAll('.opt').forEach(b=>{ if(b.textContent===q.answer) b.classList.add('correct'); }); }
  const fb=document.getElementById('qFb');
  fb.textContent=q.explain; fb.className='q-feedback show '+(correct?'ok':'no');
  if(correct){ score+=10; document.getElementById('scoreDisp').textContent=score; }
  results.push({text:q.text, correct, answer:q.answer, chosen:val});
  document.getElementById('nextBtn').className='next-btn show';
}

function timeUp(){
  const q=questions[cur];
  document.getElementById('optsGrid').querySelectorAll('.opt').forEach(b=>{ b.disabled=true; if(b.textContent===q.answer) b.classList.add('correct'); });
  const fb=document.getElementById('qFb');
  fb.textContent='⏰ Waktu habis! '+q.explain; fb.className='q-feedback show no';
  results.push({text:q.text, correct:false, answer:q.answer, chosen:'—'});
  document.getElementById('nextBtn').className='next-btn show';
}

function nextQuestion(){
  cur++;
  if(cur>=questions.length){ showResults(); return; }
  loadQuestion();
}

function showResults(){
  document.getElementById('game').style.display='none';
  const res=document.getElementById('results'); res.style.display='block';
  let icon,grade,label,color;
  if(score>=90){icon='🏆';grade='S';label='RATIO MASTER';color='var(--ratio)';}
  else if(score>=70){icon='🔥';grade='A';label='INSTINNG TAJAM';color='var(--neon)';}
  else if(score>=50){icon='💪';grade='B';label='LUMAYAN JAGO';color='var(--orange)';}
  else{icon='😅';grade='C';label='MATERI SIAP BANTUIN';color='var(--red)';}
  document.getElementById('resIcon').textContent=icon;
  document.getElementById('resGrade').textContent=grade;
  document.getElementById('resGrade').style.color=color;
  document.getElementById('resLabel').textContent=label;
  const bd=document.getElementById('scoreBreakdown');
  bd.innerHTML='<div class="score-row"><span style="font-family:\'Orbitron\',monospace;font-size:0.7rem;color:var(--muted);">SOAL</span><span style="font-family:\'Orbitron\',monospace;font-size:0.7rem;color:var(--muted);">HASIL</span></div>';
  results.forEach(r=>{
    bd.innerHTML+=`<div class="score-row"><span class="qtext">${r.text.substring(0,45)}${r.text.length>45?'...':''}</span><span class="verdict ${r.correct?'ok':'no'}">${r.correct?'✓ BENAR':'✗ '+r.answer}</span></div>`;
  });
  document.getElementById('xpBadge').textContent=`⚡ +${score} XP — Score ${score}/100`;
}

function restartGame(){
  cur=0; score=0; results.length=0;
  document.getElementById('results').style.display='none';
  document.getElementById('scoreDisp').textContent=0;
  document.getElementById('game').style.display='none';
  document.getElementById('intro').style.display='block';
}
</script>
</body>
</html>
