<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan · Jarak, Waktu, Kecepatan · Fatih</title>
<link rel="icon" type="image/svg+xml" href="../../../assets/logo1.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1419;--card:#1c2533;--border:#2a3a4a;--border2:#344858;
    --amber:#f0a830;--amber-light:#f8c870;--amber-bg:rgba(240,168,48,0.1);
    --green:#48c870;--green-bg:rgba(72,200,112,0.1);
    --red:#e85040;
    --steel:#4a90b8;--steel-bg:rgba(74,144,184,0.1);--steel-light:#7ab8d8;
    --text:#dce8f0;--text-mid:#9ab0c0;--text-muted:#586878;
    --shadow:rgba(0,0,0,0.4);--track:#263545;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(74,144,184,0.05) 0%,transparent 55%);pointer-events:none;}

  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid var(--border);background:rgba(15,20,25,0.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100;font-family:'Rajdhani',sans-serif;font-size:0.82rem;font-weight:600;letter-spacing:1px;}
  nav a{color:var(--text-muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--amber);}
  nav span{color:var(--border2);}
  nav .cur{color:var(--green);}

  .track-strip{position:fixed;bottom:0;left:0;right:0;height:24px;background:var(--track);z-index:5;border-top:2px solid var(--border2);overflow:hidden;}
  .sleepers{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 18px,var(--border) 18px,var(--border) 24px);animation:roll 3s linear infinite;}
  @keyframes roll{from{background-position:0 0;}to{background-position:-42px 0;}}
  .track-rail{position:absolute;left:0;right:0;height:3px;background:var(--border2);}
  .track-rail:first-of-type{top:7px;}.track-rail:last-of-type{top:14px;}

  .wrap{max-width:680px;margin:0 auto;padding:2.5rem 1.5rem 5rem;position:relative;z-index:1;}

  #intro{text-align:center;margin-bottom:1rem;}
  .home-icon{font-size:4rem;display:block;margin-bottom:1rem;}
  .home-title{font-family:'Rajdhani',sans-serif;font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700;color:var(--green);letter-spacing:3px;margin-bottom:0.5rem;}
  .home-sub{color:var(--text-muted);font-size:0.9rem;line-height:1.7;margin-bottom:1.5rem;}
  .info-row{display:flex;gap:0.8rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem;}
  .info-chip{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.5rem 1rem;font-family:'Rajdhani',sans-serif;font-size:0.78rem;font-weight:600;letter-spacing:1px;color:var(--text-mid);}
  .info-chip span{color:var(--steel-light);}
  .start-btn{background:linear-gradient(135deg,var(--green),#30a860);color:#000;border:none;padding:1rem 3rem;border-radius:6px;font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:800;letter-spacing:3px;cursor:pointer;box-shadow:0 5px 18px rgba(72,200,112,0.3);transition:all 0.2s;}
  .start-btn:hover{transform:translateY(-3px);}

  #quiz{display:none;}
  .progress-wrap{margin-bottom:1.5rem;}
  .progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;}
  .progress-label{font-family:'Rajdhani',sans-serif;font-size:0.72rem;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}
  .progress-val{font-family:'Rajdhani',sans-serif;font-size:0.85rem;font-weight:700;color:var(--steel-light);}
  .progress-bg{background:var(--border);border-radius:4px;height:6px;overflow:hidden;}
  .progress-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--steel),var(--steel-light));transition:width 0.4s ease;}

  .q-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.8rem;margin-bottom:1rem;box-shadow:0 4px 14px var(--shadow);position:relative;overflow:hidden;}
  .q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),transparent);}
  .q-tag{font-family:'Rajdhani',sans-serif;font-size:0.65rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--green);margin-bottom:0.9rem;}
  .q-text{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.1rem;line-height:1.55;margin-bottom:1.1rem;letter-spacing:0.3px;text-align:center;}
  .q-context{color:var(--text-muted);font-size:0.86rem;line-height:1.6;margin-bottom:1rem;font-style:italic;}

  .tri-mini{display:flex;justify-content:center;margin:0.5rem 0 1.1rem;}
  .tri-mini svg{max-width:100%;height:auto;}

  /* Fill-in (isian) single value input */
  .fillin-row{display:flex;align-items:center;justify-content:center;gap:0.6rem;margin-bottom:1rem;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.15rem;flex-wrap:wrap;}
  .fillin-row input{width:110px;text-align:center;background:var(--track);border:2px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;padding:0.5rem 0.5rem;}
  .fillin-row input:focus{outline:none;border-color:var(--steel-light);}
  .fillin-row input.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);}
  .fillin-row input.wrong{border-color:var(--red);background:rgba(232,80,64,0.08);color:var(--red);}
  .fillin-submit{display:flex;justify-content:center;margin-bottom:0.6rem;}

  .feedback{padding:0.8rem 1rem;border-radius:8px;font-size:0.88rem;font-weight:600;display:none;line-height:1.55;}
  .feedback.show{display:block;}
  .feedback.ok{background:var(--green-bg);color:var(--green);border:1px solid rgba(72,200,112,0.3);}
  .feedback.no{background:rgba(232,80,64,0.07);color:var(--red);border:1px solid rgba(232,80,64,0.25);}

  .btn{padding:0.7rem 1.4rem;border-radius:6px;border:none;font-family:'Rajdhani',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-flex;align-items:center;gap:0.4rem;letter-spacing:1px;}
  .btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text-muted);}
  .btn-ghost:hover{border-color:var(--amber);color:var(--amber);}
  .btn-next{background:linear-gradient(135deg,var(--steel),#2a6a90);color:#fff;font-weight:800;}
  .btn-next:hover{transform:translateY(-2px);}
  .btn-check{background:linear-gradient(135deg,var(--green),#30a860);color:#000;font-weight:800;}
  .btn-check:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:0.35;cursor:default;pointer-events:none;}
  .nav-btns{display:flex;gap:0.8rem;margin-top:0.5rem;}

  #results{display:none;text-align:center;padding:1.5rem 0;}
  .res-icon{font-size:4.5rem;margin-bottom:1rem;display:block;animation:pop 0.5s ease;}
  @keyframes pop{from{transform:scale(0.5);}to{transform:scale(1);}}
  .res-score{font-family:'Rajdhani',sans-serif;font-size:2.8rem;font-weight:700;color:var(--amber);letter-spacing:3px;}
  .res-lbl{font-family:'Rajdhani',sans-serif;font-size:0.7rem;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:1.2rem;}
  .res-msg{color:var(--text-mid);font-size:0.9rem;line-height:1.7;margin-bottom:1.5rem;max-width:380px;margin-left:auto;margin-right:auto;}
  .score-grid{display:flex;gap:0.4rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem;}
  .sc-pip{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;}
  .pip-ok{background:var(--green-bg);border:1px solid rgba(72,200,112,0.4);}
  .pip-no{background:rgba(232,80,64,0.1);border:1px solid rgba(232,80,64,0.3);}
  .res-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
</style>
</head>
<body>
<div class="track-strip"><div class="sleepers"></div><div class="track-rail"></div><div class="track-rail"></div></div>

<nav>
  <a href="../../../index.html">MATH ARENA</a><span>/</span>
  <a href="../fatih_0560.html">FATIH</a><span>/</span>
  <a href="lesson23.html">LESSON 23</a><span>/</span>
  <span class="cur">LATIHAN</span>
</nav>

<div class="wrap">
  <!-- INTRO -->
  <div id="intro">
    <span class="home-icon">🏠</span>
    <div class="home-title">LATIHAN MANDIRI</div>
    <p class="home-sub">10 soal jarak, waktu, dan kecepatan tanpa timer. Santai, teliti, dan tentukan rumus yang tepat sebelum menjawab!</p>
    <div class="info-row">
      <div class="info-chip"><span>8</span> Isian J-K-W</div>
      <div class="info-chip"><span>2</span> Soal Cerita</div>
      <div class="info-chip">Tanpa <span>Timer</span></div>
    </div>
    <button class="start-btn" onclick="startQuiz()">MULAI LATIHAN 🏠</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz">
    <div class="progress-wrap">
      <div class="progress-top">
        <span class="progress-label">Progress</span>
        <span class="progress-val" id="progVal">1/10</span>
      </div>
      <div class="progress-bg"><div class="progress-bar" id="progBar" style="width:0%"></div></div>
    </div>
    <div id="qarea"></div>
  </div>

  <!-- RESULTS -->
  <div id="results"></div>
</div>

<script>
/* ===================== DATA ===================== */
// Type "fillin": soal isian jarak/waktu/kecepatan (satu jawaban angka)
// Type "story": soal cerita, satu jawaban angka
// target: 'jarak' | 'kecepatan' | 'waktu' -> menentukan bagian yang di-highlight pada segitiga mini

const QS = [
  { type:'fillin', tag:'🚲 Isian Jarak · Soal 1', text:'Kecepatan 20 km/jam, waktu 3 jam.<br>Jarak = ... km', unit:'km', answer:60, target:'jarak', note:'Jarak = Kecepatan × Waktu = 20 × 3 = 60' },
  { type:'fillin', tag:'🚲 Isian Jarak · Soal 2', text:'Kecepatan 45 km/jam, waktu 2 jam.<br>Jarak = ... km', unit:'km', answer:90, target:'jarak', note:'Jarak = Kecepatan × Waktu = 45 × 2 = 90' },
  { type:'fillin', tag:'⏱️ Isian Waktu · Soal 3', text:'Jarak 80 km, kecepatan 20 km/jam.<br>Waktu = ... jam', unit:'jam', answer:4, target:'waktu', note:'Waktu = Jarak ÷ Kecepatan = 80 ÷ 20 = 4' },
  { type:'fillin', tag:'⏱️ Isian Waktu · Soal 4', text:'Jarak 150 km, kecepatan 50 km/jam.<br>Waktu = ... jam', unit:'jam', answer:3, target:'waktu', note:'Waktu = Jarak ÷ Kecepatan = 150 ÷ 50 = 3' },
  { type:'fillin', tag:'🚗 Isian Kecepatan · Soal 5', text:'Jarak 100 km, waktu 2 jam.<br>Kecepatan = ... km/jam', unit:'km/jam', answer:50, target:'kecepatan', note:'Kecepatan = Jarak ÷ Waktu = 100 ÷ 2 = 50' },
  { type:'fillin', tag:'🚗 Isian Kecepatan · Soal 6', text:'Jarak 210 km, waktu 3 jam.<br>Kecepatan = ... km/jam', unit:'km/jam', answer:70, target:'kecepatan', note:'Kecepatan = Jarak ÷ Waktu = 210 ÷ 3 = 70' },
  { type:'fillin', tag:'🚲 Isian Jarak · Soal 7', text:'Kecepatan 60 km/jam, waktu 4 jam.<br>Jarak = ... km', unit:'km', answer:240, target:'jarak', note:'Jarak = Kecepatan × Waktu = 60 × 4 = 240' },
  { type:'fillin', tag:'⏱️ Isian Waktu · Soal 8', text:'Jarak 180 km, kecepatan 45 km/jam.<br>Waktu = ... jam', unit:'jam', answer:4, target:'waktu', note:'Waktu = Jarak ÷ Kecepatan = 180 ÷ 45 = 4' },
  { type:'story', tag:'📝 Soal Cerita · Soal 9', ctx:'Dina berjalan dengan kecepatan 5 km/jam selama 2 jam. Berapa kilometer yang ditempuh Dina?', unit:'km', answer:10, note:'Jarak = Kecepatan × Waktu = 5 × 2 = 10 km' },
  { type:'story', tag:'📝 Soal Cerita · Soal 10', ctx:'Sebuah kereta menempuh jarak 300 km dalam waktu 5 jam. Berapa kecepatan kereta tersebut?', unit:'km/jam', answer:60, note:'Kecepatan = Jarak ÷ Waktu = 300 ÷ 5 = 60 km/jam' }
];

let cur=0, score=0, results=[], answered=false;

function startQuiz(){
  document.getElementById('intro').style.display='none';
  document.getElementById('quiz').style.display='block';
  renderQ();
}

/* ===== Mini static J-K-W triangle (decorative, highlights the target quantity) ===== */
function renderMiniTriangle(target){
  const w = 130, h = 112;
  const apex = [w/2, 8], bl = [w*0.08, h-8], br = [w*0.92, h-8];
  const midY = apex[1] + (bl[1]-apex[1])*0.55;
  const midXL = apex[0] + (bl[0]-apex[0])*0.55;
  const midXR = apex[0] + (br[0]-apex[0])*0.55;
  const jarakFill = target==='jarak' ? 'rgba(240,168,48,0.18)' : '#1c2533';
  const jarakStroke = target==='jarak' ? '#f0a830' : '#344858';
  const kecFill = target==='kecepatan' ? 'rgba(240,168,48,0.18)' : 'transparent';
  const wakFill = target==='waktu' ? 'rgba(240,168,48,0.18)' : 'transparent';

  let svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<polygon points="${apex[0]},${apex[1]} ${bl[0]},${bl[1]} ${br[0]},${br[1]}" fill="#1c2533" stroke="#344858" stroke-width="1.3"/>`;
  svg += `<polygon points="${midXL},${midY} ${w/2},${h-8} ${w/2},${midY}" fill="${kecFill}"/>`;
  svg += `<polygon points="${w/2},${midY} ${w/2},${h-8} ${midXR},${midY}" fill="${wakFill}"/>`;
  svg += `<line x1="${midXL}" y1="${midY}" x2="${midXR}" y2="${midY}" stroke="#344858" stroke-width="1.3"/>`;
  svg += `<line x1="${w/2}" y1="${midY}" x2="${w/2}" y2="${h-8}" stroke="#344858" stroke-width="1.3"/>`;
  const boxW = (midXR-midXL)*0.92, boxH = (midY-apex[1])*0.72;
  svg += `<rect x="${w/2-boxW/2}" y="${apex[1]+(midY-apex[1])*0.28}" width="${boxW}" height="${boxH}" rx="4" fill="${jarakFill}" stroke="${jarakStroke}" stroke-width="${target==='jarak'?1.6:1.1}"/>`;
  svg += `<text x="${w/2}" y="${apex[1]+(midY-apex[1])*0.28+boxH/2+3}" fill="${target==='jarak'?'#f8c870':'#9ab0c0'}" font-family="Rajdhani" font-size="9.5" font-weight="800" text-anchor="middle">JARAK</text>`;
  svg += `<text x="${(midXL+w/2)/2}" y="${midY+(h-8-midY)*0.62}" fill="${target==='kecepatan'?'#f8c870':'#7ab8d8'}" font-family="Rajdhani" font-size="7.5" font-weight="700" text-anchor="middle">KECEPATAN</text>`;
  svg += `<text x="${(midXR+w/2)/2}" y="${midY+(h-8-midY)*0.62}" fill="${target==='waktu'?'#f8c870':'#7ab8d8'}" font-family="Rajdhani" font-size="8.5" font-weight="700" text-anchor="middle">WAKTU</text>`;
  svg += `</svg>`;
  return svg;
}

/* ===================== RENDER QUESTION ===================== */
function renderQ(){
  answered=false;
  updateProgress();
  const q = QS[cur];

  if(q.type==='fillin'){
    const triHtml = q.target ? `<div class="tri-mini">${renderMiniTriangle(q.target)}</div>` : '';
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <div class="q-text">${q.text}</div>
        ${triHtml}
        <div class="fillin-row">
          Jawaban: <input type="number" step="any" id="inAns" placeholder="${q.unit}"> <span style="color:var(--text-muted);font-size:0.9rem;">${q.unit}</span>
        </div>
        <div class="fillin-submit"><button class="btn btn-check" id="checkBtn" onclick="checkFillin()">Periksa Jawaban ✓</button></div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
    document.getElementById('inAns').addEventListener('keydown', e=>{ if(e.key==='Enter') checkFillin(); });
  }

  if(q.type==='story'){
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <p class="q-context">${q.ctx}</p>
        <div class="fillin-row">
          Jawaban: <input type="number" step="any" id="inAns" placeholder="${q.unit}"> <span style="color:var(--text-muted);font-size:0.9rem;">${q.unit}</span>
        </div>
        <div class="fillin-submit"><button class="btn btn-check" id="checkBtn" onclick="checkFillin()">Periksa Jawaban ✓</button></div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
    document.getElementById('inAns').addEventListener('keydown', e=>{ if(e.key==='Enter') checkFillin(); });
  }
}

/* ===================== FILLIN / STORY LOGIC ===================== */
function checkFillin(){
  if(answered) return;
  const q = QS[cur];
  const raw = document.getElementById('inAns').value;
  if(raw===''){
    const fb = document.getElementById('fb');
    fb.className = 'feedback show no';
    fb.textContent = '✗ Isi jawabannya terlebih dahulu.';
    return;
  }
  answered = true;
  const val = parseFloat(raw);
  const correct = Math.abs(val - q.answer) < 0.001;
  if(correct) score++;
  results[cur] = correct;
  const inp = document.getElementById('inAns');
  inp.classList.add(correct?'correct':'wrong');
  inp.disabled = true;
  document.getElementById('checkBtn').disabled = true;
  const fb = document.getElementById('fb');
  fb.className = 'feedback show ' + (correct?'ok':'no');
  fb.textContent = correct
    ? `✓ Benar! Jawabannya ${q.answer} ${q.unit}. ${q.note||''}`
    : `✗ Kurang tepat. Jawaban yang benar adalah ${q.answer} ${q.unit}. ${q.note||''}`;
  document.getElementById('nextBtn').disabled = false;
}

/* ===================== NAV & PROGRESS ===================== */
function updateProgress(){
  document.getElementById('progVal').textContent = `${cur+1}/10`;
  document.getElementById('progBar').style.width = (cur/10*100)+'%';
}

function nextQ(){
  if(cur<QS.length-1){ cur++; renderQ(); }
  else showResults();
}
function prevQ(){
  if(cur>0){ cur--; renderQ(); }
}

function showResults(){
  document.getElementById('quiz').style.display='none';
  const div=document.getElementById('results');
  div.style.display='block';
  const tot = results.filter(r=>r===true).length;
  const pct = tot/10;
  const icon = pct>=0.9?'🏆':pct>=0.7?'🎯':pct>=0.5?'🚗':'📉';
  const msg = pct>=0.9?'Luar biasa! Kamu sudah menguasai jarak, waktu, dan kecepatan dengan sangat baik!':pct>=0.7?'Bagus sekali! Terus latihan supaya makin cepat menghitung.':pct>=0.5?'Sudah lumayan! Coba review bagian yang masih salah.':'Jangan menyerah! Baca ulang materi segitiga J-K-W dan coba lagi ya.';
  const pips = Array.from({length:10},(_,i)=>`<div class="sc-pip pip-${results[i]===true?'ok':'no'}">${results[i]===true?'✓':'✗'}</div>`).join('');
  div.innerHTML=`
    <span class="res-icon">${icon}</span>
    <div class="res-score">${tot}/10</div>
    <div class="res-lbl">Soal Benar</div>
    <div class="score-grid">${pips}</div>
    <p class="res-msg">${msg}</p>
    <div class="res-btns">
      <button class="btn btn-next" onclick="location.reload()">🔄 Ulangi Latihan</button>
      <a href="soal23.html" class="btn btn-ghost">⚡ Coba Sprint</a>
      <a href="lesson23.html" class="btn btn-ghost">← Lesson</a>
    </div>
  `;
}
</script>
</body>
</html>
