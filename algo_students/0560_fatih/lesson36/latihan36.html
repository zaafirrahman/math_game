  .btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text-muted);}
  .btn-ghost:hover{border-color:var(--amber);color:var(--amber);}
  .btn-next{background:linear-gradient(135deg,var(--violet),#5b21b6);color:#fff;font-weight:800;}
  .btn-next:hover{transform:translateY(-2px);}

  .res-lbl{font-family:'Rajdhani',sans-serif;font-size:0.7rem;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:1.2rem;}
  .res-msg{color:var(--text-mid);font-size:0.9rem;line-height:1.7;margin-bottom:1.5rem;max-width:380px;margin-left:auto;margin-right:auto;}
  .score-grid{display:flex;gap:0.4rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem;}
  .sc-pip{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;}
  .pip-ok{background:var(--green-bg);border:1px solid rgba(72,200,112,0.4);}
  .pip-retry{background:var(--amber-bg);border:1px solid rgba(240,168,48,0.4);}
  .res-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}

  /* ===== lesson 36: geometry figure ===== */
  .geo-wrap{display:flex;justify-content:center;margin:0.2rem 0 1.1rem;}
  .geo-svg{width:100%;max-width:360px;height:auto;overflow:visible;}
  .geo-svg text{font-family:'Rajdhani',sans-serif;font-weight:800;text-anchor:middle;dominant-baseline:central;}
  .geo-svg .gd{font-size:15px;fill:var(--text);}
  .geo-svg .gd.am{fill:var(--amber);}
  .geo-svg .gi{font-size:16px;fill:var(--text);}
  .geo-svg .gs{font-size:11px;fill:var(--text-muted);font-weight:700;letter-spacing:0.5px;}
  .g-steel{fill:rgba(74,144,184,0.22);stroke:#4a90b8;stroke-width:2.5;stroke-linejoin:round;}
  .g-cut{fill:rgba(124,58,237,0.14);stroke:#a78bfa;stroke-width:2.5;stroke-dasharray:6 4;stroke-linejoin:round;}
  .g-aux{stroke:#9ab0c0;stroke-width:2;stroke-dasharray:5 4;}
  .g-tick{stroke:#f0a830;stroke-width:2.5;}
</style>

<script>
/* ===================== VALUE PARSER ===================== */
function parseValue(str){
  str = String(str).trim();
  if(str==='') return null;
  str = str.replace(',', '.');
  if(/^\d{1,3}(\.\d{3})+$/.test(str)){ str = str.replace(/\./g,''); }
  let val;
  let m = str.match(/^-?\d+(\.\d+)?$/);
  if(m){ val = parseFloat(str); }
  else return null;
  return val;
}
function valEqual(a,b,tol){
  if(a===null||b===null||isNaN(a)||isNaN(b)) return false;
  tol = tol || 0.01;
  return Math.abs(a-b) <= tol;
}


/* ===================== GEOMETRY FIGURES ===================== */
/* koordinat dalam cm, y ke bawah, S = piksel per cm (proporsional) */
function geo(id, cw, ch, S, aria, fn){
  const pad = 42, W = cw*S + pad*2, Ht = ch*S + pad*2;
  const X = v => +(pad + v*S).toFixed(2), Y = v => +(pad + v*S).toFixed(2);
  const H = {
    R:(x,y,w,h,c)=>`<rect class="${c}" x="${X(x)}" y="${Y(y)}" width="${w*S}" height="${h*S}" rx="2"/>`,
    P:(pts,c)=>`<polygon class="${c}" points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`,
    L:(x1,y1,x2,y2,c)=>`<line class="${c}" x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}"/>`,
    T:(x,y,t,c)=>`<text class="${c||'gd'}" x="${X(x)}" y="${Y(y)}">${t}</text>`
  };
  document.getElementById(id).innerHTML =
    `<svg class="geo-svg" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="${aria}">${fn(H)}</svg>`;
}
const Lpts = (w,h,cw,chh) => [[0,0],[w-cw,0],[w-cw,chh],[w,chh],[w,h],[0,h]];
/* bangun L: persegi panjang w x h, sudut kanan-atas dipotong cw x chh */
const lShape = (H,w,h,cw,chh) =>
  H.P(Lpts(w,h,cw,chh),'g-steel')+H.R(w-cw,0,cw,chh,'g-cut')+
  H.T(w/2,h+0.75,w+' cm')+H.T(-1.1,h/2,h+' cm')+
  H.T(w-cw/2,-0.75,cw+' cm')+H.T(w+1.1,chh/2,chh+' cm');
const rectTicks = (H,w,h) =>
  H.L(w/2,-0.2,w/2,0.2,'g-tick')+H.L(w/2,h-0.2,w/2,h+0.2,'g-tick')+
  H.L(-0.2,h/2-0.15,0.2,h/2-0.15,'g-tick')+H.L(-0.2,h/2+0.15,0.2,h/2+0.15,'g-tick')+
  H.L(w-0.2,h/2-0.15,w+0.2,h/2-0.15,'g-tick')+H.L(w-0.2,h/2+0.15,w+0.2,h/2+0.15,'g-tick');

const FIGS = {
  l1:[10,7,26,'Bangun L: persegi panjang 10 kali 7 dengan sudut kanan atas 4 kali 3 dipotong',H=>lShape(H,10,7,4,3)],
  l2:[9,6,28,'Bangun L: persegi panjang 9 kali 6 dengan sudut kanan atas 4 kali 2 dipotong',H=>lShape(H,9,6,4,2)],
  l3:[10,7,26,'Bangun L dengan sisi luar 6, 3, 4, 4, 10 dan 7 sentimeter dan satu garis bantu putus-putus',H=>
    H.P(Lpts(10,7,4,3),'g-steel')+H.R(6,0,4,3,'g-cut')+H.L(0,3,6,3,'g-aux')+H.T(3,2.4,'garis bantu','gs')+
    H.T(3,-0.75,'6 cm')+H.T(7.1,1.3,'3 cm')+H.T(8.2,2.35,'4 cm')+H.T(10.9,5,'4 cm')+H.T(5,7.75,'10 cm')+H.T(-1.1,3.5,'7 cm')],
  l4:[12,8,22,'Persegi panjang dengan lebar 8 sentimeter, panjang belum diketahui, luas 96 sentimeter persegi',H=>
    H.R(0,0,12,8,'g-steel')+H.T(6,4,'Luas = 96 cm²','gi')+H.T(6,-0.8,'? cm','gd am')+H.T(-1.1,4,'8 cm')],
  l5:[9,5,28,'Persegi panjang dengan sisi atas 9 sentimeter dan sisi kiri 5 sentimeter, sisi bawah dan kanan bertanda tanya',H=>
    H.R(0,0,9,5,'g-steel')+rectTicks(H,9,5)+H.T(4.5,-0.8,'9 cm')+H.T(-1.15,2.5,'5 cm')+H.T(4.5,5.8,'? cm','gd am')+H.T(10.2,2.5,'? cm','gd am')]
};

/* ===================== DATA ===================== */
// type "fillin"     : isian jawaban (angka)
// type "textchoice" : pilih jawaban berupa teks
const QS = [
  { type:'textchoice', fig:'l1', tag:'🔎 Memilih Strategi · Soal 1', text:'Bangun L pada gambar adalah persegi panjang 10 cm × 7 cm yang sudut kanan atasnya dipotong 4 cm × 3 cm. Pernyataan mana yang cocok untuk mencari luasnya dengan cara mengurangi bagian yang hilang?', options:['(10 × 7) + (4 × 3)','(10 × 7) − (4 × 3)','(10 + 7) − (4 + 3)'], answer:'(10 × 7) − (4 × 3)', note:'Luas persegi panjang utuh dikurangi luas bagian yang dipotong: 70 − 12 = 58 cm².' },

  { type:'fillin', fig:'l2', tag:'✂️ Luas Bangun Gabungan · Soal 2', text:'Bangun L pada gambar adalah persegi panjang 9 cm × 6 cm yang sudut kanan atasnya dipotong 4 cm × 2 cm. Berapa cm² luas bangun tersebut?', hint:'cth: 40', answer:'46', note:'Luas utuh = 9 × 6 = 54. Luas bagian yang dipotong = 4 × 2 = 8. Luas bangun = 54 − 8 = 46 cm².' },

  { type:'fillin', fig:'l3', tag:'📏 Keliling Bangun Gabungan · Soal 3', text:'Perhatikan bangun L di bawah. Garis putus-putus hanyalah garis bantu di dalam bangun. Berapa cm keliling bangun L tersebut?', hint:'cth: 30', answer:'34', note:'Keliling hanya menghitung batas luar: 6 + 3 + 4 + 4 + 10 + 7 = 34 cm. Garis bantu tidak ikut dihitung. Hasilnya sama dengan 2 × (10 + 7) = 34 cm.' },

  { type:'fillin', fig:'l4', tag:'🔍 Sisi yang Belum Diketahui · Soal 4', text:'Sebuah persegi panjang memiliki luas 96 cm² dan lebar 8 cm. Berapa cm panjangnya?', hint:'cth: 10', answer:'12', note:'Luas = panjang × lebar, jadi panjang = luas ÷ lebar = 96 ÷ 8 = 12 cm.' },

  { type:'textchoice', fig:'l5', tag:'🔍 Alasan di Balik Langkah · Soal 5', text:'Pada persegi panjang di gambar, hanya sisi atas (9 cm) dan sisi kiri (5 cm) yang diberi ukuran. Mengapa kita yakin sisi bawah panjangnya 9 cm?', options:['Karena 9 adalah angka yang paling besar','Karena sisi yang berhadapan pada persegi panjang sama panjang','Karena gambarnya terlihat sama panjang'], answer:'Karena sisi yang berhadapan pada persegi panjang sama panjang', note:'Sisi bawah berhadapan dengan sisi atas, jadi sama-sama 9 cm. Sisi kanan = sisi kiri = 5 cm. Keliling = 2 × (9 + 5) = 28 cm.' }
];

let cur=0, score=0, results=[], solved=false, hadMiss=false;

function startQuiz(){
  document.getElementById('intro').style.display='none';
  document.getElementById('quiz').style.display='block';
  renderQ();
}

function optionsHtml(options){
  return options.map(o=>`<button class="opt-btn wide" data-v="${o}" onclick="checkOption(this)">${o}</button>`).join('');
}

/* ===================== RENDER QUESTION ===================== */
function renderQ(){
  renderQ0();
  const q = QS[cur];
  if(q.fig){ const f = FIGS[q.fig]; geo('fig', f[0], f[1], f[2], f[3], f[4]); }
}
function renderQ0(){
  solved=false;
  hadMiss=false;
  updateProgress();
  const q = QS[cur];

  if(q.type==='fillin'){
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <div class="q-text">${q.text}</div>
        ${q.fig?'<div id="fig" class="geo-wrap"></div>':''}
        <div class="fillin-row">
          Jawaban: <input type="text" id="inAns" placeholder="${q.hint}">
        </div>
        <div class="fillin-hint">Isi angka saja · jawaban harus benar dulu baru bisa lanjut</div>
        <div class="fillin-submit"><button class="btn btn-check" id="checkBtn" onclick="checkFillin()">Periksa Jawaban ✓</button></div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
    const inp = document.getElementById('inAns');
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') checkFillin(); });
    inp.addEventListener('input', ()=>{ if(!solved){ inp.classList.remove('wrong'); document.getElementById('fb').className='feedback'; } });
  }

  if(q.type==='textchoice'){
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <div class="q-text">${q.text}</div>
        ${q.fig?'<div id="fig" class="geo-wrap"></div>':''}
        <div class="opt-row" id="optRow">${optionsHtml(q.options)}</div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
  }
}

/* ===================== FILLIN LOGIC ===================== */
function checkFillin(){
  if(solved) return;
  const q = QS[cur];
  const raw = document.getElementById('inAns').value;
  const fb = document.getElementById('fb');
  if(raw===''){
    fb.className = 'feedback show no';
    fb.textContent = '✗ Isi jawabannya terlebih dahulu.';
    return;
  }
  const userVal = parseValue(raw);
  if(userVal===null){
    fb.className = 'feedback show no';
    fb.textContent = '✗ Format belum dikenali. Coba isi angka biasa saja.';
    return;
  }
  const ansVal = parseValue(q.answer);
  const correct = valEqual(userVal, ansVal, 0.01);
  const inp = document.getElementById('inAns');

  if(correct){
    solved = true;
    score += hadMiss ? 5 : 10;
    results[cur] = hadMiss ? 'retry' : 'ok';
    inp.classList.remove('wrong');
    inp.classList.add('correct');
    inp.disabled = true;
    document.getElementById('checkBtn').disabled = true;
    fb.className = 'feedback show ok';
    fb.textContent = `✓ Benar! ${q.note||''}`;
    document.getElementById('nextBtn').disabled = false;
  } else {
    hadMiss = true;
    inp.classList.add('wrong');
    fb.className = 'feedback show no';
    fb.textContent = '✗ Belum tepat, coba periksa lagi ya!';
  }
}

/* ===================== OPTION (choice) LOGIC ===================== */
function checkOption(btn){
  if(solved) return;
  const q = QS[cur];
  const val = btn.getAttribute('data-v');
  const correct = (val === q.answer);
  const fb = document.getElementById('fb');

  if(correct){
    solved = true;
    score += hadMiss ? 5 : 10;
    results[cur] = hadMiss ? 'retry' : 'ok';
    document.querySelectorAll('#optRow .opt-btn').forEach(b=>b.disabled=true);
    btn.classList.add('correct');
    fb.className = 'feedback show ok';
    fb.textContent = `✓ Benar! ${q.note||''}`;
    document.getElementById('nextBtn').disabled = false;
  } else {
    hadMiss = true;
    btn.classList.add('wrong');
    fb.className = 'feedback show no';
    fb.textContent = '✗ Belum tepat, coba pikirkan lagi ya!';
    setTimeout(()=>{ btn.classList.remove('wrong'); }, 700);
  }
}

/* ===================== NAV & PROGRESS ===================== */
function updateProgress(){
  document.getElementById('progVal').textContent = `${cur+1}/${QS.length}`;
  document.getElementById('progBar').style.width = (cur/QS.length*100)+'%';
}

function nextQ(){
  if(cur<QS.length-1){ cur++; renderQ(); }
  else showResults();
}
function prevQ(){
  if(cur>0){ cur--; renderQ(); }
}

function showResults(){
  document.getElementById('quiz').style.display='none';
  const div=document.getElementById('results');
  div.style.display='block';
  const perfect = results.filter(r=>r==='ok').length;
  const pct = perfect/QS.length;
  const icon = pct>=0.9?'🏆':pct>=0.7?'🎯':pct>=0.5?'📘':'📉';
  const msg = pct>=0.9?'Luar biasa! Kamu sudah bisa memecah bentuk, menemukan sisi yang hilang, dan memilih strategi yang tepat!':pct>=0.7?'Bagus sekali! Sebagian besar cara berpikir geometri sudah kamu kuasai.':pct>=0.5?'Sudah lumayan! Coba baca lagi materinya, terutama bagian luas vs keliling dan sisi yang belum diketahui.':'Kamu berhasil menyelesaikan semua soal! Yuk buka lagi materinya, lalu coba lagi latihan ini.';
  const pips = Array.from({length:QS.length},(_,i)=>{
    const r = results[i];
    const cls = r==='ok' ? 'pip-ok' : 'pip-retry';
    const ic = r==='ok' ? '✓' : '↻';
    return `<div class="sc-pip ${cls}">${ic}</div>`;
  }).join('');
  div.innerHTML=`
    <span class="res-icon">${icon}</span>
    <div class="res-score">${score}/${QS.length*10}</div>
    <div class="res-lbl">Skor Latihan · ${perfect}/${QS.length} Langsung Benar</div>
    <div class="score-grid">${pips}</div>
    <p class="res-msg">${msg}</p>
    <div class="res-btns">
      <button class="btn btn-next" onclick="location.reload()">🔄 Ulangi Latihan</button>
      <a href="lesson36.html" class="btn btn-ghost">← Lesson</a>
    </div>
  `;
}
</script>
