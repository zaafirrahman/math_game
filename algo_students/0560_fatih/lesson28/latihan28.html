<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan · Review Bangun Ruang · Fatih</title>
<link rel="icon" type="image/svg+xml" href="../../../assets/logo1.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1419;--card:#1c2533;--border:#2a3a4a;--border2:#344858;
    --steel:#4a90b8;--steel-light:#7ab8d8;--steel-bg:rgba(74,144,184,0.1);
    --amber:#f0a830;--amber-light:#f8c870;--amber-bg:rgba(240,168,48,0.1);
    --green:#48c870;--green-bg:rgba(72,200,112,0.1);
    --red:#e85040;
    --violet:#7c3aed;--violet-bg:rgba(124,58,237,0.1);--violet-light:#a78bfa;
    --text:#dce8f0;--text-mid:#9ab0c0;--text-muted:#586878;
    --shadow:rgba(0,0,0,0.4);--track:#263545;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(74,144,184,0.05) 0%,transparent 55%);pointer-events:none;}

  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid var(--border);background:rgba(15,20,25,0.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100;font-family:'Rajdhani',sans-serif;font-size:0.82rem;font-weight:600;letter-spacing:1px;}
  nav a{color:var(--text-muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--steel-light);}
  nav span{color:var(--border2);}
  nav .cur{color:var(--green);}

  .track-strip{position:fixed;bottom:0;left:0;right:0;height:24px;background:var(--track);z-index:5;border-top:2px solid var(--border2);overflow:hidden;}
  .sleepers{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 18px,var(--border) 18px,var(--border) 24px);animation:roll 3s linear infinite;}
  @keyframes roll{from{background-position:0 0;}to{background-position:-42px 0;}}
  .track-rail{position:absolute;left:0;right:0;height:3px;background:var(--border2);}
  .track-rail:first-of-type{top:7px;}.track-rail:last-of-type{top:14px;}

  .wrap{max-width:680px;margin:0 auto;padding:2.5rem 1.5rem 5rem;position:relative;z-index:1;}

  #intro{text-align:center;margin-bottom:1rem;}
  .home-icon{font-size:4rem;display:block;margin-bottom:1rem;}
  .home-title{font-family:'Rajdhani',sans-serif;font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700;color:var(--green);letter-spacing:3px;margin-bottom:0.5rem;}
  .home-sub{color:var(--text-muted);font-size:0.9rem;line-height:1.7;margin-bottom:1.5rem;}
  .info-row{display:flex;gap:0.8rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem;}
  .info-chip{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.5rem 1rem;font-family:'Rajdhani',sans-serif;font-size:0.78rem;font-weight:600;letter-spacing:1px;color:var(--text-mid);}
  .info-chip span{color:var(--steel-light);}
  .start-btn{background:linear-gradient(135deg,var(--green),#30a860);color:#000;border:none;padding:1rem 3rem;border-radius:6px;font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:800;letter-spacing:3px;cursor:pointer;box-shadow:0 5px 18px rgba(72,200,112,0.3);transition:all 0.2s;}
  .start-btn:hover{transform:translateY(-3px);}

  #quiz{display:none;}
  .progress-wrap{margin-bottom:1.5rem;}
  .progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;}
  .progress-label{font-family:'Rajdhani',sans-serif;font-size:0.72rem;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}
  .progress-val{font-family:'Rajdhani',sans-serif;font-size:0.85rem;font-weight:700;color:var(--steel-light);}
  .progress-bg{background:var(--border);border-radius:4px;height:6px;overflow:hidden;}
  .progress-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--steel),var(--steel-light));transition:width 0.4s ease;}

  .q-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.8rem;margin-bottom:1rem;box-shadow:0 4px 14px var(--shadow);position:relative;overflow:hidden;}
  .q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),transparent);}
  .q-tag{font-family:'Rajdhani',sans-serif;font-size:0.65rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--green);margin-bottom:0.9rem;}
  .q-text{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.1rem;line-height:1.55;margin-bottom:1.1rem;letter-spacing:0.3px;text-align:center;}
  .q-context{color:var(--text-muted);font-size:0.86rem;line-height:1.6;margin-bottom:1rem;font-style:italic;}

  /* mini shape visual */
  .shape-mini{display:flex;justify-content:center;margin:0.3rem 0 1.1rem;}

  /* compare row for choice questions */
  .compare-row{display:flex;align-items:center;justify-content:center;gap:1rem;margin:0.4rem 0 1.1rem;flex-wrap:wrap;}
  .compare-box{background:var(--track);border:1.5px solid var(--border2);border-radius:10px;padding:0.7rem 1.2rem;font-family:'Rajdhani',sans-serif;font-weight:800;font-size:0.92rem;color:var(--text);min-width:110px;text-align:center;}
  .compare-vs{color:var(--text-muted);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:0.9rem;}

  /* Fill-in (isian) text input */
  .fillin-row{display:flex;align-items:center;justify-content:center;gap:0.6rem;margin-bottom:0.5rem;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.1rem;flex-wrap:wrap;}
  .fillin-row input{width:150px;text-align:center;background:var(--track);border:2px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:1.05rem;font-weight:700;padding:0.5rem 0.5rem;}
  .fillin-row input:focus{outline:none;border-color:var(--steel-light);}
  .fillin-row input.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);}
  .fillin-row input.wrong{border-color:var(--red);background:rgba(232,80,64,0.08);color:var(--red);}
  .fillin-hint{text-align:center;font-size:0.76rem;color:var(--text-muted);margin-bottom:1rem;}
  .fillin-submit{display:flex;justify-content:center;margin-bottom:0.6rem;}

  /* Choice buttons (symbols or Ya/Tidak) */
  .opt-row{display:flex;gap:0.7rem;justify-content:center;margin-bottom:0.6rem;flex-wrap:wrap;}
  .opt-btn{background:var(--track);border:2px solid var(--border2);color:var(--text);padding:0.8rem 1.6rem;border-radius:10px;cursor:pointer;font-size:1.3rem;font-family:'Rajdhani',sans-serif;font-weight:800;text-align:center;transition:all 0.15s;min-width:70px;}
  .opt-btn.wide{font-size:0.95rem;padding:0.8rem 1.3rem;min-width:100px;}
  .opt-btn:hover:not(:disabled){border-color:var(--steel-light);background:rgba(74,144,184,0.08);}
  .opt-btn.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);}
  .opt-btn.wrong{border-color:var(--red);background:rgba(232,80,64,0.1);color:var(--red);}
  .opt-btn:disabled{cursor:default;}

  .feedback{padding:0.8rem 1rem;border-radius:8px;font-size:0.88rem;font-weight:600;display:none;line-height:1.55;}
  .feedback.show{display:block;}
  .feedback.ok{background:var(--green-bg);color:var(--green);border:1px solid rgba(72,200,112,0.3);}
  .feedback.no{background:rgba(232,80,64,0.07);color:var(--red);border:1px solid rgba(232,80,64,0.25);}

  .btn{padding:0.7rem 1.4rem;border-radius:6px;border:none;font-family:'Rajdhani',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-flex;align-items:center;gap:0.4rem;letter-spacing:1px;}
  .btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text-muted);}
  .btn-ghost:hover{border-color:var(--steel-light);color:var(--steel-light);}
  .btn-next{background:linear-gradient(135deg,var(--violet),#5b21b6);color:#fff;font-weight:800;}
  .btn-next:hover{transform:translateY(-2px);}
  .btn-check{background:linear-gradient(135deg,var(--green),#30a860);color:#000;font-weight:800;}
  .btn-check:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:0.35;cursor:default;pointer-events:none;}
  .nav-btns{display:flex;gap:0.8rem;margin-top:0.5rem;}

  #results{display:none;text-align:center;padding:1.5rem 0;}
  .res-icon{font-size:4.5rem;margin-bottom:1rem;display:block;animation:pop 0.5s ease;}
  @keyframes pop{from{transform:scale(0.5);}to{transform:scale(1);}}
  .res-score{font-family:'Rajdhani',sans-serif;font-size:2.8rem;font-weight:700;color:var(--steel-light);letter-spacing:3px;}
  .res-lbl{font-family:'Rajdhani',sans-serif;font-size:0.7rem;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:1.2rem;}
  .res-msg{color:var(--text-mid);font-size:0.9rem;line-height:1.7;margin-bottom:1.5rem;max-width:380px;margin-left:auto;margin-right:auto;}
  .score-grid{display:flex;gap:0.4rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem;}
  .sc-pip{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;}
  .pip-ok{background:var(--green-bg);border:1px solid rgba(72,200,112,0.4);}
  .pip-retry{background:var(--amber-bg);border:1px solid rgba(240,168,48,0.4);}
  .res-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
</style>
</head>

<div class="wrap">

  <div id="intro">
    <span class="home-icon">🏠</span>

<script>
/* ===================== VALUE PARSER ===================== */
function parseValue(str){
  str = String(str).trim();
  if(str==='') return null;
  str = str.replace(',', '.');
  if(/^\d{1,3}(\.\d{3})+$/.test(str)){ str = str.replace(/\./g,''); }
  let val;
  let m = str.match(/^-?\d+(\.\d+)?$/);
  if(m){ val = parseFloat(str); }
  else return null;
  return val;
}
function valEqual(a,b,tol){
  if(a===null||b===null||isNaN(a)||isNaN(b)) return false;
  tol = tol || 0.01;
  return Math.abs(a-b) <= tol;
}

/* ===================== MINI 3D SHAPE VISUALS ===================== */
function renderCubeViz(s){
  return `<div class="shape-mini"><svg width="150" height="140" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
    <polygon points="75,16 118,40 75,64 32,40" fill="rgba(74,144,184,0.16)" stroke="#7ab8d8" stroke-width="2.3" stroke-linejoin="round"/>
    <polygon points="32,40 75,64 75,124 32,100" fill="rgba(74,144,184,0.08)" stroke="#7ab8d8" stroke-width="2.3" stroke-linejoin="round"/>
    <polygon points="75,64 118,40 118,100 75,124" fill="rgba(74,144,184,0.12)" stroke="#7ab8d8" stroke-width="2.3" stroke-linejoin="round"/>
    <text x="75" y="142" fill="#7ab8d8" font-family="Rajdhani" font-size="12" font-weight="700" text-anchor="middle">sisi = ${s} cm</text>
  </svg></div>`;
}
function renderBoxViz(p,l,t){
  return `<div class="shape-mini"><svg width="200" height="150" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
    <polygon points="80,16 150,42 96,66 30,42" fill="rgba(124,58,237,0.16)" stroke="#a78bfa" stroke-width="2.3" stroke-linejoin="round"/>
    <polygon points="30,42 96,66 96,116 30,92" fill="rgba(124,58,237,0.08)" stroke="#a78bfa" stroke-width="2.3" stroke-linejoin="round"/>
    <polygon points="96,66 150,42 150,92 96,116" fill="rgba(124,58,237,0.12)" stroke="#a78bfa" stroke-width="2.3" stroke-linejoin="round"/>
    <text x="115" y="26" fill="#a78bfa" font-family="Rajdhani" font-size="11" font-weight="700">p=${p}</text>
    <text x="52" y="46" fill="#a78bfa" font-family="Rajdhani" font-size="11" font-weight="700">l=${l}</text>
    <text x="12" y="70" fill="#f8c870" font-family="Rajdhani" font-size="11" font-weight="700">t=${t}</text>
    <text x="90" y="146" fill="#a78bfa" font-family="Rajdhani" font-size="10" font-weight="700" text-anchor="middle">satuan cm</text>
  </svg></div>`;
}
function renderNetViz(kind){
  if(kind==='cross'){
    return `<div class="shape-mini"><svg width="120" height="140" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#7ab8d8" stroke-width="2" fill="rgba(74,144,184,0.14)">
        <rect x="34" y="0" width="32" height="32"/>
        <rect x="2" y="32" width="32" height="32"/>
        <rect x="34" y="32" width="32" height="32"/>
        <rect x="66" y="32" width="32" height="32"/>
        <rect x="34" y="64" width="32" height="32"/>
        <rect x="34" y="96" width="32" height="32"/>
      </g>
    </svg></div>`;
  }
  return `<div class="shape-mini"><svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#7ab8d8" stroke-width="2" fill="rgba(74,144,184,0.14)">
      <rect x="2" y="14" width="32" height="32"/>
      <rect x="34" y="14" width="32" height="32"/>
      <rect x="66" y="14" width="32" height="32"/>
      <rect x="98" y="14" width="32" height="32"/>
      <rect x="130" y="14" width="32" height="32"/>
      <rect x="162" y="14" width="32" height="32"/>
    </g>
  </svg></div>`;
}

/* ===================== DATA ===================== */
// type "fillin": isian jawaban (angka)
// type "story" : soal cerita, jawaban angka
// type "netcheck": pilih Ya / Tidak untuk jaring-jaring
// type "choice": pilih tanda <, >, =
const QS = [
  { type:'fillin', tag:'🧊 Kubus · Soal 1', text:'Sebuah kubus memiliki sisi 3 cm. Berapa cm³ volumenya?', hint:'cth: 30', answer:'27', note:'V = 3 × 3 × 3 = 27 cm³', viz:{t:'cube',s:3} },
  { type:'fillin', tag:'🧊 Kubus · Soal 2', text:'Sebuah kubus memiliki sisi 5 cm. Berapa cm³ volumenya?', hint:'cth: 30', answer:'125', note:'V = 5 × 5 × 5 = 125 cm³', viz:{t:'cube',s:5} },
  { type:'fillin', tag:'🧊 Kubus · Soal 3', text:'Sebuah kubus memiliki sisi 6 cm. Berapa cm³ volumenya?', hint:'cth: 100', answer:'216', note:'V = 6 × 6 × 6 = 216 cm³' },
  { type:'fillin', tag:'📦 Balok · Soal 4', text:'Sebuah balok berukuran panjang 4 cm, lebar 3 cm, dan tinggi 2 cm. Berapa cm³ volumenya?', hint:'cth: 20', answer:'24', note:'V = 4 × 3 × 2 = 24 cm³', viz:{t:'box',p:4,l:3,tt:2} },
  { type:'fillin', tag:'📦 Balok · Soal 5', text:'Sebuah balok berukuran panjang 5 cm, lebar 4 cm, dan tinggi 3 cm. Berapa cm³ volumenya?', hint:'cth: 20', answer:'60', note:'V = 5 × 4 × 3 = 60 cm³', viz:{t:'box',p:5,l:4,tt:3} },
  { type:'fillin', tag:'📦 Balok · Soal 6', text:'Sebuah balok berukuran panjang 6 cm, lebar 2 cm, dan tinggi 5 cm. Berapa cm³ volumenya?', hint:'cth: 20', answer:'60', note:'V = 6 × 2 × 5 = 60 cm³' },
  { type:'fillin', tag:'📦 Balok · Soal 7', text:'Sebuah balok berukuran panjang 10 cm, lebar 5 cm, dan tinggi 2 cm. Berapa cm³ volumenya?', hint:'cth: 50', answer:'100', note:'V = 10 × 5 × 2 = 100 cm³' },
  { type:'fillin', tag:'🧊 Kubus · Soal 8', text:'Sebuah kubus memiliki volume 64 cm³. Berapa cm panjang sisinya?', hint:'cth: 3', answer:'4', note:'sisi × sisi × sisi = 64, jadi sisi = 4 cm (4×4×4=64)' },
  { type:'fillin', tag:'📦 Balok · Soal 9', text:'Sebuah balok memiliki panjang 5 cm, lebar 4 cm, dan volume 40 cm³. Berapa cm tingginya?', hint:'cth: 3', answer:'2', note:'5 × 4 × t = 40, jadi t = 40 ÷ 20 = 2 cm' },
  { type:'story', tag:'📝 Soal Cerita · Soal 10', ctx:'Sebuah kotak kado berbentuk balok berukuran panjang 8 cm, lebar 5 cm, dan tinggi 4 cm. Berapa cm³ volume kotak kado tersebut?', hint:'cth: 100', answer:'160', note:'V = 8 × 5 × 4 = 160 cm³' },
  { type:'story', tag:'📝 Soal Cerita · Soal 11', ctx:'Sebuah akuarium berbentuk balok berukuran panjang 40 cm, lebar 25 cm, dan tinggi 20 cm akan diisi air penuh. Berapa cm³ volume air maksimal yang bisa ditampung?', hint:'cth: 10000', answer:'20000', note:'V = 40 × 25 × 20 = 20000 cm³' },
  { type:'netcheck', tag:'🧩 Jaring-jaring · Soal 12', text:'Perhatikan susunan 6 persegi berikut. Jika dilipat pada garis-garisnya, apakah bisa membentuk kubus?', net:'cross', answer:'Ya', note:'Susunan berbentuk salib ini adalah salah satu jaring-jaring kubus yang benar — semua sisi bisa menutup rapat.' },
  { type:'netcheck', tag:'🧩 Jaring-jaring · Soal 13', text:'Perhatikan susunan 6 persegi berikut (satu baris lurus). Jika dilipat, apakah bisa membentuk kubus?', net:'straight', answer:'Tidak', note:'Susunan satu baris lurus ini tidak bisa dilipat menjadi kubus — akan ada sisi yang tumpang tindih dan ada yang kosong.' },
  { type:'choice', tag:'🔍 Membandingkan · Soal 14', text:'Mana yang lebih besar volumenya?', left:'Kubus sisi 4 cm', right:'Balok 5×4×3 cm', answer:'>', note:'Volume kubus = 4×4×4 = 64 cm³, volume balok = 5×4×3 = 60 cm³, jadi 64 > 60' },
  { type:'choice', tag:'🔍 Membandingkan · Soal 15', text:'Bandingkan volume dua bangun berikut:', left:'Kubus sisi 3 cm', right:'Balok 3×3×3 cm', answer:'=', note:'Volume kubus = 3×3×3 = 27 cm³, volume balok = 3×3×3 = 27 cm³, jadi sama' }
];

let cur=0, score=0, results=[], solved=false, hadMiss=false;

function startQuiz(){
  document.getElementById('intro').style.display='none';
  document.getElementById('quiz').style.display='block';
  renderQ();
}

function vizHtml(v){
  if(!v) return '';
  if(v.t==='cube') return renderCubeViz(v.s);
  if(v.t==='box') return renderBoxViz(v.p,v.l,v.tt);
  return '';
}

/* ===================== RENDER QUESTION ===================== */
function renderQ(){
  solved=false;
  hadMiss=false;
  updateProgress();
  const q = QS[cur];

  if(q.type==='fillin'){
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <div class="q-text">${q.text}</div>
        ${vizHtml(q.viz)}
        <div class="fillin-row">
          Jawaban: <input type="text" id="inAns" placeholder="${q.hint}">
        </div>
        <div class="fillin-hint">Isi angka saja tanpa satuan · jawaban harus benar dulu baru bisa lanjut</div>
        <div class="fillin-submit"><button class="btn btn-check" id="checkBtn" onclick="checkFillin()">Periksa Jawaban ✓</button></div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
    const inp = document.getElementById('inAns');
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') checkFillin(); });
    inp.addEventListener('input', ()=>{ if(!solved){ inp.classList.remove('wrong'); document.getElementById('fb').className='feedback'; } });
  }

  if(q.type==='story'){
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <p class="q-context">${q.ctx}</p>
        <div class="fillin-row">
          Jawaban: <input type="text" id="inAns" placeholder="${q.hint}">
        </div>
        <div class="fillin-hint">Isi jawaban berupa angka saja tanpa satuan (cth: 100) · jawaban harus benar dulu baru bisa lanjut</div>
        <div class="fillin-submit"><button class="btn btn-check" id="checkBtn" onclick="checkFillin()">Periksa Jawaban ✓</button></div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
    const inp = document.getElementById('inAns');
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') checkFillin(); });
    inp.addEventListener('input', ()=>{ if(!solved){ inp.classList.remove('wrong'); document.getElementById('fb').className='feedback'; } });
  }

  if(q.type==='netcheck'){
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <div class="q-text">${q.text}</div>
        ${renderNetViz(q.net)}
        <div class="opt-row" id="optRow">
          <button class="opt-btn wide" data-v="Ya" onclick="checkNet(this)">✓ Ya, bisa</button>
          <button class="opt-btn wide" data-v="Tidak" onclick="checkNet(this)">✗ Tidak bisa</button>
        </div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
  }

  if(q.type==='choice'){
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <div class="q-text">${q.text}</div>
        <div class="compare-row">
          <div class="compare-box">${q.left}</div>
          <div class="compare-vs">vs</div>
          <div class="compare-box">${q.right}</div>
        </div>
        <div class="fillin-hint">Pilih tanda yang tepat: &lt; (lebih kecil), &gt; (lebih besar), atau = (sama)</div>
        <div class="opt-row" id="optRow">
          <button class="opt-btn" data-v="<" onclick="checkChoice(this)">&lt;</button>
          <button class="opt-btn" data-v="=" onclick="checkChoice(this)">=</button>
          <button class="opt-btn" data-v=">" onclick="checkChoice(this)">&gt;</button>
        </div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
  }
}

/* ===================== FILLIN / STORY LOGIC ===================== */
function checkFillin(){
  if(solved) return;
  const q = QS[cur];
  const raw = document.getElementById('inAns').value;
  const fb = document.getElementById('fb');
  if(raw===''){
    fb.className = 'feedback show no';
    fb.textContent = '✗ Isi jawabannya terlebih dahulu.';
    return;
  }
  const userVal = parseValue(raw);
  if(userVal===null){
    fb.className = 'feedback show no';
    fb.textContent = '✗ Format belum dikenali. Coba isi angka biasa saja.';
    return;
  }
  const ansVal = parseValue(q.answer);
  const correct = valEqual(userVal, ansVal, 0.01);
  const inp = document.getElementById('inAns');

  if(correct){
    solved = true;
    score += hadMiss ? 5 : 10;
    results[cur] = hadMiss ? 'retry' : 'ok';
    inp.classList.remove('wrong');
    inp.classList.add('correct');
    inp.disabled = true;
    document.getElementById('checkBtn').disabled = true;
    fb.className = 'feedback show ok';
    fb.textContent = `✓ Benar! ${q.note||''}`;
    document.getElementById('nextBtn').disabled = false;
  } else {
    hadMiss = true;
    inp.classList.add('wrong');
    fb.className = 'feedback show no';
    fb.textContent = '✗ Belum tepat, coba periksa lagi hitunganmu ya!';
  }
}

/* ===================== NETCHECK LOGIC ===================== */
function checkNet(btn){
  if(solved) return;
  const q = QS[cur];
  const val = btn.getAttribute('data-v');
  const correct = (val === q.answer);
  const fb = document.getElementById('fb');

  if(correct){
    solved = true;
    score += hadMiss ? 5 : 10;
    results[cur] = hadMiss ? 'retry' : 'ok';
    document.querySelectorAll('#optRow .opt-btn').forEach(b=>b.disabled=true);
    btn.classList.add('correct');
    fb.className = 'feedback show ok';
    fb.textContent = `✓ Benar! ${q.note||''}`;
    document.getElementById('nextBtn').disabled = false;
  } else {
    hadMiss = true;
    btn.classList.add('wrong');
    fb.className = 'feedback show no';
    fb.textContent = '✗ Belum tepat, coba pikirkan lagi ya!';
    setTimeout(()=>{ btn.classList.remove('wrong'); }, 700);
  }
}

/* ===================== CHOICE (COMPARE) LOGIC ===================== */
function checkChoice(btn){
  if(solved) return;
  const q = QS[cur];
  const val = btn.getAttribute('data-v');
  const correct = (val === q.answer);
  const fb = document.getElementById('fb');

  if(correct){
    solved = true;
    score += hadMiss ? 5 : 10;
    results[cur] = hadMiss ? 'retry' : 'ok';
    document.querySelectorAll('#optRow .opt-btn').forEach(b=>b.disabled=true);
    btn.classList.add('correct');
    fb.className = 'feedback show ok';
    fb.textContent = `✓ Benar! ${q.note||''}`;
    document.getElementById('nextBtn').disabled = false;
  } else {
    hadMiss = true;
    btn.classList.add('wrong');
    fb.className = 'feedback show no';
    fb.textContent = '✗ Belum tepat, coba pilih tanda yang lain.';
    setTimeout(()=>{ btn.classList.remove('wrong'); }, 700);
  }
}

/* ===================== NAV & PROGRESS ===================== */
function updateProgress(){
  document.getElementById('progVal').textContent = `${cur+1}/15`;
  document.getElementById('progBar').style.width = (cur/15*100)+'%';
}

function nextQ(){
  if(cur<QS.length-1){ cur++; renderQ(); }
  else showResults();
}
function prevQ(){
  if(cur>0){ cur--; renderQ(); }
}

function showResults(){
  document.getElementById('quiz').style.display='none';
  const div=document.getElementById('results');
  div.style.display='block';
  const perfect = results.filter(r=>r==='ok').length;
  const pct = perfect/15;
  const icon = pct>=0.9?'🏆':pct>=0.7?'🎯':pct>=0.5?'📘':'📉';
  const msg = pct>=0.9?'Luar biasa! Hampir semua soal kamu jawab benar di percobaan pertama!':pct>=0.7?'Bagus sekali! Sebagian besar soal langsung benar tanpa perlu coba lagi.':pct>=0.5?'Sudah lumayan! Beberapa soal masih butuh dicoba beberapa kali.':'Kamu berhasil menyelesaikan semua soal! Tapi banyak yang butuh dicoba ulang — yuk review lagi materinya.';
  const pips = Array.from({length:15},(_,i)=>{
    const r = results[i];
    const cls = r==='ok' ? 'pip-ok' : 'pip-retry';
    const ic = r==='ok' ? '✓' : '↻';
    return `<div class="sc-pip ${cls}">${ic}</div>`;
  }).join('');
  div.innerHTML=`
    <span class="res-icon">${icon}</span>
    <div class="res-score">${score}/150</div>
    <div class="res-lbl">Skor Latihan · ${perfect}/15 Langsung Benar</div>
    <div class="score-grid">${pips}</div>
    <p class="res-msg">${msg}</p>
    <div class="res-btns">
      <button class="btn btn-next" onclick="location.reload()">🔄 Ulangi Latihan</button>
      <a href="lesson28.html" class="btn btn-ghost">← Lesson</a>
    </div>
  `;
}
</script>
