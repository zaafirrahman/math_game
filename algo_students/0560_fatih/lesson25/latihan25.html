<style>
  :root{
    --bg:#0f1419;--card:#1c2533;--border:#2a3a4a;--border2:#344858;
    --amber:#f0a830;--amber-light:#f8c870;--amber-bg:rgba(240,168,48,0.1);
    --green:#48c870;--green-bg:rgba(72,200,112,0.1);
    --red:#e85040;
    --violet:#7c3aed;--violet-bg:rgba(124,58,237,0.1);--violet-light:#a78bfa;
    --text:#dce8f0;--text-mid:#9ab0c0;--text-muted:#586878;
    --shadow:rgba(0,0,0,0.4);--track:#263545;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(240,168,48,0.05) 0%,transparent 55%);pointer-events:none;}

  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid var(--border);background:rgba(15,20,25,0.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100;font-family:'Rajdhani',sans-serif;font-size:0.82rem;font-weight:600;letter-spacing:1px;}
  nav a{color:var(--text-muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--amber);}
  nav span{color:var(--border2);}
  nav .cur{color:var(--green);}

  .track-strip{position:fixed;bottom:0;left:0;right:0;height:24px;background:var(--track);z-index:5;border-top:2px solid var(--border2);overflow:hidden;}
  .sleepers{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 18px,var(--border) 18px,var(--border) 24px);animation:roll 3s linear infinite;}
  @keyframes roll{from{background-position:0 0;}to{background-position:-42px 0;}}
  .track-rail{position:absolute;left:0;right:0;height:3px;background:var(--border2);}
  .track-rail:first-of-type{top:7px;}.track-rail:last-of-type{top:14px;}

  .wrap{max-width:680px;margin:0 auto;padding:2.5rem 1.5rem 5rem;position:relative;z-index:1;}

  #intro{text-align:center;margin-bottom:1rem;}
  .home-icon{font-size:4rem;display:block;margin-bottom:1rem;}
  .home-title{font-family:'Rajdhani',sans-serif;font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700;color:var(--green);letter-spacing:3px;margin-bottom:0.5rem;}
  .home-sub{color:var(--text-muted);font-size:0.9rem;line-height:1.7;margin-bottom:1.5rem;}
  .info-row{display:flex;gap:0.8rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem;}
  .info-chip{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.5rem 1rem;font-family:'Rajdhani',sans-serif;font-size:0.78rem;font-weight:600;letter-spacing:1px;color:var(--text-mid);}
  .info-chip span{color:var(--amber);}
  .start-btn{background:linear-gradient(135deg,var(--green),#30a860);color:#000;border:none;padding:1rem 3rem;border-radius:6px;font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:800;letter-spacing:3px;cursor:pointer;box-shadow:0 5px 18px rgba(72,200,112,0.3);transition:all 0.2s;}
  .start-btn:hover{transform:translateY(-3px);}

  #quiz{display:none;}
  .progress-wrap{margin-bottom:1.5rem;}
  .progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;}
  .progress-label{font-family:'Rajdhani',sans-serif;font-size:0.72rem;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}
  .progress-val{font-family:'Rajdhani',sans-serif;font-size:0.85rem;font-weight:700;color:var(--amber);}
  .progress-bg{background:var(--border);border-radius:4px;height:6px;overflow:hidden;}
  .progress-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--amber),var(--amber-light));transition:width 0.4s ease;}

  .q-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.8rem;margin-bottom:1rem;box-shadow:0 4px 14px var(--shadow);position:relative;overflow:hidden;}
  .q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),transparent);}
  .q-tag{font-family:'Rajdhani',sans-serif;font-size:0.65rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--green);margin-bottom:0.9rem;}
  .q-text{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.1rem;line-height:1.55;margin-bottom:1.1rem;letter-spacing:0.3px;text-align:center;}
  .q-context{color:var(--text-muted);font-size:0.86rem;line-height:1.6;margin-bottom:1rem;font-style:italic;}

  .fbar-mini{display:flex;justify-content:center;gap:1.2rem;margin:0.5rem 0 1.1rem;flex-wrap:wrap;}
  .fbar-mini svg{max-width:100%;height:auto;}

  /* Fill-in (isian) text input */
  .fillin-row{display:flex;align-items:center;justify-content:center;gap:0.6rem;margin-bottom:0.5rem;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.1rem;flex-wrap:wrap;}
  .fillin-row input{width:150px;text-align:center;background:var(--track);border:2px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:1.05rem;font-weight:700;padding:0.5rem 0.5rem;}
  .fillin-row input:focus{outline:none;border-color:var(--amber);}
  .fillin-row input.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);}
  .fillin-row input.wrong{border-color:var(--red);background:rgba(232,80,64,0.08);color:var(--red);}
  .fillin-hint{text-align:center;font-size:0.76rem;color:var(--text-muted);margin-bottom:1rem;}
  .fillin-submit{display:flex;justify-content:center;margin-bottom:0.6rem;}

  /* Choice (compare) buttons */
  .opt-row{display:flex;gap:0.7rem;justify-content:center;margin-bottom:0.6rem;flex-wrap:wrap;}
  .opt-btn{background:var(--track);border:2px solid var(--border2);color:var(--text);padding:0.8rem 1.6rem;border-radius:10px;cursor:pointer;font-size:1.3rem;font-family:'Rajdhani',sans-serif;font-weight:800;text-align:center;transition:all 0.15s;min-width:70px;}
  .opt-btn:hover:not(:disabled){border-color:var(--amber);background:rgba(240,168,48,0.08);}
  .opt-btn.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);}
  .opt-btn.wrong{border-color:var(--red);background:rgba(232,80,64,0.1);color:var(--red);}
  .opt-btn:disabled{cursor:default;}

  .feedback{padding:0.8rem 1rem;border-radius:8px;font-size:0.88rem;font-weight:600;display:none;line-height:1.55;}
  .feedback.show{display:block;}
  .feedback.ok{background:var(--green-bg);color:var(--green);border:1px solid rgba(72,200,112,0.3);}
  .feedback.no{background:rgba(232,80,64,0.07);color:var(--red);border:1px solid rgba(232,80,64,0.25);}

  .btn{padding:0.7rem 1.4rem;border-radius:6px;border:none;font-family:'Rajdhani',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-flex;align-items:center;gap:0.4rem;letter-spacing:1px;}
  .btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text-muted);}
  .btn-ghost:hover{border-color:var(--amber);color:var(--amber);}
  .btn-next{background:linear-gradient(135deg,var(--violet),#5b21b6);color:#fff;font-weight:800;}
  .btn-next:hover{transform:translateY(-2px);}
  .btn-check{background:linear-gradient(135deg,var(--green),#30a860);color:#000;font-weight:800;}
  .btn-check:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:0.35;cursor:default;pointer-events:none;}
  .nav-btns{display:flex;gap:0.8rem;margin-top:0.5rem;}

  #results{display:none;text-align:center;padding:1.5rem 0;}
  .res-icon{font-size:4.5rem;margin-bottom:1rem;display:block;animation:pop 0.5s ease;}
  @keyframes pop{from{transform:scale(0.5);}to{transform:scale(1);}}
  .res-score{font-family:'Rajdhani',sans-serif;font-size:2.8rem;font-weight:700;color:var(--amber);letter-spacing:3px;}
  .res-lbl{font-family:'Rajdhani',sans-serif;font-size:0.7rem;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:1.2rem;}
  .res-msg{color:var(--text-mid);font-size:0.9rem;line-height:1.7;margin-bottom:1.5rem;max-width:380px;margin-left:auto;margin-right:auto;}
  .score-grid{display:flex;gap:0.4rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem;}
  .sc-pip{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;}
  .pip-ok{background:var(--green-bg);border:1px solid rgba(72,200,112,0.4);}
  .pip-retry{background:var(--amber-bg);border:1px solid rgba(240,168,48,0.4);}
  .res-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
</style>

<div class="wrap">

<script>
/* ===================== VALUE PARSER ===================== */
// Menerima: bilangan bulat, desimal (koma / titik), pecahan (a/b atau a b/c),
// dan persen (dengan atau tanpa tanda %). mode 'percent' -> angka polos dianggap persen.
function parseValue(str, mode){
  str = String(str).trim();
  if(str==='') return null;
  let percentFlag = false;
  if(str.endsWith('%')){ percentFlag = true; str = str.slice(0,-1).trim(); }
  str = str.replace(',', '.');
  // hilangkan pemisah ribuan titik jika ada lebih dari satu titik / format uang (mis. "45.000")
  if(/^\d{1,3}(\.\d{3})+$/.test(str)){ str = str.replace(/\./g,''); }

  let val;
  let m = str.match(/^(-?\d+)\s+(\d+)\/(\d+)$/); // mixed a b/c
  if(m){
    const whole=parseInt(m[1],10), num=parseInt(m[2],10), den=parseInt(m[3],10);
    if(den===0) return null;
    const sign = whole<0?-1:1;
    val = whole + sign*(num/den);
  } else {
    m = str.match(/^(-?\d+)\/(\d+)$/); // a/b
    if(m){
      const den=parseInt(m[2],10);
      if(den===0) return null;
      val = parseInt(m[1],10)/den;
    } else {
      m = str.match(/^-?\d+(\.\d+)?$/); // whole or decimal
      if(m){ val = parseFloat(str); }
      else return null;
    }
  }
  if(percentFlag) val = val/100;
  else if(mode==='percent') val = val/100; // angka polos pada soal persen dianggap "n%"
  return val;
}
function valEqual(a,b,tol){
  if(a===null||b===null||isNaN(a)||isNaN(b)) return false;
  tol = tol || 0.01;
  return Math.abs(a-b) <= tol;
}

/* ===================== MINI PERCENT BAR ===================== */
function renderPercentBar(pct, label){
  const w = 150, h = 40;
  let svg = `<svg width="${w}" height="${h+26}" viewBox="0 0 ${w} ${h+26}" xmlns="http://www.w3.org/2000/svg">`;
  if(label) svg += `<text x="${w/2}" y="15" fill="#f8c870" font-family="Rajdhani" font-size="14" font-weight="800" text-anchor="middle">${label}</text>`;
  const top = label ? 20 : 0;
  const innerW = w-16;
  const fillW = innerW * (pct/100);
  svg += `<rect x="8" y="${top}" width="${innerW}" height="${h}" rx="6" fill="#1c2533" stroke="#344858" stroke-width="1.3"/>`;
  svg += `<rect x="8" y="${top}" width="${fillW}" height="${h}" rx="6" fill="rgba(240,168,48,0.35)"/>`;
  svg += `</svg>`;
  return svg;
}

/* ===================== DATA ===================== */
// type "fillin": isian jawaban (angka / desimal / pecahan / persen)
// type "choice": pilih tanda <, >, =
// type "story" : soal cerita, jawaban angka
// mode "percent": jika angka diisi tanpa %, dianggap sebagai persen
const QS = [
  { type:'fillin', tag:'🔢 Pecahan ke Desimal · Soal 1', text:'Ubah 1/2 menjadi desimal = ...', hint:'cth: 0,5', answer:'0.5', note:'1/2 = 0,5', bar:{pct:50,label:'1/2'} },
  { type:'fillin', tag:'🔢 Pecahan ke Desimal · Soal 2', text:'Ubah 1/4 menjadi desimal = ...', hint:'cth: 0,5', answer:'0.25', note:'1/4 = 0,25', bar:{pct:25,label:'1/4'} },
  { type:'fillin', tag:'💯 Desimal ke Persen · Soal 3', text:'Ubah 0,5 menjadi persen = ... %', hint:'cth: 25', answer:'50', mode:'percent', note:'0,5 = 50%', bar:{pct:50,label:'0,5'} },
  { type:'fillin', tag:'💯 Desimal ke Persen · Soal 4', text:'Ubah 0,75 menjadi persen = ... %', hint:'cth: 25', answer:'75', mode:'percent', note:'0,75 = 75%', bar:{pct:75,label:'0,75'} },
  { type:'fillin', tag:'💯 Pecahan ke Persen · Soal 5', text:'Ubah 1/5 menjadi persen = ... %', hint:'cth: 25', answer:'20', mode:'percent', note:'1/5 = 0,2 = 20%', bar:{pct:20,label:'1/5'} },
  { type:'fillin', tag:'💯 Pecahan ke Persen · Soal 6', text:'Ubah 3/4 menjadi persen = ... %', hint:'cth: 25', answer:'75', mode:'percent', note:'3/4 = 0,75 = 75%', bar:{pct:75,label:'3/4'} },
  { type:'fillin', tag:'🔄 Desimal ke Pecahan · Soal 7', text:'Ubah 0,2 menjadi pecahan sederhana = ...', hint:'cth: 3/4', answer:'1/5', note:'0,2 = 2/10 = 1/5' },
  { type:'fillin', tag:'🔄 Persen ke Pecahan · Soal 8', text:'75% sama dengan pecahan sederhana ... ', hint:'cth: 3/4', answer:'3/4', note:'75% = 75/100 = 3/4' },
  { type:'fillin', tag:'🧮 Menghitung Persen · Soal 9', text:'50% dari 100 = ...', hint:'cth: 10', answer:'50', note:'50% × 100 = 0,5 × 100 = 50' },
  { type:'fillin', tag:'🧮 Menghitung Persen · Soal 10', text:'25% dari 200 = ...', hint:'cth: 10', answer:'50', note:'25% × 200 = 0,25 × 200 = 50' },
  { type:'fillin', tag:'🧮 Menghitung Persen · Soal 11', text:'10% dari 50 = ...', hint:'cth: 10', answer:'5', note:'10% × 50 = 0,1 × 50 = 5' },
  { type:'fillin', tag:'🧮 Menghitung Persen · Soal 12', text:'20% dari 150 = ...', hint:'cth: 10', answer:'30', note:'20% × 150 = 0,2 × 150 = 30' },
  { type:'fillin', tag:'🏷️ Menghitung Diskon · Soal 13', text:'Harga baju Rp50.000 didiskon 10%. Besar diskon = Rp...', hint:'cth: 5000', answer:'5000', note:'10% × Rp50.000 = Rp5.000' },
  { type:'fillin', tag:'🏷️ Menghitung Diskon · Soal 14', text:'Harga baju Rp50.000 didiskon 10%. Harga setelah diskon = Rp...', hint:'cth: 5000', answer:'45000', note:'Rp50.000 − Rp5.000 = Rp45.000' },
  { type:'fillin', tag:'🏷️ Menghitung Diskon · Soal 15', text:'Harga sepatu Rp100.000 didiskon 20%. Besar diskon = Rp...', hint:'cth: 5000', answer:'20000', note:'20% × Rp100.000 = Rp20.000' },
  { type:'fillin', tag:'🏷️ Menghitung Diskon · Soal 16', text:'Harga sepatu Rp100.000 didiskon 20%. Harga akhir = Rp...', hint:'cth: 5000', answer:'80000', note:'Rp100.000 − Rp20.000 = Rp80.000' },
  { type:'choice', tag:'🔍 Membandingkan · Soal 17', text:'0,5 ... 45%', a:{pct:50,label:'0,5'}, b:{pct:45,label:'45%'}, answer:'>', note:'0,5 = 50%, dan 50% > 45%' },
  { type:'choice', tag:'🔍 Membandingkan · Soal 18', text:'1/4 ... 20%', a:{pct:25,label:'1/4'}, b:{pct:20,label:'20%'}, answer:'>', note:'1/4 = 25%, dan 25% > 20%' },
  { type:'story', tag:'📝 Soal Cerita · Soal 19', ctx:'Harga tas Rp80.000 didiskon 25%. Berapa harga tas setelah diskon?', hint:'cth: 45000', answer:'60000', note:'Diskon = 25% × Rp80.000 = Rp20.000. Harga akhir = Rp80.000 − Rp20.000 = Rp60.000' },
  { type:'story', tag:'📝 Soal Cerita · Soal 20', ctx:'Sebuah buku seharga Rp40.000 diberi diskon 15%. Berapa besar diskon dalam rupiah?', hint:'cth: 5000', answer:'6000', note:'15% × Rp40.000 = Rp6.000' }
];

let cur=0, score=0, results=[], solved=false, hadMiss=false;

function startQuiz(){
  document.getElementById('intro').style.display='none';
  document.getElementById('quiz').style.display='block';
  renderQ();
}

/* ===================== RENDER QUESTION ===================== */
function renderQ(){
  solved=false;
  hadMiss=false;
  updateProgress();
  const q = QS[cur];

  if(q.type==='fillin'){
    const barHtml = q.bar ? `<div class="fbar-mini">${renderPercentBar(q.bar.pct,q.bar.label)}</div>` : '';
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <div class="q-text">${q.text}</div>
        ${barHtml}
        <div class="fillin-row">
          Jawaban: <input type="text" id="inAns" placeholder="${q.hint}">
        </div>
        <div class="fillin-hint">Boleh isi desimal (0,5), pecahan (3/4), atau angka biasa · jawaban harus benar dulu baru bisa lanjut</div>
        <div class="fillin-submit"><button class="btn btn-check" id="checkBtn" onclick="checkFillin()">Periksa Jawaban ✓</button></div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
    const inp = document.getElementById('inAns');
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') checkFillin(); });
    inp.addEventListener('input', ()=>{ if(!solved){ inp.classList.remove('wrong'); document.getElementById('fb').className='feedback'; } });
  }

  if(q.type==='story'){
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <p class="q-context">${q.ctx}</p>
        <div class="fillin-row">
          Jawaban: <input type="text" id="inAns" placeholder="${q.hint}">
        </div>
        <div class="fillin-hint">Isi jawaban berupa angka rupiah tanpa "Rp" dan tanpa titik (cth: 45000) · jawaban harus benar dulu baru bisa lanjut</div>
        <div class="fillin-submit"><button class="btn btn-check" id="checkBtn" onclick="checkFillin()">Periksa Jawaban ✓</button></div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
    const inp = document.getElementById('inAns');
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') checkFillin(); });
    inp.addEventListener('input', ()=>{ if(!solved){ inp.classList.remove('wrong'); document.getElementById('fb').className='feedback'; } });
  }

  if(q.type==='choice'){
    const barHtml = `<div class="fbar-mini">${renderPercentBar(q.a.pct,q.a.label)}${renderPercentBar(q.b.pct,q.b.label)}</div>`;
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <div class="q-text">${q.text}</div>
        ${barHtml}
        <div class="fillin-hint">Pilih tanda yang tepat: &lt; (lebih kecil), &gt; (lebih besar), atau = (sama)</div>
        <div class="opt-row" id="optRow">
          <button class="opt-btn" data-v="<" onclick="checkChoice(this)">&lt;</button>
          <button class="opt-btn" data-v="=" onclick="checkChoice(this)">=</button>
          <button class="opt-btn" data-v=">" onclick="checkChoice(this)">&gt;</button>
        </div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
  }
}

/* ===================== FILLIN / STORY LOGIC ===================== */
function checkFillin(){
  if(solved) return;
  const q = QS[cur];
  const raw = document.getElementById('inAns').value;
  const fb = document.getElementById('fb');
  if(raw===''){
    fb.className = 'feedback show no';
    fb.textContent = '✗ Isi jawabannya terlebih dahulu.';
    return;
  }
  const userVal = parseValue(raw, q.mode);
  if(userVal===null){
    fb.className = 'feedback show no';
    fb.textContent = '✗ Format belum dikenali. Coba isi angka biasa, desimal (0,5), atau pecahan (3/4).';
    return;
  }
  const ansVal = parseValue(q.answer, q.mode);
  const correct = valEqual(userVal, ansVal, Math.abs(ansVal)>=1 ? Math.max(0.5, Math.abs(ansVal)*0.001) : 0.01);
  const inp = document.getElementById('inAns');

  if(correct){
    solved = true;
    score += hadMiss ? 5 : 10;
    results[cur] = hadMiss ? 'retry' : 'ok';
    inp.classList.remove('wrong');
    inp.classList.add('correct');
    inp.disabled = true;
    document.getElementById('checkBtn').disabled = true;
    fb.className = 'feedback show ok';
    fb.textContent = `✓ Benar! ${q.note||''}`;
    document.getElementById('nextBtn').disabled = false;
  } else {
    hadMiss = true;
    inp.classList.add('wrong');
    fb.className = 'feedback show no';
    fb.textContent = '✗ Belum tepat, coba periksa lagi hitunganmu ya!';
  }
}

/* ===================== CHOICE (COMPARE) LOGIC ===================== */
function checkChoice(btn){
  if(solved) return;
  const q = QS[cur];
  const val = btn.getAttribute('data-v');
  const correct = (val === q.answer);
  const fb = document.getElementById('fb');

  if(correct){
    solved = true;
    score += hadMiss ? 5 : 10;
    results[cur] = hadMiss ? 'retry' : 'ok';
    document.querySelectorAll('#optRow .opt-btn').forEach(b=>b.disabled=true);
    btn.classList.add('correct');
    fb.className = 'feedback show ok';
    fb.textContent = `✓ Benar! ${q.note||''}`;
    document.getElementById('nextBtn').disabled = false;
  } else {
    hadMiss = true;
    btn.classList.add('wrong');
    fb.className = 'feedback show no';
    fb.textContent = '✗ Belum tepat, coba pilih tanda yang lain.';
    setTimeout(()=>{ btn.classList.remove('wrong'); }, 700);
  }
}

/* ===================== NAV & PROGRESS ===================== */
function updateProgress(){
  document.getElementById('progVal').textContent = `${cur+1}/20`;
  document.getElementById('progBar').style.width = (cur/20*100)+'%';
}

function nextQ(){
  if(cur<QS.length-1){ cur++; renderQ(); }
  else showResults();
}
function prevQ(){
  if(cur>0){ cur--; renderQ(); }
}

function showResults(){
  document.getElementById('quiz').style.display='none';
  const div=document.getElementById('results');
  div.style.display='block';
  const perfect = results.filter(r=>r==='ok').length;
  const pct = perfect/20;
  const icon = pct>=0.9?'🏆':pct>=0.7?'🎯':pct>=0.5?'📘':'📉';
  const msg = pct>=0.9?'Luar biasa! Hampir semua soal kamu jawab benar di percobaan pertama!':pct>=0.7?'Bagus sekali! Sebagian besar soal langsung benar tanpa perlu coba lagi.':pct>=0.5?'Sudah lumayan! Beberapa soal masih butuh dicoba beberapa kali.':'Kamu berhasil menyelesaikan semua soal! Tapi banyak yang butuh dicoba ulang — yuk review lagi materinya.';
  const pips = Array.from({length:20},(_,i)=>{
    const r = results[i];
    const cls = r==='ok' ? 'pip-ok' : 'pip-retry';
    const ic = r==='ok' ? '✓' : '↻';
    return `<div class="sc-pip ${cls}">${ic}</div>`;
  }).join('');
  div.innerHTML=`
    <span class="res-icon">${icon}</span>
    <div class="res-score">${score}/200</div>
    <div class="res-lbl">Skor Latihan · ${perfect}/20 Langsung Benar</div>
    <div class="score-grid">${pips}</div>
    <p class="res-msg">${msg}</p>
    <div class="res-btns">
      <button class="btn btn-next" onclick="location.reload()">🔄 Ulangi Latihan</button>
      <a href="lesson25.html" class="btn btn-ghost">← Lesson</a>
    </div>
  `;
}
</script>
