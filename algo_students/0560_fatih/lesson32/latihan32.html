<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan · Memilih KPK atau FPB dalam Soal Cerita · Fatih</title>
<link rel="icon" type="image/svg+xml" href="../../../assets/logo1.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1419;--card:#1c2533;--border:#2a3a4a;--border2:#344858;
    --steel:#4a90b8;--steel-light:#7ab8d8;--steel-bg:rgba(74,144,184,0.1);
    --amber:#f0a830;--amber-light:#f8c870;--amber-bg:rgba(240,168,48,0.1);
    --green:#48c870;--green-bg:rgba(72,200,112,0.1);
    --red:#e85040;
    --violet:#7c3aed;--violet-bg:rgba(124,58,237,0.1);--violet-light:#a78bfa;
    --text:#dce8f0;--text-mid:#9ab0c0;--text-muted:#586878;
    --shadow:rgba(0,0,0,0.4);--track:#263545;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(74,144,184,0.06) 0%,transparent 55%);pointer-events:none;}

  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid var(--border);background:rgba(15,20,25,0.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100;font-family:'Rajdhani',sans-serif;font-size:0.82rem;font-weight:600;letter-spacing:1px;}
  nav a{color:var(--text-muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--steel-light);}
  nav span{color:var(--border2);}
  nav .cur{color:var(--amber);}

  .track-strip{position:fixed;bottom:0;left:0;right:0;height:24px;background:var(--track);z-index:5;border-top:2px solid var(--border2);overflow:hidden;}
  .sleepers{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 18px,var(--border) 18px,var(--border) 24px);animation:roll 3s linear infinite;}
  @keyframes roll{from{background-position:0 0;}to{background-position:-42px 0;}}
  .track-rail{position:absolute;left:0;right:0;height:3px;background:var(--border2);}
  .track-rail:first-of-type{top:7px;}.track-rail:last-of-type{top:14px;}

  .wrap{max-width:680px;margin:0 auto;padding:2.5rem 1.5rem 5rem;position:relative;z-index:1;}

  #intro{text-align:center;margin-bottom:1rem;}
  .home-icon{font-size:4rem;display:block;margin-bottom:1rem;}
  .home-title{font-family:'Rajdhani',sans-serif;font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700;color:var(--amber);letter-spacing:3px;margin-bottom:0.5rem;}
  .home-sub{color:var(--text-muted);font-size:0.9rem;line-height:1.7;margin-bottom:1.5rem;}
  .info-row{display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem;}
  .info-chip{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.5rem 0.9rem;font-family:'Rajdhani',sans-serif;font-size:0.74rem;font-weight:600;letter-spacing:0.5px;color:var(--text-mid);}
  .info-chip span{color:var(--amber);}
  .start-btn{background:linear-gradient(135deg,var(--amber-light),#c9820f);color:#08131c;border:none;padding:1rem 3rem;border-radius:6px;font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:800;letter-spacing:3px;cursor:pointer;box-shadow:0 5px 18px rgba(240,168,48,0.3);transition:all 0.2s;}
  .start-btn:hover{transform:translateY(-3px);}

  #quiz{display:none;}
  .progress-wrap{margin-bottom:1.5rem;}
  .progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;}
  .progress-label{font-family:'Rajdhani',sans-serif;font-size:0.72rem;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}
  .progress-val{font-family:'Rajdhani',sans-serif;font-size:0.85rem;font-weight:700;color:var(--amber);}
  .progress-bg{background:var(--border);border-radius:4px;height:6px;overflow:hidden;}
  .progress-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--steel),var(--amber));transition:width 0.4s ease;}

  .q-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.8rem;margin-bottom:1rem;box-shadow:0 4px 14px var(--shadow);position:relative;overflow:hidden;}
  .q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--amber),transparent);}
  .q-tag{font-family:'Rajdhani',sans-serif;font-size:0.65rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--amber);margin-bottom:0.9rem;}
  .q-text{font-family:'Nunito',sans-serif;font-weight:700;font-size:0.98rem;line-height:1.65;margin-bottom:1.1rem;letter-spacing:0.1px;text-align:left;}

  /* Fill-in (isian) text input */
  .fillin-row{display:flex;align-items:center;justify-content:center;gap:0.6rem;margin-bottom:0.5rem;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.1rem;flex-wrap:wrap;}
  .fillin-row input{width:150px;text-align:center;background:var(--track);border:2px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:1.05rem;font-weight:700;padding:0.5rem 0.5rem;}
  .fillin-row input:focus{outline:none;border-color:var(--amber);}
  .fillin-row input.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);}
  .fillin-row input.wrong{border-color:var(--red);background:rgba(232,80,64,0.08);color:var(--red);}
  .fillin-hint{text-align:center;font-size:0.76rem;color:var(--text-muted);margin-bottom:1rem;}
  .fillin-submit{display:flex;justify-content:center;margin-bottom:0.6rem;}

  /* Choice buttons */
  .opt-row{display:flex;gap:0.7rem;justify-content:center;margin-bottom:0.6rem;flex-wrap:wrap;}
  .opt-btn{background:var(--track);border:2px solid var(--border2);color:var(--text);padding:0.8rem 1.6rem;border-radius:10px;cursor:pointer;font-size:1.3rem;font-family:'Rajdhani',sans-serif;font-weight:800;text-align:center;transition:all 0.15s;min-width:70px;}
  .opt-btn.wide{font-size:0.92rem;padding:0.8rem 1.3rem;min-width:100px;}
  .opt-btn:hover:not(:disabled){border-color:var(--amber);background:rgba(240,168,48,0.08);}
  .opt-btn.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);}
  .opt-btn.wrong{border-color:var(--red);background:rgba(232,80,64,0.1);color:var(--red);}
  .opt-btn:disabled{cursor:default;}

  .feedback{padding:0.8rem 1rem;border-radius:8px;font-size:0.88rem;font-weight:600;display:none;line-height:1.55;}
  .feedback.show{display:block;}
  .feedback.ok{background:var(--green-bg);color:var(--green);border:1px solid rgba(72,200,112,0.3);}
  .feedback.no{background:rgba(232,80,64,0.07);color:var(--red);border:1px solid rgba(232,80,64,0.25);}

  .btn{padding:0.7rem 1.4rem;border-radius:6px;border:none;font-family:'Rajdhani',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-flex;align-items:center;gap:0.4rem;letter-spacing:1px;}
  .btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text-muted);}
  .btn-ghost:hover{border-color:var(--amber);color:var(--amber);}
  .btn-next{background:linear-gradient(135deg,var(--violet),#5b21b6);color:#fff;font-weight:800;}
  .btn-next:hover{transform:translateY(-2px);}
  .btn-check{background:linear-gradient(135deg,var(--green),#30a860);color:#000;font-weight:800;}
  .btn-check:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:0.35;cursor:default;pointer-events:none;}
  .nav-btns{display:flex;gap:0.8rem;margin-top:0.5rem;}

  #results{display:none;text-align:center;padding:1.5rem 0;}
  .res-icon{font-size:4.5rem;margin-bottom:1rem;display:block;animation:pop 0.5s ease;}
  @keyframes pop{from{transform:scale(0.5);}to{transform:scale(1);}}
  .res-score{font-family:'Rajdhani',sans-serif;font-size:2.8rem;font-weight:700;color:var(--amber);letter-spacing:3px;}
  .res-lbl{font-family:'Rajdhani',sans-serif;font-size:0.7rem;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:1.2rem;}
  .res-msg{color:var(--text-mid);font-size:0.9rem;line-height:1.7;margin-bottom:1.5rem;max-width:380px;margin-left:auto;margin-right:auto;}
  .score-grid{display:flex;gap:0.4rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem;}
  .sc-pip{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;}
  .pip-ok{background:var(--green-bg);border:1px solid rgba(72,200,112,0.4);}
  .pip-retry{background:var(--amber-bg);border:1px solid rgba(240,168,48,0.4);}
  .res-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
</style>
</head>
<body>
<div class="track-strip"><div class="sleepers"></div><div class="track-rail"></div><div class="track-rail"></div></div>

<nav>
  <a href="../../../index.html">MATH ARENA</a><span>/</span>
  <a href="../fatih_0560.html">FATIH</a><span>/</span>

</nav>

<div class="wrap">
  <!-- INTRO -->
  <div id="intro">
    <span class="home-icon">🧮</span>
    <div class="home-title">LATIHAN SOAL</div>
    <p class="home-sub">10 soal cerita tentang FPB & KPK. Baca ceritanya baik-baik dulu — apakah sedang <strong style="color:var(--green)">membagi</strong> atau menunggu <strong style="color:var(--violet-light)">bertemu lagi</strong> — baru putuskan konsepnya!</p>
    <div class="info-row">
      <div class="info-chip"><span>5</span> Cerita FPB</div>
      <div class="info-chip"><span>5</span> Cerita KPK</div>
    </div>
    <button class="start-btn" onclick="startQuiz()">MULAI LATIHAN 🧮</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz">
    <div class="progress-wrap">
      <div class="progress-top">
        <span class="progress-label">Progress</span>
        <span class="progress-val" id="progVal">1/10</span>
      </div>
      <div class="progress-bg"><div class="progress-bar" id="progBar" style="width:0%"></div></div>
    </div>
    <div id="qarea"></div>
  </div>

  <!-- RESULTS -->
  <div id="results"></div>
</div>

<script>
/* ===================== VALUE PARSER ===================== */
function parseValue(str){
  str = String(str).trim();
  if(str==='') return null;
  str = str.replace(',', '.');
  if(/^\d{1,3}(\.\d{3})+$/.test(str)){ str = str.replace(/\./g,''); }
  let val;
  let m = str.match(/^-?\d+(\.\d+)?$/);
  if(m){ val = parseFloat(str); }
  else return null;
  return val;
}
function valEqual(a,b,tol){
  if(a===null||b===null||isNaN(a)||isNaN(b)) return false;
  tol = tol || 0.01;
  return Math.abs(a-b) <= tol;
}

/* ===================== DATA ===================== */
// type "fillin"     : isian jawaban (angka)
// type "textchoice" : pilih jawaban berupa teks
const QS = [
  // 1-2 FPB: paket donat & kue
  { type:'textchoice', tag:'🤝 Cerita FPB · Soal 1', text:'Bu Tuti punya 16 donat dan 24 kue. Semuanya ingin dimasukkan ke beberapa piring dengan isi sama banyak, sebanyak mungkin piring tanpa sisa. Konsep apa yang dipakai?', options:['FPB','KPK'], answer:'FPB', note:'Ini soal "membagi jadi kelompok sama besar", jadi pakai FPB.' },
  { type:'fillin', tag:'🤝 Cerita FPB · Soal 2', text:'Sebuah toko punya 18 kemeja dan 24 celana. Semuanya ingin dibungkus jadi paket dengan isi sama banyak, sebanyak mungkin paket tanpa sisa. Berapa paket terbanyak yang bisa dibuat?', hint:'cth: 3', answer:'6', note:'FPB dari 18 dan 24 adalah 6, jadi bisa dibuat 6 paket.' },

  // 3-4 KPK: renang & piano
  { type:'textchoice', tag:'🔁 Cerita KPK · Soal 3', text:'Sinta latihan renang setiap 6 hari sekali, dan latihan piano setiap 8 hari sekali. Hari ini ia latihan keduanya bersamaan. Konsep apa yang dipakai untuk mencari kapan keduanya bersamaan lagi?', options:['FPB','KPK'], answer:'KPK', note:'Ini soal "kejadian berulang yang ingin bertemu lagi", jadi pakai KPK.' },
  { type:'fillin', tag:'🔁 Cerita KPK · Soal 4', text:'Masih soal Sinta: latihan renang tiap 6 hari, latihan piano tiap 8 hari, dan hari ini keduanya bersamaan. Berapa hari lagi keduanya akan latihan bersamaan lagi?', hint:'cth: 10', answer:'24', note:'KPK dari 6 dan 8 adalah 24, jadi 24 hari lagi.' },

  // 5-6 FPB: hadiah lomba
  { type:'textchoice', tag:'🤝 Cerita FPB · Soal 5', text:'Panitia lomba ingin membagi 30 pensil dan 45 buku menjadi hadiah yang sama banyak untuk sebanyak mungkin anak, tanpa sisa. Konsep apa yang dipakai?', options:['FPB','KPK'], answer:'FPB', note:'Karena membagi rata sebanyak mungkin anak tanpa sisa, ini soal FPB.' },
  { type:'fillin', tag:'🤝 Cerita FPB · Soal 6', text:'Masih soal panitia lomba: 30 pensil dan 45 buku dibagi rata ke sebanyak mungkin anak tanpa sisa. Berapa anak terbanyak yang bisa mendapatkan hadiah?', hint:'cth: 5', answer:'15', note:'FPB dari 30 dan 45 adalah 15, jadi hadiah bisa dibagi ke 15 anak.' },

  // 7-8 KPK: bel sekolah
  { type:'textchoice', tag:'🔁 Cerita KPK · Soal 7', text:'Bel sekolah A berbunyi setiap 15 menit, dan bel sekolah B berbunyi setiap 20 menit. Keduanya berbunyi bersamaan pukul 07.00. Konsep apa yang dipakai untuk mencari kapan keduanya berbunyi bersamaan lagi?', options:['FPB','KPK'], answer:'KPK', note:'Ini soal kejadian berulang yang ingin bertemu lagi, jadi pakai KPK.' },
  { type:'fillin', tag:'🔁 Cerita KPK · Soal 8', text:'Masih soal bel sekolah: bel A tiap 15 menit, bel B tiap 20 menit, bersamaan pukul 07.00. Berapa menit lagi keduanya akan berbunyi bersamaan lagi?', hint:'cth: 30', answer:'60', note:'KPK dari 15 dan 20 adalah 60, jadi 60 menit lagi.' },

  // 9-10 Campuran (uji pemahaman, bukan hafalan kata kunci)
  { type:'textchoice', tag:'🧭 Campuran · Soal 9', text:'Pak Budi memiliki 27 apel dan 36 mangga. Ia ingin membaginya ke beberapa keranjang dengan isi sama banyak, sebanyak mungkin keranjang, tanpa sisa. Konsep apa yang dipakai?', options:['FPB','KPK'], answer:'FPB', note:'Sesuatu sedang dibagi menjadi kelompok sama besar tanpa sisa → FPB.' },
  { type:'textchoice', tag:'🧭 Campuran · Soal 10', text:'Dua bus berangkat bersamaan dari terminal pukul 08.00. Bus A kembali ke terminal setiap 45 menit, dan bus B setiap 60 menit. Konsep apa yang dipakai untuk mencari kapan keduanya kembali ke terminal secara bersamaan lagi?', options:['FPB','KPK'], answer:'KPK', note:'Ini soal kejadian berulang yang ingin bertemu lagi → KPK, meskipun tidak ada kata "bersamaan" secara eksplisit di awal cerita.' }
];

let cur=0, score=0, results=[], solved=false, hadMiss=false;

function startQuiz(){
  document.getElementById('intro').style.display='none';
  document.getElementById('quiz').style.display='block';
  renderQ();
}

function optionsHtml(options){
  return options.map(o=>`<button class="opt-btn wide" data-v="${o}" onclick="checkOption(this)">${o}</button>`).join('');
}

/* ===================== RENDER QUESTION ===================== */
function renderQ(){
  solved=false;
  hadMiss=false;
  updateProgress();
  const q = QS[cur];

  if(q.type==='fillin'){
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <div class="q-text">${q.text}</div>
        <div class="fillin-row">
          Jawaban: <input type="text" id="inAns" placeholder="${q.hint}">
        </div>
        <div class="fillin-hint">Isi angka saja · jawaban harus benar dulu baru bisa lanjut</div>
        <div class="fillin-submit"><button class="btn btn-check" id="checkBtn" onclick="checkFillin()">Periksa Jawaban ✓</button></div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
    const inp = document.getElementById('inAns');
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') checkFillin(); });
    inp.addEventListener('input', ()=>{ if(!solved){ inp.classList.remove('wrong'); document.getElementById('fb').className='feedback'; } });
  }

  if(q.type==='textchoice'){
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <div class="q-text">${q.text}</div>
        <div class="opt-row" id="optRow">${optionsHtml(q.options)}</div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
  }
}

/* ===================== FILLIN LOGIC ===================== */
function checkFillin(){
  if(solved) return;
  const q = QS[cur];
  const raw = document.getElementById('inAns').value;
  const fb = document.getElementById('fb');
  if(raw===''){
    fb.className = 'feedback show no';
    fb.textContent = '✗ Isi jawabannya terlebih dahulu.';
    return;
  }
  const userVal = parseValue(raw);
  if(userVal===null){
    fb.className = 'feedback show no';
    fb.textContent = '✗ Format belum dikenali. Coba isi angka biasa saja.';
    return;
  }
  const ansVal = parseValue(q.answer);
  const correct = valEqual(userVal, ansVal, 0.01);
  const inp = document.getElementById('inAns');

  if(correct){
    solved = true;
    score += hadMiss ? 5 : 10;
    results[cur] = hadMiss ? 'retry' : 'ok';
    inp.classList.remove('wrong');
    inp.classList.add('correct');
    inp.disabled = true;
    document.getElementById('checkBtn').disabled = true;
    fb.className = 'feedback show ok';
    fb.textContent = `✓ Benar! ${q.note||''}`;
    document.getElementById('nextBtn').disabled = false;
  } else {
    hadMiss = true;
    inp.classList.add('wrong');
    fb.className = 'feedback show no';
    fb.textContent = '✗ Belum tepat, coba periksa lagi ya!';
  }
}

/* ===================== OPTION (choice) LOGIC ===================== */
function checkOption(btn){
  if(solved) return;
  const q = QS[cur];
  const val = btn.getAttribute('data-v');
  const correct = (val === q.answer);
  const fb = document.getElementById('fb');

  if(correct){
    solved = true;
    score += hadMiss ? 5 : 10;
    results[cur] = hadMiss ? 'retry' : 'ok';
    document.querySelectorAll('#optRow .opt-btn').forEach(b=>b.disabled=true);
    btn.classList.add('correct');
    fb.className = 'feedback show ok';
    fb.textContent = `✓ Benar! ${q.note||''}`;
    document.getElementById('nextBtn').disabled = false;
  } else {
    hadMiss = true;
    btn.classList.add('wrong');
    fb.className = 'feedback show no';
    fb.textContent = '✗ Belum tepat, coba baca lagi ceritanya ya!';
    setTimeout(()=>{ btn.classList.remove('wrong'); }, 700);
  }
}

/* ===================== NAV & PROGRESS ===================== */
function updateProgress(){
  document.getElementById('progVal').textContent = `${cur+1}/${QS.length}`;
  document.getElementById('progBar').style.width = (cur/QS.length*100)+'%';
}

function nextQ(){
  if(cur<QS.length-1){ cur++; renderQ(); }
  else showResults();
}
function prevQ(){
  if(cur>0){ cur--; renderQ(); }
}

function showResults(){
  document.getElementById('quiz').style.display='none';
  const div=document.getElementById('results');
  div.style.display='block';
  const perfect = results.filter(r=>r==='ok').length;
  const pct = perfect/QS.length;
  const icon = pct>=0.9?'🏆':pct>=0.7?'🎯':pct>=0.5?'📘':'📉';
  const msg = pct>=0.9?'Luar biasa! Kamu sudah jago membaca soal cerita dan memilih FPB atau KPK dengan tepat!':pct>=0.7?'Bagus sekali! Sebagian besar soal cerita sudah kamu baca dengan tepat.':pct>=0.5?'Sudah lumayan! Coba baca lagi materinya, lalu perhatikan lagi soal ceritanya.':'Kamu berhasil menyelesaikan semua soal! Yuk buka lagi materinya, lalu coba lagi latihan ini.';
  const pips = Array.from({length:QS.length},(_,i)=>{
    const r = results[i];
    const cls = r==='ok' ? 'pip-ok' : 'pip-retry';
    const ic = r==='ok' ? '✓' : '↻';
    return `<div class="sc-pip ${cls}">${ic}</div>`;
  }).join('');
  div.innerHTML=`
    <span class="res-icon">${icon}</span>
    <div class="res-score">${score}/${QS.length*10}</div>
    <div class="res-lbl">Skor Latihan · ${perfect}/${QS.length} Langsung Benar</div>
    <div class="score-grid">${pips}</div>
    <p class="res-msg">${msg}</p>
    <div class="res-btns">
      <button class="btn btn-next" onclick="location.reload()">🔄 Ulangi Latihan</button>
