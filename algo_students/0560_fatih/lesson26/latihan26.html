<script>
/* ===================== VALUE PARSER ===================== */
// Menerima: bilangan bulat, desimal (koma / titik), pecahan (a/b atau a b/c).
function parseValue(str){
  str = String(str).trim();
  if(str==='') return null;
  str = str.replace(',', '.');
  if(/^\d{1,3}(\.\d{3})+$/.test(str)){ str = str.replace(/\./g,''); }

  let val;
  let m = str.match(/^(-?\d+)\s+(\d+)\/(\d+)$/); // mixed a b/c
  if(m){
    const whole=parseInt(m[1],10), num=parseInt(m[2],10), den=parseInt(m[3],10);
    if(den===0) return null;
    const sign = whole<0?-1:1;
    val = whole + sign*(num/den);
  } else {
    m = str.match(/^(-?\d+)\/(\d+)$/); // a/b
    if(m){
      const den=parseInt(m[2],10);
      if(den===0) return null;
      val = parseInt(m[1],10)/den;
    } else {
      m = str.match(/^-?\d+(\.\d+)?$/); // whole or decimal
      if(m){ val = parseFloat(str); }
      else return null;
    }
  }
  return val;
}
function valEqual(a,b,tol){
  if(a===null||b===null||isNaN(a)||isNaN(b)) return false;
  tol = tol || 0.01;
  return Math.abs(a-b) <= tol;
}

/* ===================== MINI RATIO DOTS ===================== */
function renderRatioDots(a,b,labelA,labelB){
  const dotsA = Array.from({length:a},()=>'<span class="dot a"></span>').join('');
  const dotsB = Array.from({length:b},()=>'<span class="dot b"></span>').join('');
  return `<div class="dots-mini">
    <div class="grp"><div class="row">${dotsA}</div><div class="lbl">${labelA}</div></div>
    <div class="grp"><div class="row">${dotsB}</div><div class="lbl">${labelB}</div></div>
  </div>`;
}

/* ===================== DATA ===================== */
// type "fillin": isian jawaban (angka / desimal / pecahan)
// type "choice": pilih tanda <, >, =
// type "story" : soal cerita, jawaban angka
const QS = [
  { type:'fillin', tag:'🔗 Perbandingan · Soal 1', text:'Sederhanakan perbandingan 6 : 8 menjadi bentuk paling sederhana (tulis sebagai pecahan, cth: 3/4)', hint:'cth: 3/4', answer:'3/4', note:'6:8 dibagi 2 = 3:4, ditulis 3/4', dots:{a:6,b:8,la:'6',lb:'8'} },
  { type:'fillin', tag:'🔗 Perbandingan · Soal 2', text:'Sederhanakan perbandingan 10 : 15 menjadi bentuk paling sederhana (tulis sebagai pecahan, cth: 3/4)', hint:'cth: 3/4', answer:'2/3', note:'10:15 dibagi 5 = 2:3, ditulis 2/3', dots:{a:10,b:15,la:'10',lb:'15'} },
  { type:'fillin', tag:'🔗 Perbandingan · Soal 3', text:'Perbandingan kucing dan anjing di rumah adalah 2 : 3. Jika kucing ada 4 ekor, berapa ekor anjing?', hint:'cth: 5', answer:'6', note:'2:3 = 4:x → x = (3×4)/2 = 6' },
  { type:'fillin', tag:'🔗 Perbandingan · Soal 4', text:'Perbandingan umur Andi dan umur Budi adalah 3 : 4. Jika umur Andi 9 tahun, berapa umur Budi?', hint:'cth: 5', answer:'12', note:'3:4 = 9:x → x = (4×9)/3 = 12' },
  { type:'fillin', tag:'🗺️ Skala · Soal 5', text:'Skala sebuah peta adalah 1 : 100. Jarak pada peta 5 cm. Berapa cm jarak sebenarnya?', hint:'cth: 500', answer:'500', note:'Jarak sebenarnya = 5 × 100 = 500 cm' },
  { type:'fillin', tag:'🗺️ Skala · Soal 6', text:'Skala sebuah peta adalah 1 : 500. Jarak pada peta 4 cm. Berapa cm jarak sebenarnya?', hint:'cth: 500', answer:'2000', note:'Jarak sebenarnya = 4 × 500 = 2.000 cm' },
  { type:'fillin', tag:'🗺️ Skala · Soal 7', text:'Jarak sebenarnya dua tempat adalah 300 cm, dan pada peta digambar 3 cm. Skala peta = 1 : ...', hint:'cth: 100', answer:'100', note:'Skala = 3 : 300 = 1 : 100' },
  { type:'fillin', tag:'🗺️ Skala · Soal 8', text:'Jarak sebenarnya dua tempat adalah 4.000 cm, dan pada peta digambar 2 cm. Skala peta = 1 : ...', hint:'cth: 100', answer:'2000', note:'Skala = 2 : 4.000 = 1 : 2.000' },
  { type:'fillin', tag:'📏 Konversi Panjang · Soal 9', text:'3 km = ... m', hint:'cth: 100', answer:'3000', note:'3 km = 3 × 1.000 m = 3.000 m' },
  { type:'fillin', tag:'📏 Konversi Panjang · Soal 10', text:'250 cm = ... m', hint:'cth: 2,5', answer:'2.5', note:'250 cm = 250 ÷ 100 = 2,5 m' },
  { type:'fillin', tag:'📏 Konversi Panjang · Soal 11', text:'5 m = ... cm', hint:'cth: 100', answer:'500', note:'5 m = 5 × 100 = 500 cm' },
  { type:'fillin', tag:'📏 Konversi Panjang · Soal 12', text:'1.500 mm = ... m', hint:'cth: 1,5', answer:'1.5', note:'1.500 mm = 1.500 ÷ 1.000 = 1,5 m' },
  { type:'fillin', tag:'⚖️ Konversi Berat · Soal 13', text:'2 kg = ... g', hint:'cth: 1000', answer:'2000', note:'2 kg = 2 × 1.000 g = 2.000 g' },
  { type:'fillin', tag:'⚖️ Konversi Berat · Soal 14', text:'3.000 g = ... kg', hint:'cth: 1', answer:'3', note:'3.000 g = 3.000 ÷ 1.000 = 3 kg' },
  { type:'fillin', tag:'⏱️ Konversi Waktu · Soal 15', text:'2 jam = ... menit', hint:'cth: 60', answer:'120', note:'2 jam = 2 × 60 menit = 120 menit' },
  { type:'fillin', tag:'⏱️ Konversi Waktu · Soal 16', text:'180 detik = ... menit', hint:'cth: 1', answer:'3', note:'180 detik = 180 ÷ 60 = 3 menit' },
  { type:'choice', tag:'🔍 Membandingkan · Soal 17', text:'Bandingkan dua perbandingan berikut:', left:'3 : 6', right:'1 : 2', answer:'=', note:'3:6 disederhanakan menjadi 1:2, jadi keduanya sama' },
  { type:'choice', tag:'🔍 Membandingkan · Soal 18', text:'Bandingkan dua panjang berikut:', left:'2 km', right:'1.500 m', answer:'>', note:'2 km = 2.000 m, dan 2.000 m > 1.500 m' },
  { type:'story', tag:'📝 Soal Cerita · Soal 19', ctx:'Jarak dua kota pada peta adalah 6 cm dengan skala 1 : 1.000.000. Berapa km jarak sebenarnya?', hint:'cth: 60', answer:'60', note:'Jarak sebenarnya = 6 × 1.000.000 = 6.000.000 cm = 60 km (1 km = 100.000 cm)' },
  { type:'story', tag:'📝 Soal Cerita · Soal 20', ctx:'Sebuah resep kue membutuhkan tepung dan gula dengan perbandingan 3 : 2. Jika gula yang dipakai 4 kg, berapa kg tepung yang dibutuhkan?', hint:'cth: 5', answer:'6', note:'3:2 = x:4 → x = (3×4)/2 = 6 kg' }
];

let cur=0, score=0, results=[], solved=false, hadMiss=false;

function startQuiz(){
  document.getElementById('intro').style.display='none';
  document.getElementById('quiz').style.display='block';
  renderQ();
}

/* ===================== RENDER QUESTION ===================== */
function renderQ(){
  solved=false;
  hadMiss=false;
  updateProgress();
  const q = QS[cur];

  if(q.type==='fillin'){
    const dotsHtml = q.dots ? renderRatioDots(q.dots.a,q.dots.b,q.dots.la,q.dots.lb) : '';
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <div class="q-text">${q.text}</div>
        ${dotsHtml}
        <div class="fillin-row">
          Jawaban: <input type="text" id="inAns" placeholder="${q.hint}">
        </div>
        <div class="fillin-hint">Boleh isi desimal (2,5), pecahan (3/4), atau angka biasa · jawaban harus benar dulu baru bisa lanjut</div>
        <div class="fillin-submit"><button class="btn btn-check" id="checkBtn" onclick="checkFillin()">Periksa Jawaban ✓</button></div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
    const inp = document.getElementById('inAns');
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') checkFillin(); });
    inp.addEventListener('input', ()=>{ if(!solved){ inp.classList.remove('wrong'); document.getElementById('fb').className='feedback'; } });
  }

  if(q.type==='story'){
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <p class="q-context">${q.ctx}</p>
        <div class="fillin-row">
          Jawaban: <input type="text" id="inAns" placeholder="${q.hint}">
        </div>
        <div class="fillin-hint">Isi jawaban berupa angka saja tanpa satuan (cth: 60) · jawaban harus benar dulu baru bisa lanjut</div>
        <div class="fillin-submit"><button class="btn btn-check" id="checkBtn" onclick="checkFillin()">Periksa Jawaban ✓</button></div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
    const inp = document.getElementById('inAns');
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') checkFillin(); });
    inp.addEventListener('input', ()=>{ if(!solved){ inp.classList.remove('wrong'); document.getElementById('fb').className='feedback'; } });
  }

  if(q.type==='choice'){
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <div class="q-text">${q.text}</div>
        <div class="compare-row">
          <div class="compare-box">${q.left}</div>
          <div class="compare-vs">vs</div>
          <div class="compare-box">${q.right}</div>
        </div>
        <div class="fillin-hint">Pilih tanda yang tepat: &lt; (lebih kecil), &gt; (lebih besar), atau = (sama)</div>
        <div class="opt-row" id="optRow">
          <button class="opt-btn" data-v="<" onclick="checkChoice(this)">&lt;</button>
          <button class="opt-btn" data-v="=" onclick="checkChoice(this)">=</button>
          <button class="opt-btn" data-v=">" onclick="checkChoice(this)">&gt;</button>
        </div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
  }
}

/* ===================== FILLIN / STORY LOGIC ===================== */
function checkFillin(){
  if(solved) return;
  const q = QS[cur];
  const raw = document.getElementById('inAns').value;
  const fb = document.getElementById('fb');
  if(raw===''){
    fb.className = 'feedback show no';
    fb.textContent = '✗ Isi jawabannya terlebih dahulu.';
    return;
  }
  const userVal = parseValue(raw);
  if(userVal===null){
    fb.className = 'feedback show no';
    fb.textContent = '✗ Format belum dikenali. Coba isi angka biasa, desimal (2,5), atau pecahan (3/4).';
    return;
  }
  const ansVal = parseValue(q.answer);
  const correct = valEqual(userVal, ansVal, 0.01);
  const inp = document.getElementById('inAns');

  if(correct){
    solved = true;
    score += hadMiss ? 5 : 10;
    results[cur] = hadMiss ? 'retry' : 'ok';
    inp.classList.remove('wrong');
    inp.classList.add('correct');
    inp.disabled = true;
    document.getElementById('checkBtn').disabled = true;
    fb.className = 'feedback show ok';
    fb.textContent = `✓ Benar! ${q.note||''}`;
    document.getElementById('nextBtn').disabled = false;
  } else {
    hadMiss = true;
    inp.classList.add('wrong');
    fb.className = 'feedback show no';
    fb.textContent = '✗ Belum tepat, coba periksa lagi hitunganmu ya!';
  }
}

/* ===================== CHOICE (COMPARE) LOGIC ===================== */
function checkChoice(btn){
  if(solved) return;
  const q = QS[cur];
  const val = btn.getAttribute('data-v');
  const correct = (val === q.answer);
  const fb = document.getElementById('fb');

  if(correct){
    solved = true;
    score += hadMiss ? 5 : 10;
    results[cur] = hadMiss ? 'retry' : 'ok';
    document.querySelectorAll('#optRow .opt-btn').forEach(b=>b.disabled=true);
    btn.classList.add('correct');
    fb.className = 'feedback show ok';
    fb.textContent = `✓ Benar! ${q.note||''}`;
    document.getElementById('nextBtn').disabled = false;
  } else {
    hadMiss = true;
    btn.classList.add('wrong');
    fb.className = 'feedback show no';
    fb.textContent = '✗ Belum tepat, coba pilih tanda yang lain.';
    setTimeout(()=>{ btn.classList.remove('wrong'); }, 700);
  }
}

/* ===================== NAV & PROGRESS ===================== */
function updateProgress(){
  document.getElementById('progVal').textContent = `${cur+1}/20`;
  document.getElementById('progBar').style.width = (cur/20*100)+'%';
}

function nextQ(){
  if(cur<QS.length-1){ cur++; renderQ(); }
  else showResults();
}
function prevQ(){
  if(cur>0){ cur--; renderQ(); }
}

function showResults(){
  document.getElementById('quiz').style.display='none';
  const div=document.getElementById('results');
  div.style.display='block';
  const perfect = results.filter(r=>r==='ok').length;
  const pct = perfect/20;
  const icon = pct>=0.9?'🏆':pct>=0.7?'🎯':pct>=0.5?'📘':'📉';
  const msg = pct>=0.9?'Luar biasa! Hampir semua soal kamu jawab benar di percobaan pertama!':pct>=0.7?'Bagus sekali! Sebagian besar soal langsung benar tanpa perlu coba lagi.':pct>=0.5?'Sudah lumayan! Beberapa soal masih butuh dicoba beberapa kali.':'Kamu berhasil menyelesaikan semua soal! Tapi banyak yang butuh dicoba ulang — yuk review lagi materinya.';
  const pips = Array.from({length:20},(_,i)=>{
    const r = results[i];
    const cls = r==='ok' ? 'pip-ok' : 'pip-retry';
    const ic = r==='ok' ? '✓' : '↻';
    return `<div class="sc-pip ${cls}">${ic}</div>`;
  }).join('');
  div.innerHTML=`
    <span class="res-icon">${icon}</span>
    <div class="res-score">${score}/200</div>
    <div class="res-lbl">Skor Latihan · ${perfect}/20 Langsung Benar</div>
    <div class="score-grid">${pips}</div>
    <p class="res-msg">${msg}</p>
    <div class="res-btns">
      <button class="btn btn-next" onclick="location.reload()">🔄 Ulangi Latihan</button>
      <a href="lesson26.html" class="btn btn-ghost">← Lesson</a>
    </div>
  `;
}
</script>
