  .feedback{padding:0.8rem 1rem;border-radius:8px;font-size:0.88rem;font-weight:600;display:none;line-height:1.55;}

  .res-msg{color:var(--text-mid);font-size:0.9rem;line-height:1.7;margin-bottom:1.5rem;max-width:380px;margin-left:auto;margin-right:auto;}
  .score-grid{display:flex;gap:0.4rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem;}
  .sc-pip{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;}
  .pip-ok{background:var(--green-bg);border:1px solid rgba(72,200,112,0.4);}
  .pip-retry{background:var(--amber-bg);border:1px solid rgba(240,168,48,0.4);}
  .res-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
</style>

<script>
/* ===================== VALUE PARSER ===================== */
// Menerima: bilangan bulat, desimal (koma / titik), pecahan (a/b atau a b/c).
function parseValue(str){
  str = String(str).trim();
  if(str==='') return null;
  str = str.replace(',', '.');
  if(/^\d{1,3}(\.\d{3})+$/.test(str)){ str = str.replace(/\./g,''); }

  let val;
  let m = str.match(/^(-?\d+)\s+(\d+)\/(\d+)$/); // mixed a b/c
  if(m){
    const whole=parseInt(m[1],10), num=parseInt(m[2],10), den=parseInt(m[3],10);
    if(den===0) return null;
    const sign = whole<0?-1:1;
    val = whole + sign*(num/den);
  } else {
    m = str.match(/^(-?\d+)\/(\d+)$/); // a/b
    if(m){
      const den=parseInt(m[2],10);
      if(den===0) return null;
      val = parseInt(m[1],10)/den;
    } else {
      m = str.match(/^-?\d+(\.\d+)?$/); // whole or decimal
      if(m){ val = parseFloat(str); }
      else return null;
    }
  }
  return val;
}
function valEqual(a,b,tol){
  if(a===null||b===null||isNaN(a)||isNaN(b)) return false;
  tol = tol || 0.01;
  return Math.abs(a-b) <= tol;
}

/* ===================== MINI SHAPE VISUALS ===================== */
function renderSquareViz(s){
  return `<div class="shape-mini"><svg width="110" height="110" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
    <rect x="20" y="15" width="70" height="70" fill="rgba(74,144,184,0.12)" stroke="#7ab8d8" stroke-width="2.5"/>
    <text x="55" y="98" fill="#7ab8d8" font-family="Rajdhani" font-size="12" font-weight="700" text-anchor="middle">s = ${s} cm</text>
  </svg></div>`;
}
function renderRectViz(p,l){
  return `<div class="shape-mini"><svg width="180" height="120" viewBox="0 0 180 120" xmlns="http://www.w3.org/2000/svg">
    <rect x="25" y="20" width="130" height="60" fill="rgba(124,58,237,0.1)" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="90" y="14" fill="#a78bfa" font-family="Rajdhani" font-size="12" font-weight="700" text-anchor="middle">p = ${p} cm</text>
    <text x="168" y="54" fill="#a78bfa" font-family="Rajdhani" font-size="12" font-weight="700" text-anchor="middle">l = ${l}</text>
  </svg></div>`;
}
function renderTriViz(a,t){
  return `<div class="shape-mini"><svg width="180" height="130" viewBox="0 0 180 130" xmlns="http://www.w3.org/2000/svg">
    <polygon points="90,15 150,95 30,95" fill="rgba(72,200,112,0.1)" stroke="#80e0a0" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="90" y1="15" x2="90" y2="95" stroke="#f0a830" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="102" y="58" fill="#f8c870" font-family="Rajdhani" font-size="11" font-weight="700">t = ${t}</text>
    <text x="90" y="112" fill="#80e0a0" font-family="Rajdhani" font-size="12" font-weight="700" text-anchor="middle">alas = ${a} cm</text>
  </svg></div>`;
}

/* ===================== DATA ===================== */
// type "fillin": isian jawaban (angka / desimal / pecahan)
// type "choice": pilih tanda <, >, =
// type "story" : soal cerita, jawaban angka
const QS = [
  { type:'fillin', tag:'🔲 Persegi · Soal 1', text:'Sebuah persegi memiliki sisi 6 cm. Berapa cm kelilingnya?', hint:'cth: 20', answer:'24', note:'K = 4 × 6 = 24 cm', viz:{t:'square',s:6} },
  { type:'fillin', tag:'🔲 Persegi · Soal 2', text:'Sebuah persegi memiliki sisi 7 cm. Berapa cm² luas persegi tersebut?', hint:'cth: 40', answer:'49', note:'L = 7 × 7 = 49 cm²', viz:{t:'square',s:7} },
  { type:'fillin', tag:'▭ Persegi Panjang · Soal 3', text:'Persegi panjang punya panjang 9 cm dan lebar 4 cm. Berapa cm kelilingnya?', hint:'cth: 20', answer:'26', note:'K = 2 × (9+4) = 2 × 13 = 26 cm', viz:{t:'rect',p:9,l:4} },
  { type:'fillin', tag:'▭ Persegi Panjang · Soal 4', text:'Persegi panjang punya panjang 12 cm dan lebar 5 cm. Berapa cm² luasnya?', hint:'cth: 40', answer:'60', note:'L = 12 × 5 = 60 cm²', viz:{t:'rect',p:12,l:5} },
  { type:'fillin', tag:'▭ Persegi Panjang · Soal 5', text:'Persegi panjang punya panjang 15 cm dan lebar 6 cm. Berapa cm kelilingnya?', hint:'cth: 20', answer:'42', note:'K = 2 × (15+6) = 2 × 21 = 42 cm' },
  { type:'fillin', tag:'▭ Persegi Panjang · Soal 6', text:'Persegi panjang punya panjang 20 cm dan lebar 8 cm. Berapa cm² luasnya?', hint:'cth: 100', answer:'160', note:'L = 20 × 8 = 160 cm²' },
  { type:'fillin', tag:'🔺 Segitiga · Soal 7', text:'Sebuah segitiga punya alas 10 cm dan tinggi 6 cm. Berapa cm² luasnya?', hint:'cth: 20', answer:'30', note:'L = ½ × 10 × 6 = 30 cm²', viz:{t:'tri',a:10,tt:6} },
  { type:'fillin', tag:'🔺 Segitiga · Soal 8', text:'Sebuah segitiga punya alas 14 cm dan tinggi 5 cm. Berapa cm² luasnya?', hint:'cth: 20', answer:'35', note:'L = ½ × 14 × 5 = 35 cm²' },
  { type:'fillin', tag:'🔺 Segitiga · Soal 9', text:'Sebuah segitiga punya ketiga sisi 5 cm, 6 cm, dan 7 cm. Berapa cm kelilingnya?', hint:'cth: 15', answer:'18', note:'K = 5 + 6 + 7 = 18 cm' },
  { type:'fillin', tag:'🔺 Segitiga · Soal 10', text:'Sebuah segitiga punya ketiga sisi 8 cm, 9 cm, dan 10 cm. Berapa cm kelilingnya?', hint:'cth: 15', answer:'27', note:'K = 8 + 9 + 10 = 27 cm' },
  { type:'fillin', tag:'🧩 Bangun Gabungan · Soal 11', text:'Bangun gabungan terdiri dari persegi panjang (10 cm × 4 cm) dan segitiga di atasnya (alas 10 cm, tinggi 3 cm). Berapa cm² luas totalnya?', hint:'cth: 50', answer:'55', note:'L = (10×4) + (½×10×3) = 40 + 15 = 55 cm²' },
  { type:'fillin', tag:'🧩 Bangun Gabungan · Soal 12', text:'Bangun gabungan berbentuk huruf L: bagian besar 12 cm × 5 cm dan bagian kecil 3 cm × 4 cm. Berapa cm² luas totalnya?', hint:'cth: 50', answer:'72', note:'L = (12×5) + (3×4) = 60 + 12 = 72 cm²' },
  { type:'fillin', tag:'🔲 Persegi · Soal 13', text:'Sebuah persegi memiliki luas 64 cm². Berapa cm kelilingnya?', hint:'cth: 20', answer:'32', note:'sisi = √64 = 8 cm, K = 4 × 8 = 32 cm' },
  { type:'fillin', tag:'▭ Persegi Panjang · Soal 14', text:'Persegi panjang punya panjang 10 cm dan lebar 5 cm. Berapa cm² luasnya?', hint:'cth: 40', answer:'50', note:'L = 10 × 5 = 50 cm²' },
  { type:'fillin', tag:'🔺 Segitiga · Soal 15', text:'Sebuah segitiga punya alas 16 cm dan tinggi 9 cm. Berapa cm² luasnya?', hint:'cth: 50', answer:'72', note:'L = ½ × 16 × 9 = 72 cm²', viz:{t:'tri',a:16,tt:9} },
  { type:'fillin', tag:'🧩 Bangun Gabungan · Soal 16', text:'Bangun gabungan terdiri dari persegi panjang (8 cm × 6 cm) dan segitiga di atasnya (alas 8 cm, tinggi 3 cm). Berapa cm² luas totalnya?', hint:'cth: 50', answer:'60', note:'L = (8×6) + (½×8×3) = 48 + 12 = 60 cm²' },
  { type:'choice', tag:'🔍 Membandingkan · Soal 17', text:'Mana yang lebih besar luasnya?', left:'Persegi sisi 5 cm', right:'P.panjang 6×4 cm', answer:'>', note:'Luas persegi = 25 cm², luas persegi panjang = 24 cm², jadi 25 > 24' },
  { type:'choice', tag:'🔍 Membandingkan · Soal 18', text:'Bandingkan keliling dua bangun berikut:', left:'Persegi sisi 8', right:'P.panjang 10×6', answer:'=', note:'Keliling persegi = 4×8 = 32, keliling p.panjang = 2×(10+6) = 32, jadi sama' },
  { type:'story', tag:'📝 Soal Cerita · Soal 19', ctx:'Sebuah kebun berbentuk persegi panjang berukuran panjang 25 m dan lebar 15 m akan dipagari keliling penuh dengan kawat. Berapa meter kawat yang dibutuhkan?', hint:'cth: 60', answer:'80', note:'K = 2 × (25+15) = 2 × 40 = 80 m' },
  { type:'story', tag:'📝 Soal Cerita · Soal 20', ctx:'Sebuah taman berbentuk gabungan persegi panjang (panjang 12 m, lebar 7 m) dan segitiga di atasnya (alas 12 m, tinggi 5 m). Berapa m² luas taman tersebut secara keseluruhan?', hint:'cth: 90', answer:'114', note:'L = (12×7) + (½×12×5) = 84 + 30 = 114 m²' }
];

let cur=0, score=0, results=[], solved=false, hadMiss=false;

function startQuiz(){
  document.getElementById('intro').style.display='none';
  document.getElementById('quiz').style.display='block';
  renderQ();
}

function vizHtml(v){
  if(!v) return '';
  if(v.t==='square') return renderSquareViz(v.s);
  if(v.t==='rect') return renderRectViz(v.p,v.l);
  if(v.t==='tri') return renderTriViz(v.a,v.tt);
  return '';
}

/* ===================== RENDER QUESTION ===================== */
function renderQ(){
  solved=false;
  hadMiss=false;
  updateProgress();
  const q = QS[cur];

  if(q.type==='fillin'){
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <div class="q-text">${q.text}</div>
        ${vizHtml(q.viz)}
        <div class="fillin-row">
          Jawaban: <input type="text" id="inAns" placeholder="${q.hint}">
        </div>
        <div class="fillin-hint">Isi angka saja tanpa satuan · jawaban harus benar dulu baru bisa lanjut</div>
        <div class="fillin-submit"><button class="btn btn-check" id="checkBtn" onclick="checkFillin()">Periksa Jawaban ✓</button></div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
    const inp = document.getElementById('inAns');
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') checkFillin(); });
    inp.addEventListener('input', ()=>{ if(!solved){ inp.classList.remove('wrong'); document.getElementById('fb').className='feedback'; } });
  }

  if(q.type==='story'){
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <p class="q-context">${q.ctx}</p>
        <div class="fillin-row">
          Jawaban: <input type="text" id="inAns" placeholder="${q.hint}">
        </div>
        <div class="fillin-hint">Isi jawaban berupa angka saja tanpa satuan (cth: 60) · jawaban harus benar dulu baru bisa lanjut</div>
        <div class="fillin-submit"><button class="btn btn-check" id="checkBtn" onclick="checkFillin()">Periksa Jawaban ✓</button></div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
    const inp = document.getElementById('inAns');
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') checkFillin(); });
    inp.addEventListener('input', ()=>{ if(!solved){ inp.classList.remove('wrong'); document.getElementById('fb').className='feedback'; } });
  }

  if(q.type==='choice'){
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <div class="q-text">${q.text}</div>
        <div class="compare-row">
          <div class="compare-box">${q.left}</div>
          <div class="compare-vs">vs</div>
          <div class="compare-box">${q.right}</div>
        </div>
        <div class="fillin-hint">Pilih tanda yang tepat: &lt; (lebih kecil), &gt; (lebih besar), atau = (sama)</div>
        <div class="opt-row" id="optRow">
          <button class="opt-btn" data-v="<" onclick="checkChoice(this)">&lt;</button>
          <button class="opt-btn" data-v="=" onclick="checkChoice(this)">=</button>
          <button class="opt-btn" data-v=">" onclick="checkChoice(this)">&gt;</button>
        </div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
  }
}

/* ===================== FILLIN / STORY LOGIC ===================== */
function checkFillin(){
  if(solved) return;
  const q = QS[cur];
  const raw = document.getElementById('inAns').value;
  const fb = document.getElementById('fb');
  if(raw===''){
    fb.className = 'feedback show no';
    fb.textContent = '✗ Isi jawabannya terlebih dahulu.';
    return;
  }
  const userVal = parseValue(raw);
  if(userVal===null){
    fb.className = 'feedback show no';
    fb.textContent = '✗ Format belum dikenali. Coba isi angka biasa, desimal (2,5), atau pecahan (3/4).';
    return;
  }
  const ansVal = parseValue(q.answer);
  const correct = valEqual(userVal, ansVal, 0.01);
  const inp = document.getElementById('inAns');

  if(correct){
    solved = true;
    score += hadMiss ? 5 : 10;
    results[cur] = hadMiss ? 'retry' : 'ok';
    inp.classList.remove('wrong');
    inp.classList.add('correct');
    inp.disabled = true;
    document.getElementById('checkBtn').disabled = true;
    fb.className = 'feedback show ok';
    fb.textContent = `✓ Benar! ${q.note||''}`;
    document.getElementById('nextBtn').disabled = false;
  } else {
    hadMiss = true;
    inp.classList.add('wrong');
    fb.className = 'feedback show no';
    fb.textContent = '✗ Belum tepat, coba periksa lagi hitunganmu ya!';
  }
}

/* ===================== CHOICE (COMPARE) LOGIC ===================== */
function checkChoice(btn){
  if(solved) return;
  const q = QS[cur];
  const val = btn.getAttribute('data-v');
  const correct = (val === q.answer);
  const fb = document.getElementById('fb');

  if(correct){
    solved = true;
    score += hadMiss ? 5 : 10;
    results[cur] = hadMiss ? 'retry' : 'ok';
    document.querySelectorAll('#optRow .opt-btn').forEach(b=>b.disabled=true);
    btn.classList.add('correct');
    fb.className = 'feedback show ok';
    fb.textContent = `✓ Benar! ${q.note||''}`;
    document.getElementById('nextBtn').disabled = false;
  } else {
    hadMiss = true;
    btn.classList.add('wrong');
    fb.className = 'feedback show no';
    fb.textContent = '✗ Belum tepat, coba pilih tanda yang lain.';
    setTimeout(()=>{ btn.classList.remove('wrong'); }, 700);
  }
}

/* ===================== NAV & PROGRESS ===================== */
function updateProgress(){
  document.getElementById('progVal').textContent = `${cur+1}/20`;
  document.getElementById('progBar').style.width = (cur/20*100)+'%';
}

function nextQ(){
  if(cur<QS.length-1){ cur++; renderQ(); }
  else showResults();
}
function prevQ(){
  if(cur>0){ cur--; renderQ(); }
}

function showResults(){
  document.getElementById('quiz').style.display='none';
  const div=document.getElementById('results');
  div.style.display='block';
  const perfect = results.filter(r=>r==='ok').length;
  const pct = perfect/20;
  const icon = pct>=0.9?'🏆':pct>=0.7?'🎯':pct>=0.5?'📘':'📉';
  const msg = pct>=0.9?'Luar biasa! Hampir semua soal kamu jawab benar di percobaan pertama!':pct>=0.7?'Bagus sekali! Sebagian besar soal langsung benar tanpa perlu coba lagi.':pct>=0.5?'Sudah lumayan! Beberapa soal masih butuh dicoba beberapa kali.':'Kamu berhasil menyelesaikan semua soal! Tapi banyak yang butuh dicoba ulang — yuk review lagi materinya.';
  const pips = Array.from({length:20},(_,i)=>{
    const r = results[i];
    const cls = r==='ok' ? 'pip-ok' : 'pip-retry';
    const ic = r==='ok' ? '✓' : '↻';
    return `<div class="sc-pip ${cls}">${ic}</div>`;
  }).join('');
  div.innerHTML=`
    <span class="res-icon">${icon}</span>
    <div class="res-score">${score}/200</div>
    <div class="res-lbl">Skor Latihan · ${perfect}/20 Langsung Benar</div>
    <div class="score-grid">${pips}</div>
    <p class="res-msg">${msg}</p>
    <div class="res-btns">
      <button class="btn btn-next" onclick="location.reload()">🔄 Ulangi Latihan</button>
      <a href="lesson27.html" class="btn btn-ghost">← Lesson</a>
    </div>
  `;
}
</script>
