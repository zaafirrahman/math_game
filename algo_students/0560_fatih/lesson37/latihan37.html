<style>
  :root{
    --bg:#0f1419;--card:#1c2533;--border:#2a3a4a;--border2:#344858;
    --steel:#4a90b8;--steel-light:#7ab8d8;--steel-bg:rgba(74,144,184,0.1);
    --amber:#f0a830;--amber-light:#f8c870;--amber-bg:rgba(240,168,48,0.1);
    --green:#48c870;--green-bg:rgba(72,200,112,0.1);
    --red:#e85040;
    --violet:#7c3aed;--violet-bg:rgba(124,58,237,0.1);--violet-light:#a78bfa;
    --text:#dce8f0;--text-mid:#9ab0c0;--text-muted:#586878;
    --shadow:rgba(0,0,0,0.4);--track:#263545;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(74,144,184,0.06) 0%,transparent 55%);pointer-events:none;}

  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid var(--border);background:rgba(15,20,25,0.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100;font-family:'Rajdhani',sans-serif;font-size:0.82rem;font-weight:600;letter-spacing:1px;}
  nav a{color:var(--text-muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--steel-light);}
  nav span{color:var(--border2);}
  nav .cur{color:var(--amber);}

  .track-strip{position:fixed;bottom:0;left:0;right:0;height:24px;background:var(--track);z-index:5;border-top:2px solid var(--border2);overflow:hidden;}
  .sleepers{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 18px,var(--border) 18px,var(--border) 24px);animation:roll 3s linear infinite;}
  @keyframes roll{from{background-position:0 0;}to{background-position:-42px 0;}}
  .track-rail{position:absolute;left:0;right:0;height:3px;background:var(--border2);}
  .track-rail:first-of-type{top:7px;}.track-rail:last-of-type{top:14px;}

  .wrap{max-width:680px;margin:0 auto;padding:2.5rem 1.5rem 5rem;position:relative;z-index:1;}

  #intro{text-align:center;margin-bottom:1rem;}
  .home-icon{font-size:4rem;display:block;margin-bottom:1rem;}
  .home-title{font-family:'Rajdhani',sans-serif;font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700;color:var(--amber);letter-spacing:3px;margin-bottom:0.5rem;}
  .home-sub{color:var(--text-muted);font-size:0.9rem;line-height:1.7;margin-bottom:1.5rem;}
  .info-row{display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem;}
  .info-chip{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.5rem 0.9rem;font-family:'Rajdhani',sans-serif;font-size:0.74rem;font-weight:600;letter-spacing:0.5px;color:var(--text-mid);}
  .info-chip span{color:var(--amber);}
  .start-btn{background:linear-gradient(135deg,var(--amber-light),#c9820f);color:#08131c;border:none;padding:1rem 3rem;border-radius:6px;font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:800;letter-spacing:3px;cursor:pointer;box-shadow:0 5px 18px rgba(240,168,48,0.3);transition:all 0.2s;}
  .start-btn:hover{transform:translateY(-3px);}

  #quiz{display:none;}
  .progress-wrap{margin-bottom:1.5rem;}
  .progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;}
  .progress-label{font-family:'Rajdhani',sans-serif;font-size:0.72rem;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}
  .progress-val{font-family:'Rajdhani',sans-serif;font-size:0.85rem;font-weight:700;color:var(--amber);}
  .progress-bg{background:var(--border);border-radius:4px;height:6px;overflow:hidden;}
  .progress-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--steel),var(--amber));transition:width 0.4s ease;}

  .q-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.8rem;margin-bottom:1rem;box-shadow:0 4px 14px var(--shadow);position:relative;overflow:hidden;}
  .q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--amber),transparent);}
  .q-tag{font-family:'Rajdhani',sans-serif;font-size:0.65rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--amber);margin-bottom:0.9rem;}
  .q-text{font-family:'Nunito',sans-serif;font-weight:700;font-size:0.98rem;line-height:1.65;margin-bottom:1.1rem;letter-spacing:0.1px;text-align:left;}

  /* Fill-in (isian) text input */
  .fillin-row{display:flex;align-items:center;justify-content:center;gap:0.6rem;margin-bottom:0.5rem;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.1rem;flex-wrap:wrap;}
  .fillin-row input{width:150px;text-align:center;background:var(--track);border:2px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:1.05rem;font-weight:700;padding:0.5rem 0.5rem;}
  .fillin-row input:focus{outline:none;border-color:var(--amber);}
  .fillin-row input.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);}
  .fillin-row input.wrong{border-color:var(--red);background:rgba(232,80,64,0.08);color:var(--red);}
  .fillin-hint{text-align:center;font-size:0.76rem;color:var(--text-muted);margin-bottom:1rem;}
  .fillin-submit{display:flex;justify-content:center;margin-bottom:0.6rem;}

  /* Choice buttons */
  .opt-row{display:flex;gap:0.7rem;justify-content:center;margin-bottom:0.6rem;flex-wrap:wrap;}
  .opt-btn{background:var(--track);border:2px solid var(--border2);color:var(--text);padding:0.8rem 1.6rem;border-radius:10px;cursor:pointer;font-size:1.3rem;font-family:'Rajdhani',sans-serif;font-weight:800;text-align:center;transition:all 0.15s;min-width:70px;}

  .opt-btn.wrong{border-color:var(--red);background:rgba(232,80,64,0.1);color:var(--red);}

  .feedback{padding:0.8rem 1rem;border-radius:8px;font-size:0.88rem;font-weight:600;display:none;line-height:1.55;}

  .feedback.no{background:rgba(232,80,64,0.07);color:var(--red);border:1px solid rgba(232,80,64,0.25);}

  .btn{padding:0.7rem 1.4rem;border-radius:6px;border:none;font-family:'Rajdhani',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-flex;align-items:center;gap:0.4rem;letter-spacing:1px;}

  .btn-next{background:linear-gradient(135deg,var(--violet),#5b21b6);color:#fff;font-weight:800;}

  .res-lbl{font-family:'Rajdhani',sans-serif;font-size:0.7rem;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:1.2rem;}
  .res-msg{color:var(--text-mid);font-size:0.9rem;line-height:1.7;margin-bottom:1.5rem;max-width:380px;margin-left:auto;margin-right:auto;}
  .score-grid{display:flex;gap:0.4rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem;}
  .sc-pip{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;}
  .pip-ok{background:var(--green-bg);border:1px solid rgba(72,200,112,0.4);}
  .pip-retry{background:var(--amber-bg);border:1px solid rgba(240,168,48,0.4);}

  /* ===== lesson 36: geometry figure ===== */
  .geo-wrap{display:flex;justify-content:center;margin:0.2rem 0 1.1rem;}
  .geo-svg{width:100%;max-width:360px;height:auto;overflow:visible;}
  .geo-svg text{font-family:'Rajdhani',sans-serif;font-weight:800;text-anchor:middle;dominant-baseline:central;}
  .geo-svg .gd{font-size:15px;fill:var(--text);}

  .geo-svg .gi{font-size:16px;fill:var(--text);}
  .geo-svg .gs{font-size:11px;fill:var(--text-muted);font-weight:700;letter-spacing:0.5px;}
  .g-steel{fill:rgba(74,144,184,0.22);stroke:#4a90b8;stroke-width:2.5;stroke-linejoin:round;}
  .g-cut{fill:rgba(124,58,237,0.14);stroke:#a78bfa;stroke-width:2.5;stroke-dasharray:6 4;stroke-linejoin:round;}
  .g-aux{stroke:#9ab0c0;stroke-width:2;stroke-dasharray:5 4;}
  .g-tick{stroke:#f0a830;stroke-width:2.5;}

  /* ===== lesson 37: data charts & tables ===== */
  .ch-svg{width:100%;max-width:400px;height:auto;overflow:visible;}

  .ch-svg .ax{font-size:12px;fill:#9ab0c0;}
  .ch-svg .ax.l{text-anchor:end;}
  .ch-svg .vl{font-size:14px;fill:#dce8f0;}
  .ch-svg .at{font-size:11px;fill:#586878;letter-spacing:1px;}
  .ch-svg .gr{stroke:#2a3a4a;stroke-width:1;}
  .ch-svg .axl{stroke:#344858;stroke-width:2;}
  .ch-svg .b-st{fill:rgba(74,144,184,0.5);stroke:#4a90b8;stroke-width:2;}
  .ch-svg .b-am{fill:rgba(240,168,48,0.45);stroke:#f0a830;stroke-width:2;}
  .ch-svg .ln{fill:none;stroke:#7ab8d8;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;}
  .ch-svg .dt-st{fill:#1c2533;stroke:#7ab8d8;stroke-width:3;}
  .ch-svg .dt-am{fill:#f0a830;stroke:#f8c870;stroke-width:3;}
  .ch-svg .wf{fill:#263545;stroke:#344858;stroke-width:1.5;}
  .ch-svg .wf.on{fill:rgba(240,168,48,0.55);stroke:#f0a830;}

  .dt{border-collapse:separate;border-spacing:0;margin:0.4rem auto;min-width:230px;border:1px solid #344858;border-radius:10px;overflow:hidden;font-family:'Rajdhani',sans-serif;}
  .dt caption{caption-side:top;font-size:0.78rem;color:#586878;letter-spacing:0.5px;padding-bottom:0.5rem;font-weight:700;}
  .dt th{background:#263545;color:#f0a830;font-size:0.78rem;letter-spacing:1.5px;text-transform:uppercase;padding:0.55rem 0.7rem;text-align:center;font-weight:700;}
  .dt th:first-child,.dt td:first-child{text-align:left;}
  .dt th.der{color:#48c870;}
  .dt td{padding:0.5rem 0.7rem;border-top:1px solid #2a3a4a;font-weight:700;font-size:1.02rem;color:#dce8f0;text-align:center;}
  .dt td:first-child{color:#9ab0c0;}
  .dt td.der{color:#80e0a0;}
  .dt tr.sum td{background:rgba(240,168,48,0.1);color:#f8c870;}
  .dt-wrap{display:block;overflow-x:auto;margin:0.8rem 0;}
  .dt-wrap .dt{margin:0.4rem auto;}
  @media (max-width:480px){.dt th{font-size:0.7rem;letter-spacing:0.5px;padding:0.5rem 0.45rem;}.dt td{padding:0.45rem 0.45rem;font-size:0.95rem;}}

  .cg-row{display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;margin:0.7rem 0;}
  .cg{background:#263545;border:1px solid #344858;border-radius:8px;padding:0.35rem 0.75rem;font-family:'Rajdhani',sans-serif;font-weight:800;font-size:0.9rem;color:#dce8f0;}
  .cg b{margin-left:0.4rem;}
  .cg.up b{color:#48c870;} .cg.dn b{color:#e85040;}

  .picto{display:flex;flex-direction:column;gap:0.35rem;margin:0.9rem auto;max-width:360px;}
  .picto-r{display:flex;align-items:center;gap:0.7rem;background:#263545;border:1px solid #344858;border-radius:8px;padding:0.4rem 0.8rem;}
  .picto-n{font-family:'Rajdhani',sans-serif;font-weight:800;color:#dce8f0;width:3.2rem;font-size:0.95rem;}
  .picto-b{font-size:1.05rem;letter-spacing:1px;line-height:1.3;}

  .fk{border-radius:10px;padding:0.8rem 1rem;margin:0.6rem 0;border:1px solid;}
  .fk-t{font-family:'Rajdhani',sans-serif;font-size:0.72rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:0.25rem;}
  .fk-q{font-size:0.92rem;color:#dce8f0;line-height:1.55;font-weight:700;}
  .fk-w{font-size:0.8rem;color:#9ab0c0;margin-top:0.35rem;line-height:1.55;}
  .fk.f{background:rgba(74,144,184,0.1);border-color:rgba(74,144,184,0.4);} .fk.f .fk-t{color:#7ab8d8;}
  .fk.k{background:rgba(72,200,112,0.1);border-color:rgba(72,200,112,0.4);} .fk.k .fk-t{color:#48c870;}
  .fk.a{background:rgba(232,80,64,0.08);border-color:rgba(232,80,64,0.35);} .fk.a .fk-t{color:#e85040;}
</style>

<script>
/* ===================== VALUE PARSER ===================== */
function parseValue(str){
  str = String(str).trim();
  if(str==='') return null;
  str = str.replace(',', '.');
  if(/^\d{1,3}(\.\d{3})+$/.test(str)){ str = str.replace(/\./g,''); }
  let val;
  let m = str.match(/^-?\d+(\.\d+)?$/);
  if(m){ val = parseFloat(str); }
  else return null;
  return val;
}
function valEqual(a,b,tol){
  if(a===null||b===null||isNaN(a)||isNaN(b)) return false;
  tol = tol || 0.01;
  return Math.abs(a-b) <= tol;
}



/* ===================== CHARTS & TABLES ===================== */
function chart(o){
  const W=o.W||360, H=o.H||250, ml=50, mr=18, mt=28, mb=(o.xt?56:42);
  const pw=W-ml-mr, ph=H-mt-mb, n=o.data.length;
  const y0=o.ymin||0, y1=o.ymax, st=o.step;
  const Y=v=>+(mt+ph-(v-y0)/(y1-y0)*ph).toFixed(1);
  const slot=pw/n, cx=i=>+(ml+slot*i+slot/2).toFixed(1);
  const hl=o.hl||[];
  let s='';
  for(let v=y0; v<=y1+1e-9; v+=st){
    s+=`<line class="gr" x1="${ml}" y1="${Y(v)}" x2="${W-mr}" y2="${Y(v)}"/>`+
       `<text class="ax l" x="${ml-8}" y="${Y(v)}">${v}</text>`;
  }
  s+=`<line class="axl" x1="${ml}" y1="${mt}" x2="${ml}" y2="${Y(y0)}"/><line class="axl" x1="${ml}" y1="${Y(y0)}" x2="${W-mr}" y2="${Y(y0)}"/>`;
  if(o.type==='bar'){
    const bw=Math.min(slot*0.58,54);
    o.data.forEach((d,i)=>{
      const top=Y(d[1]);
      s+=`<rect class="${hl.includes(i)?'b-am':'b-st'}" x="${(cx(i)-bw/2).toFixed(1)}" y="${top}" width="${bw.toFixed(1)}" height="${(Y(y0)-top).toFixed(1)}" rx="3"/>`;
      if(o.vals) s+=`<text class="vl" x="${cx(i)}" y="${top-11}">${d[1]}${o.unit||''}</text>`;
    });
  } else {
    s+=`<polyline class="ln" points="${o.data.map((d,i)=>cx(i)+','+Y(d[1])).join(' ')}"/>`;
    o.data.forEach((d,i)=>{
      s+=`<circle class="${hl.includes(i)?'dt-am':'dt-st'}" cx="${cx(i)}" cy="${Y(d[1])}" r="6"/>`;
      if(o.vals) s+=`<text class="vl" x="${cx(i)}" y="${Y(d[1])-17}">${d[1]}${o.unit||''}</text>`;
    });
  }
  o.data.forEach((d,i)=>{ s+=`<text class="ax" x="${cx(i)}" y="${Y(y0)+17}">${d[0]}</text>`; });
  if(o.xt) s+=`<text class="at" x="${ml+pw/2}" y="${H-10}">${o.xt}</text>`;
  if(o.yt) s+=`<text class="at" transform="translate(13 ${mt+ph/2}) rotate(-90)">${o.yt}</text>`;
  return `<svg class="ch-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria}">${s}</svg>`;
}

function waffle(total, cols, hi, aria){
  const c=22, g=5, rows=Math.ceil(total/cols);
  const W=cols*(c+g)+g, H=rows*(c+g)+g;
  let s='';
  for(let i=0;i<total;i++){
    const r=Math.floor(i/cols), k=i%cols;
    s+=`<circle class="wf${i<hi?' on':''}" cx="${g+k*(c+g)+c/2}" cy="${g+r*(c+g)+c/2}" r="${c/2}"/>`;
  }
  return `<svg class="ch-svg" style="max-width:340px" viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">${s}</svg>`;
}

function dtable(h, rows, o){
  o=o||{};
  const der=o.der||[], sum=o.sum||[];
  const hs=h.map((x,i)=>`<th${der.includes(i)?' class="der"':''}>${x}</th>`).join('');
  const rs=rows.map((r,ri)=>`<tr${sum.includes(ri)?' class="sum"':''}>`+r.map((c,i)=>`<td${der.includes(i)?' class="der"':''}>${c}</td>`).join('')+'</tr>').join('');
  return `<table class="dt">${o.cap?`<caption>${o.cap}</caption>`:''}<thead><tr>${hs}</tr></thead><tbody>${rs}</tbody></table>`;
}
function put(id, html){ document.getElementById(id).innerHTML = html; }


const ICE = [['Senin',15],['Selasa',25],['Rabu',20],['Kamis',35],['Jumat',30]];
const FIGS = {
  t1:()=>'<div class="dt-wrap">'+dtable(['Nama','Jumlah Kelereng (butir)'],[['Rani',12],['Sinta',18],['Tono',9],['Umar',15],['Vina',21]],{cap:'Kelereng yang dimiliki lima anak'})+'</div>',
  c2:()=>chart({type:'bar',data:ICE,ymax:40,step:5,xt:'Hari',yt:'Es krim terjual (buah)',aria:'Diagram batang es krim terjual: Senin 15, Selasa 25, Rabu 20, Kamis 35, Jumat 30'}),
  c3:()=>chart({type:'line',data:[['Mgg 1',5],['Mgg 2',8],['Mgg 3',14],['Mgg 4',15],['Mgg 5',19]],ymax:20,step:5,vals:true,xt:'Minggu',yt:'Tinggi (cm)',aria:'Diagram garis tinggi tanaman: minggu 1 5 cm, minggu 2 8 cm, minggu 3 14 cm, minggu 4 15 cm, minggu 5 19 cm'}),
  t4:()=>'<div class="dt-wrap">'+dtable(['Buah Favorit','Jumlah Siswa'],[['Apel',22],['Jeruk',10],['Mangga',18]],{cap:'Buah favorit siswa kelas 6'})+'</div>'
};

/* ===================== DATA ===================== */
// type "fillin"     : isian jawaban (angka)
// type "textchoice" : pilih jawaban berupa teks
const QS = [
  { type:'fillin', fig:'t1', tag:'📋 Membaca Tabel · Soal 1', text:'Perhatikan tabel kelereng di bawah. Berapa butir selisih antara kelereng terbanyak dan kelereng tersedikit?', hint:'cth: 5', answer:'12', note:'Terbanyak: Vina, 21 butir. Tersedikit: Tono, 9 butir. Selisih = 21 − 9 = 12 butir.' },

  { type:'fillin', fig:'c2', tag:'📊 Diagram Batang · Soal 2', text:'Diagram batang menunjukkan es krim yang terjual di sebuah kantin. Berapa buah total es krim yang terjual pada hari Rabu, Kamis, dan Jumat?', hint:'cth: 60', answer:'85', note:'Baca tinggi batang: Rabu 20, Kamis 35, Jumat 30. Total = 20 + 35 + 30 = 85 buah.' },

  { type:'textchoice', fig:'c3', tag:'📈 Diagram Garis · Soal 3', text:'Diagram garis menunjukkan tinggi sebuah tanaman setiap minggu. Pada minggu ke berapa tanaman bertambah tinggi paling banyak dibandingkan minggu sebelumnya?', options:['Minggu ke-2','Minggu ke-3','Minggu ke-5'], answer:'Minggu ke-3', note:'Pertambahan tiap minggu: +3, +6, +1, +4. Terbesar pada minggu ke-3 (8 cm menjadi 14 cm, naik 6 cm). Minggu ke-5 memang paling tinggi (19 cm), tetapi pertambahannya hanya 4 cm.' },

  { type:'fillin', fig:'t4', tag:'💯 Data dan Persentase · Soal 4', text:'Tabel menunjukkan buah favorit siswa kelas 6. Berapa persen siswa yang memilih jeruk? (tulis angkanya saja, tanpa tanda %)', hint:'cth: 30', answer:'20', note:'Jumlah siswa = 22 + 10 + 18 = 50. Bagian yang memilih jeruk = 10/50 = 1/5. Persentasenya 1/5 × 100% = 20%.' },

  { type:'textchoice', fig:'c2', tag:'🧠 Kesimpulan dari Data · Soal 5', text:'Perhatikan lagi diagram es krim. Pernyataan mana yang merupakan kesimpulan yang didukung oleh data pada diagram?', options:['Penjualan es krim naik dari Rabu ke Kamis','Anak-anak lebih suka es krim karena cuaca panas','Minggu depan es krim pasti paling laris pada hari Kamis'], answer:'Penjualan es krim naik dari Rabu ke Kamis', note:'Rabu 20, Kamis 35, jadi penjualan naik 15. Dua pernyataan lainnya adalah dugaan: diagram tidak memuat alasan anak-anak membeli, dan tidak memuat data minggu depan.' }
];

let cur=0, score=0, results=[], solved=false, hadMiss=false;

function startQuiz(){
  document.getElementById('intro').style.display='none';
  document.getElementById('quiz').style.display='block';
  renderQ();
}

function optionsHtml(options){
  return options.map(o=>`<button class="opt-btn wide" data-v="${o}" onclick="checkOption(this)">${o}</button>`).join('');
}

/* ===================== RENDER QUESTION ===================== */
function renderQ(){
  renderQ0();
  const q = QS[cur];
  if(q.fig){ document.getElementById('fig').innerHTML = FIGS[q.fig](); }
}
function renderQ0(){
  solved=false;
  hadMiss=false;
  updateProgress();
  const q = QS[cur];

  if(q.type==='fillin'){
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <div class="q-text">${q.text}</div>
        ${q.fig?'<div id="fig" class="geo-wrap"></div>':''}
        <div class="fillin-row">
          Jawaban: <input type="text" id="inAns" placeholder="${q.hint}">
        </div>
        <div class="fillin-hint">Isi angka saja · jawaban harus benar dulu baru bisa lanjut</div>
        <div class="fillin-submit"><button class="btn btn-check" id="checkBtn" onclick="checkFillin()">Periksa Jawaban ✓</button></div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
    const inp = document.getElementById('inAns');
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') checkFillin(); });
    inp.addEventListener('input', ()=>{ if(!solved){ inp.classList.remove('wrong'); document.getElementById('fb').className='feedback'; } });
  }

  if(q.type==='textchoice'){
    document.getElementById('qarea').innerHTML = `
      <div class="q-card">
        <div class="q-tag">${q.tag}</div>
        <div class="q-text">${q.text}</div>
        ${q.fig?'<div id="fig" class="geo-wrap"></div>':''}
        <div class="opt-row" id="optRow">${optionsHtml(q.options)}</div>
        <div class="feedback" id="fb"></div>
      </div>
      <div class="nav-btns">
        <button class="btn btn-ghost" onclick="prevQ()" ${cur===0?'disabled':''}>← Soal Sebelumnya</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>${cur===QS.length-1?'Lihat Hasil ✓':'Soal Berikutnya →'}</button>
      </div>
    `;
  }
}

/* ===================== FILLIN LOGIC ===================== */
function checkFillin(){
  if(solved) return;
  const q = QS[cur];
  const raw = document.getElementById('inAns').value;
  const fb = document.getElementById('fb');
  if(raw===''){
    fb.className = 'feedback show no';
    fb.textContent = '✗ Isi jawabannya terlebih dahulu.';
    return;
  }
  const userVal = parseValue(raw);
  if(userVal===null){
    fb.className = 'feedback show no';
    fb.textContent = '✗ Format belum dikenali. Coba isi angka biasa saja.';
    return;
  }
  const ansVal = parseValue(q.answer);
  const correct = valEqual(userVal, ansVal, 0.01);
  const inp = document.getElementById('inAns');

  if(correct){
    solved = true;
    score += hadMiss ? 5 : 10;
    results[cur] = hadMiss ? 'retry' : 'ok';
    inp.classList.remove('wrong');
    inp.classList.add('correct');
    inp.disabled = true;
    document.getElementById('checkBtn').disabled = true;
    fb.className = 'feedback show ok';
    fb.textContent = `✓ Benar! ${q.note||''}`;
    document.getElementById('nextBtn').disabled = false;
  } else {
    hadMiss = true;
    inp.classList.add('wrong');
    fb.className = 'feedback show no';
    fb.textContent = '✗ Belum tepat, coba periksa lagi ya!';
  }
}

/* ===================== OPTION (choice) LOGIC ===================== */
function checkOption(btn){
  if(solved) return;
  const q = QS[cur];
  const val = btn.getAttribute('data-v');
  const correct = (val === q.answer);
  const fb = document.getElementById('fb');

  if(correct){
    solved = true;
    score += hadMiss ? 5 : 10;
    results[cur] = hadMiss ? 'retry' : 'ok';
    document.querySelectorAll('#optRow .opt-btn').forEach(b=>b.disabled=true);
    btn.classList.add('correct');
    fb.className = 'feedback show ok';
    fb.textContent = `✓ Benar! ${q.note||''}`;
    document.getElementById('nextBtn').disabled = false;
  } else {
    hadMiss = true;
    btn.classList.add('wrong');
    fb.className = 'feedback show no';
    fb.textContent = '✗ Belum tepat, coba pikirkan lagi ya!';
    setTimeout(()=>{ btn.classList.remove('wrong'); }, 700);
  }
}

/* ===================== NAV & PROGRESS ===================== */
function updateProgress(){
  document.getElementById('progVal').textContent = `${cur+1}/${QS.length}`;
  document.getElementById('progBar').style.width = (cur/QS.length*100)+'%';
}

function nextQ(){
  if(cur<QS.length-1){ cur++; renderQ(); }
  else showResults();
}
function prevQ(){
  if(cur>0){ cur--; renderQ(); }
}

function showResults(){
  document.getElementById('quiz').style.display='none';
  const div=document.getElementById('results');
  div.style.display='block';
  const perfect = results.filter(r=>r==='ok').length;
  const pct = perfect/QS.length;
  const icon = pct>=0.9?'🏆':pct>=0.7?'🎯':pct>=0.5?'📘':'📉';
  const msg = pct>=0.9?'Luar biasa! Kamu sudah bisa membaca data, menghitung dari tabel dan diagram, dan menarik kesimpulan dengan bukti!':pct>=0.7?'Bagus sekali! Sebagian besar cara membaca dan menafsirkan data sudah kamu kuasai.':pct>=0.5?'Sudah lumayan! Coba baca lagi materinya, terutama bagian membandingkan perubahan dan membedakan fakta dari asumsi.':'Kamu berhasil menyelesaikan semua soal! Yuk buka lagi materinya, lalu coba lagi latihan ini.';
  const pips = Array.from({length:QS.length},(_,i)=>{
    const r = results[i];
    const cls = r==='ok' ? 'pip-ok' : 'pip-retry';
    const ic = r==='ok' ? '✓' : '↻';
    return `<div class="sc-pip ${cls}">${ic}</div>`;
  }).join('');
  div.innerHTML=`
    <span class="res-icon">${icon}</span>
    <div class="res-score">${score}/${QS.length*10}</div>
    <div class="res-lbl">Skor Latihan · ${perfect}/${QS.length} Langsung Benar</div>
    <div class="score-grid">${pips}</div>
    <p class="res-msg">${msg}</p>
    <div class="res-btns">
      <button class="btn btn-next" onclick="location.reload()">🔄 Ulangi Latihan</button>
      <a href="lesson37.html" class="btn btn-ghost">← Lesson</a>
    </div>
  `;
}
</script>
