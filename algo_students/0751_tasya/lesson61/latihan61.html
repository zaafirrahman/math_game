<h1>Aplikasi Pangkat &amp; Akar — Latihan <span>Mandiri</span></h1>
<p class="intro">20 soal bertahap dengan petunjuk di tiap soal. Alur pikir: apa yang diketahui → apa yang ditanyakan → pilih konsep → hitung → periksa masuk akal.</p>
<div id="app"></div>
</div>
<script>
/* Engine kuis L61. Di data, opsi pertama (o[0]) = jawaban benar; urutan diacak tiap ditampilkan. Notasi a^(m/n) otomatis dirender sebagai pangkat pecahan bertumpuk. */
function Quiz(c){
  const A=document.getElementById('app'),N=c.qs.length,P=c.pts||1;let i=0,s=0,t,done;
  const sh=a=>{a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a};
  const X=z=>z.replace(/\^\((\w+)\/(\w+)\)/g,'<span class="ex"><i>$1</i><i>$2</i></span>').replace(/\^\(([^()]+)\)/g,'<span class="ex s"><i>$1</i></span>');
  function show(){
    done=false;clearInterval(t);const q=c.qs[i];
    A.innerHTML=`<div class="prog"><i style="width:${i/N*100}%"></i></div><div class="ph"><span>Soal ${i+1} dari ${N}</span>${c.timer?'<span id="tm"></span>':''}<span>Skor: ${s}</span></div>
    <div class="card"><span class="tg">${q.t}</span><div class="qt">${X(q.q)}</div>${q.v?`<div class="vis">${q.v}</div>`:''}${q.h?`<button class="rv" id="hb">💡 Petunjuk</button><div class="hint" id="hn">${X(q.h)}</div>`:''}
    <div class="opts">${sh(q.o).map(x=>`<button class="opt" data-c="${x===q.o[0]?1:0}">${X(x)}</button>`).join('')}</div><div class="fb" id="fb"></div>
    <button class="btn p nb" id="nb">${i<N-1?'Soal Berikutnya →':'Lihat Hasil 🏆'}</button></div>`;
    if(q.h)document.getElementById('hb').onclick=()=>{document.getElementById('hn').style.display='block'};
    A.querySelectorAll('.opt').forEach(b=>b.onclick=()=>ans(b));
    document.getElementById('nb').onclick=()=>{i++;i<N?show():end()};
    if(c.timer){let l=c.timer;const tm=document.getElementById('tm');tm.textContent='⏱ '+l;t=setInterval(()=>{l--;tm.textContent='⏱ '+l;if(l<=10)tm.className='lo';if(l<=0)ans(null)},1000)}
  }
  function ans(b){
    if(done)return;done=true;clearInterval(t);const q=c.qs[i],fb=document.getElementById('fb');
    A.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.c==='1')x.classList.add('ok')});
    const good=!!b&&b.dataset.c==='1';if(b&&!good)b.classList.add('no');if(good)s+=P;
    fb.className='fb '+(good?'ok':'no');fb.innerHTML=(good?'✅ Benar! ':b?'❌ Belum tepat. ':'⏰ Waktu habis! ')+X(q.f);
    document.getElementById('nb').style.display='inline-block';
  }
  function end(){
    const r=Math.min(4,Math.floor(s/(N*P)*5));
    A.innerHTML=`<div class="fin"><div style="font-size:3.5rem">${['😊','🙂','😄','🌟','🏆'][r]}</div><h2>${c.title} selesai!</h2><div class="s">${s}/${N*P}</div><p>${c.msgs[r]}</p>
    <button class="btn p" id="rs">🔄 Ulangi</button>${c.links.map(l=>`<a class="btn gh" href="${l[1]}">${l[0]}</a>`).join('')}</div>`;
    document.getElementById('rs').onclick=()=>{i=0;s=0;show()};
  }
  show();
}
</script>
<script>
/* Kunci: opsi pertama (o[0]) selalu jawaban benar; urutan diacak otomatis. */
Quiz({title:'Latihan',timer:0,pts:1,
qs:[
{

"q": "Situasi mana yang paling membutuhkan akar?",

"Keliling persegi dari panjang sisinya"

"f": "Dari luas ke sisi artinya membalik proses kuadrat, itulah tugas akar.",
"h": "Akar membalik pangkat. Mana situasi yang meminta \"balik arah\"?"
},
{
"t": "Konsep",
"q": "Situasi mana yang paling cocok dimodelkan dengan pangkat?",

"Jumlah sel yang berlipat dua setiap jam",

"Mencari rusuk kubus dari volumenya",

],
"f": "Pengalian yang sama berulang-ulang ditulis sebagai pangkat. Menambah 5 kursi tiap hari adalah penambahan tetap.",

{
"t": "Luas ke Sisi",

"o": [
"7 m",
"24,5 m",
"98 m",
"2.401 m"
],
"f": "sisi = √49 = 7 m. Angka 24,5 muncul kalau luas dibagi 2.",
"h": "Luas = sisi × sisi. Bilangan berapa yang dikalikan dirinya sendiri menjadi 49?"
},
{
"t": "Dua Langkah",
"q": "Luas lapangan persegi 400 m². Berapa keliling lapangan itu?",
"o": [
"80 m",
"20 m",
"1.600 m",
"160 m"
],
"f": "Sisi = √400 = 20 m, keliling = 4 × 20 = 80 m. Angka 20 baru sisinya.",
"h": "Cari sisinya dulu, baru keliling."
},
{
"t": "Volume ke Rusuk",
"q": "Kubus bervolume 64 cm³. Berapa panjang rusuknya?",
"o": [
"4 cm",
"8 cm",
"16 cm",
"32 cm"
],
"f": "rusuk = ∛64 = 4 cm karena 4³ = 64. Angka 8 adalah √64, akar yang salah.",

},
{
"t": "Dua Langkah",
"q": "Kubus bervolume 125 cm³. Berapa luas satu sisi (satu bidang persegi) kubus itu?",

"25 cm²",
"5 cm²",
"625 cm²",

],

},

"t": "Pola Penggandaan",

"o": [
"800 sel",
"600 sel",
"700 sel",
"1.600 sel"

"100 × 2t",
"100 + 2t",

"t": "Berlipat vs Tetap",
"q": "Koloni A: 100 sel, bertambah 100 sel tiap jam. Koloni B: 100 sel, menjadi dua kali lipat tiap jam. Berapa selisih jumlah sel setelah 5 jam?",
"o": [
"2.600 sel",
"600 sel",
"3.200 sel",
"2.500 sel"
],
"f": "A = 100 + 5 × 100 = 600 sel. B = 100 × 2⁵ = 3.200 sel. Selisih = 2.600 sel.",

},
{
"t": "Bekerja Mundur",
"q": "Kultur 50 sel berlipat dua setiap jam. Setelah berapa jam jumlahnya mencapai 800 sel?",
"o": [
"4 jam",
"8 jam",
"16 jam",

"f": "800 ÷ 50 = 16 = 2⁴, jadi 4 jam.",

{
"t": "Asumsi Model",
"q": "Mengapa model 100 × 2^(t) belum tentu cocok untuk populasi nyata dalam waktu yang lama?",

],
"f": "Model ini mengasumsikan kondisi ideal. Di dunia nyata, sumber daya dan ruang terbatas."
},
{
"t": "Pythagoras",
"q": "Sebuah segitiga siku-siku memiliki sisi tegak 6 cm dan 8 cm. Berapa panjang sisi miringnya?",
"o": [

"14 cm",

"2 cm"
],
"f": "c² = 36 + 64 = 100, c = 10 cm. Angka 14 adalah 6 + 8, dan 100 belum diakarkan.",
"h": "Kuadratkan kedua sisi, jumlahkan, lalu akarkan.",
"v": "<svg viewBox=\"0 0 320 184\" style=\"width:100%;max-width:360px\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"100,20 100,150 290,150\" fill=\"rgba(74,159,212,.18)\" stroke=\"#4a9fd4\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><path d=\"M100,138 H112 V150\" fill=\"none\" stroke=\"#3d2b3d\" stroke-width=\"1.6\"/><text x=\"90\" y=\"90\" font-family=\"Nunito\" font-weight=\"800\" font-size=\"13\" fill=\"#7a5c78\" text-anchor=\"end\">6 cm</text><text x=\"195\" y=\"172\" font-family=\"Nunito\" font-weight=\"800\" font-size=\"13\" fill=\"#7a5c78\" text-anchor=\"middle\">8 cm</text><text x=\"232\" y=\"78\" font-family=\"Nunito\" font-weight=\"800\" font-size=\"13\" fill=\"#e8628a\" text-anchor=\"start\">c = ?</text></svg>"
},
