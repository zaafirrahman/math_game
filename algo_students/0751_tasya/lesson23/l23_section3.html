<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Test · L23 · Tasya</title>
<link rel="icon" type="image/svg+xml" href="../../../assets/logo1.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fdf6fb;--card:#ffffff;--border:#f0d6ea;--border2:#e8c8e0;
    --rose:#e8628a;--rose-light:#f5a0bc;--rose-bg:rgba(232,98,138,0.08);
    --lavender:#9b7fc8;--lavender-light:#c8b4e8;--lav-bg:rgba(155,127,200,0.08);
    --mint:#5fbfa0;--mint-light:#a8dfd0;--mint-bg:rgba(95,191,160,0.08);
    --peach:#f0956a;--peach-bg:rgba(240,149,106,0.08);
    --gold:#e8a020;--gold-light:#f5d080;--gold-bg:rgba(232,160,32,0.08);
    --text:#3d2b3d;--text-mid:#7a5c78;--text-muted:#b898b4;
    --shadow:rgba(180,100,150,0.1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Quicksand',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(155,127,200,0.1) 0%,transparent 50%);pointer-events:none;}
  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:2px solid var(--border);background:rgba(253,246,251,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;font-size:0.76rem;font-weight:700;}
  nav a{color:var(--text-muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--rose);}
  nav span{color:var(--border2);}
  nav .cur{color:var(--lavender);}
  .wrap{max-width:640px;margin:0 auto;padding:2.5rem 1.5rem 5rem;position:relative;z-index:1;}

  .intro-screen{text-align:center;padding:2rem 1rem;}
  .sprint-icon{font-size:4.5rem;display:block;margin-bottom:1.2rem;animation:bounce 1s ease-in-out infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .sprint-title{font-family:'Nunito',sans-serif;font-size:clamp(1.6rem,5vw,2.2rem);font-weight:900;color:var(--lavender);margin-bottom:0.6rem;}
  .sprint-sub{color:var(--text-muted);line-height:1.7;margin-bottom:2rem;font-size:0.92rem;}
  .rules{display:flex;flex-direction:column;gap:0.6rem;max-width:360px;margin:0 auto 2rem;}
  .rule{display:flex;align-items:center;gap:0.8rem;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:0.7rem 1.1rem;font-size:0.88rem;font-weight:600;}
  .start-btn{background:linear-gradient(135deg,var(--lavender),#7a5aa8);color:#fff;border:none;padding:0.9rem 2.5rem;border-radius:99px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(155,127,200,0.35);transition:all 0.2s;}
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(155,127,200,0.45);}

  .hud{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:2px solid var(--border);border-radius:16px;padding:0.9rem 1.2rem;margin-bottom:1.2rem;box-shadow:0 2px 8px var(--shadow);}
  .hud-box{text-align:center;}
  .hud-val{font-family:'Nunito',sans-serif;font-size:1.2rem;font-weight:900;}
  .hud-val.q{color:var(--lavender);}
  .hud-val.s{color:var(--mint);}
  .hud-lbl{font-size:0.6rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);}

  .timer-ring-wrap{display:flex;justify-content:center;margin-bottom:1.2rem;}
  .timer-ring{position:relative;width:70px;height:70px;}
  .timer-ring svg{transform:rotate(-90deg);}
  .timer-ring circle{fill:none;stroke-width:5;}
  .timer-bg{stroke:var(--border2);}
  .timer-fg{stroke:var(--lavender);transition:stroke-dashoffset 1s linear,stroke 0.5s;}
  .timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-size:1.2rem;font-weight:900;color:var(--lavender);}

  .q-area{display:none;animation:fadeUp 0.3s ease;}
  .q-area.active{display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .q-card{background:var(--card);border:2px solid var(--border);border-radius:20px;padding:1.6rem;margin-bottom:1rem;box-shadow:0 3px 12px var(--shadow);}

  /* Sample chips inline */
  .chip-row{display:flex;flex-wrap:wrap;gap:0.4rem;margin:0.6rem 0;}
  .chip{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:900;border:2px solid;}
  .chip-n{background:var(--lav-bg);border-color:var(--lavender-light);color:var(--lavender);}
  .chip-h{background:var(--mint-bg);border-color:var(--mint-light);color:var(--mint);}
  .chip-m{background:#fafafa;border-color:var(--border2);color:var(--text-muted);}

  .q-hint{background:var(--lav-bg);border:1.5px solid var(--lavender-light);border-radius:10px;padding:0.5rem 0.9rem;margin-bottom:0.8rem;font-size:0.78rem;font-weight:700;color:var(--lavender);}
  .q-text{font-family:'Nunito',sans-serif;font-weight:800;font-size:0.95rem;margin-bottom:1.1rem;line-height:1.5;color:var(--text);}
  .opts{display:flex;flex-direction:column;gap:0.65rem;}
  .opt{background:#fafafa;border:2px solid var(--border2);color:var(--text);padding:0.75rem 1rem;border-radius:13px;cursor:pointer;font-size:0.88rem;font-family:'Quicksand',sans-serif;font-weight:600;text-align:left;transition:all 0.15s;}
  .opt:hover{border-color:var(--lavender-light);background:var(--lav-bg);}
  .opt.correct{border-color:var(--mint);background:var(--mint-bg);color:var(--mint);}
  .opt.wrong{border-color:var(--rose);background:var(--rose-bg);color:var(--rose);}
  .opt:disabled{cursor:default;}
  .fb{margin-top:0.8rem;padding:0.7rem 0.9rem;border-radius:11px;font-size:0.85rem;font-weight:700;display:none;}
  .fb.show{display:block;}
  .fb.ok{background:var(--mint-bg);color:var(--mint);border:1.5px solid var(--mint-light);}
  .fb.no{background:var(--rose-bg);color:var(--rose);border:1.5px solid var(--rose-light);}
  .next-btn{width:100%;background:linear-gradient(135deg,var(--lavender),#7a5aa8);color:#fff;border:none;padding:0.8rem 1.5rem;border-radius:13px;font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer;font-size:0.9rem;display:none;margin-top:1rem;transition:all 0.2s;}
  .next-btn:hover{transform:translateY(-1px);}

  .result-screen{display:none;text-align:center;padding:2rem 1rem;animation:fadeUp 0.5s ease;}
  .result-screen.show{display:block;}
  .res-emoji{font-size:4rem;display:block;margin-bottom:0.8rem;}
  .res-title{font-family:'Nunito',sans-serif;font-size:1.6rem;font-weight:900;margin-bottom:0.4rem;}
  .res-score{font-family:'Nunito',sans-serif;font-size:clamp(2.5rem,8vw,4rem);font-weight:900;color:var(--lavender);margin-bottom:0.3rem;}
  .res-sub{color:var(--text-muted);margin-bottom:1.8rem;font-size:0.9rem;}
  .breakdown{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:1.2rem;margin:0 auto 1.8rem;max-width:380px;text-align:left;}
  .br-row{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;border-bottom:1px solid var(--border);font-size:0.85rem;}
  .br-row:last-child{border-bottom:none;font-weight:800;}
  .br-ok{color:var(--mint);}
  .br-no{color:var(--rose);}
  .res-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
  .btn{padding:0.75rem 1.5rem;border-radius:99px;border:none;font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:800;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-flex;align-items:center;gap:0.4rem;}
  .btn-ghost{background:transparent;border:2px solid var(--border2);color:var(--text-muted);}
  .btn-ghost:hover{border-color:var(--lavender-light);color:var(--lavender);}
  .btn-primary{background:linear-gradient(135deg,var(--lavender),#7a5aa8);color:#fff;box-shadow:0 4px 14px rgba(155,127,200,0.3);}
  .btn-primary:hover{transform:translateY(-2px);}
</style>
</head>
<body>
<nav>
  <a href="../../../index.html">ARENA</a><span>›</span>
  <a href="../tasya_0751.html">TASYA</a><span>›</span>
  <a href="lesson23.html">LESSON 23</a><span>›</span>
  <span class="cur">QUICK TEST</span>
</nav>

<div class="wrap">
  <!-- Intro -->
  <div class="intro-screen" id="introScreen">
    <span class="sprint-icon">⚡</span>
    <div class="sprint-title">QUICK TEST PELUANG</div>
    <div class="sprint-sub">5 soal peluang dengan timer. Hitung ruang sampel → tentukan peluangnya. Cepat dan tepat!</div>
    <div class="rules">
      <div class="rule"><span>🎯</span> 5 soal peluang campuran</div>
      <div class="rule"><span>⏱️</span> 60 detik per soal</div>
      <div class="rule"><span>🎲</span> Selalu mulai dari ruang sampel</div>
    </div>
    <button class="start-btn" onclick="startSprint()">MULAI QUICK TEST ⚡</button>
  </div>

  <!-- Quiz -->
  <div id="quizScreen" style="display:none;">
    <div class="hud">
      <div class="hud-box"><div class="hud-val q" id="qNum">1/5</div><div class="hud-lbl">Soal</div></div>
      <div class="hud-box"><div class="hud-val s" id="scoreD">0</div><div class="hud-lbl">Score</div></div>
    </div>
    <div class="timer-ring-wrap">
      <div class="timer-ring">
        <svg viewBox="0 0 70 70" width="70" height="70">
          <circle class="timer-bg" cx="35" cy="35" r="30"/>
          <circle class="timer-fg" id="timerArc" cx="35" cy="35" r="30" stroke-dasharray="188.5" stroke-dashoffset="0"/>
        </svg>
        <div class="timer-num" id="timerNum">60</div>
      </div>
    </div>
    <div id="qArea"></div>
  </div>

  <!-- Result -->
  <div class="result-screen" id="resultScreen">
    <span class="res-emoji" id="resEmoji"></span>
    <div class="res-title" id="resTitle"></div>
    <div class="res-score" id="resScore"></div>
    <div class="res-sub">dari 100 poin</div>
    <div class="breakdown" id="breakdown"></div>
    <div class="res-btns">
      <button class="btn btn-ghost" onclick="retryAll()">🔄 Ulangi</button>
      <a href="l23_section4.html" class="btn btn-primary">Exercise 🌙</a>
    </div>
  </div>
</div>

<script>
const questions = [
  {
    hint: '🎲 Ruang sampel dadu: { 1, 2, 3, 4, 5, 6 } — 6 kemungkinan',
    chips: [{v:'1',t:'n'},{v:'2',t:'n'},{v:'3',t:'n'},{v:'4',t:'n'},{v:'5',t:'n'},{v:'6',t:'n'}],
    text: 'Sebuah dadu dilempar sekali. Peluang mendapatkan angka ganjil adalah...',
    opts: ['1/6','2/6','3/6','4/6'],
    answer: '3/6',
    explain: 'Angka ganjil di dadu: {1, 3, 5} → 3 hasil dari total 6. Peluang = 3/6 = ½.'
  },
  {
    hint: '🪙 Ruang sampel koin: { A, G } — 2 kemungkinan',
    chips: [{v:'A',t:'n'},{v:'G',t:'n'}],
    text: 'Sebuah koin dilempar sekali. Peluang mendapatkan sisi "Angka" adalah...',
    opts: ['1/4','1/3','2/3','1/2'],
    answer: '1/2',
    explain: 'Ruang sampel koin: {A, G}. Angka = 1 hasil dari 2. Peluang = 1/2.'
  },
  {
    hint: '🎲 Tandai dulu mana yang memenuhi syarat dari {1,2,3,4,5,6}',
    chips: [{v:'1',t:'m'},{v:'2',t:'m'},{v:'3',t:'m'},{v:'4',t:'m'},{v:'5',t:'h'},{v:'6',t:'h'}],
    text: 'Sebuah dadu dilempar. Peluang mendapatkan angka yang lebih besar dari 4 adalah...',
    opts: ['1/6','2/6','3/6','4/6'],
    answer: '2/6',
    explain: 'Lebih besar dari 4: {5, 6} → 2 hasil. Peluang = 2/6 = 1/3.'
  },
  {
    hint: '🪙🪙 Ruang sampel 2 koin: { AA, AG, GA, GG } — 4 kemungkinan',
    chips: [{v:'AA',t:'h'},{v:'AG',t:'m'},{v:'GA',t:'m'},{v:'GG',t:'m'}],
    text: 'Dua koin dilempar bersamaan. Peluang mendapatkan dua sisi Angka (AA) adalah...',
    opts: ['1/4','2/4','1/2','3/4'],
    answer: '1/4',
    explain: 'Ruang sampel 2 koin: {AA, AG, GA, GG}. AA hanya 1 dari 4 kemungkinan. Peluang = 1/4.'
  },
  {
    hint: '🎲 Tulis ruang sampel, tandai yang bukan faktor 6',
    chips: [{v:'1',t:'h'},{v:'2',t:'h'},{v:'3',t:'h'},{v:'4',t:'m'},{v:'5',t:'m'},{v:'6',t:'h'}],
    text: 'Sebuah dadu dilempar. Peluang mendapatkan angka yang merupakan faktor dari 6 adalah...',
    opts: ['2/6','3/6','4/6','5/6'],
    answer: '4/6',
    explain: 'Faktor dari 6: {1, 2, 3, 6} → 4 angka dari 6. Peluang = 4/6 = 2/3.'
  }
];

let cur=0,score=0,answered=false,timer=null,timeLeft=60;
const results=[];
const CIRC=188.5;

function startSprint(){
  document.getElementById('introScreen').style.display='none';
  document.getElementById('quizScreen').style.display='block';
  loadQ(0);
}

function buildChips(chips){
  if(!chips||chips.length===0) return '';
  const map={n:'chip-n',h:'chip-h',m:'chip-m'};
  return `<div class="chip-row">${chips.map(c=>`<div class="chip ${map[c.t]||'chip-n'}">${c.v}</div>`).join('')}</div>`;
}

function loadQ(idx){
  answered=false; timeLeft=60;
  document.getElementById('qNum').textContent=(idx+1)+'/5';
  const q=questions[idx];
  const html=`
    <div class="q-area active" id="activeQ">
      <div class="q-card">
        <div class="q-hint">🔑 ${q.hint}</div>
        ${buildChips(q.chips)}
        <div class="q-text">${q.text}</div>
        <div class="opts">
          ${q.opts.map(o=>`<button class="opt" onclick="answer(this,'${o}',${idx})">${o}</button>`).join('')}
        </div>
        <div class="fb" id="fb"></div>
        <button class="next-btn" id="nextBtn" onclick="nextQ()">LANJUT →</button>
      </div>
    </div>`;
  document.getElementById('qArea').innerHTML=html;
  startTimer();
}

function startTimer(){
  clearInterval(timer);
  updateTimerUI();
  timer=setInterval(()=>{
    timeLeft--;
    updateTimerUI();
    if(timeLeft<=0){
      clearInterval(timer);
      if(!answered){
        answered=true;
        document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
        const fb=document.getElementById('fb');
        fb.className='fb show no';
        fb.textContent='⏰ Waktu habis! '+questions[cur].explain;
        results.push({ok:false});
        document.getElementById('nextBtn').style.display='block';
      }
    }
  },1000);
}

function updateTimerUI(){
  const pct=timeLeft/60;
  const offset=CIRC*(1-pct);
  const arc=document.getElementById('timerArc');
  const num=document.getElementById('timerNum');
  if(arc){
    arc.style.strokeDashoffset=offset;
    arc.style.stroke=timeLeft>20?'var(--lavender)':'var(--rose)';
    num.textContent=timeLeft;
    num.style.color=timeLeft>20?'var(--lavender)':'var(--rose)';
  }
}

function answer(btn,choice,idx){
  if(answered)return;
  answered=true;
  clearInterval(timer);
  const q=questions[idx];
  const correct=choice===q.answer;
  if(correct){score+=20;document.getElementById('scoreD').textContent=score;}
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  btn.classList.add(correct?'correct':'wrong');
  if(!correct)document.querySelectorAll('.opt').forEach(b=>{if(b.textContent.trim()===q.answer)b.classList.add('correct');});
  const fb=document.getElementById('fb');
  fb.className='fb show '+(correct?'ok':'no');
  fb.textContent=(correct?'✅ ':'❌ ')+q.explain;
  results.push({ok:correct});
  document.getElementById('nextBtn').style.display='block';
}

function nextQ(){
  cur++;
  if(cur<5)loadQ(cur);
  else showResult();
}

function showResult(){
  document.getElementById('quizScreen').style.display='none';
  const rs=document.getElementById('resultScreen');
  rs.className='result-screen show';
  const pct=score/100;
  const emoji=pct>=0.8?'🏆':pct>=0.6?'🎯':'💪';
  const title=pct>=0.8?'Luar Biasa!':pct>=0.6?'Bagus!':'Terus Berlatih!';
  document.getElementById('resEmoji').textContent=emoji;
  document.getElementById('resTitle').textContent=title;
  document.getElementById('resScore').textContent=score+' / 100';
  let html='';
  results.forEach((r,i)=>{html+=`<div class="br-row"><span>Soal ${i+1}</span><span class="${r.ok?'br-ok':'br-no'}">${r.ok?'✅ +20':'❌ +0'}</span></div>`;});
  html+=`<div class="br-row"><span>Total</span><span>${score} poin</span></div>`;
  document.getElementById('breakdown').innerHTML=html;
}

function retryAll(){
  cur=0;score=0;answered=false;results.length=0;
  document.getElementById('scoreD').textContent='0';
  document.getElementById('resultScreen').className='result-screen';
  document.getElementById('quizScreen').style.display='block';
  loadQ(0);
}
</script>
</body>
</html>
