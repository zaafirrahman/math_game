<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Section 4 · Latihan · L19 · Tasya</title>
<link rel="icon" type="image/svg+xml" href="../../../assets/logo1.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf6fb;--card:#fff;--border:#f0d6ea;--border2:#e8c8e0;
    --rose:#e8628a;--rose-light:#f5a0bc;--rose-bg:rgba(232,98,138,0.08);
    --lavender:#9b7fc8;--lavender-light:#c8b4e8;--lav-bg:rgba(155,127,200,0.08);
    --mint:#5fbfa0;--mint-light:#a8dfd0;--mint-bg:rgba(95,191,160,0.08);
    --peach:#f0956a;
    --text:#3d2b3d;--text-mid:#7a5c78;--text-muted:#b898b4;
    --shadow:rgba(180,100,150,0.1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Quicksand',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 10% 20%,rgba(95,191,160,0.07) 0%,transparent 50%);pointer-events:none;}

  nav{padding:1rem 2rem;display:flex;align-items:center;gap:0.5rem;border-bottom:2px solid var(--border);background:rgba(253,246,251,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;font-size:0.76rem;font-weight:700;}
  nav a{color:var(--text-muted);text-decoration:none;transition:color 0.2s;}
  nav a:hover{color:var(--rose);}
  nav span{color:var(--border2);}
  nav .cur{color:var(--mint);}

  .wrap{max-width:660px;margin:0 auto;padding:2.5rem 1.5rem 5rem;position:relative;z-index:1;}

  /* Intro */
  .hw-header{text-align:center;margin-bottom:2.5rem;}
  .hw-icon{font-size:4rem;display:block;margin-bottom:1rem;}
  .hw-title{font-family:'Nunito',sans-serif;font-size:clamp(1.5rem,5vw,2rem);font-weight:900;color:var(--mint);margin-bottom:0.5rem;}
  .hw-sub{color:var(--text-muted);line-height:1.7;font-size:0.92rem;margin-bottom:1.5rem;}
  .progress-bar-wrap{background:var(--border2);border-radius:99px;height:8px;overflow:hidden;margin-bottom:0.5rem;}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--mint),var(--lavender));border-radius:99px;transition:width 0.4s ease;}
  .progress-label{font-size:0.78rem;color:var(--text-muted);font-weight:700;text-align:right;}

  /* Question card */
  .q-wrap{display:none;animation:fadeUp 0.35s ease;}
  .q-wrap.active{display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .q-card{background:var(--card);border:2px solid var(--border);border-radius:20px;padding:2rem;box-shadow:0 4px 14px var(--shadow);}
  .q-num{font-size:0.65rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--mint);margin-bottom:0.6rem;}
  .q-cat{font-size:0.72rem;font-weight:700;color:var(--text-muted);margin-bottom:1rem;}
  .q-text{font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:800;margin-bottom:0.5rem;line-height:1.5;color:var(--text);}
  .q-hint{font-size:0.82rem;color:var(--text-muted);margin-bottom:1.5rem;font-style:italic;}

  .opts{display:flex;flex-direction:column;gap:0.7rem;}
  .opt-btn{background:#fafafa;border:2px solid var(--border2);color:var(--text);padding:0.9rem 1.1rem;border-radius:14px;cursor:pointer;font-size:0.9rem;font-family:'Quicksand',sans-serif;font-weight:600;text-align:left;transition:all 0.18s;line-height:1.4;}
  .opt-btn:hover:not(:disabled){border-color:var(--mint-light);background:var(--mint-bg);}
  .opt-btn.correct{border-color:var(--mint);background:var(--mint-bg);color:var(--mint);}
  .opt-btn.wrong{border-color:var(--rose);background:var(--rose-bg);color:var(--rose);}
  .opt-btn:disabled{cursor:default;}

  .feedback{margin-top:1rem;padding:0.9rem 1.1rem;border-radius:12px;font-size:0.88rem;font-weight:700;display:none;line-height:1.5;}
  .feedback.show{display:block;}
  .feedback.ok{background:var(--mint-bg);color:var(--mint);border:1.5px solid var(--mint-light);}
  .feedback.no{background:var(--rose-bg);color:var(--rose);border:1.5px solid var(--rose-light);}

  .next-q-btn{width:100%;padding:0.9rem;border-radius:99px;border:none;background:linear-gradient(135deg,var(--mint),var(--lavender));color:#fff;font-family:'Nunito',sans-serif;font-weight:900;font-size:0.9rem;cursor:pointer;margin-top:1rem;display:none;box-shadow:0 4px 14px rgba(95,191,160,0.3);transition:all 0.2s;}
  .next-q-btn:hover{transform:translateY(-2px);}
  .next-q-btn.show{display:block;animation:fadeUp 0.3s ease;}

  /* Results */
  #results{display:none;text-align:center;}
  .res-big{font-family:'Nunito',sans-serif;font-size:5rem;font-weight:900;line-height:1;margin-bottom:0.5rem;}
  .res-label{font-size:1rem;font-weight:700;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:2rem;}
  .grade-ring{display:inline-flex;align-items:center;justify-content:center;width:120px;height:120px;border-radius:50%;margin-bottom:1.5rem;}
  .score-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;margin-bottom:2rem;}
  .score-tile{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:1rem;text-align:center;box-shadow:0 2px 8px var(--shadow);}
  .score-tile .sv{font-family:'Nunito',sans-serif;font-size:1.8rem;font-weight:900;}
  .score-tile .sl{font-size:0.7rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-top:0.2rem;}
  .review-list{background:var(--card);border:2px solid var(--border);border-radius:18px;padding:1.2rem;text-align:left;margin-bottom:2rem;box-shadow:0 3px 12px var(--shadow);}
  .rv-title{font-size:0.65rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:0.9rem;}
  .rv-row{display:flex;gap:0.8rem;align-items:center;padding:0.5rem 0;border-bottom:1px solid var(--border);font-size:0.85rem;}
  .rv-row:last-child{border-bottom:none;}
  .rv-num{font-family:'Nunito',sans-serif;font-weight:900;font-size:0.8rem;color:var(--text-muted);min-width:24px;}
  .rv-icon{font-size:1rem;flex-shrink:0;}
  .rv-text{color:var(--text-mid);flex:1;font-size:0.82rem;}
  .xp-badge{display:inline-block;background:var(--mint-bg);border:1.5px solid var(--mint-light);color:var(--mint);padding:0.4rem 1.2rem;border-radius:99px;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.88rem;margin-bottom:2rem;}
  .action-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
  .btn{padding:0.75rem 1.6rem;border-radius:99px;border:none;font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:800;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-flex;align-items:center;gap:0.4rem;}
  .btn-ghost{background:transparent;border:2px solid var(--border2);color:var(--text-muted);}
  .btn-ghost:hover{border-color:var(--mint-light);color:var(--mint);}
  .btn-primary{background:linear-gradient(135deg,var(--mint),var(--lavender));color:#fff;box-shadow:0 4px 14px rgba(95,191,160,0.3);}
  .btn-primary:hover{transform:translateY(-2px);}
</style>
</head>
<body>
<nav>
  <a href="../../../index.html">ARENA</a><span>›</span>
  <a href="../tasya_0751.html">TASYA</a><span>›</span>

  <span class="cur">SEC 4 · LATIHAN</span>
</nav>

<div class="wrap">
  <div class="hw-header">
    <span class="hw-icon">🌙</span>
    <div class="hw-title">Latihan Mandiri</div>
    <div class="hw-sub">10 soal SPLDV — santai, tanpa timer. Kerjain dengan teliti, bisa sambil review materi tadi.</div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="pbar" style="width:0%"></div></div>
    <div class="progress-label" id="plabel">0 / 10</div>
  </div>

  <!-- Questions injected here -->
  <div id="qContainer"></div>

  <!-- Results -->
  <div id="results">
    <div class="grade-ring" id="gradeRing">
      <div style="text-align:center;">
        <div class="res-big" id="resBig"></div>
        <div style="font-size:0.8rem;color:var(--text-muted);font-weight:700;">/ 10</div>
      </div>
    </div>
    <div class="res-label" id="resLabel"></div>
    <div class="xp-badge" id="xpBadge"></div>
    <div class="score-grid">
      <div class="score-tile"><div class="sv" id="stBenar" style="color:var(--mint)">0</div><div class="sl">Benar</div></div>
      <div class="score-tile"><div class="sv" id="stSalah" style="color:var(--rose)">0</div><div class="sl">Salah</div></div>
    </div>
    <div class="review-list">
      <div class="rv-title">📋 Rekap Jawaban</div>
      <div id="reviewList"></div>
    </div>
    <div class="action-btns">
      <button class="btn btn-ghost" onclick="restart()">🔄 Ulangi</button>
      <a href="lesson19.html" class="btn btn-primary">← Lesson 19</a>
    </div>
  </div>
</div>

<script>
  const Qs = [
    {
      cat:'🛒 Cerita ke Persamaan',
      text:'3 buku + 1 pensil = Rp 16.000. Jika b = harga buku dan p = harga pensil (dalam ribu), persamaannya adalah...',
      hint:'Koefisien sesuai jumlah barang',
      opts:['3b + p = 16','b + 3p = 16','3b − p = 16','3b + p = 1600'],
      answer:'3b + p = 16',
      explain:'3 buku (3b) + 1 pensil (p) = 16 ribu → 3b + p = 16.'
    },
    {
      cat:'📝 Definisi Variabel',
      text:'Kakak membeli 4 permen dan 2 cokelat dengan total Rp 10.000. Manakah cara yang benar mendefinisikan variabel?',
      hint:'Satu variabel untuk satu jenis barang',
      opts:['x = permen, y = cokelat','x = 4, y = 2','x = 10.000','x = harga total'],
      answer:'x = permen, y = cokelat',
      explain:'Variabel harus mewakili hal yang tidak diketahui nilainya — yaitu harga permen (x) dan harga cokelat (y).'
    },
    {
      cat:'🔍 Baca Sistem',
      text:'Dari sistem: x + y = 8 dan 2x + y = 12. Berapa nilai x?',
      hint:'Coba kurangkan persamaan 1 dari persamaan 2',
      opts:['x = 4','x = 3','x = 8','x = 6'],
      answer:'x = 4',
      explain:'(2x+y)−(x+y) = 12−8 → x = 4. Lalu y = 8−4 = 4.'
    },
    {
      cat:'🔍 Substitusi',
      text:'Dari sistem: a = 2b + 1 dan a + b = 7. Setelah substitusi a = 2b+1 ke persamaan kedua, hasilnya adalah...',
      hint:'Ganti a dengan (2b+1) di persamaan kedua',
      opts:['3b + 1 = 7','2b + 1 = 7','b + 1 = 7','3b − 1 = 7'],
      answer:'3b + 1 = 7',
      explain:'a + b = 7 → (2b+1) + b = 7 → 3b + 1 = 7 → 3b = 6 → b = 2, a = 5.'
    },
    {
      cat:'✅ Verifikasi',
      text:'Solusi dari sistem p + q = 9 dan p − q = 3 diklaim adalah (6, 3). Manakah cek verifikasi yang benar?',
      hint:'Substitusi (6,3) ke kedua persamaan',
      opts:[
        '6+3=9 ✅ dan 6−3=3 ✅ → Benar!',
        '6+3=9 ✅ tapi 6−3=2 ❌ → Salah',
        '6×3=18 ≠ 9 → Salah',
        'Tidak perlu dicek'
      ],
      answer:'6+3=9 ✅ dan 6−3=3 ✅ → Benar!',
      explain:'Verifikasi: p+q=6+3=9 ✓ dan p−q=6−3=3 ✓. Kedua persamaan terpenuhi, jadi solusi valid!'
    },
    {
      cat:'📈 Grafik SPLDV',
      text:'Dua garis dari SPLDV digambar di grafik. Di titik (2, 5) kedua garis berpotongan. Apa artinya?',
      hint:'Titik potong = titik yang ada di kedua garis',
      opts:[
        'Solusi SPLDV adalah x=2 dan y=5',
        'Salah satu persamaan tidak valid',
        'Tidak ada solusi',
        'Solusinya adalah x=5 dan y=2'
      ],
      answer:'Solusi SPLDV adalah x=2 dan y=5',
      explain:'Titik potong dua garis adalah titik yang memenuhi kedua persamaan sekaligus. Jadi (2,5) adalah solusinya: x=2, y=5.'
    },
    {
      cat:'🛒 Cerita ke Sistem',
      text:'2 kaos + 3 celana = Rp 350.000, dan 1 kaos + 1 celana = Rp 150.000. Jika k = harga kaos, c = harga celana, sistem persamaannya adalah...',
      hint:'Terjemahkan setiap kalimat jadi satu persamaan',
      opts:[
        '2k+3c=350 dan k+c=150',
        '3k+2c=350 dan k+c=150',
        '2k+3c=350000 dan k+c=150000',
        '2k+3c=350 dan 2k+2c=150'
      ],
      answer:'2k+3c=350 dan k+c=150',
      explain:'Kalimat 1: 2k+3c=350 (dalam ribu). Kalimat 2: k+c=150. Satuan harus konsisten!'
    },
    {
      cat:'🔢 Berapa Persamaan?',
      text:'Untuk menyelesaikan SPLDV dengan 2 variabel (x dan y), minimal dibutuhkan...',
      hint:'Satu variabel butuh satu persamaan',
      opts:['2 persamaan','1 persamaan','3 persamaan','4 persamaan'],
      answer:'2 persamaan',
      explain:'SPLDV = Sistem Persamaan Linear Dua Variabel. 2 variabel = butuh 2 persamaan untuk menemukan solusi yang unik.'
    },
    {
      cat:'🔍 Cari Nilai',
      text:'Dari sistem: m + n = 10 dan m = 2n. Berapakah nilai n?',
      hint:'Substitusi m=2n ke persamaan pertama',
      opts:['n = 10/3 ≈ 3,3','n = 5','n = 4','n = 2'],
      answer:'n = 10/3 ≈ 3,3',
      explain:'Substitusi m=2n: 2n+n=10 → 3n=10 → n=10/3. Lalu m=2×(10/3)=20/3. Tidak selalu bilangan bulat!'
    },
    {
      cat:'💡 Konsep',
      text:'SPLDV "Sistem Persamaan Linear" — kata "linear" berarti...',
      hint:'Linear = membentuk garis lurus',
      opts:[
        'Grafik setiap persamaan berupa garis lurus',
        'Jawabannya selalu bilangan bulat',
        'Harus diselesaikan dengan eliminasi',
        'Hanya ada satu variabel'
      ],
      answer:'Grafik setiap persamaan berupa garis lurus',
      explain:'"Linear" artinya persamaan berbentuk garis lurus saat digambar. Variabelnya berpangkat 1 (tidak ada x² atau y³).'
    }
  ];

  let answers = new Array(10).fill(null);
  let answered = new Array(10).fill(false);
  let doneCount = 0;

  function buildQuestions() {
    const cont = document.getElementById('qContainer');
    Qs.forEach((q, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'q-wrap' + (i===0?' active':'');
      wrap.id = 'qw'+i;

      const card = document.createElement('div');
      card.className = 'q-card';
      card.innerHTML = `
        <div class="q-num">Soal ${i+1} dari 10</div>
        <div class="q-cat">${q.cat}</div>
        <div class="q-text">${q.text}</div>
        <div class="q-hint">💡 ${q.hint}</div>
        <div class="opts" id="opts${i}">
          ${q.opts.map(o=>`<button class="opt-btn" onclick="answer(${i},'${o.replace(/'/g,"\\'")}',this)">${o}</button>`).join('')}
        </div>
        <div class="feedback" id="fb${i}"></div>
        <button class="next-q-btn" id="nxt${i}" onclick="nextQ(${i})">
          ${i<9?'Soal Berikutnya →':'Lihat Hasil 🎉'}
        </button>
      `;
      wrap.appendChild(card);
      cont.appendChild(wrap);
    });
  }

  function answer(qi, val, btn) {
    if (answered[qi]) return;
    answered[qi] = true;
    answers[qi] = val;
    const correct = val === Qs[qi].answer;

    document.querySelectorAll(`#opts${qi} .opt-btn`).forEach(b => {
      b.disabled = true;
      if (b.textContent === Qs[qi].answer) b.classList.add('correct');
    });
    if (!correct) btn.classList.add('wrong');

    const fb = document.getElementById('fb'+qi);
    fb.className = 'feedback show ' + (correct?'ok':'no');
    fb.textContent = (correct?'✅ ':'❌ ') + Qs[qi].explain;

    document.getElementById('nxt'+qi).className = 'next-q-btn show';

    doneCount++;
    updateProgress();
  }

  function nextQ(qi) {
    document.getElementById('qw'+qi).classList.remove('active');
    if (qi < 9) {
      document.getElementById('qw'+(qi+1)).classList.add('active');
      window.scrollTo({top:0,behavior:'smooth'});
    } else {
      showResults();
    }
  }

  function updateProgress() {
    const pct = (doneCount/10)*100;
    document.getElementById('pbar').style.width = pct+'%';
    document.getElementById('plabel').textContent = doneCount+' / 10';
  }

  function showResults() {
    document.getElementById('qContainer').style.display = 'none';
    document.getElementById('results').style.display = 'block';
    window.scrollTo({top:0,behavior:'smooth'});

    const correct = answers.filter((a,i) => a === Qs[i].answer).length;
    const pct = correct/10;

    document.getElementById('resBig').textContent = correct;
    document.getElementById('stBenar').textContent = correct;
    document.getElementById('stSalah').textContent = 10-correct;

    let label, xp, bg;
    if(pct>=0.9){label='LUAR BIASA!';xp='+200 XP';bg='linear-gradient(135deg,var(--mint),#4aa890)';}
    else if(pct>=0.7){label='BAGUS!';xp='+140 XP';bg='linear-gradient(135deg,var(--lavender),#7a5fba)';}
    else if(pct>=0.5){label='LUMAYAN!';xp='+100 XP';bg='linear-gradient(135deg,var(--peach),var(--rose))';}
    else{label='TERUS BELAJAR!';xp='+60 XP';bg='linear-gradient(135deg,#b898b4,#9b7fc8)';}

    document.getElementById('resLabel').textContent = label;
    document.getElementById('xpBadge').textContent = '✨ '+xp+' — '+label;
    document.getElementById('gradeRing').style.background = bg;
    document.getElementById('resBig').style.color = '#fff';
    document.getElementById('gradeRing').querySelector('div div:last-child').style.color = 'rgba(255,255,255,0.7)';

    const rl = document.getElementById('reviewList');
    rl.innerHTML = Qs.map((q,i) => {
      const ok = answers[i] === q.answer;
      return `<div class="rv-row">
        <div class="rv-num">${i+1}</div>
        <div class="rv-icon">${ok?'✅':'❌'}</div>
        <div class="rv-text">${q.text.substring(0,60)}${q.text.length>60?'...':''}</div>
      </div>`;
    }).join('');
  }

  function restart() {
    answers = new Array(10).fill(null);
    answered = new Array(10).fill(false);
    doneCount = 0;
    document.getElementById('results').style.display = 'none';
    document.getElementById('qContainer').style.display = '';
    document.getElementById('pbar').style.width = '0%';
    document.getElementById('plabel').textContent = '0 / 10';

    // Reset all questions
    document.querySelectorAll('.q-wrap').forEach((w,i) => {
      w.classList.toggle('active', i===0);
    });
    document.querySelectorAll('.opt-btn').forEach(b => {
      b.disabled=false; b.className='opt-btn';
    });
    document.querySelectorAll('.feedback').forEach(f => f.className='feedback');
    document.querySelectorAll('.next-q-btn').forEach(n => n.className='next-q-btn');
    window.scrollTo({top:0,behavior:'smooth'});
  }

  buildQuestions();
</script>
</body>
</html>
