<div class="wrap">
  <div class="bdg">🌙 Latihan Mandiri · Lesson 57</div>
  <h1>Menyederhanakan Akar — Latihan <span>Mandiri</span></h1>
  <p class="intro">20 soal bertahap dengan petunjuk di tiap soal. Alur pikir: angka → faktor → perfect-square factor → pecah akar → keluarkan → cek apakah masih bisa disederhanakan.</p>
  <div id="app"></div>
</div>
<script>
/* Engine kuis L57. Di data, opsi pertama (o[0]) = jawaban benar; urutan diacak tiap ditampilkan. */
function Quiz(c){
  const A=document.getElementById('app'),N=c.qs.length,P=c.pts||1;let i=0,s=0,t,done;
  const sh=a=>{a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a};
  function show(){
    done=false;clearInterval(t);const q=c.qs[i];
    A.innerHTML=`<div class="prog"><i style="width:${i/N*100}%"></i></div><div class="ph"><span>Soal ${i+1} dari ${N}</span>${c.timer?'<span id="tm"></span>':''}<span>Skor: ${s}</span></div>
    <div class="card"><span class="tg">${q.t}</span><div class="qt">${q.q}</div>${q.h?`<button class="rv" id="hb">💡 Petunjuk</button><div class="hint" id="hn">${q.h}</div>`:''}
    <div class="opts">${sh(q.o).map(x=>`<button class="opt">${x}</button>`).join('')}</div><div class="fb" id="fb"></div>
    <button class="btn p nb" id="nb">${i<N-1?'Soal Berikutnya →':'Lihat Hasil 🏆'}</button></div>`;
    if(q.h)document.getElementById('hb').onclick=()=>{document.getElementById('hn').style.display='block'};
    A.querySelectorAll('.opt').forEach(b=>b.onclick=()=>ans(b));
    document.getElementById('nb').onclick=()=>{i++;i<N?show():end()};
    if(c.timer){let l=c.timer;const tm=document.getElementById('tm');tm.textContent='⏱ '+l;t=setInterval(()=>{l--;tm.textContent='⏱ '+l;if(l<=10)tm.className='lo';if(l<=0)ans(null)},1000)}
  }
  function ans(b){
    if(done)return;done=true;clearInterval(t);const q=c.qs[i],fb=document.getElementById('fb');
    A.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===q.o[0])x.classList.add('ok')});
    const good=b&&b.textContent===q.o[0];if(b&&!good)b.classList.add('no');if(good)s+=P;
    fb.className='fb '+(good?'ok':'no');fb.textContent=(good?'✅ Benar! ':b?'❌ Belum tepat. ':'⏰ Waktu habis! ')+q.f;
    document.getElementById('nb').style.display='inline-block';
  }
  function end(){
    const r=Math.min(4,Math.floor(s/(N*P)*5));
    A.innerHTML=`<div class="fin"><div style="font-size:3.5rem">${['😊','🙂','😄','🌟','🏆'][r]}</div><h2>${c.title} selesai!</h2><div class="s">${s}/${N*P}</div><p>${c.msgs[r]}</p>
    <button class="btn p" id="rs">🔄 Ulangi</button>${c.links.map(l=>`<a class="btn gh" href="${l[1]}">${l[0]}</a>`).join('')}</div>`;
    document.getElementById('rs').onclick=()=>{i=0;s=0;show()};
  }
  show();
}
</script>
<script>
/* Kunci: opsi pertama (o[0]) selalu jawaban benar; urutan diacak otomatis. */
Quiz({title:'Latihan',timer:0,pts:1,
qs:[
{t:'Konsep',q:'Kenapa √16 menghasilkan bilangan bulat, tapi √17 tidak?',o:['16 = 4², sedangkan 17 tidak bisa ditulis sebagai n² dengan n bilangan bulat','16 lebih kecil dari 17','16 genap, 17 ganjil','√17 tidak punya nilai'],h:'Ingat definisi perfect square.',f:'√16 = 4 karena 16 = 4². Tidak ada bilangan bulat yang kuadratnya 17.'},
{t:'Pilih Faktor',q:'Untuk menyederhanakan √12, pasangan faktor mana yang berguna (perfect square selain 1)?',o:['3 × 4','2 × 6','1 × 12','Tidak ada yang berguna'],h:'Cari faktor yang bisa ditulis n², selain 1.',f:'4 = 2², jadi √12 = √(4 × 3) = 2√3.'},
{t:'Sederhanakan',q:'√18 = ...?',o:['3√2','2√3','9√2','6√3'],h:'Perfect square apa yang membagi 18?',f:'18 = 9 × 2, jadi √18 = 3√2.'},
{t:'Sederhanakan',q:'√50 = ...?',o:['5√2','2√5','25√2','10√5'],h:'50 = 25 × 2.',f:'√50 = √25 × √2 = 5√2.'},
{t:'Bekerja Mundur',q:'5√3 = √□. Berapa □?',o:['75','15','8','53'],h:'Masukkan 5 kembali ke dalam akar: 5 = √25.',f:'5√3 = √25 × √3 = √75.'},
{t:'Kapan Berhenti?',q:'Manakah yang sudah paling sederhana?',o:['4√3','2√12','3√8','2√18'],h:'Cek isi akarnya: masih ada perfect-square factor (selain 1)?',f:'12, 8, dan 18 masing-masing masih punya faktor 4, 4, dan 9. Isi akar 3 tidak.'},
{t:'Error Detective',q:'Adi menulis √45 = 3√5. Budi menulis √45 = 5√3. Siapa yang benar?',o:['Adi, karena 45 = 9 × 5','Budi, karena 45 = 5 × 9','Keduanya benar','Keduanya salah'],h:'Kuadratkan hasilnya: (3√5)² dan (5√3)² sama dengan berapa?',f:'(3√5)² = 9 × 5 = 45 ✓, sedangkan (5√3)² = 25 × 3 = 75 ✗.'},
{t:'Factor Tree',q:'108 = 2 × 2 × 3 × 3 × 3. Jadi √108 = ...?',o:['6√3','3√6','2√27','36√3'],h:'Pasangkan faktor kembar: (2 × 2) dan (3 × 3), sisa satu 3.',f:'Pasangan 2×2 keluar jadi 2, pasangan 3×3 keluar jadi 3, sisa √3: 2 × 3 × √3 = 6√3.'},
{t:'Sederhanakan',q:'√8 = ...?',o:['2√2','4√2','2√4','8√2'],h:'8 = 4 × 2.',f:'√8 = √4 × √2 = 2√2.'},
{t:'Sederhanakan',q:'√27 = ...?',o:['3√3','9√3','3√9','27√3'],h:'Perfect square apa yang membagi 27?',f:'27 = 9 × 3, jadi √27 = 3√3.'},
{t:'Pilih Faktor Terbaik',q:'√32 = ...? (bentuk paling sederhana)',o:['4√2','2√8','16√2','8√2'],h:'Cari perfect square terbesar yang membagi 32.',f:'32 = 16 × 2, jadi 4√2. Kalau pakai 4 × 8 hasilnya 2√8, dan 8 masih punya faktor 4.'},
{t:'Sederhanakan',q:'√63 = ...?',o:['3√7','7√3','9√7','21√3'],h:'63 = 9 × 7.',f:'√63 = √9 × √7 = 3√7.'},
{t:'Sederhanakan',q:'√125 = ...?',o:['5√5','25√5','5√25','125√5'],h:'125 = 25 × 5.',f:'√125 = √25 × √5 = 5√5.'},
{t:'Bekerja Mundur',q:'3√5 = √□. Berapa □?',o:['45','15','35','8'],h:'Tulis 3 sebagai √9, lalu gabungkan.',f:'3√5 = √9 × √5 = √45.'},
{t:'Konsep',q:'1 adalah perfect square. Kenapa pasangan 1 × 12 tidak membantu menyederhanakan √12?',o:['Karena √(1 × 12) = √1 × √12 = 1 × √12, bentuknya tetap √12','Karena 1 bukan bilangan','Karena √1 = 0','Karena 1 × 12 ≠ 12'],h:'Hitung √1 × √12.',f:'Faktor 1 keluar sebagai 1, jadi tidak ada yang berubah. Kita perlu perfect square yang lebih besar dari 1.'},
{t:'Error Detective',q:'Sari menulis √50 = 25√2. Apa kesalahannya?',o:['Yang keluar dari akar seharusnya √25 = 5, bukan 25','Seharusnya 50 = 10 × 5','Sudah benar','Seharusnya √50 = 2√25'],h:'Kuadratkan 25√2. Apakah hasilnya 50?',f:'√(25 × 2) = √25 × √2 = 5√2. Kalau 25√2 dikuadratkan hasilnya 1250.'},
{t:'Factor Tree',q:'180 = 2 × 2 × 3 × 3 × 5. Jadi √180 = ...?',o:['6√5','5√6','3√10','36√5'],h:'Pasangan 2×2 dan 3×3 keluar, sisa 5.',f:'Pasangan 2×2 keluar jadi 2, pasangan 3×3 keluar jadi 3: 2 × 3 × √5 = 6√5.'},
{t:'Boss Question',q:'√150 = ...? (bentuk paling sederhana)',o:['5√6','6√5','25√6','15√10'],h:'150 = 25 × 6. Apakah 6 masih punya perfect-square factor?',f:'√150 = √25 × √6 = 5√6. Isi akar 6 = 2 × 3, tidak ada pasangan, jadi berhenti.'},
{t:'Gabungan dengan x² = a',q:'Jika x² = 12, nilai x adalah ...?',o:['±2√3','2√3','±6','±3√2'],h:'Ingat: persamaan x² = a punya dua solusi (±). Sederhanakan √12.',f:'Persamaan → dua solusi: x = ±√12 = ±2√3.'},
{t:'Boss Question',q:'Manakah bentuk paling sederhana dari √200?',o:['10√2','5√8','2√50','20√5'],h:'Cari perfect-square factor terbesar dari 200.',f:'200 = 100 × 2, jadi √200 = 10√2. Bentuk 5√8 dan 2√50 nilainya sama tapi belum sederhana.'}
],
msgs:['Tetap semangat! Ulangi materinya, fokus di mencari perfect-square factor 💪','Sudah mulai paham! Latihan lagi untuk lebih mantap 🙌','Bagus! Kamu sudah menguasai dasarnya 🔥','Keren banget! Hampir sempurna ✨','Sempurna! Kamu siap lanjut ke Fractional Exponents 🏆'],
links:[['⚡ Boss Challenge','soal57.html'],['← Lesson 57','lesson57.html']]});
</script>
