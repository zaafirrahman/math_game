<div class="wrap">
  <div class="bdg">🌙 Latihan Mandiri · Lesson 58</div>
  <h1>Pangkat Pecahan — Latihan <span>Mandiri</span></h1>
  <p class="intro">20 soal bertahap dengan petunjuk di tiap soal. Alur pikir: baca penyebut → akar apa → baca pembilang → pangkat berapa → hitung.</p>
  <div id="app"></div>
</div>
<script>
/* Engine kuis L58. Di data, opsi pertama (o[0]) = jawaban benar; urutan diacak tiap ditampilkan. Notasi a^(m/n) otomatis dirender sebagai pangkat pecahan bertumpuk. */
function Quiz(c){
  const A=document.getElementById('app'),N=c.qs.length,P=c.pts||1;let i=0,s=0,t,done;
  const sh=a=>{a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a};
  const X=z=>z.replace(/\^\((\w+)\/(\w+)\)/g,'<span class="ex"><i>$1</i><i>$2</i></span>').replace(/\^\(([^()]+)\)/g,'<span class="ex s"><i>$1</i></span>');
  function show(){
    done=false;clearInterval(t);const q=c.qs[i];
    A.innerHTML=`<div class="prog"><i style="width:${i/N*100}%"></i></div><div class="ph"><span>Soal ${i+1} dari ${N}</span>${c.timer?'<span id="tm"></span>':''}<span>Skor: ${s}</span></div>
    <div class="card"><span class="tg">${q.t}</span><div class="qt">${X(q.q)}</div>${q.h?`<button class="rv" id="hb">💡 Petunjuk</button><div class="hint" id="hn">${X(q.h)}</div>`:''}
    <div class="opts">${sh(q.o).map(x=>`<button class="opt" data-c="${x===q.o[0]?1:0}">${X(x)}</button>`).join('')}</div><div class="fb" id="fb"></div>
    <button class="btn p nb" id="nb">${i<N-1?'Soal Berikutnya →':'Lihat Hasil 🏆'}</button></div>`;
    if(q.h)document.getElementById('hb').onclick=()=>{document.getElementById('hn').style.display='block'};
    A.querySelectorAll('.opt').forEach(b=>b.onclick=()=>ans(b));
    document.getElementById('nb').onclick=()=>{i++;i<N?show():end()};
    if(c.timer){let l=c.timer;const tm=document.getElementById('tm');tm.textContent='⏱ '+l;t=setInterval(()=>{l--;tm.textContent='⏱ '+l;if(l<=10)tm.className='lo';if(l<=0)ans(null)},1000)}
  }
  function ans(b){
    if(done)return;done=true;clearInterval(t);const q=c.qs[i],fb=document.getElementById('fb');
    A.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.c==='1')x.classList.add('ok')});
    const good=!!b&&b.dataset.c==='1';if(b&&!good)b.classList.add('no');if(good)s+=P;
    fb.className='fb '+(good?'ok':'no');fb.innerHTML=(good?'✅ Benar! ':b?'❌ Belum tepat. ':'⏰ Waktu habis! ')+X(q.f);
    document.getElementById('nb').style.display='inline-block';
  }
  function end(){
    const r=Math.min(4,Math.floor(s/(N*P)*5));
    A.innerHTML=`<div class="fin"><div style="font-size:3.5rem">${['😊','🙂','😄','🌟','🏆'][r]}</div><h2>${c.title} selesai!</h2><div class="s">${s}/${N*P}</div><p>${c.msgs[r]}</p>
    <button class="btn p" id="rs">🔄 Ulangi</button>${c.links.map(l=>`<a class="btn gh" href="${l[1]}">${l[0]}</a>`).join('')}</div>`;
    document.getElementById('rs').onclick=()=>{i=0;s=0;show()};
  }
  show();
}
</script>
<script>
/* Kunci: opsi pertama (o[0]) selalu jawaban benar; urutan diacak otomatis. */
Quiz({title:'Latihan',timer:0,pts:1,
qs:[
{t:'Konsep',q:'(9^(1/2))² = 9^(1/2 × 2) = 9¹ = 9. Jadi 9^(1/2) adalah bilangan positif yang kuadratnya 9. Nilainya ...?',o:['3','4,5','9','81'],h:'Bilangan positif apa yang kalau dikuadratkan menjadi 9?',f:'9^(1/2) = √9 = 3. Angka 4,5 muncul kalau 9 dikali ½ — itu bukan arti pangkat pecahan.'},
{t:'Akar ke Pangkat',q:'√49 jika ditulis sebagai pangkat pecahan menjadi ...?',o:['49^(1/2)','49²','2^(1/49)','49^(-2)'],h:'Akar kuadrat → penyebut berapa?',f:'√49 = 49^(1/2) = 7.'},
{t:'Hitung',q:'36^(1/2) = ...?',o:['6','18','72','1296'],h:'Ubah ke bentuk akar dulu.',f:'36^(1/2) = √36 = 6.'},
{t:'Hitung',q:'100^(1/2) = ...?',o:['10','50','200','10000'],h:'Penyebut 2 → akar apa?',f:'100^(1/2) = √100 = 10.'},
{t:'Dari Kuadrat ke Kubik',q:'64^(1/3) = ...?',o:['4','8','32','192'],h:'Penyebut 3 → akar pangkat 3. Bilangan apa yang pangkat tiganya 64?',f:'64^(1/3) = ∛64 = 4, karena 4³ = 64. Angka 8 adalah √64 — akar yang salah.'},
{t:'Pangkat ke Akar',q:'∛125 = 125^(?). Berapa pangkatnya?',o:['1/3','3','1/125','3/125'],h:'Jenis akar menjadi penyebut.',f:'Akar pangkat 3 → penyebut 3: ∛125 = 125^(1/3) = 5.'},
{t:'Hitung',q:'16^(1/4) = ...?',o:['2','4','8','64'],h:'Penyebut 4 → akar pangkat 4. Bilangan apa yang pangkat empatnya 16?',f:'16^(1/4) = ⁴√16 = 2, karena 2⁴ = 16.'},
{t:'Makna Penyebut',q:'Pada 7^(1/5), angka 5 menunjukkan ...?',o:['akar pangkat 5','pangkat 5','dikali 5','dibagi 5'],h:'Ingat: penyebut = ...?',f:'Penyebut = indeks akar. 7^(1/5) = ⁵√7.'},
{t:'Pangkat ke Akar',q:'x^(1/3) sama dengan ...?',o:['∛x','x ÷ 3','x³','√x'],h:'Penyebut 3 → akar pangkat berapa?',f:'x^(1/3) = ∛x.'},
{t:'Makna Pembilang',q:'Pada 8^(2/3), apa fungsi pembilang 2?',o:['Memangkatkan hasil akar dengan 2','Mengakarkan dengan akar 2','Mengalikan 8 dengan 2','Mengurangi 8 dengan 2'],h:'Penyebut 3 sudah mengurus akar. Sisanya?',f:'8^(2/3) = (∛8)² = 2² = 4. Pembilang = pangkat.'},
{t:'Hitung',q:'27^(2/3) = ...?',o:['9','18','6','729'],h:'∛27 dulu, baru dipangkatkan 2.',f:'∛27 = 3, lalu 3² = 9. Angka 18 muncul kalau 27 dikali 2/3 — itu salah kaprah.'},
{t:'Hitung',q:'64^(2/3) = ...?',o:['16','8','4','128'],h:'∛64 = 4. Lalu?',f:'∛64 = 4, lalu 4² = 16.'},
{t:'Hitung',q:'81^(3/4) = ...?',o:['27','9','3','60,75'],h:'Penyebut 4 → ⁴√81. Pembilang 3 → pangkat tiga.',f:'⁴√81 = 3 (karena 3⁴ = 81), lalu 3³ = 27.'},
{t:'Dua Cara',q:'∛(5²) sama dengan ...?',o:['5^(2/3)','5^(3/2)','5^(1/6)','2^(5/3)'],h:'Akar pangkat 3 → penyebut. Pangkat 2 → pembilang.',f:'Akar pangkat 3 → penyebut 3, pangkat 2 → pembilang 2: 5^(2/3).'},
{t:'Hitung',q:'25^(3/2) = ...?',o:['125','37,5','75','15625'],h:'Pakai (√25)³.',f:'(√25)³ = 5³ = 125. Cek dengan jalur lain: √(25³) = √15625 = 125.'},
{t:'Representasi',q:'Manakah yang sama dengan 7^(3/2)?',o:['(√7)³','(∛7)²','7 × 3/2','∛(7²)'],h:'Penyebut 2 → akar kuadrat. Pembilang 3 → pangkat tiga.',f:'7^(3/2) = (√7)³ (atau √(7³)). Bentuk (∛7)² dan ∛(7²) itu 7^(2/3).'},
{t:'Error Detective',q:'Dina menulis 8^(2/3) = 8 × 2/3 = 16/3. Apa kesalahannya?',o:['Pangkat pecahan bukan perkalian: penyebut 3 = akar pangkat 3, pembilang 2 = kuadrat','Seharusnya 8 × 3/2','Seharusnya 8 + 2/3','Tidak ada kesalahan'],h:'Apa arti penyebut dan pembilang pada pangkat?',f:'8^(2/3) = (∛8)² = 2² = 4. Pangkat pecahan menggambarkan akar dan pangkat, bukan perkalian.'},
{t:'Error Detective',q:'Rafi menulis 16^(1/4) = 4 karena 16 ÷ 4 = 4. Pernyataan yang tepat?',o:['Salah; 16^(1/4) = ⁴√16 = 2 karena 2⁴ = 16','Benar','Salah; hasilnya 8','Salah; hasilnya 64'],h:'Penyebut 4 artinya apa? Cek: 4⁴ sama dengan berapa?',f:'4⁴ = 256, bukan 16. Yang benar ⁴√16 = 2.'},
{t:'Boss Question',q:'243^(2/5) = ...?',o:['9','6','97,2','3'],h:'3⁵ = 243. Penyebut 5 → akar pangkat 5.',f:'⁵√243 = 3, lalu 3² = 9.'},
{t:'Boss: Gabungan',q:'16^(1/2) × 8^(2/3) = ...?',o:['16','32','8','128'],h:'Hitung masing-masing dulu: berapa 16^(1/2)? berapa 8^(2/3)?',f:'16^(1/2) = 4, 8^(2/3) = (∛8)² = 4, jadi 4 × 4 = 16.'}
],
msgs:['Tetap semangat! Ulangi materinya, fokus: penyebut = akar, pembilang = pangkat 💪','Sudah mulai paham! Latihan lagi untuk lebih mantap 🙌','Bagus! Kamu sudah menguasai dasarnya 🔥','Keren banget! Hampir sempurna ✨','Sempurna! Kamu siap lanjut ke soal gabungan pangkat dan akar 🏆'],
links:[['⚡ Boss Challenge','soal58.html'],['← Lesson 58','lesson58.html']]});
</script>
